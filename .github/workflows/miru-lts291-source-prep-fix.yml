name: Fix audited Linux 4.14.291 source materializer

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  fix-source-materializer:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact preparation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove unsupported reference ancestry assumption
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/miru-lts291-source-prep.yml')
          text = path.read_text()
          bad = '          git merge-base --is-ancestor "${PRODUCTION_SHA}" "${DIRECT_305_REFERENCE_SHA}"\n'
          if text.count(bad) == 1:
              text = text.replace(bad, '', 1)
          elif bad in text:
              raise SystemExit('unexpected duplicate unsupported gate')
          anchor = '          set -Eeuo pipefail\n          mkdir -p source-generation-evidence\n'
          traced = '          set -Eeuo pipefail\n          set -x\n          mkdir -p source-generation-evidence\n'
          if anchor in text:
              text = text.replace(anchor, traced, 1)
          elif traced not in text:
              raise SystemExit('source materializer trace anchor changed')
          path.write_text(text)
          PY
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .github/workflows/miru-lts291-source-prep.yml
          git commit -m 'ci: correct 4.14.291 source identity gate'
          git push origin "HEAD:${HEAD_BRANCH}"
