name: Miru LTS 4.14.190 kernel and external modules

on:
  pull_request:
    branches:
      - h40-miru-module-compat-test
    types:
      - synchronize

permissions:
  contents: read

jobs:
  sanity-build-and-modules:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'h40-miru-lts-4.14.190'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: h40-miru-lts-4.14.190
          fetch-depth: 1

      - name: Prepare final vendor compatibility build driver
        run: |
          python3 scripts/miru/prepare_vendor_v6_linewise.py
          python3 scripts/miru/inject_vendor_compat_v3_into_ci_build.py
          sed -i 's/apply_vendor_lts190_compat_v3.py/apply_vendor_lts190_compat_v6.py/' \
            scripts/miru/ci_build_4.14.190.sh
          python3 scripts/miru/insert_vendor_format_fixer.py
          grep -Fq 'apply_vendor_lts190_compat_v6.py' scripts/miru/ci_build_4.14.190.sh
          grep -Fq 'fix_vendor_lts190_format_quotes.py' scripts/miru/ci_build_4.14.190.sh

      - name: Run sanity scan and clean kernel build
        run: bash scripts/miru/ci_build_4.14.190.sh

      - name: Rebuild and package external modules
        run: |
          python3 scripts/miru/prepare_external_modules_toolchain.py
          python3 scripts/miru/prepare_external_pinctrl_headers.py
          python3 scripts/miru/prepare_wlan_response_link.py
          bash scripts/miru/build_external_modules_4.14.190.sh

      - name: Upload external module drop-in packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-v3-modules-dropin-4.14.190
          path: |
            ${{ runner.temp }}/android-root/out/miru-v3-modules-dropin-4.14.190.7z
            ${{ runner.temp }}/android-root/out/miru-v3-modules-dropin-4.14.190-audit.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Upload external module diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-v3-modules-dropin-4.14.190-diagnostics
          path: external-module-diagnostics
          if-no-files-found: warn
          retention-days: 30

      - name: Upload kernel build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts-4.14.190-ci1-build
          path: ${{ runner.temp }}/android-root/out/h40-artifacts
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Upload kernel build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts-4.14.190-ci1-diagnostics
          path: build-diagnostics
          if-no-files-found: error
          retention-days: 30
