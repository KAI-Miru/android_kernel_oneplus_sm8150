name: Miru LTS 4.14.190 clean kernel build

on:
  pull_request:
    branches:
      - h40-miru-module-compat-test
    types:
      - synchronize

permissions:
  contents: read

jobs:
  sanity-and-build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'h40-miru-lts-4.14.190'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: h40-miru-lts-4.14.190
          fetch-depth: 1

      - name: Prepare final vendor compatibility build driver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path("scripts/miru/apply_vendor_lts190_compat_v6.py")
          expected = "044cc260e47a887d2394567a6882421199866e1f"
          actual = subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
          if actual != expected:
              raise SystemExit(f"vendor v6 patcher changed: expected {expected}, found {actual}")

          text = path.read_text()
          count_guard = '''    if text.count("F2FS_OPTION(sbi).test_dummy_encryption") != 1:
              raise SystemExit("expected exactly one direct of2fs dummy boolean assignment")

          '''
          if text.count(count_guard) != 1:
              raise SystemExit("redundant direct-reference count block missing or duplicated")
          text = text.replace(count_guard, "", 1)

          final_guard = '''    if "F2FS_OPTION(sbi).test_dummy_encryption" in text:
              raise SystemExit("direct of2fs dummy boolean assignment remains")
          '''
          cleanup = '''    text = base.replace_exact(
              text,
              "\\tF2FS_OPTION(sbi).test_dummy_encryption = false;\\n",
              "",
          )

          '''
          if text.count(final_guard) != 1:
              raise SystemExit("final direct-reference guard missing or duplicated")
          path.write_text(text.replace(final_guard, cleanup + final_guard, 1))
          PY
          python3 scripts/miru/inject_vendor_compat_v3_into_ci_build.py
          sed -i 's/apply_vendor_lts190_compat_v3.py/apply_vendor_lts190_compat_v6.py/' \
            scripts/miru/ci_build_4.14.190.sh
          grep -Fq 'apply_vendor_lts190_compat_v6.py' scripts/miru/ci_build_4.14.190.sh

      - name: Run sanity scan and clean build
        run: bash scripts/miru/ci_build_4.14.190.sh

      - name: Upload kernel build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts-4.14.190-ci1-build
          path: ${{ runner.temp }}/android-root/out/h40-artifacts
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts-4.14.190-ci1-diagnostics
          path: build-diagnostics
          if-no-files-found: error
          retention-days: 30
