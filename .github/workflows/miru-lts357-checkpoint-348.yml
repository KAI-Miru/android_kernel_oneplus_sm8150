name: Miru H.40 OpenELA stage 348 compile checkpoint

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/miru-lts357-checkpoint-348.yml'
      - 'scripts/miru/lts357/run_compile_checkpoint_348.sh'

permissions:
  contents: read

concurrency:
  group: miru-h40-lts357-checkpoint-348
  cancel-in-progress: true

jobs:
  compile-stage-348:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'miru-h40-lts357-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify workflow source and compile exact stage 348
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = eb9451c0a1639e1aa49ee094681f98df0545f797
          bash scripts/miru/lts357/run_compile_checkpoint_348.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miru-h40-openela-compile-checkpoint-348-${{ github.event.pull_request.head.sha }}
          path: integration-evidence/compile-checkpoint-348
          if-no-files-found: error
          retention-days: 30
