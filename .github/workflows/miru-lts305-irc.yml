# Trigger guarded IRC DCC parser validation with exact target provenance.
name: Miru H.40 4.14.305 IRC DCC parser resolution

on:
  push:
    branches:
      - miru-h40-lts305-integration
    paths:
      - scripts/miru/lts305_apply_irc_resolution.sh
      - .github/workflows/miru-lts305-irc.yml

permissions:
  contents: write
  statuses: write

jobs:
  resolve-irc:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve, validate, reverse, document and guarded-push
        shell: bash
        run: bash scripts/miru/lts305_apply_irc_resolution.sh

      - name: Upload IRC resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-irc-resolution-${{ github.run_id }}
          path: lts305-irc-resolution
          if-no-files-found: error
          retention-days: 14
