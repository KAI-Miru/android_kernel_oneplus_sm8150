name: Miru LTS 4.14.190 Step 10 ALSA write

on:
  pull_request:
    branches:
      - h40-miru-module-compat-test
    types:
      - synchronize

permissions:
  contents: write

jobs:
  resolve-step-10:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'h40-miru-lts-4.14.190'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: h40-miru-lts-4.14.190
          fetch-depth: 50
          sparse-checkout: |
            .github/workflows
            Documentation/miru
            scripts/miru
            sound/core
            include/sound
          sparse-checkout-cone-mode: true

      - name: Configure Git
        run: |
          git config user.name "Miru LTS Integration"
          git config user.email "110590275+Benetsu@users.noreply.github.com"

      - name: Check one-shot guard
        id: guard
        run: |
          if git log --all --grep='^lts: resolve ALSA compress and rawmidi conflicts$' --format='%H' | grep -q .; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run guarded Step 10 resolver
        if: steps.guard.outputs.run == 'true'
        run: |
          set +e
          python3 scripts/miru/adjust_step10_guard.py > "$RUNNER_TEMP/step10-resolver.log" 2>&1
          adjust_status=$?
          if [ "$adjust_status" -ne 0 ]; then
            cat "$RUNNER_TEMP/step10-resolver.log"
            exit "$adjust_status"
          fi
          python3 scripts/miru/resolve_step10.py >> "$RUNNER_TEMP/step10-resolver.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/step10-resolver.log"
          exit "$status"

      - name: Upload Step 10 resolver diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts-4.14.190-step10-resolver-diagnostics
          path: ${{ runner.temp }}/step10-resolver.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stage and validate Step 10
        id: final_validation
        if: steps.guard.outputs.run == 'true' && success()
        run: |
          set -euo pipefail

          git rm -f \
            scripts/miru/adjust_step10_guard.py \
            scripts/miru/audit_step10.py \
            scripts/miru/resolve_step10.py \
            .github/workflows/miru-lts-4.14.190-step10-audit.yml \
            .github/workflows/miru-lts-4.14.190-step10-write.yml

          git add \
            sound/core/compress_offload.c \
            sound/core/rawmidi.c \
            Documentation/miru/lts-4.14.190-conflicts.md

          printf '%s\n' \
            '.github/workflows/miru-lts-4.14.190-step10-audit.yml' \
            '.github/workflows/miru-lts-4.14.190-step10-write.yml' \
            'Documentation/miru/lts-4.14.190-conflicts.md' \
            'scripts/miru/adjust_step10_guard.py' \
            'scripts/miru/audit_step10.py' \
            'scripts/miru/resolve_step10.py' \
            'sound/core/compress_offload.c' \
            'sound/core/rawmidi.c' | sort > "$RUNNER_TEMP/expected.txt"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

          git diff --cached --check
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- \
            sound/core/compress_offload.c \
            sound/core/rawmidi.c \
            include/sound/compress_driver.h \
            include/sound/rawmidi.h \
            Documentation/miru/lts-4.14.190-conflicts.md

          test "$(git hash-object sound/core/compress_offload.c)" = "9296eb6c4ce8ae96ac49a2b4d77cc05ee1d047f4"
          test "$(git hash-object sound/core/rawmidi.c)" = "7b841a23481a86dc28c91dc39870fd43d1e50d29"
          test "$(git hash-object include/sound/compress_driver.h)" = "ca0fa6193353cf1d6432bd90e273ccc94036973c"
          test "$(git hash-object include/sound/rawmidi.h)" = "17f2f6ed8defdc6570d4424403b6ff20f8be8b89"

          grep -Fq 'stream->partial_drain = true;' sound/core/compress_offload.c
          grep -Fq 'stream->partial_drain = false;' sound/core/compress_offload.c
          grep -Fq 'stream->metadata_set = false;' sound/core/compress_offload.c
          grep -Fq 'snd_compr_set_next_track_param' sound/core/compress_offload.c
          grep -Fq 'snd_compress_simple_ioctls' sound/core/compress_offload.c
          grep -Fq 'EXPORT_SYMBOL(snd_compress_free);' sound/core/compress_offload.c

          grep -Fq 'static inline void snd_rawmidi_buffer_ref' sound/core/rawmidi.c
          grep -Fq 'static inline void snd_rawmidi_buffer_unref' sound/core/rawmidi.c
          grep -Fq 'runtime->buffer = kzalloc(runtime->buffer_size, GFP_KERNEL)' sound/core/rawmidi.c
          grep -Fq 'newbuf = kzalloc(params->buffer_size, GFP_KERNEL);' sound/core/rawmidi.c
          grep -Fq 'if (runtime->buffer_ref) {' sound/core/rawmidi.c
          grep -Fq 'spin_unlock_irqrestore(&runtime->lock, flags);' sound/core/rawmidi.c
          grep -Fq 'mutex_unlock(&runtime->realloc_mutex);' sound/core/rawmidi.c
          test "$(grep -Fc 'snd_rawmidi_buffer_ref(runtime);' sound/core/rawmidi.c)" = "2"
          test "$(grep -Fc 'snd_rawmidi_buffer_unref(runtime);' sound/core/rawmidi.c)" = "2"
          ! grep -Fq 'newbuf = __krealloc(runtime->buffer' sound/core/rawmidi.c

          grep -Fq -- '- Resolved conflicts: 28' Documentation/miru/lts-4.14.190-conflicts.md
          grep -Fq -- '- Remaining conflicts: 0' Documentation/miru/lts-4.14.190-conflicts.md
          grep -Fq 'None. All 28 merge conflicts now have explicit source-level resolutions.' Documentation/miru/lts-4.14.190-conflicts.md

          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Commit and push Step 10
        if: steps.final_validation.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git commit \
            -m "lts: resolve ALSA compress and rawmidi conflicts" \
            -m "Apply Android 4.14.190 partial-drain state tracking while preserving H.40 compressed-audio ioctls, error work and snd_compress_free export. Integrate raw-MIDI buffer reference tracking and zero initialization with H.40's realloc mutex, using a separate zeroed allocation and complete IRQ/mutex cleanup instead of the unsafe mechanical __krealloc merge. Mark all 28 conflicts explicitly resolved and remove temporary Step 10 tooling."
          git push origin HEAD:h40-miru-lts-4.14.190

      - name: Report branch tip
        if: always()
        run: |
          git log -1 --decorate --oneline
          git show --stat --oneline --summary HEAD
