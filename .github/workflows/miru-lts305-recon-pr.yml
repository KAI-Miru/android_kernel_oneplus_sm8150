# Trigger guarded RNDIS target-equivalence validation after preflight.
name: Miru H.40 4.14.305 RNDIS bounds equivalence

on:
  push:
    branches:
      - miru-h40-lts305-integration

permissions:
  contents: write
  statuses: write

jobs:
  resolve-rndis-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate equivalence, compile, reverse, document and guarded-push
        shell: bash
        run: bash scripts/miru/lts305_apply_rndis_equivalence_resolution.sh

      - name: Upload RNDIS equivalence diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-rndis-equivalence-${{ github.run_id }}
          path: lts305-rndis-target-equivalence
          if-no-files-found: error
          retention-days: 14
