name: Miru H.40 4.14.305 conflict history

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  audit-conflict-history:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Collect target and downstream history
        shell: bash
        run: bash scripts/miru/lts305_conflict_history.sh

      - name: Upload conflict-history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-conflict-history-${{ github.run_id }}
          path: lts305-conflict-history
          if-no-files-found: error
          retention-days: 14
