# Push-only helper; never target production through a pull request.
# Launching guarded mailbox polling-timer resolution validation.
name: Miru H.40 4.14.305 mailbox resolution

on:
  push:
    branches:
      - miru-h40-lts305-integration

permissions:
  contents: write
  statuses: write

jobs:
  resolve-mailbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              'state': 'pending',
              'context': 'miru/lts305-mailbox-resolution',
              'description': f"run {os.environ['GITHUB_RUN_ID']} is validating",
              'target_url': os.environ['RUN_URL'],
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}"

      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve, compile, reverse, document and guarded-push
        shell: bash
        run: bash scripts/miru/lts305_apply_mailbox_resolution_v2.sh

      - name: Upload mailbox resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-mailbox-resolution-${{ github.run_id }}
          path: lts305-mailbox-resolution
          if-no-files-found: error
          retention-days: 14

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          case "${JOB_STATUS}" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          export state
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              'state': os.environ['state'],
              'context': 'miru/lts305-mailbox-resolution',
              'description': f"run {os.environ['GITHUB_RUN_ID']} finished: {os.environ['JOB_STATUS']}",
              'target_url': os.environ['RUN_URL'],
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}"
