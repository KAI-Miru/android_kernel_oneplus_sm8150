# Scaffold launch is based on verified ledger ff5db9a60f5eedb4e6b1215ffd5e5e0f0e6c65d3.
name: Miru H.40 4.14.305 scaffold

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  create-authentic-scaffold:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Create and guarded-push authentic scaffold
        shell: bash
        run: bash scripts/miru/lts305_create_scaffold.sh

      - name: Upload scaffold diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-scaffold-${{ github.run_id }}
          path: lts305-scaffold
          if-no-files-found: error
          retention-days: 14
