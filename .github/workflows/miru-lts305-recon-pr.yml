# Launch uses an authentic disposable-worktree merge preview.
name: Miru H.40 4.14.305 ARM64 resolution

on:
  push:
    branches:
      - miru-h40-lts305-integration

permissions:
  contents: write

jobs:
  resolve-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve, compile, reverse, document and guarded-push
        shell: bash
        run: bash scripts/miru/lts305_arm64_resolution_ci.sh

      - name: Upload ARM64 resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-arm64-resolution-${{ github.run_id }}
          path: lts305-arm64-resolution
          if-no-files-found: error
          retention-days: 14
