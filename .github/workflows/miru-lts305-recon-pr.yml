# Trigger guarded DWC3 core validation after provenance parsing correction.
name: Miru H.40 4.14.305 DWC3 core lifecycle resolution

on:
  push:
    branches:
      - miru-h40-lts305-integration

permissions:
  contents: write
  statuses: write

jobs:
  resolve-dwc3-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve, validate, reverse, document and guarded-push
        shell: bash
        run: bash scripts/miru/lts305_apply_dwc3_core_resolution.sh

      - name: Upload DWC3 core resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-dwc3-core-resolution-${{ github.run_id }}
          path: lts305-dwc3-core-resolution
          if-no-files-found: error
          retention-days: 14
