name: Miru H.40 4.14.305 ARM64 resolution

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  resolve-arm64:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve, compile, reverse, document and guarded-push
        shell: bash
        run: bash scripts/miru/lts305_apply_arm64_resolution.sh

      - name: Upload ARM64 resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-arm64-resolution-${{ github.run_id }}
          path: lts305-arm64-resolution
          if-no-files-found: error
          retention-days: 14
