# Re-run scoped guarded xHCI audit through the xHCI Kbuild directory.
name: Miru H.40 4.14.305 xHCI lifecycle and LPM resolution

on:
  push:
    branches:
      - miru-h40-lts305-integration
    paths:
      - scripts/miru/lts305_apply_xhci_resolution.sh
      - .github/workflows/miru-lts305-recon-pr.yml

permissions:
  contents: write
  statuses: write

jobs:
  resolve-xhci:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve, validate, reverse, document and guarded-push
        shell: bash
        run: bash scripts/miru/lts305_apply_xhci_resolution.sh

      - name: Upload xHCI resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-xhci-resolution-${{ github.run_id }}
          path: lts305-xhci-resolution
          if-no-files-found: error
          retention-days: 14
