# Trigger guarded netfilter queue header validation after helper installation.
name: Miru H.40 4.14.305 netfilter queue header resolution

on:
  push:
    branches:
      - miru-h40-lts305-integration

permissions:
  contents: write
  statuses: write

jobs:
  resolve-nf-queue-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve, validate, reverse, document and guarded-push
        shell: bash
        run: bash scripts/miru/lts305_apply_nf_queue_header_resolution.sh

      - name: Upload netfilter queue header resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-nf-queue-header-resolution-${{ github.run_id }}
          path: lts305-nf-queue-header-resolution
          if-no-files-found: error
          retention-days: 14
