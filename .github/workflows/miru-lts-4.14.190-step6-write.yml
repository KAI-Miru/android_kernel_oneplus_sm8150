name: Miru LTS 4.14.190 Step 6 UFS write

on:
  pull_request:
    branches:
      - h40-miru-module-compat-test
    types:
      - synchronize

permissions:
  contents: write

jobs:
  resolve-step-6:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'h40-miru-lts-4.14.190'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: h40-miru-lts-4.14.190
          fetch-depth: 50
          sparse-checkout: |
            .github/workflows
            Documentation/miru
            scripts/miru
            drivers/scsi/ufs
          sparse-checkout-cone-mode: true

      - name: Configure Git
        run: |
          git config user.name "Miru LTS Integration"
          git config user.email "110590275+Benetsu@users.noreply.github.com"

      - name: Check one-shot guard
        id: guard
        run: |
          if git log --all --grep='^lts: resolve Qualcomm UFS atomic dump conflict$' --format='%H' | grep -q .; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run guarded Step 6 resolver
        if: steps.guard.outputs.run == 'true'
        run: |
          set +e
          python3 scripts/miru/resolve_step6.py > "$RUNNER_TEMP/step6-resolver.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/step6-resolver.log"
          exit "$status"

      - name: Upload Step 6 resolver diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts-4.14.190-step6-resolver-diagnostics
          path: ${{ runner.temp }}/step6-resolver.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stage and validate Step 6
        id: final_validation
        if: steps.guard.outputs.run == 'true' && success()
        run: |
          set -euo pipefail

          git rm -f \
            scripts/miru/audit_step6.py \
            scripts/miru/resolve_step6.py \
            .github/workflows/miru-lts-4.14.190-step6-audit.yml \
            .github/workflows/miru-lts-4.14.190-step6-write.yml

          git add \
            drivers/scsi/ufs/ufs-qcom.c \
            Documentation/miru/lts-4.14.190-conflicts.md

          printf '%s\n' \
            '.github/workflows/miru-lts-4.14.190-step6-audit.yml' \
            '.github/workflows/miru-lts-4.14.190-step6-write.yml' \
            'Documentation/miru/lts-4.14.190-conflicts.md' \
            'drivers/scsi/ufs/ufs-qcom.c' \
            'scripts/miru/audit_step6.py' \
            'scripts/miru/resolve_step6.py' | sort > "$RUNNER_TEMP/expected.txt"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

          git diff --cached --check
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- \
            drivers/scsi/ufs/ufs-qcom.c \
            Documentation/miru/lts-4.14.190-conflicts.md

          grep -Fq '#include "ufshcd-crypto-qti.h"' drivers/scsi/ufs/ufs-qcom.c
          grep -Fq 'ufshcd_crypto_qti_set_vops(hba);' drivers/scsi/ufs/ufs-qcom.c
          grep -Fq 'ufs_qcom_force_mem_config' drivers/scsi/ufs/ufs-qcom.c
          grep -Fq 'ufs_qcom_full_reset' drivers/scsi/ufs/ufs-qcom.c
          grep -Fq 'ufs_qcom_update_sec_cfg' drivers/scsi/ufs/ufs-qcom.c
          grep -Fq 'ufs_qcom_pm_qos_init' drivers/scsi/ufs/ufs-qcom.c
          grep -Fq 'ufs_qcom_set_bus_vote' drivers/scsi/ufs/ufs-qcom.c
          grep -Fq 'clk_set_flags(clki->clk, CLKFLAG_RETAIN_MEM);' drivers/scsi/ufs/ufs-qcom.c
          test "$(sed -n '/static void ufs_qcom_dump_dbg_regs/,/^}/p' drivers/scsi/ufs/ufs-qcom.c | grep -Fc 'udelay(1000);')" = "5"
          test "$(sed -n '/static void ufs_qcom_dump_dbg_regs/,/^}/p' drivers/scsi/ufs/ufs-qcom.c | grep -Fc 'usleep_range(')" = "0"

          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Commit and push Step 6
        if: steps.final_validation.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git commit \
            -m "lts: resolve Qualcomm UFS atomic dump conflict" \
            -m "Preserve the complete H.40 Qualcomm UFS host, QTI ICE, secure-config, bus-vote, PM QoS, clock, regulator, PHY, reset, debugfs and suspend/resume implementation. Apply Android 4.14.190's atomic-context fix by replacing five sleepable delays in ufs_qcom_dump_dbg_regs() with udelay(1000). Update the ledger to 20 of 28 conflicts resolved and remove temporary Step 6 tooling."
          git push origin HEAD:h40-miru-lts-4.14.190

      - name: Report branch tip
        if: always()
        run: |
          git log -1 --decorate --oneline
          git show --stat --oneline --summary HEAD
