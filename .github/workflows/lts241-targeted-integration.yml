name: Temporary targeted LTS 4.14.241 integration

on:
  pull_request:
    branches: [automation/lts241-resolve-runner-20260721]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  semantic-resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout helper runner with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fix generated source and preserve file modes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          resolver = Path('scripts/miru/lts241_semantic_resolve.py')
          text = resolver.read_text()
          replacements = {
              '"failed to put link in Recovery\\n"':
                  '"failed to put link in Recovery\\\\n"',
              '"failed to send transfer wakeup\\n"':
                  '"failed to send transfer wakeup\\\\n"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing generated DWC3 string: {old!r}')
              text = text.replace(old, new, 1)

          marker = "resolve('drivers/usb/dwc3/gadget.c',[dwc3_gadget])\n"
          addition = dedent(r'''
              p=DST/'drivers/usb/dwc3/gadget.c'
              s=p.read_text()
              duplicate=''' + "'''" + r'''
              \tcase DWC3_LINK_STATE_U2:\t/* in HS, means Sleep (L1) */
              \tcase DWC3_LINK_STATE_U1:
              \tcase DWC3_LINK_STATE_RESUME:
              \t\tbreak;
              \tcase DWC3_LINK_STATE_U1:
              ''' + "'''" + r'''
              combined=''' + "'''" + r'''
              \tcase DWC3_LINK_STATE_U2:\t/* in HS, means Sleep (L1) */
              \tcase DWC3_LINK_STATE_RESUME:
              \t\tbreak;
              \tcase DWC3_LINK_STATE_U1:
              ''' + "'''" + r'''
              if s.count(duplicate)!=1:
                  raise RuntimeError('DWC3 clean-merge U1 collision')
              s=s.replace(duplicate,combined,1)
              p.write_text(s)
          ''').lstrip()
          if marker not in text:
              raise SystemExit('missing DWC3 resolver marker')
          text = text.replace(marker, marker + addition, 1)
          resolver.write_text(text)

          transaction = Path('scripts/miru/lts241_targeted_integration.sh')
          text = transaction.read_text()
          old = '      install -D -m 0644 "${RESOLVE_ROOT}/${path}" "${KERNEL_WORKTREE}/${path}"'
          new = '      mkdir -p "${KERNEL_WORKTREE}/$(dirname "${path}")"\n      cp "${RESOLVE_ROOT}/${path}" "${KERNEL_WORKTREE}/${path}"'
          if old not in text:
              raise SystemExit('missing source installation line')
          transaction.write_text(text.replace(old, new, 1))
          PY

      - name: Resolve, reverse-check and compile every conflict batch
        run: bash scripts/miru/lts241_targeted_integration.sh

      - name: Upload semantic-resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts241-semantic-${{ github.run_id }}
          path: resolution-diagnostics
          if-no-files-found: error
          retention-days: 30
