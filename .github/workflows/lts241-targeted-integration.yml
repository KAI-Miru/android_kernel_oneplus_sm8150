name: Temporary targeted LTS 4.14.241 integration

on:
  pull_request:
    branches: [automation/lts241-resolve-runner-20260721]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  semantic-resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout helper runner with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prepare audited semantic resolver
        run: |
          mkdir -p resolution-diagnostics
          exec > >(tee resolution-diagnostics/preparation.log) 2>&1
          python3 -m py_compile scripts/miru/lts241_prepare_resolver.py
          python3 -m py_compile scripts/miru/lts241_prepare_selinux_clean_merge.py
          python3 -m py_compile scripts/miru/lts241_prepare_final_whitespace.py
          python3 scripts/miru/lts241_prepare_resolver.py
          python3 scripts/miru/lts241_prepare_selinux_clean_merge.py
          python3 scripts/miru/lts241_prepare_final_whitespace.py
          python3 -m py_compile scripts/miru/lts241_semantic_resolve.py
          bash -n scripts/miru/lts241_targeted_integration.sh
          grep -Fq 'LPFC_PATH="drivers/scsi/lpfc/lpfc_mbox.c"' scripts/miru/lts241_targeted_integration.sh
          grep -Fq "commit -m 'lts: clean up LPFC merge whitespace for 4.14.241'" scripts/miru/lts241_targeted_integration.sh

      - name: Resolve, reverse-check and compile every conflict batch
        run: bash scripts/miru/lts241_targeted_integration.sh

      - name: Upload semantic-resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts241-semantic-${{ github.run_id }}
          path: resolution-diagnostics
          if-no-files-found: error
          retention-days: 30
