name: Miru LTS 4.14.190 Step 8 networking write

on:
  pull_request:
    branches:
      - h40-miru-module-compat-test
    types:
      - synchronize

permissions:
  contents: write

jobs:
  resolve-step-8:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'h40-miru-lts-4.14.190'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: h40-miru-lts-4.14.190
          fetch-depth: 50
          sparse-checkout: |
            .github/workflows
            Documentation/miru
            scripts/miru
            include/net/netfilter
            include/net/netns
            net/netfilter
            net/ipv4
            net/qrtr
          sparse-checkout-cone-mode: true

      - name: Configure Git
        run: |
          git config user.name "Miru LTS Integration"
          git config user.email "110590275+Benetsu@users.noreply.github.com"

      - name: Check one-shot guard
        id: guard
        run: |
          if git log --all --grep='^lts: resolve conntrack IPv4 sysctl and QRTR conflicts$' --format='%H' | grep -q .; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run guarded Step 8 resolver
        if: steps.guard.outputs.run == 'true'
        run: |
          set +e
          python3 scripts/miru/resolve_step8.py > "$RUNNER_TEMP/step8-resolver.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/step8-resolver.log"
          exit "$status"

      - name: Upload Step 8 resolver diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts-4.14.190-step8-resolver-diagnostics
          path: ${{ runner.temp }}/step8-resolver.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stage and validate Step 8
        id: final_validation
        if: steps.guard.outputs.run == 'true' && success()
        run: |
          set -euo pipefail

          git rm -f \
            scripts/miru/audit_step8.py \
            scripts/miru/resolve_step8.py \
            .github/workflows/miru-lts-4.14.190-step8-audit.yml \
            .github/workflows/miru-lts-4.14.190-step8-write.yml

          git add \
            include/net/netfilter/nf_conntrack.h \
            net/ipv4/sysctl_net_ipv4.c \
            net/qrtr/qrtr.c \
            Documentation/miru/lts-4.14.190-conflicts.md

          printf '%s\n' \
            '.github/workflows/miru-lts-4.14.190-step8-audit.yml' \
            '.github/workflows/miru-lts-4.14.190-step8-write.yml' \
            'Documentation/miru/lts-4.14.190-conflicts.md' \
            'include/net/netfilter/nf_conntrack.h' \
            'net/ipv4/sysctl_net_ipv4.c' \
            'net/qrtr/qrtr.c' \
            'scripts/miru/audit_step8.py' \
            'scripts/miru/resolve_step8.py' | sort > "$RUNNER_TEMP/expected.txt"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

          git diff --cached --check
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- \
            include/net/netfilter/nf_conntrack.h \
            net/ipv4/sysctl_net_ipv4.c \
            net/qrtr/qrtr.c \
            Documentation/miru/lts-4.14.190-conflicts.md

          test "$(git hash-object include/net/netfilter/nf_conntrack.h)" = "7ce58cd24a8089f49cdaf4a04691abc1603a8a99"
          test "$(git hash-object net/ipv4/sysctl_net_ipv4.c)" = "11c4c837a98294c289e29d3b0de6979b49205516"
          test "$(git hash-object net/qrtr/qrtr.c)" = "67c9e413d9f09551b46f101cfab36fd8507555c4"

          grep -Fq 'struct { } __nfct_init_offset;' include/net/netfilter/nf_conntrack.h
          grep -Fq '#define OPLUS_FEATURE_WIFI_LUCKYMONEY' include/net/netfilter/nf_conntrack.h
          grep -Fq 'u32 oplus_app_uid;' include/net/netfilter/nf_conntrack.h
          grep -Fq 'void *sfe_entry;' include/net/netfilter/nf_conntrack.h
          grep -Fq '.data           = &init_net.ipv4.sysctl_tcp_default_init_rwnd,' net/ipv4/sysctl_net_ipv4.c
          grep -Fq '.proc_handler   = proc_dointvec_minmax,' net/ipv4/sysctl_net_ipv4.c
          grep -Fq '.procname' net/ipv4/sysctl_net_ipv4.c
          grep -Fq '"tcp_timestamps_control"' net/ipv4/sysctl_net_ipv4.c
          grep -Fq '"tcp_random_timestamp"' net/ipv4/sysctl_net_ipv4.c
          grep -Fq 'qrtr_local_enqueue(NULL, skb, type, from, to, flags);' net/qrtr/qrtr.c
          grep -Fq 'oplus_match_qrtr_service_port' net/qrtr/qrtr.c
          grep -Fq 'oplus_match_qrtr_wakeup' net/qrtr/qrtr.c
          grep -Fq 'qrtr_backup_init();' net/qrtr/qrtr.c
          grep -Fq 'sock_orphan(sk);' net/qrtr/qrtr.c
          grep -Fq 'sock->sk = NULL;' net/qrtr/qrtr.c

          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Commit and push Step 8
        if: steps.final_validation.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git commit \
            -m "lts: resolve conntrack IPv4 sysctl and QRTR conflicts" \
            -m "Apply Android 4.14.190's GCC-10-safe conntrack initialization marker, namespace the Android tcp_default_init_rwnd sysctl with native min/max handling, and fix QRTR's local leg after broadcast iteration. Preserve H.40 Oplus UID/SIP/SFE/NATTYPE conntrack fields, delayed-ACK and timestamp sysctls, modem wake accounting, service matching, IPC logging, emergency skb pools, forwarding and socket release ordering. Update the ledger to 25 of 28 conflicts resolved and remove temporary Step 8 tooling."
          git push origin HEAD:h40-miru-lts-4.14.190

      - name: Report branch tip
        if: always()
        run: |
          git log -1 --decorate --oneline
          git show --stat --oneline --summary HEAD
