name: Miru LTS 4.14.190 Step 9 THP audit

on:
  pull_request:
    branches:
      - h40-miru-module-compat-test
    types:
      - synchronize

permissions:
  contents: read

jobs:
  audit-step-9:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'h40-miru-lts-4.14.190'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: h40-miru-lts-4.14.190
          fetch-depth: 20
          sparse-checkout: |
            .github/workflows
            scripts/miru
            mm
            include/linux
            arch/arm64
            h40-repro/config
          sparse-checkout-cone-mode: true

      - name: Fetch comparison commits
        run: |
          git fetch --no-tags https://github.com/LineageOS/android_kernel_oneplus_sm8150.git \
            816f245a4e2afc92ac6119852e33524858410c41 \
            d2d05bcf4b4edf8d028fa420dee3c6644aa5b4ac \
            0190a01fb1cde1c2ba48e7836084bad818c14d94

      - name: Generate Step 9 audit
        run: python3 scripts/miru/audit_step9.py

      - name: Upload Step 9 audit
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts-4.14.190-step9-audit
          path: step9-audit
          if-no-files-found: error
          retention-days: 30
