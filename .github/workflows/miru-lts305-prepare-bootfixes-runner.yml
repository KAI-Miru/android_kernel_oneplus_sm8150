name: Run isolated Miru H.40 4.14.305 source preparation

on:
  pull_request:
    branches: [miru-h40-lts305-prep-anchor]
    paths:
      - .github/workflows/miru-lts305-prepare-bootfixes-runner.yml

permissions:
  contents: write

concurrency:
  group: miru-h40-lts305-bootfix-prebuild-pr-v2
  cancel-in-progress: true

jobs:
  prepare-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact preparation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Execute pinned source-only transformation
        shell: bash
        env:
          AUDITED_SHA: af61e9d6dfc33b7b46bfc608b20b6badf894ad23
          VALIDATED_SHA: 09abbe312c55a13dd2bf0d652bb5d658a64ed781
          PRODUCTION_SHA: 61371a1024e341f434deaf61b79a05f73827260a
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          WORKFLOW: .github/workflows/miru-lts305-prepare-bootfixes.yml
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/miru-lts305-prepare-bootfixes.yml').read_text().splitlines()
          marker = '        run: |'
          try:
              start = source.index(marker) + 1
          except ValueError:
              raise SystemExit('pinned source-preparation run block not found')

          lines = []
          for line in source[start:]:
              if line and not line.startswith('          '):
                  raise SystemExit(f'unexpected line outside run block: {line!r}')
              lines.append(line[10:] if line.startswith('          ') else '')

          script = '\n'.join(lines) + '\n'
          old = 'git rm "${WORKFLOW}"'
          new = ('git rm "${WORKFLOW}" '
                 '.github/workflows/miru-lts305-prepare-bootfixes-runner.yml')
          if script.count(old) != 1:
              raise SystemExit('unexpected workflow cleanup command count')
          script = script.replace(old, new, 1)
          if 'make ' in script or 'build-h40' in script or 'clang' in script:
              raise SystemExit('compilation command detected in source-only script')
          Path('/tmp/miru-lts305-prepare-source.sh').write_text(script)
          PY
          bash -n /tmp/miru-lts305-prepare-source.sh
          bash /tmp/miru-lts305-prepare-source.sh
