name: Miru H.40 Linux 4.14.291 source from proven 4.14.283 scaffold

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miru-h40-lts291-from-proven-283-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PRODUCTION_SHA: 61371a1024e341f434deaf61b79a05f73827260a
  SCAFFOLD_283_SHA: b581c659db87713eb2df1c29e4f28e337e5e908c
  COMMON_283_SHA: bc1a5b8c02ae4f3f821f3b325bad7bf87e679450
  STABLE_291_SHA: e548869f356fead9fdcb3562f52d2226574f4f41
  FDT_292_SHA: 3c2ae48eceaa40f1ecb18ba31dda3f6fe755796c
  TARGET_BRANCH: miru-h40-lts291-source-diag21

jobs:
  materialize-source:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact preparation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Advance proven 4.14.283 scaffold to complete 4.14.291
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          set -x
          mkdir -p source-generation-evidence
          trigger_sha="$(git rev-parse HEAD)"

          test "$(git ls-remote origin refs/heads/miru-h40 | awk '{print $1}')" = "${PRODUCTION_SHA}"
          test -z "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}")"
          git fetch --no-tags origin "${PRODUCTION_SHA}" "${SCAFFOLD_283_SHA}" "${COMMON_283_SHA}"

          if ! git remote get-url android-common >/dev/null 2>&1; then
            git remote add android-common https://github.com/aosp-mirror/kernel_common.git
          fi
          git fetch --no-tags android-common "${STABLE_291_SHA}" "${FDT_292_SHA}"

          test "$(git rev-parse "${SCAFFOLD_283_SHA}^1")" = "${PRODUCTION_SHA}"
          test "$(git rev-parse "${SCAFFOLD_283_SHA}^2")" = "${COMMON_283_SHA}"
          git merge-base --is-ancestor "${PRODUCTION_SHA}" "${SCAFFOLD_283_SHA}"
          test "$(git show "${SCAFFOLD_283_SHA}:Makefile" | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 283
          test "$(git show "${COMMON_283_SHA}:Makefile" | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 283

          stable_283_sha="$(git rev-parse "${COMMON_283_SHA}^2")"
          test "$(git show -s --format=%s "${stable_283_sha}")" = 'Linux 4.14.283'
          test "$(git show -s --format=%s "${STABLE_291_SHA}")" = 'Linux 4.14.291'
          test "$(git show "${STABLE_291_SHA}:Makefile" | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 291
          git merge-base --is-ancestor "${stable_283_sha}" "${STABLE_291_SHA}"
          git merge-base --is-ancestor "${STABLE_291_SHA}" "${FDT_292_SHA}"
          if git merge-base --is-ancestor "${FDT_292_SHA}" "${STABLE_291_SHA}"; then
            echo '4.14.292 FDT transition is present in the 4.14.291 endpoint' >&2
            exit 1
          fi

          source_wt="${RUNNER_TEMP}/miru-291-from-proven-283"
          rm -rf "${source_wt}"
          git worktree add --detach "${source_wt}" "${SCAFFOLD_283_SHA}"
          git -C "${source_wt}" config user.name github-actions[bot]
          git -C "${source_wt}" config user.email 41898282+github-actions[bot]@users.noreply.github.com

          set +e
          git -C "${source_wt}" merge --no-commit --no-ff "${STABLE_291_SHA}" \
            > source-generation-evidence/stable-283-to-291-merge.log 2>&1
          merge_rc=$?
          set -e
          printf '%s\n' "${merge_rc}" > source-generation-evidence/merge-exit-code.txt
          git -C "${source_wt}" diff --name-only --diff-filter=U | sort -u \
            > source-generation-evidence/conflicts.txt
          git -C "${source_wt}" ls-files -u \
            > source-generation-evidence/unmerged-index.txt
          git -C "${source_wt}" status --short \
            > source-generation-evidence/status.txt

          if [ "${merge_rc}" -ne 0 ]; then
            echo 'Stable 4.14.291 did not merge cleanly into the proven 4.14.283 scaffold.' >&2
            cat source-generation-evidence/conflicts.txt >&2
            exit 1
          fi
          test ! -s source-generation-evidence/conflicts.txt
          test ! -s source-generation-evidence/unmerged-index.txt
          test "$(sed -n 's/^SUBLEVEL = //p' "${source_wt}/Makefile" | head -n1)" = 291
          grep -Fq 'void *dt_virt = fixmap_remap_fdt(dt_phys);' "${source_wt}/arch/arm64/kernel/setup.c"
          ! grep -Fq 'fixmap_remap_fdt(dt_phys, &size, PAGE_KERNEL)' "${source_wt}/arch/arm64/kernel/setup.c"
          if git -C "${source_wt}" grep -nE '^(<<<<<<< .+|>>>>>>> .+)$' -- . \
              ':!Documentation' > source-generation-evidence/source-conflict-markers.txt; then
            cat source-generation-evidence/source-conflict-markers.txt >&2
            exit 1
          fi
          git -C "${source_wt}" diff --check

          export GIT_AUTHOR_DATE='2026-07-31T07:30:00Z'
          export GIT_COMMITTER_DATE='2026-07-31T07:30:00Z'
          git -C "${source_wt}" commit -m 'Merge complete Linux 4.14.291 after proven 4.14.283 diagnostic'
          source_sha="$(git -C "${source_wt}" rev-parse HEAD)"
          source_tree="$(git -C "${source_wt}" rev-parse 'HEAD^{tree}')"
          test "$(git -C "${source_wt}" rev-parse 'HEAD^1')" = "${SCAFFOLD_283_SHA}"
          test "$(git -C "${source_wt}" rev-parse 'HEAD^2')" = "${STABLE_291_SHA}"
          git -C "${source_wt}" merge-base --is-ancestor "${PRODUCTION_SHA}" HEAD
          git -C "${source_wt}" merge-base --is-ancestor "${STABLE_291_SHA}" HEAD
          if git -C "${source_wt}" merge-base --is-ancestor "${FDT_292_SHA}" HEAD; then
            echo '4.14.292 FDT transition unexpectedly entered final source' >&2
            exit 1
          fi

          {
            echo result=PASS
            echo "trigger_sha=${trigger_sha}"
            echo "production_sha=${PRODUCTION_SHA}"
            echo "proven_283_scaffold=${SCAFFOLD_283_SHA}"
            echo "android_common_283=${COMMON_283_SHA}"
            echo "stable_283_sha=${stable_283_sha}"
            echo "stable_291_sha=${STABLE_291_SHA}"
            echo "excluded_fdt_292_sha=${FDT_292_SHA}"
            echo "source_sha=${source_sha}"
            echo "source_tree=${source_tree}"
            echo source_sublevel=291
            echo unresolved_conflicts=0
          } | tee source-generation-evidence/SOURCE-SUMMARY.txt

          test "$(git ls-remote origin refs/heads/miru-h40 | awk '{print $1}')" = "${PRODUCTION_SHA}"
          test -z "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}")"
          git -C "${source_wt}" push origin "${source_sha}:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${source_sha}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Upload source-generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-4.14.291-source-from-proven-283-evidence
          path: source-generation-evidence
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
