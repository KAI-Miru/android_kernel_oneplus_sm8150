# SPDX-License-Identifier: GPL-2.0
name: Miru H.40 4.14.305 resolve final three conflicts

on:
  push:
    branches:
      - miru-h40-lts305-integration
    paths:
      - .github/workflows/miru-lts305-final3-resolve.yml

permissions:
  contents: write

jobs:
  resolve-final-three:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Decode audited source-only resolver
        shell: bash
        env:
          RESOLVER_B64: 
        run: |
          set -Eeuo pipefail
          printf '%s' "$RESOLVER_B64" | base64 -d | gzip -d > "$RUNNER_TEMP/lts305-final3-resolver.sh"
          chmod 0700 "$RUNNER_TEMP/lts305-final3-resolver.sh"
          bash -n "$RUNNER_TEMP/lts305-final3-resolver.sh"
          "$RUNNER_TEMP/lts305-final3-resolver.sh"

      - name: Upload source-only resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-final3-resolution-${{ github.run_id }}
          path: lts305-final3-resolution
          if-no-files-found: warn
          retention-days: 14
