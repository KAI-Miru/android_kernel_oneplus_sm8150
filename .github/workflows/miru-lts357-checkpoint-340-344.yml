name: Miru H.40 OpenELA stage 340 and 344 compile checkpoints

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/miru-lts357-checkpoint-340-344.yml'
      - 'scripts/miru/lts357/compile_checkpoint_340_344.sh'
      - 'scripts/miru/lts357/run_compile_checkpoint_340_344.sh'

permissions:
  contents: read

concurrency:
  group: miru-h40-lts357-checkpoint-340-344
  cancel-in-progress: true

jobs:
  compile-checkpoints:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'miru-h40-lts357-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify workflow source and run sequential checkpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          bash scripts/miru/lts357/run_compile_checkpoint_340_344.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miru-h40-openela-compile-checkpoints-${{ github.event.pull_request.head.sha }}
          path: integration-evidence/compile-checkpoints-340-344
          if-no-files-found: error
          retention-days: 30
