name: Miru H.40 memory Stage 4ABCD build

on:
  workflow_dispatch:
  push:
    branches:
      - miru-h40-mem-stage4abcd-ci-trigger
    paths:
      - '.github/workflows/miru-mem-stage4abcd-ci.yml'

permissions:
  contents: read

concurrency:
  group: miru-h40-memory-stage4abcd
  cancel-in-progress: true

env:
  SOURCE_BRANCH: miru-h40-mem-stage4abcd
  SOURCE_SHA_EXPECTED: a571718e6dc70ecfb9cff92b9f578cd76fa654f5
  VENDOR_SHA: 32fc97fdb660965ffd042650d832067e4e4f3f17
  VENDOR_BASE_SHA: c03a4c6339b959f1a9b288a157d5b5d16fbcf015
  EXPECTED_RELEASE: 4.14.357-openela-miru-h40-mem-s4abcd+

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Stage 4ABCD source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          path: source
          fetch-depth: 1

      - name: Validate Stage 4ABCD source
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA_EXPECTED}"
          grep -Fq '#define STAGE3A_RECLAIM_PAGES 256' mm/process_reclaim.c
          grep -Fq 'int min_idx = -1;' mm/process_reclaim.c
          grep -Fq 'if (min_idx >= 0)' mm/process_reclaim.c
          test -f scripts/miru/configure_mem_stage4.sh
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Generate Stage 4ABCD Clang build driver
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('source/scripts/miru/ci_build_4.14.190.sh')
          target = Path('build-stage4abcd.sh')
          text = source.read_text()

          start = text.index('# Fetch only the distant commits required by the source-level sanity checks.')
          end = text.index("# GitHub's Ubuntu image contains most dependencies already")
          text = text[:start] + text[end:]

          vendor_anchor = '''test -d "${VENDOR_SOURCE}/vendor"
          mkdir -p "${ANDROID_ROOT}/vendor"
          rsync -a "${VENDOR_SOURCE}/vendor/" "${ANDROID_ROOT}/vendor/"
          '''
          vendor_patch = '''test -d "${VENDOR_SOURCE}/vendor"
          STAGE4C_PATCH="${VENDOR_SOURCE}/vendor/oplus/kernel/oplus_performance/oplus_nandswap/stage4c-nandswap-lifetime-fixes.patch"
          NANDSWAP_CORE="${VENDOR_SOURCE}/vendor/oplus/kernel/oplus_performance/oplus_nandswap/nandswap_core.c"
          test -f "${STAGE4C_PATCH}"
          test -f "${NANDSWAP_CORE}"
          git -C "${VENDOR_SOURCE}" apply --check "${STAGE4C_PATCH}"
          git -C "${VENDOR_SOURCE}" apply "${STAGE4C_PATCH}"
          grep -Fq 'if (nswapdropd && nswapdropd->state == TASK_INTERRUPTIBLE)' "${NANDSWAP_CORE}"
          grep -Fq 'if (page_count(page) > 2)' "${NANDSWAP_CORE}"
          grep -Fq 'enqueue_reclaim_data(task_pid, &drop_info);' "${NANDSWAP_CORE}"
          mkdir -p "${ANDROID_ROOT}/vendor"
          rsync -a "${VENDOR_SOURCE}/vendor/" "${ANDROID_ROOT}/vendor/"
          '''
          if text.count(vendor_anchor) != 1:
              raise SystemExit(f'vendor patch anchor count={text.count(vendor_anchor)}')
          text = text.replace(vendor_anchor, vendor_patch, 1)

          final = '\n'.join([
              'cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb"',
              'printf \'%s\\n\' "${EXPECTED_RELEASE}" > "${ARTIFACT_DIR}/KERNEL-RELEASE.txt"',
              'printf \'%s\\n\' "${SOURCE_SHA}" > "${ARTIFACT_DIR}/SOURCE-SHA.txt"',
              'printf \'%s\\n\' "${VENDOR_SHA}" > "${ARTIFACT_DIR}/VENDOR-SHA.txt"',
              'sha256sum "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb" > "${ARTIFACT_DIR}/STAGE4ABCD-IMAGE-SHA256.txt"',
              'echo "Stage 4ABCD kernel build: PASS"',
          ])

          replacements = {
              'VENDOR_SHA=125ff7d0153cbb3aaa8f9fd618c33b7f728d7798': 'VENDOR_SHA=32fc97fdb660965ffd042650d832067e4e4f3f17',
              '== Miru H.40 Android 4.14.190 CI build ==': '== Miru H.40 memory Stage 4ABCD build ==',
              'KERNEL_LOCALVERSION=-miru-h40-lts190-ci1': 'KERNEL_LOCALVERSION=-miru-h40-mem-s4abcd',
              'CONFIG_LOCALVERSION="-miru-h40-lts190-ci1"': 'CONFIG_LOCALVERSION="-miru-h40-mem-s4abcd"',
              "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 '^Linux version 4\\.14\\.190-' || true)\"": "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 -F 'Linux version 4.14.357-openela-miru-h40-mem-s4abcd+' || true)\"",
              'cp "${DIAG_DIR}/sanity-summary.txt" "${ARTIFACT_DIR}/SANITY-SUMMARY.txt"': ': # Stage 4ABCD source validation is performed by the workflow',
              'echo "Clean kernel build and output validation: PASS"': final,
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'build-driver anchor count for {old!r}={text.count(old)}')
              text = text.replace(old, new, 1)

          target.write_text(text)
          target.chmod(0o755)
          PY
          bash -n build-stage4abcd.sh

      - name: Prepare Stage 4ABCD H.40 config
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          cp h40-repro/config/GM1911_11_H.40.config "${RUNNER_TEMP}/stage4abcd.config"
          bash scripts/miru/configure_mem_stage4.sh "${RUNNER_TEMP}/stage4abcd.config"

      - name: Build combined Stage 4ABCD candidate with Clang
        shell: bash
        working-directory: source
        env:
          STOCK_CONFIG: ${{ runner.temp }}/stage4abcd.config
        run: |
          set -Eeuo pipefail
          bash ../build-stage4abcd.sh

          cfg="${RUNNER_TEMP}/android-root/out/h40-kernel/.config"
          grep -Fxq 'CONFIG_HAVE_USERSPACE_LOW_MEMORY_KILLER=y' "${cfg}"
          grep -Fxq '# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set' "${cfg}"
          grep -Fxq 'CONFIG_PROCESS_RECLAIM_ENHANCE=y' "${cfg}"
          grep -Fxq 'CONFIG_ION_DEFER_FREE_NO_SCHED_IDLE=y' "${cfg}"
          grep -Fxq '# CONFIG_OPLUS_FEATURE_LOWMEM_DBG is not set' "${cfg}"
          grep -Fxq '# CONFIG_DEBUG_LIST is not set' "${cfg}"
          grep -Fxq '# CONFIG_KMALLOC_DEBUG is not set' "${cfg}"
          grep -Fxq '# CONFIG_VMALLOC_DEBUG is not set' "${cfg}"

          nandswap="${RUNNER_TEMP}/oneplus-sm8150-vendor-source/vendor/oplus/kernel/oplus_performance/oplus_nandswap/nandswap_core.c"
          grep -Fq 'if (nswapdropd && nswapdropd->state == TASK_INTERRUPTIBLE)' "${nandswap}"
          grep -Fq 'if (page_count(page) > 2)' "${nandswap}"
          grep -Fq 'enqueue_reclaim_data(task_pid, &drop_info);' "${nandswap}"

      - name: Upload Stage 4ABCD kernel
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: miru-h40-memory-stage4abcd-s4abcd
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/android-root/out/h40-artifacts/**
            source/build-diagnostics/**
