name: Miru H.40 execute OpenELA stage 2 to 4.14.344

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/miru-lts357-stage344-execute.yml'
      - 'scripts/miru/lts357/resolve_stage_344.py'
      - 'scripts/miru/lts357/run_stage_344_resolver.py'

permissions:
  contents: write

concurrency:
  group: miru-h40-lts357-stage344-execute
  cancel-in-progress: true

env:
  BRANCH: miru-h40-lts357-integration
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PRODUCTION: eb9451c0a1639e1aa49ee094681f98df0545f797
  STAGE1_MERGE: e714dcc91781cc51118b3761d5be1b74645cd9af
  OPENELA_PREVIOUS: 9b7ef2749ffa187d86acd0033327338c0fc299bf
  OPENELA_TARGET: 7a22fc46cc7a72d72b6dfdcbbc46e18c9f2caab0
  OPENELA_FINAL: 1e6347375d088ecc896aabb067131d0f9e3c0575
  MODULES_SHA: 3216c08bb3f97f865eb055296ea8034e1744caef

jobs:
  integrate-stage-344:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'miru-h40-lts357-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Verify live immutable inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/${BRANCH} | awk 'NR==1{print $1}')" = "${SOURCE_SHA}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${PRODUCTION}"
          test "$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/oneplus/sm8150_s_12.1_op7pro | awk 'NR==1{print $1}')" = "${MODULES_SHA}"
          git merge-base --is-ancestor "${PRODUCTION}" HEAD
          git merge-base --is-ancestor "${STAGE1_MERGE}" HEAD
          test "$(git rev-list --parents -n1 "${STAGE1_MERGE}" | awk '{print $3}')" = "${OPENELA_PREVIOUS}"

      - name: Fetch and verify exact bounded OpenELA history
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote add openela https://github.com/openela/kernel-lts.git
          git fetch --no-tags openela "${OPENELA_PREVIOUS}" "${OPENELA_TARGET}" "${OPENELA_FINAL}"
          git merge-base --is-ancestor "${OPENELA_PREVIOUS}" "${OPENELA_TARGET}"
          git merge-base --is-ancestor "${OPENELA_TARGET}" "${OPENELA_FINAL}"
          test "$(git show ${OPENELA_TARGET}:Makefile | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 344
          git merge-base --is-ancestor "${OPENELA_PREVIOUS}" HEAD
          ! git merge-base --is-ancestor "${OPENELA_TARGET}" HEAD
          ! git merge-base --is-ancestor "${OPENELA_FINAL}" HEAD

      - name: Create genuine reviewed stage-344 merge
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Miru H.40 Integration Bot'
          git config user.email '110590275+KAI-Miru@users.noreply.github.com'
          first="$(git rev-parse HEAD)"
          out=integration-evidence/stage-344
          mkdir -p "${out}"
          set +e
          git merge --no-ff --no-commit "${OPENELA_TARGET}" >"${out}/merge.stdout" 2>"${out}/merge.stderr"
          rc=$?
          set -e
          test "${rc}" -ne 0
          git diff --name-only --diff-filter=U | sort | tee "${out}/initial-conflicts.txt"
          cat >"${out}/expected-conflicts.txt" <<'EOF'
          drivers/android/binder.c
          fs/select.c
          include/net/netns/ipv4.h
          net/ipv4/sysctl_net_ipv4.c
          net/ipv4/tcp_ipv4.c
          net/netfilter/xt_owner.c
          sound/usb/stream.c
          EOF
          sed -i 's/^          //' "${out}/expected-conflicts.txt"
          cmp "${out}/expected-conflicts.txt" "${out}/initial-conflicts.txt"

          python3 scripts/miru/lts357/run_stage_344_resolver.py
          git add -A
          test -z "$(git ls-files -u)"
          git diff --cached --check
          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)" = 344
          test -z "$(find . -path ./.git -prune -o -type f \( -name '*.orig' -o -name '*.rej' \) -print)"
          if git grep -nE '^(<<<<<<< .+|>>>>>>> .+)$' -- . ':!Documentation/miru/lts-4.14.357-conflicts.md'; then
            exit 1
          fi

          grep -Fq 'thread->pid == current->pid && !thread->process_todo' drivers/android/binder.c
          grep -Fq 'wake_up_interruptible_sync(&thread->wait);' drivers/android/binder.c
          grep -Fq 'static int noinline_for_stack' fs/select.c
          grep -Fq 'int sysctl_tcp_early_retrans;' include/net/netns/ipv4.h
          grep -Fq '&init_net.ipv4.sysctl_tcp_early_retrans' net/ipv4/sysctl_net_ipv4.c
          ! grep -Fq $'\t\t.data\t\t= &sysctl_tcp_early_retrans,' net/ipv4/sysctl_net_ipv4.c
          grep -Fq 'net->ipv4.sysctl_tcp_early_retrans = 3;' net/ipv4/tcp_ipv4.c
          grep -Fq 'OPLUS_FEATURE_XTOWNER_INPUT' net/netfilter/xt_owner.c
          grep -Fq 'read_lock_bh(&sk->sk_callback_lock);' net/netfilter/xt_owner.c
          grep -Fq 'read_unlock_bh(&sk->sk_callback_lock);' net/netfilter/xt_owner.c
          grep -Fq 'XT_OWNER_SUPPL_GROUPS' net/netfilter/xt_owner.c
          grep -Fq 'NF_INET_LOCAL_IN' net/netfilter/xt_owner.c
          grep -Fq 'if (c == chmap->channels)' sound/usb/stream.c

          ! grep -Fq 'if (pm_runtime_suspended(dwc->dev)) {' drivers/usb/dwc3/gadget.c
          ! grep -Fq 'pm_runtime_get(dwc->dev);' drivers/usb/dwc3/gadget.c
          grep -Fq 'dwc3_interrupt(dwc->irq_gadget, dwc->ev_buf);' drivers/usb/dwc3/gadget.c
          grep -RqsF 'EXPORT_SYMBOL_GPL(extend_codec_i2s_be_dailinks);' .

          git commit -m 'Merge OpenELA Linux 4.14.344 into Miru H.40' \
            -m 'Integrate the cumulative OpenELA 4.14.340..4.14.344 range with seven reviewed Android, networking and USB-audio resolutions.'
          merge="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 HEAD)" = "${merge} ${first} ${OPENELA_TARGET}"
          git merge-base --is-ancestor "${PRODUCTION}" HEAD
          git merge-base --is-ancestor "${STAGE1_MERGE}" HEAD
          git merge-base --is-ancestor "${OPENELA_TARGET}" HEAD
          ! git merge-base --is-ancestor "${OPENELA_FINAL}" HEAD
          {
            echo "range=4.14.340..4.14.344"
            echo "merge=${merge}"
            echo "first_parent=${first}"
            echo "second_parent=${OPENELA_TARGET}"
            echo conflicts=7/7
            echo modules_sha=${MODULES_SHA}
            echo production_write=NONE
          } | tee "${out}/RESULT.txt"

      - name: Recheck production and push only integration branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${PRODUCTION}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/${BRANCH} | awk 'NR==1{print $1}')" = "${SOURCE_SHA}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${PRODUCTION}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miru-h40-openela-stage344-${{ env.SOURCE_SHA }}
          path: integration-evidence/stage-344
          if-no-files-found: error
          retention-days: 30
