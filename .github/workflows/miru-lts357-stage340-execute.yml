name: Miru H.40 execute OpenELA stage 1 to 4.14.340

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/miru-lts357-stage340-execute.yml'
      - 'scripts/miru/lts357/resolve_stage_340.py'
      - 'scripts/miru/lts357/run_stage_340_resolver.py'

permissions:
  contents: write

concurrency:
  group: miru-h40-lts357-stage340-execute
  cancel-in-progress: true

env:
  BRANCH: miru-h40-lts357-integration
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PRODUCTION: eb9451c0a1639e1aa49ee094681f98df0545f797
  OPENELA_BASE: c31e35278ea8f04f1dceadd77dca4dd7d47932a3
  OPENELA_TARGET: 9b7ef2749ffa187d86acd0033327338c0fc299bf
  OPENELA_FINAL: 1e6347375d088ecc896aabb067131d0f9e3c0575
  MODULES_SHA: 3216c08bb3f97f865eb055296ea8034e1744caef

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'miru-h40-lts357-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Verify live immutable inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/${BRANCH} | awk 'NR==1{print $1}')" = "${SOURCE_SHA}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${PRODUCTION}"
          test "$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/oneplus/sm8150_s_12.1_op7pro | awk 'NR==1{print $1}')" = "${MODULES_SHA}"
          git merge-base --is-ancestor "${PRODUCTION}" HEAD

      - name: Fetch and verify exact bounded OpenELA history
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote add openela https://github.com/openela/kernel-lts.git
          git fetch --no-tags openela "${OPENELA_BASE}" "${OPENELA_TARGET}" "${OPENELA_FINAL}"
          git merge-base --is-ancestor "${OPENELA_BASE}" "${OPENELA_TARGET}"
          git merge-base --is-ancestor "${OPENELA_TARGET}" "${OPENELA_FINAL}"
          test "$(git show ${OPENELA_TARGET}:Makefile | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 340
          ! git merge-base --is-ancestor "${OPENELA_TARGET}" HEAD
          ! git merge-base --is-ancestor "${OPENELA_FINAL}" HEAD

      - name: Create genuine reviewed merge
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Miru H.40 Integration Bot'
          git config user.email '110590275+KAI-Miru@users.noreply.github.com'
          first="$(git rev-parse HEAD)"
          mkdir -p integration-evidence/stage-340
          set +e
          git merge --no-ff --no-commit "${OPENELA_TARGET}" >integration-evidence/stage-340/merge.stdout 2>integration-evidence/stage-340/merge.stderr
          rc=$?
          set -e
          test "${rc}" -ne 0
          git diff --name-only --diff-filter=U | sort | tee integration-evidence/stage-340/initial-conflicts.txt
          test "$(wc -l < integration-evidence/stage-340/initial-conflicts.txt)" = 6
          python3 scripts/miru/lts357/run_stage_340_resolver.py
          git add -A
          test -z "$(git ls-files -u)"
          git diff --cached --check
          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)" = 340
          test -z "$(find . -path ./.git -prune -o -type f \( -name '*.orig' -o -name '*.rej' \) -print)"
          if git grep -nE '^(<<<<<<< .+|>>>>>>> .+)$' -- . ':!Documentation/miru/lts-4.14.357-conflicts.md'; then exit 1; fi
          git commit -m 'Merge OpenELA Linux 4.14.340 into Miru H.40' -m 'Integrate the cumulative OpenELA 4.14.336..4.14.340 range with six reviewed downstream resolutions.'
          merge="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 HEAD)" = "${merge} ${first} ${OPENELA_TARGET}"
          {
            echo "merge=${merge}"
            echo "first_parent=${first}"
            echo "second_parent=${OPENELA_TARGET}"
            echo conflicts=6/6
            echo production_write=NONE
          } | tee integration-evidence/stage-340/RESULT.txt

      - name: Push only integration branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${PRODUCTION}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/${BRANCH} | awk 'NR==1{print $1}')" = "${SOURCE_SHA}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${PRODUCTION}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miru-h40-openela-stage340-${{ env.SOURCE_SHA }}
          path: integration-evidence/stage-340
          if-no-files-found: error
          retention-days: 30
