# SPDX-License-Identifier: GPL-2.0
name: Miru H.40 4.14.305 final conflict merge view

on:
  push:
    branches:
      - miru-h40-lts305-integration
    paths:
      - .github/workflows/miru-lts305-final3-recon.yml

permissions:
  contents: write

jobs:
  final3-merge-view:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish three-way merge views without compiling
        shell: bash
        run: |
          set -Eeuo pipefail
          BRANCH=miru-h40-lts305-integration
          START_HEAD="$(git rev-parse HEAD)"
          OUT=Documentation/miru/lts305-final3-recon
          BASE=0eec6f6001d15bb1108835a642ec4637d75eef19
          TARGET=4415bf5e08942aee6487946a3e0a50956ef68f1e
          SCAFFOLD=b92a77e96dd54fd30f8f39c7eef23e76f211c515
          PATHS=(mm/memory.c net/ipv4/tcp_output.c net/ipv6/ip6_output.c)

          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)" = 305
          git merge-base --is-ancestor "$TARGET" HEAD

          for p in "${PATHS[@]}"; do
            safe="${p//\//__}"
            mkdir -p "$OUT/$safe"
            ours="$(mktemp)"
            base="$(mktemp)"
            theirs="$(mktemp)"
            git show "$SCAFFOLD:$p" > "$ours"
            git show "$BASE:$p" > "$base"
            git show "$TARGET:$p" > "$theirs"
            set +e
            git merge-file -p --diff3 -L MIRU -L BASE -L ANDROID "$ours" "$base" "$theirs" > "$OUT/$safe/three-way-merge.txt"
            rc=$?
            set -e
            test "$rc" -le 1
            echo "merge_file_exit=$rc" > "$OUT/$safe/three-way-status.txt"
            python3 - "$OUT/$safe/three-way-merge.txt" "$OUT/$safe/conflict-sections.txt" <<'PY'
          import sys
          from pathlib import Path
          src = Path(sys.argv[1]).read_text().splitlines()
          out = []
          i = 0
          while i < len(src):
              if src[i].startswith('<<<<<<< '):
                  start = max(0, i - 12)
                  j = i + 1
                  while j < len(src) and not src[j].startswith('>>>>>>> '):
                      j += 1
                  if j == len(src):
                      raise SystemExit('unterminated conflict marker')
                  end = min(len(src), j + 13)
                  out.extend(src[start:end])
                  out.append('\n--- conflict boundary ---\n')
                  i = end
              else:
                  i += 1
          Path(sys.argv[2]).write_text('\n'.join(out) + ('\n' if out else 'no conflicts\n'))
          PY
            rm -f "$ours" "$base" "$theirs"
          done

          {
            echo "head=$START_HEAD"
            echo "base=$BASE"
            echo "target=$TARGET"
            echo "scaffold=$SCAFFOLD"
            echo "compilation=not_performed"
          } > "$OUT/merge-view-identity.txt"
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          git diff --check
          git config user.name 'Miru LTS Integration Bot'
          git config user.email 'miru-lts-integration@users.noreply.github.com'
          git add -f -- "$OUT"
          git commit -m 'docs: record final 4.14.305 three-way merge views [skip ci]'
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$START_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Upload merge views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts305-final3-merge-view-${{ github.run_id }}
          path: Documentation/miru/lts305-final3-recon
          if-no-files-found: error
          retention-days: 14
