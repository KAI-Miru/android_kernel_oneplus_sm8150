name: Miru H.40 execute OpenELA stage 3 to 4.14.348

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/miru-lts357-stage348-execute.yml'
      - 'scripts/miru/lts357/resolve_stage_348.py'

permissions:
  contents: write

concurrency:
  group: miru-h40-lts357-stage348-execute
  cancel-in-progress: true

env:
  BRANCH: miru-h40-lts357-integration
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PRODUCTION: eb9451c0a1639e1aa49ee094681f98df0545f797
  STAGE2_MERGE: 4ca04340dfd5abd1b7e4d9b72c3f9223331cd118
  OPENELA_PREVIOUS: 7a22fc46cc7a72d72b6dfdcbbc46e18c9f2caab0
  OPENELA_TARGET: ef4cb0aa8addc73e6257039a17061cb1766b7477
  OPENELA_FINAL: 1e6347375d088ecc896aabb067131d0f9e3c0575
  MODULES_SHA: 3216c08bb3f97f865eb055296ea8034e1744caef

jobs:
  integrate-stage-348:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'miru-h40-lts357-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Verify live immutable inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/${BRANCH} | awk 'NR==1{print $1}')" = "${SOURCE_SHA}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${PRODUCTION}"
          test "$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/oneplus/sm8150_s_12.1_op7pro | awk 'NR==1{print $1}')" = "${MODULES_SHA}"
          git merge-base --is-ancestor "${PRODUCTION}" HEAD
          git merge-base --is-ancestor "${STAGE2_MERGE}" HEAD
          test "$(git rev-list --parents -n1 "${STAGE2_MERGE}" | awk '{print $3}')" = "${OPENELA_PREVIOUS}"

      - name: Fetch and verify exact bounded OpenELA history
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote add openela https://github.com/openela/kernel-lts.git
          git fetch --no-tags openela "${OPENELA_PREVIOUS}" "${OPENELA_TARGET}" "${OPENELA_FINAL}"
          git merge-base --is-ancestor "${OPENELA_PREVIOUS}" "${OPENELA_TARGET}"
          git merge-base --is-ancestor "${OPENELA_TARGET}" "${OPENELA_FINAL}"
          test "$(git show ${OPENELA_TARGET}:Makefile | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 348
          git merge-base --is-ancestor "${OPENELA_PREVIOUS}" HEAD
          ! git merge-base --is-ancestor "${OPENELA_TARGET}" HEAD
          ! git merge-base --is-ancestor "${OPENELA_FINAL}" HEAD

      - name: Create genuine reviewed stage-348 merge
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Miru H.40 Integration Bot'
          git config user.email '110590275+KAI-Miru@users.noreply.github.com'
          first="$(git rev-parse HEAD)"
          out=integration-evidence/stage-348
          mkdir -p "${out}"

          set +e
          git merge --no-ff --no-commit "${OPENELA_TARGET}" >"${out}/merge.stdout" 2>"${out}/merge.stderr"
          rc=$?
          set -e
          test "${rc}" -ne 0
          git diff --name-only --diff-filter=U | sort | tee "${out}/initial-conflicts.txt"
          cat >"${out}/expected-conflicts.txt" <<'EOF'
          fs/aio.c
          mm/memory-failure.c
          mm/page_alloc.c
          net/core/filter.c
          EOF
          sed -i 's/^          //' "${out}/expected-conflicts.txt"
          cmp "${out}/expected-conflicts.txt" "${out}/initial-conflicts.txt"

          python3 scripts/miru/lts357/resolve_stage_348.py
          git add -A
          test -z "$(git ls-files -u)"
          git diff --cached --check
          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)" = 348
          test -z "$(find . -path ./.git -prune -o -type f \( -name '*.orig' -o -name '*.rej' \) -print)"
          if git grep -nE '^(<<<<<<< .+|>>>>>>> .+)$' -- . ':!Documentation/miru/lts-4.14.357-conflicts.md'; then
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          aio = Path('fs/aio.c').read_text()
          assert aio.index('if (!(iocb->ki_flags & IOCB_AIO_RW))') < aio.index('container_of(iocb, struct aio_kiocb, common)')
          assert 'WARN_ON_ONCE(!list_empty(&req->ki_list))' in aio
          mf = Path('mm/memory-failure.c').read_text()
          assert 'try_to_unmap(hpage, ttu, NULL)' in mf
          assert 'try_to_unmap(p, ttu, NULL)' not in mf
          pa = Path('mm/page_alloc.c').read_text()
          for needle in (
              'bool can_compact = gfp_compaction_allowed(gfp_mask);',
              'can_direct_reclaim && can_compact',
              'costly_order && (!can_compact ||',
              'lmk_kill_possible()) && can_compact',
              'OPLUS_FEATURE_HEALTHINFO',
              'should_compact_lmk_retry',
          ):
              assert needle in pa, needle
          filt = Path('net/core/filter.c').read_text()
          assert filt.count('skb_is_gso_sctp(skb)') >= 4
          assert filt.count('skb_decrease_gso_size(shinfo, len_diff)') >= 2
          assert filt.count('skb_increase_gso_size(shinfo, len_diff)') >= 2
          PY

          ! grep -Fq 'if (pm_runtime_suspended(dwc->dev)) {' drivers/usb/dwc3/gadget.c
          ! grep -Fq 'pm_runtime_get(dwc->dev);' drivers/usb/dwc3/gadget.c
          grep -Fq 'dwc3_interrupt(dwc->irq_gadget, dwc->ev_buf);' drivers/usb/dwc3/gadget.c
          grep -RqsF 'EXPORT_SYMBOL_GPL(extend_codec_i2s_be_dailinks);' .

          git commit -m 'Merge OpenELA Linux 4.14.348 into Miru H.40' \
            -m 'Integrate the cumulative OpenELA 4.14.344..4.14.348 range with four reviewed AIO, memory-management and BPF resolutions.'
          merge="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 HEAD)" = "${merge} ${first} ${OPENELA_TARGET}"
          git merge-base --is-ancestor "${PRODUCTION}" HEAD
          git merge-base --is-ancestor "${STAGE2_MERGE}" HEAD
          git merge-base --is-ancestor "${OPENELA_TARGET}" HEAD
          ! git merge-base --is-ancestor "${OPENELA_FINAL}" HEAD
          {
            echo 'range=4.14.344..4.14.348'
            echo "merge=${merge}"
            echo "first_parent=${first}"
            echo "second_parent=${OPENELA_TARGET}"
            echo 'conflicts=4/4'
            echo "modules_sha=${MODULES_SHA}"
            echo 'production_write=NONE'
          } | tee "${out}/RESULT.txt"

      - name: Recheck production and push only integration branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${PRODUCTION}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/${BRANCH} | awk 'NR==1{print $1}')" = "${SOURCE_SHA}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${PRODUCTION}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miru-h40-openela-stage348-${{ env.SOURCE_SHA }}
          path: integration-evidence/stage-348
          if-no-files-found: error
          retention-days: 30
