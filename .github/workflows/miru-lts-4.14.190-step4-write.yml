name: Miru LTS 4.14.190 Step 4 write

on:
  pull_request:
    branches:
      - h40-miru-module-compat-test
    types:
      - synchronize

permissions:
  contents: write

jobs:
  resolve-step-4:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'h40-miru-lts-4.14.190'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: h40-miru-lts-4.14.190
          fetch-depth: 50
          sparse-checkout: |
            .github/workflows
            Documentation/miru
            scripts/miru
            fs/crypto
            fs/f2fs
            fs/incfs
          sparse-checkout-cone-mode: true

      - name: Configure Git
        run: |
          git config user.name "Miru LTS Integration"
          git config user.email "110590275+Benetsu@users.noreply.github.com"

      - name: Check one-shot guard
        id: guard
        run: |
          if git log --all --grep='^lts: resolve fscrypt f2fs and incfs conflicts$' --format='%H' | grep -q .; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Android stable reference
        if: steps.guard.outputs.run == 'true'
        run: |
          git fetch --no-tags https://github.com/LineageOS/android_kernel_oneplus_sm8150.git \
            d2d05bcf4b4edf8d028fa420dee3c6644aa5b4ac

      - name: Run guarded Step 4 resolver
        if: steps.guard.outputs.run == 'true'
        run: |
          set +e
          python3 scripts/miru/adjust_step4_incfs_resolution.py
          adjust_status=$?
          if [ "$adjust_status" -ne 0 ]; then
            echo "IncFS policy adjustment failed" > "$RUNNER_TEMP/step4-resolver.log"
            exit "$adjust_status"
          fi
          python3 scripts/miru/resolve_step4.py > "$RUNNER_TEMP/step4-resolver.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/step4-resolver.log"
          exit "$status"

      - name: Upload Step 4 resolver diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts-4.14.190-step4-resolver-diagnostics
          path: ${{ runner.temp }}/step4-resolver.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stage and validate Step 4
        id: final_validation
        if: steps.guard.outputs.run == 'true' && success()
        run: |
          set +e
          log="$RUNNER_TEMP/step4-final-validation.log"
          {
            set -x
            git rm -f \
              scripts/miru/audit_step4.py \
              scripts/miru/resolve_step4.py \
              scripts/miru/adjust_step4_incfs_resolution.py \
              .github/workflows/miru-lts-4.14.190-step4-audit.yml \
              .github/workflows/miru-lts-4.14.190-step4-write.yml \
              .github/workflows/miru-lts-4.14.190-step4-incfs-diagnostic.yml || exit $?

            git add \
              fs/crypto/inline_crypt.c \
              fs/crypto/keyring.c \
              fs/f2fs/checkpoint.c \
              Documentation/miru/lts-4.14.190-conflicts.md || exit $?

            printf '%s\n' \
              '.github/workflows/miru-lts-4.14.190-step4-audit.yml' \
              '.github/workflows/miru-lts-4.14.190-step4-incfs-diagnostic.yml' \
              '.github/workflows/miru-lts-4.14.190-step4-write.yml' \
              'Documentation/miru/lts-4.14.190-conflicts.md' \
              'fs/crypto/inline_crypt.c' \
              'fs/crypto/keyring.c' \
              'fs/f2fs/checkpoint.c' \
              'scripts/miru/adjust_step4_incfs_resolution.py' \
              'scripts/miru/audit_step4.py' \
              'scripts/miru/resolve_step4.py' | sort > "$RUNNER_TEMP/expected.txt"
            git diff --cached --name-only | sort > "$RUNNER_TEMP/actual.txt" || exit $?
            echo '=== expected paths ==='
            cat "$RUNNER_TEMP/expected.txt"
            echo '=== actual paths ==='
            cat "$RUNNER_TEMP/actual.txt"
            diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt" || exit $?

            git diff --cached --check || exit $?
            if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- \
              fs/crypto/inline_crypt.c \
              fs/crypto/keyring.c \
              fs/f2fs/checkpoint.c \
              fs/incfs/data_mgmt.c \
              Documentation/miru/lts-4.14.190-conflicts.md; then
              echo 'Conflict marker found' >&2
              exit 1
            fi

            grep -Fq 'fscrypt_find_storage_type' fs/crypto/inline_crypt.c || exit $?
            grep -Fq 'bio->bi_crypt_context->is_ext4 = true' fs/crypto/inline_crypt.c || exit $?
            grep -Fq 'retry_count++ <= 3' fs/crypto/keyring.c || exit $?
            grep -Fq 'fscrypt_add_test_dummy_key' fs/crypto/keyring.c || exit $?
            grep -Fq 'bdev_set_turbo_write' fs/f2fs/checkpoint.c || exit $?
            grep -Fq 'f2fs_kvzalloc' fs/f2fs/checkpoint.c || exit $?
            grep -Fq 'bfc = incfs_alloc_bfc(mi, bf);' fs/incfs/data_mgmt.c || exit $?
            grep -Fq 'kfree(df->df_signature);' fs/incfs/data_mgmt.c || exit $?
            test "$(git hash-object fs/incfs/data_mgmt.c)" = "e0705be44fb2280fb65df30472368882fef136e3" || exit $?

            echo 'ready=true' >> "$GITHUB_OUTPUT"
          } > "$log" 2>&1
          status=$?
          cat "$log"
          exit "$status"

      - name: Upload Step 4 final validation diagnostics
        if: failure() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts-4.14.190-step4-final-diagnostics
          path: ${{ runner.temp }}/step4-final-validation.log
          if-no-files-found: warn
          retention-days: 30

      - name: Commit and push Step 4
        if: steps.final_validation.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git commit \
            -m "lts: resolve fscrypt f2fs and incfs conflicts" \
            -m "Preserve H.40 private-mode DUN sizing, ext4 crypto context handling, wrapped-secret retry behavior, UFSTW checkpoint hooks, and the mount-aware IncFS backing-context API. Add Android 4.14.190's IV_INO_LBLK_32 safety gate, keyring refactor and dummy-key support, and F2FS checkpoint fixes. Update the ledger to 15 of 28 conflicts resolved and remove all temporary Step 4 audit/resolver files."
          git push origin HEAD:h40-miru-lts-4.14.190

      - name: Report branch tip
        if: always()
        run: |
          git log -1 --decorate --oneline
          git show --stat --oneline --summary HEAD
