name: One-time Miru H.40 4.14.305 release cleanup

on:
  push:
    branches:
      - miru-h40-lts305-release
    paths:
      - .github/workflows/release-cleanup-once.yml

permissions:
  contents: write

concurrency:
  group: miru-h40-lts305-release-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact release head
        uses: actions/checkout@v4
        with:
          ref: miru-h40-lts305-release
          fetch-depth: 0
          persist-credentials: true

      - name: Remove temporary diagnostic infrastructure
        shell: bash
        env:
          BOOT_TESTED_SOURCE: 53f76796d1b68260507a83968a4a4bee3b89754f
          PRODUCTION_SHA: 61371a1024e341f434deaf61b79a05f73827260a
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = miru-h40-lts305-release
          git merge-base --is-ancestor "${BOOT_TESTED_SOURCE}" HEAD
          test "$(git ls-remote origin refs/heads/miru-h40 | awk '{print $1}')" = "${PRODUCTION_SHA}"

          find .github/workflows -maxdepth 1 -type f -name 'miru-lts305-*' -print -delete
          git rm -r --ignore-unmatch .github/miru-audit
          git rm -r --ignore-unmatch Documentation/miru/lts305-final3-recon
          git rm .github/workflows/release-cleanup-once.yml

          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'miru-lts305-*' -print -quit)"
          test ! -e .github/miru-audit
          test ! -e Documentation/miru/lts305-final3-recon
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove obsolete 4.14.305 diagnostic automation'
          git push origin HEAD:miru-h40-lts305-release
