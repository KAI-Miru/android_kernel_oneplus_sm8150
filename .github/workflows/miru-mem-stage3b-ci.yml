name: Miru H.40 memory Stage 3B build

on:
  workflow_dispatch:
  push:
    branches:
      - miru-h40-mem-stage3a-ci-trigger-r2
    paths:
      - '.github/workflows/miru-mem-stage3b-ci.yml'

permissions:
  contents: write

concurrency:
  group: miru-h40-memory-stage3b
  cancel-in-progress: true

env:
  SOURCE_BRANCH: miru-h40-mem-stage3b-kgsl-reclaim
  STAGE3A_SHA: 05a6ecb1ad43eeef5f4fa9eb42348008543fffa6
  VENDOR_SHA: c03a4c6339b959f1a9b288a157d5b5d16fbcf015
  EXPECTED_RELEASE: 4.14.357-openela-miru-h40-mem-s3b+

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Stage 3B source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          path: source
          fetch-depth: 0

      - name: Apply Stage 3B.1 allocator fix
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${STAGE3A_SHA}" || {
            if ! git grep -q 'static inline long __zone_watermark_unusable_free' -- mm/page_alloc.c; then
              echo "Unexpected Stage 3B source head: $(git rev-parse HEAD)" >&2
              exit 1
            fi
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path('mm/page_alloc.c')
          text = path.read_text()

          helper_sig = 'static inline long __zone_watermark_unusable_free(struct zone *z,'
          safe_fast = 'usable_free -= min(usable_free, reserved);'

          if helper_sig in text:
              if safe_fast not in text:
                  raise SystemExit('Stage 3B.1 helper exists without the negative-value safety fix')
              print('Stage 3B.1 already present; source is idempotent')
          else:
              marker = '''/*
           * Return true if free base pages are above 'mark'. For high-order checks it
           * will return true of the order-0 watermark is reached and there is at least
           * one free page of a suitable size. Checking now avoids taking the zone lock
           * to check in the allocation paths if no pages are free.
           */
          '''
              if text.count(marker) != 1:
                  raise SystemExit(f'watermark comment anchor count={text.count(marker)}')

              helper = '''static inline long __zone_watermark_unusable_free(struct zone *z,
          				unsigned int order, unsigned int alloc_flags)
          {
          	const bool alloc_harder = (alloc_flags & (ALLOC_HARDER|ALLOC_OOM));
          	long unusable_free = (1 << order) - 1;

          	/*
          	 * If the caller does not have rights to ALLOC_HARDER then subtract
          	 * the high-atomic reserves. This will over-estimate the size of the
          	 * atomic reserve but it avoids a search.
          	 */
          	if (likely(!alloc_harder))
          		unusable_free += z->nr_reserved_highatomic;

          #ifdef CONFIG_CMA
          	/* If allocation can't use CMA areas don't use free CMA pages */
          	if (!(alloc_flags & ALLOC_CMA))
          		unusable_free += zone_page_state(z, NR_FREE_CMA_PAGES);
          #endif

          	return unusable_free;
          }

          '''
              text = text.replace(marker, helper + marker, 1)

              old_initial = '''	/* free_pages may go negative - that's OK */
          	free_pages -= (1 << order) - 1;

          	if (alloc_flags & ALLOC_HIGH)
          		min -= min / 2;

          	/*
          	 * If the caller does not have rights to ALLOC_HARDER then subtract
          	 * the high-atomic reserves. This will over-estimate the size of the
          	 * atomic reserve but it avoids a search.
          	 */
          	if (likely(!alloc_harder)) {
          		free_pages -= z->nr_reserved_highatomic;
          	} else {
          		/*
          		 * OOM victims can try even harder than normal ALLOC_HARDER
          		 * users on the grounds that it's definitely going to be in
          		 * the exit path shortly and free memory. Any allocation it
          		 * makes during the free path will be small and short-lived.
          		 */
          		if (alloc_flags & ALLOC_OOM)
          			min -= min / 2;
          		else
          			min -= min / 4;
          	}


          #ifdef CONFIG_CMA
          	/* If allocation can't use CMA areas don't use free CMA pages */
          	if (!(alloc_flags & ALLOC_CMA))
          		free_pages -= zone_page_state(z, NR_FREE_CMA_PAGES);
          #endif
          '''
              new_initial = '''	/* free_pages may go negative - that's OK */
          	free_pages -= __zone_watermark_unusable_free(z, order, alloc_flags);

          	if (alloc_flags & ALLOC_HIGH)
          		min -= min / 2;

          	if (unlikely(alloc_harder)) {
          		/*
          		 * OOM victims can try even harder than normal ALLOC_HARDER
          		 * users on the grounds that it's definitely going to be in
          		 * the exit path shortly and free memory. Any allocation it
          		 * makes during the free path will be small and short-lived.
          		 */
          		if (alloc_flags & ALLOC_OOM)
          			min -= min / 2;
          		else
          			min -= min / 4;
          	}
          '''
              if text.count(old_initial) != 1:
                  raise SystemExit(f'__zone_watermark_ok anchor count={text.count(old_initial)}')
              text = text.replace(old_initial, new_initial, 1)

              start = text.index('static inline bool zone_watermark_fast(struct zone *z, unsigned int order,')
              end = text.index('\nbool zone_watermark_ok_safe(', start)
              old_fast = text[start:end]
              new_fast = '''static inline bool zone_watermark_fast(struct zone *z, unsigned int order,
          		unsigned long mark, int classzone_idx, unsigned int alloc_flags)
          {
          	long free_pages = zone_page_state(z, NR_FREE_PAGES);

          	/*
          	 * Fast check for order-0 only. If this fails then the reserves
          	 * need to be calculated. Account for both CMA and high-atomic
          	 * reserves so normal allocations cannot consume emergency pages.
          	 */
          	if (!order) {
          		long usable_free;
          		long reserved;

          		usable_free = free_pages;
          		reserved = __zone_watermark_unusable_free(z, 0, alloc_flags);

          		/* reserved may over estimate high-atomic reserves. */
          		usable_free -= min(usable_free, reserved);
          		if (usable_free > mark + z->lowmem_reserve[classzone_idx])
          			return true;
          	}

          	return __zone_watermark_ok(z, order, mark, classzone_idx, alloc_flags,
          					free_pages);
          }
          '''
              if 'long cma_pages = 0;' not in old_fast:
                  raise SystemExit('unexpected zone_watermark_fast baseline')
              text = text[:start] + new_fast + text[end:]

              path.write_text(text)

          final = path.read_text()
          required = [
              helper_sig,
              'free_pages -= __zone_watermark_unusable_free(z, order, alloc_flags);',
              'reserved = __zone_watermark_unusable_free(z, 0, alloc_flags);',
              safe_fast,
          ]
          for token in required:
              if final.count(token) != 1:
                  raise SystemExit(f'final Stage 3B.1 token count for {token!r}={final.count(token)}')
          PY

          git diff --check
          if ! git diff --quiet; then
            git config user.name 'KAI-Miru'
            git config user.email '110590275+KAI-Miru@users.noreply.github.com'
            git add mm/page_alloc.c
            git commit -m 'mm: add Stage 3B.1 highatomic watermark protection'
            git push origin HEAD:"${SOURCE_BRANCH}"
          fi

          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          git show --stat --oneline --decorate -1

      - name: Generate Stage 3B Clang build driver
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('source/scripts/miru/ci_build_4.14.190.sh')
          target = Path('build-stage3b.sh')
          text = source.read_text()

          start = text.index('# Fetch only the distant commits required by the source-level sanity checks.')
          end = text.index("# GitHub's Ubuntu image contains most dependencies already")
          text = text[:start] + text[end:]

          final = '\n'.join([
              'cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb"',
              'printf \'%s\\n\' "${EXPECTED_RELEASE}" > "${ARTIFACT_DIR}/KERNEL-RELEASE.txt"',
              'printf \'%s\\n\' "${SOURCE_SHA}" > "${ARTIFACT_DIR}/SOURCE-SHA.txt"',
              'sha256sum "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb" > "${ARTIFACT_DIR}/STAGE3B-IMAGE-SHA256.txt"',
              'echo "Stage 3B kernel build: PASS"',
          ])

          replacements = {
              'VENDOR_SHA=125ff7d0153cbb3aaa8f9fd618c33b7f728d7798': 'VENDOR_SHA=c03a4c6339b959f1a9b288a157d5b5d16fbcf015',
              '== Miru H.40 Android 4.14.190 CI build ==': '== Miru H.40 memory Stage 3B build ==',
              'KERNEL_LOCALVERSION=-miru-h40-lts190-ci1': 'KERNEL_LOCALVERSION=-miru-h40-mem-s3b',
              'CONFIG_LOCALVERSION="-miru-h40-lts190-ci1"': 'CONFIG_LOCALVERSION="-miru-h40-mem-s3b"',
              "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 '^Linux version 4\\.14\\.190-' || true)\"": "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 -F 'Linux version 4.14.357-openela-miru-h40-mem-s3b+' || true)\"",
              'cp "${DIAG_DIR}/sanity-summary.txt" "${ARTIFACT_DIR}/SANITY-SUMMARY.txt"': ': # Stage 3B source validation intentionally disabled',
              'echo "Clean kernel build and output validation: PASS"': final,
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'build-driver anchor count for {old!r}: {count}')
              text = text.replace(old, new, 1)

          target.write_text(text)
          target.chmod(0o755)
          PY

          bash -n build-stage3b.sh

      - name: Prepare Stage 3B H.40 config
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          cp h40-repro/config/GM1911_11_H.40.config "${RUNNER_TEMP}/stage3b.config"
          scripts/config --file "${RUNNER_TEMP}/stage3b.config" \
            --enable HAVE_USERSPACE_LOW_MEMORY_KILLER \
            --disable ANDROID_LOW_MEMORY_KILLER \
            --disable ANDROID_LOW_MEMORY_KILLER_AUTODETECT_OOM_ADJ_VALUES \
            --enable ION_DEFER_FREE_NO_SCHED_IDLE

      - name: Build combined Stage 3B candidate with Clang
        shell: bash
        working-directory: source
        env:
          STOCK_CONFIG: ${{ runner.temp }}/stage3b.config
        run: |
          set -Eeuo pipefail
          bash ../build-stage3b.sh
          cfg="${RUNNER_TEMP}/android-root/out/h40-kernel/.config"
          grep -Fxq 'CONFIG_HAVE_USERSPACE_LOW_MEMORY_KILLER=y' "${cfg}"
          grep -Fxq '# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set' "${cfg}"
          grep -Fxq 'CONFIG_PROCESS_RECLAIM_ENHANCE=y' "${cfg}"
          grep -Fxq 'CONFIG_ION_DEFER_FREE_NO_SCHED_IDLE=y' "${cfg}"

      - name: Upload Stage 3B kernel
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: miru-h40-memory-stage3b-s3b
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/android-root/out/h40-artifacts/**
            source/build-diagnostics/**
