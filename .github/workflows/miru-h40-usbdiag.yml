name: Miru H.40 Linux 4.14.336 proper fixes

on:
  pull_request:
    branches: [miru-h40]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: miru-h40-lts336-properfix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PRODUCTION_HEAD: a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee
  ANDROID_COMMON_TARGET: 014241ad77dda0eafbdf671d5b8e86917d8ec97e
  AUTHENTIC_MERGE: e0fc49a4660130692e6ac893f8119282b0192b85
  SOURCE_SHA: a131a04930e81ed489396cb521710ef2efede08a
  PR_HEAD: ${{ github.event.pull_request.head.sha }}
  VALIDATOR_SHA: 9db1ff57feb92e9bed955f0395d9ea298ae13906
  VALIDATOR_BLOB: 6d5e44a57b611463b7f691710ccfb84e2e88123b
  WLAN_HELPER_BLOB: f8db305e54123f3b9a768d4fc32a418785838bb6
  MAKEFILE_BUILD_BLOB: ee3b37a3bf6a586b74fe00f9e39ca5e77f08b6d3
  EXPECTED_GADGET_BLOB: f897b4fbda584d473f8a96cdd4440e2b4425c782
  EXPECTED_CORE_BLOB: c32b5820619cf1db39d7cd91a48c7a8e62a05d78
  VENDOR_SHA: c39d346b16c864c506913e720cc71753423f95c0
  AUDIO_EXTEND_BLOB: 70c77c97efc73bed681c871c66409f1460905f69
  EXPECTED_RELEASE: 4.14.336-miru-h40-lts336-properfix1+
  EXPECTED_LOCALVERSION: miru-h40-lts336-properfix1

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts336-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD }}
          path: branch
          fetch-depth: 0

      - name: Checkout exact proper-fix source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0

      - name: Checkout reviewed production validator
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATOR_SHA }}
          path: control
          fetch-depth: 1

      - name: Verify exact source and fixes
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$(git -C branch rev-parse HEAD)" = "${PR_HEAD}"
          test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          git -C branch merge-base --is-ancestor "${SOURCE_SHA}" "${PR_HEAD}"
          printf '%s\n' .github/workflows/miru-h40-usbdiag.yml > expected-workflow-diff.txt
          git -C branch diff --name-only "${SOURCE_SHA}" "${PR_HEAD}" -- | sort > actual-workflow-diff.txt
          cmp expected-workflow-diff.txt actual-workflow-diff.txt

          test "$(git -C control hash-object scripts/miru/ci_validate_4.14.305.sh)" = "${VALIDATOR_BLOB}"
          test "$(git -C source hash-object scripts/miru/prepare_wlan_response_link.py)" = "${WLAN_HELPER_BLOB}"
          test "$(git -C source hash-object scripts/Makefile.build)" = "${MAKEFILE_BUILD_BLOB}"
          test "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')" = "${PRODUCTION_HEAD}"

          for ancestor in "${PRODUCTION_HEAD}" "${ANDROID_COMMON_TARGET}" "${AUTHENTIC_MERGE}"; do
            git -C source merge-base --is-ancestor "${ancestor}" "${SOURCE_SHA}"
          done
          test "$(sed -n 's/^SUBLEVEL = //p' source/Makefile | head -n 1)" = 336
          test -z "$(git -C source ls-files -u)"
          git -C source diff --check "${AUTHENTIC_MERGE}" "${SOURCE_SHA}" --

          test "$(git -C source hash-object drivers/usb/dwc3/gadget.c)" = "${EXPECTED_GADGET_BLOB}"
          test "$(git -C source hash-object drivers/usb/dwc3/core.c)" = "${EXPECTED_CORE_BLOB}"
          grep -Fq 'if (pm_runtime_suspended(dwc->dev))' source/drivers/usb/dwc3/gadget.c
          grep -Fq 'dwc->pending_events = true;' source/drivers/usb/dwc3/gadget.c
          grep -Fq 'disable_irq_nosync(dwc->irq_gadget);' source/drivers/usb/dwc3/gadget.c
          grep -Fq 'if (!dwc3_notify_event(dwc, DWC3_CORE_PM_RESUME_EVENT, 0)) {' source/drivers/usb/dwc3/core.c
          grep -Fq 'dwc3_gadget_process_pending_events(dwc);' source/drivers/usb/dwc3/core.c

          rm -rf audio-control
          git init -q audio-control
          git -C audio-control remote add origin \
            https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git
          git -C audio-control fetch -q --depth=1 --filter=blob:none origin "${VENDOR_SHA}"
          git -C audio-control checkout -q --detach FETCH_HEAD
          test "$(git -C audio-control rev-parse HEAD)" = "${VENDOR_SHA}"
          audio_path=vendor/oplus/kernel_4.14/audio/driver/audio_extend_drv.c
          test "$(git -C audio-control hash-object "${audio_path}")" = "${AUDIO_EXTEND_BLOB}"
          grep -Fq 'EXPORT_SYMBOL_GPL(extend_codec_i2s_be_dailinks);' "audio-control/${audio_path}"
          ! grep -Fq 'EXPORT_SYMBOL(extend_codec_i2s_be_dailinks);' "audio-control/${audio_path}"

          kcal_paths=(
            drivers/gpu/drm/msm/sde/sde_kcal_ctrl.c
            drivers/gpu/drm/msm/sde/sde_kcal_ctrl.h
            drivers/gpu/drm/msm/sde/sde_color_processing.c
            drivers/gpu/drm/msm/sde/sde_crtc.c
            drivers/gpu/drm/msm/msm_drv.c
            drivers/gpu/drm/msm/Makefile
            h40-repro/config/GM1911_11_H.40.config
          )
          for path in "${kcal_paths[@]}"; do
            test "$(git -C source rev-parse "${SOURCE_SHA}:${path}")" = \
              "$(git -C source rev-parse "${AUTHENTIC_MERGE}:${path}")"
          done

          {
            echo result=PASS
            echo "source_sha=${SOURCE_SHA}"
            echo "workflow_head=${PR_HEAD}"
            echo "production_head=${PRODUCTION_HEAD}"
            echo "gadget_blob=${EXPECTED_GADGET_BLOB}"
            echo "core_blob=${EXPECTED_CORE_BLOB}"
            echo "vendor_source_commit=${VENDOR_SHA}"
            echo "audio_extend_blob=${AUDIO_EXTEND_BLOB}"
            echo usb_fix=proper_4.14.336_pending_event_drain
            echo audio_fix=gpl_only_export
            echo production_write=NONE
          } | tee PROPER-FIX-SOURCE.txt

      - name: Adapt reviewed validator to proper-fix candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          validator=control/scripts/miru/ci_validate_4.14.305.sh
          helper=source/scripts/miru/prepare_wlan_response_link.py

          python3 - "${validator}" "${SOURCE_SHA}" "${EXPECTED_RELEASE}" "${EXPECTED_LOCALVERSION}" "${VENDOR_SHA}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source_sha, release, localversion, vendor_sha = sys.argv[2:]
          text = path.read_text()

          replacements = [
              ("af61e9d6dfc33b7b46bfc608b20b6badf894ad23", source_sha),
              ("61371a1024e341f434deaf61b79a05f73827260a", "a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee"),
              ("b92a77e96dd54fd30f8f39c7eef23e76f211c515", "e0fc49a4660130692e6ac893f8119282b0192b85"),
              ("4415bf5e08942aee6487946a3e0a50956ef68f1e", "014241ad77dda0eafbdf671d5b8e86917d8ec97e"),
              ("4.14.305", "4.14.336"),
              ("lts305", "lts336"),
              ("4.14.336-miru-h40-lts336-af61e9d-ci1+", release),
              ("miru-h40-lts336-af61e9d-ci1", localversion),
              ("= 305", "= 336"),
              ('= "305"', '= "336"'),
              ("- Initial authentic conflicts: **33**", "- Authentic conflicts: **14**"),
              ("- Index-resolved conflicts: **33**", "- Integration status: **COMPLETE — authentic candidate merge created**"),
              ("- Semantically resolved conflicts: **33**", "- Semantic resolutions: **14 of 14 complete**"),
              ("- Remaining semantic conflicts: **0**", "- Production promotion: **not authorized**"),
              ("conflicts=33/33", "conflicts=14/14"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing validator anchor: {old!r}")
              text = text.replace(old, new)

          escaped_old = "4" + chr(92) * 2 + ".14" + chr(92) * 2 + ".305"
          escaped_new = "4" + chr(92) * 2 + ".14" + chr(92) * 2 + ".336"
          if escaped_old not in text:
              raise SystemExit(f"missing escaped validator anchor: {escaped_old!r}")
          text = text.replace(escaped_old, escaped_new)

          top_vendor = "VENDOR_SHA=125ff7d0153cbb3aaa8f9fd618c33b7f728d7798"
          if text.count(top_vendor) != 1:
              raise SystemExit("validator vendor identity anchor mismatch")
          text = text.replace(top_vendor, f"VENDOR_SHA={vendor_sha}", 1)

          stable_pair = (
              "    ('STABLE_SHA=d2d05bcf4b4edf8d028fa420dee3c6644aa5b4ac',\n"
              "     'STABLE_SHA=014241ad77dda0eafbdf671d5b8e86917d8ec97e'),\n"
          )
          if text.count(stable_pair) != 1:
              raise SystemExit("embedded build-driver stable anchor mismatch")
          vendor_pair = (
              "    ('VENDOR_SHA=125ff7d0153cbb3aaa8f9fd618c33b7f728d7798',\n"
              f"     'VENDOR_SHA={vendor_sha}'),\n"
          )
          text = text.replace(stable_pair, stable_pair + vendor_pair, 1)

          if "305" in text or "lts305" in text:
              stale = [f"{i}: {line}" for i, line in enumerate(text.splitlines(), 1)
                       if "305" in line or "lts305" in line]
              raise SystemExit("stale 305 validator tokens:\n" + "\n".join(stale))

          exit_trap = "trap 'status=$?; echo \"exit_code=${status}\" > \"${REPORT_ROOT}/validation-exit-code.txt\"; exit \"${status}\"' EXIT\n"
          err_trap = "trap 'rc=$?; printf \"failed_line=%s\\nfailed_command=%s\\nfailed_rc=%s\\n\" \"$LINENO\" \"$BASH_COMMAND\" \"$rc\" | tee \"${REPORT_ROOT}/validation-error.txt\" >&2' ERR\n"
          if text.count(exit_trap) != 1:
              raise SystemExit("validator EXIT trap mismatch")
          text = text.replace(exit_trap, exit_trap + err_trap, 1)

          build_call = "bash scripts/miru/ci_build_4.14.190.sh"
          if text.count(build_call) != 1:
              raise SystemExit("kernel build invocation missing or duplicated")
          text = text.replace(build_call, "bash -x scripts/miru/ci_build_4.14.190.sh", 1)
          path.write_text(text)
          PY

          python3 - "${helper}" "${MAKEFILE_BUILD_BLOB}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          new_blob = sys.argv[2]
          text = path.read_text()
          old_blob = "74ce588c69513197a354ef0032c2145e91ee0641"
          if text.count(old_blob) != 1 or new_blob in text:
              raise SystemExit("WLAN helper identity mismatch")
          path.write_text(text.replace(old_blob, new_blob, 1))
          PY

          bash -n "${validator}"
          python3 -m py_compile "${helper}"
          grep -Fq "SOURCE_SHA=${SOURCE_SHA}" "${validator}"
          grep -Fq "EXPECTED_RELEASE=${EXPECTED_RELEASE}" "${validator}"
          grep -Fq "VENDOR_SHA=${VENDOR_SHA}" "${validator}"
          grep -Fq "KERNEL_LOCALVERSION=-${EXPECTED_LOCALVERSION}" "${validator}"

      - name: Build proper-fix kernel and matching modules
        id: build
        shell: bash
        run: |
          set +e
          bash control/scripts/miru/ci_validate_4.14.305.sh \
            "${GITHUB_WORKSPACE}/source" "${GITHUB_WORKSPACE}/control"
          status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [ "${status}" = 0 ]; then
            echo result=success >> "${GITHUB_OUTPUT}"
          else
            echo result=failure >> "${GITHUB_OUTPUT}"
          fi
          exit 0

      - name: Validate proper-fix outputs
        id: post
        if: always() && steps.build.outputs.result == 'success'
        shell: bash
        run: |
          set +e
          (
            set -Eeuo pipefail
            out="${RUNNER_TEMP}/android-root/out/h40-kernel"
            external="${RUNNER_TEMP}/miru-external-modules/dropin"
            report="${GITHUB_WORKSPACE}/properfix-post"
            mkdir -p "${report}"

            test "$(tr -d '\n' < "${out}/include/config/kernel.release")" = "${EXPECTED_RELEASE}"
            test -s "${out}/arch/arm64/boot/Image.gz-dtb"
            grep -Fq 'CONFIG_MODVERSIONS=y' "${out}/.config"

            mapfile -t in_tree < <(find "${out}" -type f -name '*.ko' | sort)
            mapfile -t extmods < <(find "${external}" -maxdepth 1 -type f -name '*.ko' | sort)
            test "${#in_tree[@]}" = 13
            test "${#extmods[@]}" = 32

            vermagic="${EXPECTED_RELEASE} SMP preempt mod_unload modversions aarch64"
            for module in "${in_tree[@]}"; do
              test "$(modinfo -F vermagic "${module}")" = "${vermagic}"
            done
            test "$(grep -F ": ${vermagic}" source/external-module-diagnostics/vermagic.txt | wc -l)" = 32
            grep -Fq 'modules=32' source/external-module-diagnostics/MODULE-ABI-REPORT.txt
            grep -Fq 'errors=0' source/external-module-diagnostics/MODULE-ABI-REPORT.txt

            audio_extend="${external}/audio_extend.ko"
            audio_machine="${external}/audio_machine_msmnile.ko"
            test -s "${audio_extend}"
            test -s "${audio_machine}"
            nm "${audio_extend}" > "${report}/audio-extend-nm.txt"
            grep -Eq '[[:space:]]__ksymtab_extend_codec_i2s_be_dailinks$' \
              "${report}/audio-extend-nm.txt"
            readelf --wide --section-headers "${audio_extend}" \
              > "${report}/audio-extend-sections.txt"
            grep -Fq '___ksymtab_gpl+extend_codec_i2s_be_dailinks' \
              "${report}/audio-extend-sections.txt"
            if grep -Fq '___ksymtab+extend_codec_i2s_be_dailinks' \
                "${report}/audio-extend-sections.txt"; then
              echo 'ordinary non-GPL export section unexpectedly present' >&2
              exit 1
            fi
            strings "${audio_machine}" > "${report}/audio-machine-strings.txt"
            grep -Fxq 'extend_codec_i2s_be_dailinks' "${report}/audio-machine-strings.txt"

            dtb_root="${out}/arch/arm64/boot/dts"
            projects=(18821 19801 19863 18865 18857)
            test "$(find "${dtb_root}" -type f -name '*.dtb' | wc -l)" = 5
            for project in "${projects[@]}"; do
              test -s "${dtb_root}/${project}/sm8150-v2-mtp.dtb"
            done
            test "$(find "${dtb_root}" -type f -name '*.dtbo' | wc -l)" = 0

            {
              echo result=PASS
              echo "source_sha=${SOURCE_SHA}"
              echo "workflow_head=${PR_HEAD}"
              echo "kernel_release=${EXPECTED_RELEASE}"
              echo "gadget_blob=${EXPECTED_GADGET_BLOB}"
              echo "core_blob=${EXPECTED_CORE_BLOB}"
              echo "vendor_source_commit=${VENDOR_SHA}"
              echo audio_gpl_export=PASS
              echo audio_symbol_reference=PASS
              echo dtb_count=5
              echo in_tree_modules=13
              echo external_modules=32
              echo external_abi_errors=0
              echo "production_head=${PRODUCTION_HEAD}"
              echo production_write=NONE
            } | tee "${report}/RESULT.txt"
          )
          status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [ "${status}" = 0 ]; then
            echo result=success >> "${GITHUB_OUTPUT}"
          else
            echo result=failure >> "${GITHUB_OUTPUT}"
          fi
          exit 0

      - name: Assemble and verify proper-fix package
        id: package
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outputs.result }}
          POST_RESULT: ${{ steps.post.outputs.result }}
        run: |
          set -Eeuo pipefail
          test "${BUILD_RESULT:-}" = success
          test "${POST_RESULT:-}" = success

          package="${GITHUB_WORKSPACE}/properfix-package"
          out="${RUNNER_TEMP}/android-root/out/h40-kernel"
          external="${RUNNER_TEMP}/miru-external-modules/dropin"
          dtb_root="${out}/arch/arm64/boot/dts"
          projects=(18821 19801 19863 18865 18857)

          rm -rf "${package}"
          mkdir -p "${package}/kernel" "${package}/modules/in-tree" \
            "${package}/modules/external" "${package}/archives" "${package}/dtb"

          test -s "${out}/arch/arm64/boot/Image.gz-dtb"
          test -s "${out}/include/config/kernel.release"
          test -s "${out}/Module.symvers"
          test -d "${external}"
          test "$(tr -d '\n' < "${out}/include/config/kernel.release")" = "${EXPECTED_RELEASE}"

          cp "${out}/arch/arm64/boot/Image.gz-dtb" "${package}/kernel/"
          cp "${out}/include/config/kernel.release" "${package}/kernel/"
          cp "${out}/Module.symvers" "${package}/kernel/"

          mapfile -t in_tree < <(find "${out}" -type f -name '*.ko' | sort)
          mapfile -t extmods < <(find "${external}" -maxdepth 1 -type f -name '*.ko' | sort)
          test "${#in_tree[@]}" = 13
          test "${#extmods[@]}" = 32

          for module in "${in_tree[@]}"; do
            rel="${module#${out}/}"
            mkdir -p "${package}/modules/in-tree/$(dirname "${rel}")"
            cp "${module}" "${package}/modules/in-tree/${rel}"
          done
          cp "${extmods[@]}" "${package}/modules/external/"

          for project in "${projects[@]}"; do
            mkdir -p "${package}/dtb/${project}"
            cp "${dtb_root}/${project}/sm8150-v2-mtp.dtb" \
              "${package}/dtb/${project}/"
          done

          test "$(find "${package}/modules/in-tree" -type f -name '*.ko' | wc -l)" = 13
          test "$(find "${package}/modules/external" -type f -name '*.ko' | wc -l)" = 32
          test "$(find "${package}/dtb" -type f -name '*.dtb' | wc -l)" = 5
          test "$(find "${package}/dtb" -type f -name '*.dtbo' | wc -l)" = 0

          tar -C "${package}/modules/in-tree" -czf \
            "${package}/archives/in-tree-modules.tar.gz" .
          tar -C "${package}/modules/external" -czf \
            "${package}/archives/external-modules.tar.gz" .
          tar -C "${package}/dtb" -czf \
            "${package}/archives/dtb-5-set.tar.gz" .

          cp PROPER-FIX-SOURCE.txt "${package}/"
          cp -a control/build-validation-result "${package}/"
          cp -a source/build-diagnostics "${package}/"
          cp -a source/external-module-diagnostics "${package}/"
          cp -a properfix-post "${package}/"

          {
            echo result=PASS
            echo flashable_candidate=yes
            echo physical_validation=pending
            echo "source_sha=${SOURCE_SHA}"
            echo "workflow_head=${PR_HEAD}"
            echo "vendor_sha=${VENDOR_SHA}"
            echo "kernel_release=${EXPECTED_RELEASE}"
            echo image=kernel/Image.gz-dtb
            echo in_tree_modules=13
            echo external_modules=32
            echo dtb_count=5
            echo production_write=NONE
          } > "${package}/VALIDATED-CANDIDATE.txt"

          (
            cd "${package}"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          test -s "${package}/kernel/Image.gz-dtb"
          test "$(tr -d '\n' < "${package}/kernel/kernel.release")" = "${EXPECTED_RELEASE}"
          echo result=success >> "${GITHUB_OUTPUT}"

      - name: Upload proper-fix candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-4.14.336-lts336-properfix1
          path: properfix-package
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Enforce complete proper-fix validation
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outputs.result }}
          POST_RESULT: ${{ steps.post.outputs.result }}
          PACKAGE_RESULT: ${{ steps.package.outputs.result }}
        run: |
          test "${BUILD_RESULT:-}" = success
          test "${POST_RESULT:-}" = success
          test "${PACKAGE_RESULT:-}" = success
