# SPDX-License-Identifier: GPL-2.0
name: Miru H.40 Linux 4.14.305 three-way audit

on:
  pull_request:
    branches:
      - miru-h40-lts305-prep-anchor
    paths:
      - .github/workflows/miru-lts305-threeway-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Run exact three-way source audit
        shell: bash
        run: |
          set -euo pipefail

          H40=180d787684d5965be5145bcfbf666ed427b4ea18
          MIRU269=61371a1024e341f434deaf61b79a05f73827260a
          MIRU305=53f76796d1b68260507a83968a4a4bee3b89754f
          COMMON269=0eec6f6001d15bb1108835a642ec4637d75eef19
          COMMON305=4415bf5e08942aee6487946a3e0a50956ef68f1e
          COMMON305_TAG=fb7d1aa1e00554d9ac07b2a6267f58e585569b81
          COMMON305_TREE=b13cdb6b1f31e75df2d2dddeed15b04dceeed939
          OUT="$GITHUB_WORKSPACE/threeway-audit"
          mkdir -p "$OUT"
          fatal=0

          git remote remove android-common 2>/dev/null || true
          git remote add android-common https://android.googlesource.com/kernel/common
          git fetch --no-tags --force android-common \
            "$COMMON269:refs/audit/common-269" \
            "$COMMON305:refs/audit/common-305"
          git fetch --force android-common \
            refs/tags/ASB-2023-02-05_4.14-stable:refs/tags/audit-common-305

          for object in "$H40" "$MIRU269" "$MIRU305" "$COMMON269" "$COMMON305"; do
            git cat-file -e "$object^{commit}"
          done

          {
            echo "H40=$H40"
            echo "MIRU269=$MIRU269"
            echo "MIRU305=$MIRU305"
            echo "COMMON269=$COMMON269"
            echo "COMMON305=$COMMON305"
            echo "COMMON305_TAG=$(git rev-parse refs/tags/audit-common-305)"
            echo "COMMON305_PEELED=$(git rev-parse refs/tags/audit-common-305^{commit})"
            echo "COMMON305_TREE=$(git rev-parse "$COMMON305^{tree}")"
            echo "H40_TREE=$(git rev-parse "$H40^{tree}")"
            echo "MIRU269_TREE=$(git rev-parse "$MIRU269^{tree}")"
            echo "MIRU305_TREE=$(git rev-parse "$MIRU305^{tree}")"
          } > "$OUT/IDENTITY.txt"

          test "$(git rev-parse refs/tags/audit-common-305)" = "$COMMON305_TAG" || fatal=1
          test "$(git rev-parse refs/tags/audit-common-305^{commit})" = "$COMMON305" || fatal=1
          test "$(git rev-parse "$COMMON305^{tree}")" = "$COMMON305_TREE" || fatal=1

          version_of() {
            git show "$1:Makefile" | awk '
              /^VERSION =/ {v=$3}
              /^PATCHLEVEL =/ {p=$3}
              /^SUBLEVEL =/ {s=$3}
              END {print v "." p "." s}'
          }
          {
            echo "pristine_h40=$(version_of "$H40")"
            echo "miru269=$(version_of "$MIRU269")"
            echo "miru305=$(version_of "$MIRU305")"
            echo "common269=$(version_of "$COMMON269")"
            echo "common305=$(version_of "$COMMON305")"
          } > "$OUT/VERSIONS.txt"
          test "$(version_of "$MIRU305")" = "4.14.305" || fatal=1
          test "$(version_of "$COMMON305")" = "4.14.305" || fatal=1

          check_ancestor() {
            local label=$1 older=$2 newer=$3
            if git merge-base --is-ancestor "$older" "$newer"; then
              printf 'PASS\t%s\t%s\t%s\n' "$label" "$older" "$newer"
            else
              printf 'FAIL\t%s\t%s\t%s\n' "$label" "$older" "$newer"
              fatal=1
            fi
          }
          {
            check_ancestor pristine_H40_is_in_Miru305 "$H40" "$MIRU305"
            check_ancestor Miru269_is_in_Miru305 "$MIRU269" "$MIRU305"
            check_ancestor Common269_is_in_Common305 "$COMMON269" "$COMMON305"
            check_ancestor Common269_is_in_Miru269 "$COMMON269" "$MIRU269"
            check_ancestor Common305_is_in_Miru305 "$COMMON305" "$MIRU305"
          } > "$OUT/ANCESTRY.tsv"

          git rev-list "$COMMON269..$COMMON305" > "$OUT/common-269-to-305.commits"
          common_commit_count=$(wc -l < "$OUT/common-269-to-305.commits")
          : > "$OUT/common-commits-missing-from-miru305.txt"
          while read -r commit; do
            git merge-base --is-ancestor "$commit" "$MIRU305" || \
              echo "$commit" >> "$OUT/common-commits-missing-from-miru305.txt"
          done < "$OUT/common-269-to-305.commits"
          missing_common_count=$(wc -l < "$OUT/common-commits-missing-from-miru305.txt")
          test "$missing_common_count" -eq 0 || fatal=1

          git log --format='%H%x09%s' --grep='^Merge 4\.14\.' \
            "$COMMON269..$COMMON305" > "$OUT/common-stable-endpoints.tsv"
          stable_endpoint_count=$(wc -l < "$OUT/common-stable-endpoints.tsv")

          exact_merge=""
          while read -r commit p1 p2 rest; do
            if [ "${p1:-}" = "$MIRU269" ] && [ "${p2:-}" = "$COMMON305" ] && [ -z "${rest:-}" ]; then
              exact_merge=$commit
              break
            fi
          done < <(git rev-list --parents "$MIRU269..$MIRU305")
          if [ -z "$exact_merge" ]; then
            echo "NOT FOUND" > "$OUT/EXACT-MERGE.txt"
            fatal=1
          else
            {
              echo "merge_commit=$exact_merge"
              echo "parents=$(git show -s --format='%P' "$exact_merge")"
              echo "tree=$(git rev-parse "$exact_merge^{tree}")"
              echo "subject=$(git show -s --format='%s' "$exact_merge")"
            } > "$OUT/EXACT-MERGE.txt"
            git merge-base --is-ancestor "$exact_merge" "$MIRU305" || fatal=1
          fi

          set +e
          git merge-tree --write-tree --messages "$MIRU269" "$COMMON305" \
            > "$OUT/merge-tree-reconstruction.txt" 2>&1
          merge_tree_rc=$?
          set -e
          grep '^CONFLICT' "$OUT/merge-tree-reconstruction.txt" \
            > "$OUT/reconstructed-conflict-messages.txt" || true
          reconstructed_conflict_count=$(wc -l < "$OUT/reconstructed-conflict-messages.txt")
          if [ "$reconstructed_conflict_count" -ne 33 ]; then
            fatal=1
          fi
          grep -Fq -- '- Initial authentic conflicts: **33**' \
            Documentation/miru/lts-4.14.305-conflicts.md || fatal=1
          grep -Fq -- '- Semantically resolved conflicts: **33**' \
            Documentation/miru/lts-4.14.305-conflicts.md || fatal=1
          grep -Fq -- '- Remaining semantic conflicts: **0**' \
            Documentation/miru/lts-4.14.305-conflicts.md || fatal=1

          git diff --name-only "$COMMON269" "$COMMON305" | sort -u \
            > "$OUT/common-269-to-305.paths"
          git diff --name-only "$COMMON269" "$MIRU269" | sort -u \
            > "$OUT/downstream-at-269.paths"
          comm -12 "$OUT/common-269-to-305.paths" "$OUT/downstream-at-269.paths" \
            > "$OUT/common-downstream-overlap.paths"
          comm -23 "$OUT/common-269-to-305.paths" "$OUT/downstream-at-269.paths" \
            > "$OUT/common-only.paths"
          comm -13 "$OUT/common-269-to-305.paths" "$OUT/downstream-at-269.paths" \
            > "$OUT/downstream-only.paths"

          common_path_count=$(wc -l < "$OUT/common-269-to-305.paths")
          downstream_path_count=$(wc -l < "$OUT/downstream-at-269.paths")
          overlap_path_count=$(wc -l < "$OUT/common-downstream-overlap.paths")
          common_only_count=$(wc -l < "$OUT/common-only.paths")
          downstream_only_count=$(wc -l < "$OUT/downstream-only.paths")

          cat > "$OUT/expected-final-compatibility.paths" <<'EOF'
          arch/arm64/kernel/cpu_errata.c
          drivers/char/random.c
          drivers/extcon/extcon.c
          drivers/of/fdt.c
          drivers/soc/qcom/early_random.c
          EOF
          sed -i 's/^[[:space:]]*//' "$OUT/expected-final-compatibility.paths"
          sort -u -o "$OUT/expected-final-compatibility.paths" \
            "$OUT/expected-final-compatibility.paths"

          oid_or_missing() {
            git rev-parse "$1:$2" 2>/dev/null || printf 'MISSING\n'
          }
          core_source_path() {
            case "$1" in
              arch/*|block/*|crypto/*|drivers/*|fs/*|include/*|init/*|ipc/*|kernel/*|lib/*|mm/*|net/*|security/*|sound/*|virt/*|Kbuild|Kconfig|Makefile)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          : > "$OUT/common-only-final-mismatches.tsv"
          : > "$OUT/common-only-expected-compatibility.tsv"
          : > "$OUT/common-only-UNEXPECTED-core-mismatches.tsv"
          while read -r path; do
            [ -n "$path" ] || continue
            common_oid=$(oid_or_missing "$COMMON305" "$path")
            miru_oid=$(oid_or_missing "$MIRU305" "$path")
            if [ "$common_oid" != "$miru_oid" ]; then
              printf '%s\t%s\t%s\n' "$path" "$common_oid" "$miru_oid" \
                >> "$OUT/common-only-final-mismatches.tsv"
              if grep -Fxq "$path" "$OUT/expected-final-compatibility.paths"; then
                printf '%s\t%s\t%s\n' "$path" "$common_oid" "$miru_oid" \
                  >> "$OUT/common-only-expected-compatibility.tsv"
              elif core_source_path "$path"; then
                printf '%s\t%s\t%s\n' "$path" "$common_oid" "$miru_oid" \
                  >> "$OUT/common-only-UNEXPECTED-core-mismatches.tsv"
              fi
            fi
          done < "$OUT/common-only.paths"
          unexpected_common_only_count=$(wc -l < "$OUT/common-only-UNEXPECTED-core-mismatches.tsv")
          test "$unexpected_common_only_count" -eq 0 || fatal=1

          H40_COMMON_BASE=$(git merge-base "$H40" "$COMMON305")
          echo "$H40_COMMON_BASE" > "$OUT/H40-COMMON-MERGE-BASE.txt"
          git diff --name-only "$H40_COMMON_BASE" "$H40" | sort -u \
            > "$OUT/pristine-h40-delta.paths"
          git diff --name-only "$H40_COMMON_BASE" "$COMMON305" | sort -u \
            > "$OUT/common-since-h40-base.paths"
          comm -23 "$OUT/pristine-h40-delta.paths" "$OUT/common-since-h40-base.paths" \
            > "$OUT/h40-only.paths"
          comm -12 "$OUT/pristine-h40-delta.paths" "$OUT/common-since-h40-base.paths" \
            > "$OUT/h40-common-overlap.paths"

          git ls-tree -r --name-only "$H40" | grep -Ei '(oplus|oppo|oneplus)' | sort -u \
            > "$OUT/pristine-h40-oplus-paths.txt" || true
          : > "$OUT/pristine-h40-oplus-paths-missing-from-miru305.txt"
          while read -r path; do
            [ -n "$path" ] || continue
            git cat-file -e "$MIRU305:$path" 2>/dev/null || \
              echo "$path" >> "$OUT/pristine-h40-oplus-paths-missing-from-miru305.txt"
          done < "$OUT/pristine-h40-oplus-paths.txt"
          h40_oplus_path_count=$(wc -l < "$OUT/pristine-h40-oplus-paths.txt")
          missing_h40_oplus_paths=$(wc -l < "$OUT/pristine-h40-oplus-paths-missing-from-miru305.txt")
          test "$missing_h40_oplus_paths" -eq 0 || fatal=1

          extract_vendor_tokens() {
            local rev=$1
            { git grep -IhoEi '(oplus|oppo|oneplus)_[A-Za-z0-9_]+' "$rev" -- . \
                ':(exclude)Documentation/**' ':(exclude).github/**' \
                ':(exclude)h40-repro/**' 2>/dev/null || true; } |
              tr '[:upper:]' '[:lower:]' | sort -u
          }
          extract_config_tokens() {
            local rev=$1
            { git grep -IhoE 'CONFIG_(OPLUS|OPPO|ONEPLUS)_[A-Za-z0-9_]+' "$rev" -- . \
                ':(exclude)Documentation/**' ':(exclude).github/**' 2>/dev/null || true; } |
              sort -u
          }
          extract_vendor_tokens "$H40" > "$OUT/pristine-h40-vendor-identifiers.txt"
          extract_vendor_tokens "$MIRU305" > "$OUT/miru305-vendor-identifiers.txt"
          comm -23 "$OUT/pristine-h40-vendor-identifiers.txt" \
            "$OUT/miru305-vendor-identifiers.txt" \
            > "$OUT/pristine-h40-vendor-identifiers-missing-from-miru305.txt"
          extract_config_tokens "$H40" > "$OUT/pristine-h40-oplus-config-symbols.txt"
          extract_config_tokens "$MIRU305" > "$OUT/miru305-oplus-config-symbols.txt"
          comm -23 "$OUT/pristine-h40-oplus-config-symbols.txt" \
            "$OUT/miru305-oplus-config-symbols.txt" \
            > "$OUT/pristine-h40-oplus-config-symbols-missing-from-miru305.txt"

          h40_vendor_identifier_count=$(wc -l < "$OUT/pristine-h40-vendor-identifiers.txt")
          missing_h40_vendor_identifiers=$(wc -l < "$OUT/pristine-h40-vendor-identifiers-missing-from-miru305.txt")
          h40_config_symbol_count=$(wc -l < "$OUT/pristine-h40-oplus-config-symbols.txt")
          missing_h40_config_symbols=$(wc -l < "$OUT/pristine-h40-oplus-config-symbols-missing-from-miru305.txt")
          test "$missing_h40_config_symbols" -eq 0 || fatal=1

          if [ -n "$exact_merge" ]; then
            git diff --name-only "$exact_merge" "$MIRU305" | sort -u \
              > "$OUT/post-authentic-merge.paths"
            git log --format='%H%x09%s' --reverse "$exact_merge..$MIRU305" \
              > "$OUT/post-authentic-merge.commits.tsv"
          else
            : > "$OUT/post-authentic-merge.paths"
            : > "$OUT/post-authentic-merge.commits.tsv"
          fi
          post_merge_path_count=$(wc -l < "$OUT/post-authentic-merge.paths")
          post_merge_commit_count=$(wc -l < "$OUT/post-authentic-merge.commits.tsv")

          {
            echo "# Miru H.40 Linux 4.14.305 three-way audit"
            echo
            echo "## Exact identities"
            echo
            echo "- Pristine H.40: \`$H40\`"
            echo "- Miru production 4.14.269: \`$MIRU269\`"
            echo "- Booted Miru 4.14.305: \`$MIRU305\`"
            echo "- Android Common 4.14.269: \`$COMMON269\`"
            echo "- Android Common 4.14.305: \`$COMMON305\`"
            echo "- Official 4.14.305 tree: \`$COMMON305_TREE\`"
            echo
            echo "## Cumulative Android Common proof"
            echo
            echo "- Commits reachable from Common 4.14.305 but not Common 4.14.269: **$common_commit_count**"
            echo "- Those commits missing from Miru 4.14.305 ancestry: **$missing_common_count**"
            echo "- Stable endpoint merge commits found: **$stable_endpoint_count**"
            echo "- Exact two-parent Miru269 + Common305 merge: \`${exact_merge:-NOT_FOUND}\`"
            echo "- Reconstructed authentic conflict messages: **$reconstructed_conflict_count**"
            echo "- merge-tree return code: **$merge_tree_rc**"
            echo
            echo "## 4.14.269 to 4.14.305 path classification"
            echo
            echo "- Paths changed by Android Common: **$common_path_count**"
            echo "- Downstream paths already different at Miru 4.14.269: **$downstream_path_count**"
            echo "- Paths touched by both sides: **$overlap_path_count**"
            echo "- Common-only paths: **$common_only_count**"
            echo "- Downstream-only paths: **$downstream_only_count**"
            echo "- Unexpected final mismatches on Common-only core source paths: **$unexpected_common_only_count**"
            echo
            echo "## Original H.40 preservation"
            echo
            echo "- H.40 is an ancestor of Miru 4.14.305: see \`ANCESTRY.tsv\`"
            echo "- Pristine H.40 paths containing Oplus/Oppo/OnePlus names: **$h40_oplus_path_count**"
            echo "- Those paths missing from Miru 4.14.305: **$missing_h40_oplus_paths**"
            echo "- Unique vendor-prefixed identifiers in pristine H.40: **$h40_vendor_identifier_count**"
            echo "- Vendor-prefixed identifiers not found in Miru 4.14.305: **$missing_h40_vendor_identifiers**"
            echo "- Oplus/Oppo/OnePlus CONFIG symbols in pristine H.40: **$h40_config_symbol_count**"
            echo "- Those CONFIG symbols missing from Miru 4.14.305: **$missing_h40_config_symbols**"
            echo
            echo "## Post-merge audit surface"
            echo
            echo "- Commits after the exact authentic merge: **$post_merge_commit_count**"
            echo "- Paths changed after the exact authentic merge: **$post_merge_path_count**"
            echo
            echo "## Automated gate"
            echo
            if [ "$fatal" -eq 0 ]; then
              echo "**PASS** — no structural omission or unexplained Common-only core-source mismatch was detected."
            else
              echo "**FAIL** — inspect the detailed reports in this artifact."
            fi
          } > "$OUT/SUMMARY.md"

          {
            echo "fatal=$fatal"
            echo "common_commit_count=$common_commit_count"
            echo "missing_common_count=$missing_common_count"
            echo "reconstructed_conflict_count=$reconstructed_conflict_count"
            echo "unexpected_common_only_count=$unexpected_common_only_count"
            echo "missing_h40_oplus_paths=$missing_h40_oplus_paths"
            echo "missing_h40_vendor_identifiers=$missing_h40_vendor_identifiers"
            echo "missing_h40_config_symbols=$missing_h40_config_symbols"
          } > "$OUT/status.env"

          cat "$OUT/SUMMARY.md"

      - name: Upload complete three-way audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts305-threeway-audit-${{ github.run_id }}
          path: threeway-audit
          if-no-files-found: error
          retention-days: 14

      - name: Enforce structural audit gate
        if: always()
        shell: bash
        run: |
          source threeway-audit/status.env
          test "$fatal" -eq 0
