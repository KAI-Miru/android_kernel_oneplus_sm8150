name: Miru LTS 4.14.190 Step 9 fast THP audit

on:
  pull_request:
    branches:
      - h40-miru-module-compat-test
    types:
      - synchronize

permissions:
  contents: read

jobs:
  audit-step-9-fast:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'h40-miru-lts-4.14.190'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: h40-miru-lts-4.14.190
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            scripts/miru
            mm/huge_memory.c
          sparse-checkout-cone-mode: false

      - name: Generate fast Step 9 comparison
        run: python3 scripts/miru/audit_step9_fast.py

      - name: Upload fast Step 9 comparison
        uses: actions/upload-artifact@v4
        with:
          name: miru-lts-4.14.190-step9-fast-audit
          path: step9-fast-audit
          if-no-files-found: error
          retention-days: 30
