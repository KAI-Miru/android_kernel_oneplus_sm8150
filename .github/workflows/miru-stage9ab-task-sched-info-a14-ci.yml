name: Miru H.40 Wave 20 audio small-task policy build

on:
  workflow_dispatch:
  push:
    branches:
      - miru-h40-wave20-audio-small-task-ci-trigger
    paths:
      - '.github/workflows/miru-stage9ab-task-sched-info-a14-ci.yml'

permissions:
  contents: read

concurrency:
  group: miru-h40-wave20-audio-small-task
  cancel-in-progress: true

env:
  PRODUCTION_SHA: 83c84c2b5d2210b15623e6b8bda14b7250624bb6
  MODULES_PRODUCTION_SHA: c03a4c6339b959f1a9b288a157d5b5d16fbcf015
  MODULES_BASE_SHA: 5a78fa49d8771c4ebff6a7e51b6e83ca740bb823

jobs:
  build-stage9a:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_BRANCH: miru-h40-stage9a-task-sched-info-a14
      SOURCE_SHA: 29d7d81080e7208e9466d7ab886ae8ba48cdebb7
      PARENT_SHA: a218e2e10987ac4d1bcb5094c199e8d36b8ac1f9
      MODULES_REPAIR_BRANCH: miru-h40-stage9a-task-sched-info-a14
      MODULES_REPAIR_SHA: e892a9c730424c82bff50953b57674b53cdae35b
      EXPECTED_RELEASE: 4.14.357-openela-miru-h40-stage9a-task-sched-info-a14-ci1+
      PACKAGE_TAG: miru-v3-modules-dropin-4.14.357-openela-miru-h40-stage9a-task-sched-info-a14-ci1

    steps:
      - name: Checkout Stage 9A task scheduler telemetry source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0

      - name: Verify immutable build boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          check() {
            local label="$1"
            shift
            if ! "$@"; then
              echo "::error title=Stage 9A boundary check failed::${label}"
              exit 1
            fi
            echo "boundary check passed: ${label}"
          }

          check source-head test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          check source-parent test "$(git -C source rev-parse HEAD^)" = "${PARENT_SHA}"
          check source-single-parent test "$(git -C source rev-list --parents -n1 HEAD | wc -w)" = 2
          check source-diff-clean test -z "$(git -C source diff --check HEAD^)"
          check source-index-clean test -z "$(git -C source ls-files -u)"
          check kernel-version test "$(sed -n 's/^VERSION = //p' source/Makefile | head -n1)" = 4
          check kernel-patchlevel test "$(sed -n 's/^PATCHLEVEL = //p' source/Makefile | head -n1)" = 14
          check kernel-sublevel test "$(sed -n 's/^SUBLEVEL = //p' source/Makefile | head -n1)" = 357
          check kernel-extraversion test "$(sed -n 's/^EXTRAVERSION = //p' source/Makefile | head -n1)" = -openela
          check reclaim-pages grep -Fq '#define STAGE3A_RECLAIM_PAGES 256' source/mm/process_reclaim.c
          check reclaim-min-index grep -Fq 'int min_idx = -1;' source/mm/process_reclaim.c
          check reclaim-index-guard grep -Fq 'if (min_idx >= 0)' source/mm/process_reclaim.c
          check stage4-configurator test -f source/scripts/miru/configure_mem_stage4.sh
          check sched-assist-macro grep -Fq -- '-DOPLUS_FEATURE_SCHED_ASSIST' source/Makefile
          check sched-assist-build grep -Fq 'obj-y += sched_assist/' source/kernel/Makefile
          check special-opt-build grep -Fq 'obj-y += special_opt/' source/kernel/Makefile
          check cpu-jank-build grep -Fq 'obj-$(CONFIG_OPLUS_FEATURE_CPU_JANKINFO) += sched_info/' source/kernel/Makefile
          check cpu-jank-symlink test -L source/kernel/sched_info
          check cpu-jank-symlink-target test "$(readlink source/kernel/sched_info)" = '../../../vendor/oplus/kernel/oplus_performance/sched_info'
          check cpu-jank-kconfig grep -Fq 'source "kernel/sched_info/Kconfig"' source/init/Kconfig
          check task-im-flag grep -Fq 'int ux_im_flag;' source/include/linux/sched.h
          check cpu-jank-config grep -Fxq 'CONFIG_OPLUS_FEATURE_CPU_JANKINFO=y' source/h40-repro/config/GM1911_11_H.40.config
          check frame-boost-build grep -Fq 'obj-$(CONFIG_OPLUS_FEATURE_FRAME_BOOST) += tuning/' source/kernel/Makefile
          check frame-boost-kconfig grep -Fq 'source "kernel/tuning/Kconfig"' source/init/Kconfig
          check frame-boost-kernel-symlink test -L source/kernel/tuning
          check frame-boost-kernel-symlink-target test "$(readlink source/kernel/tuning)" = '../../../vendor/oplus/kernel/oplus_performance/frame_boost'
          check frame-boost-header-symlink test -L source/include/linux/tuning
          check frame-boost-config grep -Fxq 'CONFIG_OPLUS_FEATURE_FRAME_BOOST=y' source/h40-repro/config/GM1911_11_H.40.config
          check frame-boost-task-field grep -Fq 'unsigned int fbg_state;' source/include/linux/sched.h
          check frame-boost-fork-hook grep -Fq 'fbg_sched_fork_hook(NULL, p);' source/kernel/sched/core.c
          check procabi-audit-script test -f source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-tasktrack-audit-source grep -Fq 'tasktrack_c="${sched_info_dir}/tasktrack.c"' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-tasktrack-audit-gate grep -Fq 'tasktrack_enabled && tasktrack_has_entries_locked()' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-tasktrack-audit-fastpath grep -Fq 'if (!prev_tracked && !next_tracked)' source/scripts/miru/verify_coloros14_procabi.sh
          check task-cpustats-feature-macro grep -Fq -- '-DOPLUS_FEATURE_TASK_CPUSTATS' source/Makefile
          check task-cpustats-config grep -Fxq 'CONFIG_OPLUS_CTP=y' source/h40-repro/config/GM1911_11_H.40.config
          check task-cpustats-kconfig grep -Fq 'config OPLUS_CTP' source/fs/proc/Kconfig
          check task-cpustats-build grep -Fq 'proc-$(CONFIG_OPLUS_CTP) += task_cpustats.o' source/fs/proc/Makefile
          check task-cpustats-source test -f source/fs/proc/task_cpustats.c
          check task-cpustats-header-symlink test -L source/include/linux/task_cpustats.h
          check task-cpustats-header-target test "$(readlink source/include/linux/task_cpustats.h)" = '../../../../vendor/oplus/kernel/oplus_performance/task_cpustats/task_cpustats.h'
          check task-cpustats-disabled-fastpath grep -Fq 'if (!READ_ONCE(sysctl_task_cpustats_enable))' source/fs/proc/task_cpustats.c
          check task-cpustats-sysctl grep -Fq '.procname	= "task_cpustats_enable"' source/kernel/sysctl.c
          check task-cpustats-four-tick-hooks test "$(grep -Fc 'account_task_time(p, ticks,' source/kernel/sched/cputime.c)" -eq 4
          check task-cpustats-audit-gate grep -Fq 'task_cpustats=real-tick-accounting' source/scripts/miru/verify_coloros14_procabi.sh
          check task-cpustats-h40-energy grep -Fq 'sge_array[cpu][SD_LEVEL0]' source/fs/proc/task_cpustats.c
          check task-cpustats-no-new-em test "$(grep -Fc 'em_cpu_get' source/fs/proc/task_cpustats.c)" -eq 0
          check task-cpustats-no-trace-printk test "$(grep -Fc 'trace_printk' source/fs/proc/task_cpustats.c)" -eq 0
          check task-sched-info-config grep -Fxq 'CONFIG_OPLUS_SCHED=y' source/h40-repro/config/GM1911_11_H.40.config
          check task-sched-info-kconfig grep -Fq 'config OPLUS_SCHED' source/fs/proc/Kconfig
          check task-sched-info-build grep -Fq 'obj-$(CONFIG_OPLUS_SCHED) += task_sched_info.o' source/fs/proc/Makefile
          check task-sched-info-source test -f source/fs/proc/task_sched_info.c
          check task-sched-info-header test -f source/include/linux/task_sched_info.h
          check task-sched-info-control grep -Fq 'module_param_named(sched_info_ctrl, sched_info_ctrl, bool, 0644);' source/fs/proc/task_sched_info.c
          check task-sched-info-fields grep -Fq 'running_start_time;' source/include/linux/sched.h
          check task-sched-info-fork grep -Fq 'p->running_start_time = 0;' source/kernel/fork.c
          check task-sched-info-wake-hooks test "$(grep -Fc 'update_wake_tid(' source/kernel/sched/core.c)" -eq 3
          check task-sched-info-runtime-hook test "$(grep -Fc 'update_running_start_time(prev, next);' source/kernel/sched/core.c)" -eq 1
          check task-sched-info-summary grep -Fq 'task_sched_info=core-scheduler-telemetry' source/scripts/miru/verify_coloros14_procabi.sh
          check task-sched-info-no-trace-printk test "$(grep -Fc 'trace_printk' source/fs/proc/task_sched_info.c)" -eq 0
          check task-sched-info-no-frequency-stage9a test "$(grep -Fc 'update_freq_info(policy);' source/drivers/cpufreq/cpufreq.c)" -eq 0
          check task-sched-info-no-isolation-stage9a test "$(grep -Fc 'update_cpu_isolate_info(' source/kernel/sched/core.c)" -eq 0

          live_production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          check production-ref test "${live_production}" = "${PRODUCTION_SHA}"
          live_modules_repair="$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/${MODULES_REPAIR_BRANCH} | awk 'NR == 1 {print $1}')"
          check modules-ref test "${live_modules_repair}" = "${MODULES_REPAIR_SHA}"
          live_modules_production="$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/oneplus/sm8150_s_12.1_op7pro | awk 'NR == 1 {print $1}')"
          check modules-production-ref test "${live_modules_production}" = "${MODULES_PRODUCTION_SHA}"

          {
            echo "result=PASS"
            echo "source_sha=${SOURCE_SHA}"
            echo "production_sha=${PRODUCTION_SHA}"
            echo "modules_base_sha=${MODULES_BASE_SHA}"
            echo "modules_production_sha=${MODULES_PRODUCTION_SHA}"
            echo "modules_repair_sha=${MODULES_REPAIR_SHA}"
            echo "modules_repair_branch=${MODULES_REPAIR_BRANCH}"
            echo "expected_release=${EXPECTED_RELEASE}"
            echo "production_write=NONE"
          } | tee BUILD-BOUNDARIES.txt

      - name: Prepare Stage 9A task scheduler telemetry H.40 config
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          cp h40-repro/config/GM1911_11_H.40.config "${RUNNER_TEMP}/stage9a-task-sched-info-a14.config"
          bash scripts/miru/configure_mem_stage4.sh "${RUNNER_TEMP}/stage9a-task-sched-info-a14.config"

      - name: Generate stable Stage 9A 4.14.357 build driver
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('source/scripts/miru/ci_build_4.14.190.sh')
          target = Path('build-stage9a-task-sched-info-a14-stable.sh')
          text = source.read_text()

          start = text.index('# Fetch only the distant commits required by the source-level sanity checks.')
          end = text.index("# GitHub's Ubuntu image contains most dependencies already")
          gate = '''# Exact Stage 9A task scheduler telemetry source sanity gate.
          source_head="$(git rev-parse HEAD)"
          test "${source_head}" = "${SOURCE_SHA}"
          test -z "$(git ls-files -u)"
          test "$(sed -n 's/^VERSION = //p' Makefile | head -n1)" = 4
          test "$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -n1)" = 14
          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)" = 357
          test "$(sed -n 's/^EXTRAVERSION = //p' Makefile | head -n1)" = -openela
          grep -Fq '#define STAGE3A_RECLAIM_PAGES 256' mm/process_reclaim.c
          grep -Fq 'int min_idx = -1;' mm/process_reclaim.c
          grep -Fq -- '-DOPLUS_FEATURE_SCHED_ASSIST' Makefile
          grep -Fq 'obj-y += sched_assist/' kernel/Makefile
          grep -Fq 'obj-$(CONFIG_OPLUS_FEATURE_CPU_JANKINFO) += sched_info/' kernel/Makefile
          test -L kernel/sched_info
          test "$(readlink kernel/sched_info)" = '../../../vendor/oplus/kernel/oplus_performance/sched_info'
          grep -Fq 'tasktrack_c="${sched_info_dir}/tasktrack.c"' scripts/miru/verify_coloros14_procabi.sh
          grep -Fq 'tasktrack_enabled && tasktrack_has_entries_locked()' scripts/miru/verify_coloros14_procabi.sh
          grep -Fq 'if (!prev_tracked && !next_tracked)' scripts/miru/verify_coloros14_procabi.sh
          grep -Fq -- '-DOPLUS_FEATURE_TASK_CPUSTATS' Makefile
          grep -Fxq 'CONFIG_OPLUS_CTP=y' h40-repro/config/GM1911_11_H.40.config
          grep -Fq 'config OPLUS_CTP' fs/proc/Kconfig
          grep -Fq 'proc-$(CONFIG_OPLUS_CTP) += task_cpustats.o' fs/proc/Makefile
          grep -Fq '.procname	= "task_cpustats_enable"' kernel/sysctl.c
          test "$(grep -Fc 'account_task_time(p, ticks,' kernel/sched/cputime.c)" -eq 4
          grep -Fq 'if (!READ_ONCE(sysctl_task_cpustats_enable))' fs/proc/task_cpustats.c
          grep -Fq 'sge_array[cpu][SD_LEVEL0]' fs/proc/task_cpustats.c
          ! grep -Fq 'em_cpu_get' fs/proc/task_cpustats.c
          ! grep -Fq 'trace_printk' fs/proc/task_cpustats.c
          grep -Fq 'task_cpustats=real-tick-accounting' scripts/miru/verify_coloros14_procabi.sh
          grep -Fxq 'CONFIG_OPLUS_SCHED=y' h40-repro/config/GM1911_11_H.40.config
          grep -Fq 'config OPLUS_SCHED' fs/proc/Kconfig
          grep -Fq 'obj-$(CONFIG_OPLUS_SCHED) += task_sched_info.o' fs/proc/Makefile
          test -f fs/proc/task_sched_info.c
          test -f include/linux/task_sched_info.h
          grep -Fq 'module_param_named(sched_info_ctrl, sched_info_ctrl, bool, 0644);' fs/proc/task_sched_info.c
          grep -Fq 'task_sched_info=core-scheduler-telemetry' scripts/miru/verify_coloros14_procabi.sh
          ! grep -Fq 'trace_printk' fs/proc/task_sched_info.c
          ! grep -Fq 'update_freq_info(policy);' drivers/cpufreq/cpufreq.c
          ! grep -Fq 'update_cpu_isolate_info(' kernel/sched/core.c
          grep -Fq 'int ux_im_flag;' include/linux/sched.h
          grep -Fq 'obj-$(CONFIG_OPLUS_FEATURE_FRAME_BOOST) += tuning/' kernel/Makefile
          grep -Fq 'source "kernel/tuning/Kconfig"' init/Kconfig
          test -L kernel/tuning
          test "$(readlink kernel/tuning)" = '../../../vendor/oplus/kernel/oplus_performance/frame_boost'
          test -L include/linux/tuning
          grep -Fxq 'CONFIG_OPLUS_FEATURE_FRAME_BOOST=y' h40-repro/config/GM1911_11_H.40.config
          grep -Fq 'unsigned int fbg_state;' include/linux/sched.h
          grep -Fq 'fbg_sched_fork_hook(NULL, p);' kernel/sched/core.c
          live_production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          test "${live_production}" = "${PRODUCTION_SHA}"
          {
            echo "Sanity gate: PASS"
            echo "head=${source_head}"
            echo "source_sha=${SOURCE_SHA}"
            echo "kernel_version=4.14.357-openela"
            echo "task_cpustats=real-tick-accounting"
            echo "production_write=NONE"
          } | tee "${DIAG_DIR}/sanity-summary.txt"

          '''
          text = text[:start] + gate + text[end:]

          final = '\n'.join([
              'release="$(printf \'%s\\n\' "${banner}" | sed -n \'s/^Linux version \\([^ ]*\\).*/\\1/p\')"',
              'test "${release}" = "${EXPECTED_RELEASE}"',
              'cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb"',
              'printf \'%s\\n\' "${EXPECTED_RELEASE}" > "${ARTIFACT_DIR}/KERNEL-RELEASE.txt"',
              'printf \'%s\\n\' "${SOURCE_SHA}" > "${ARTIFACT_DIR}/SOURCE-SHA.txt"',
              'printf \'%s\\n\' "${MODULES_REPAIR_SHA}" > "${ARTIFACT_DIR}/VENDOR-SHA.txt"',
              'sha256sum "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb" > "${ARTIFACT_DIR}/STAGE9A-TASK-SCHED-INFO-A14-IMAGE-SHA256.txt"',
              'echo "Stage 9A task scheduler telemetry kernel build: PASS"',
          ])

          replacements = {
              'VENDOR_SHA=125ff7d0153cbb3aaa8f9fd618c33b7f728d7798': 'VENDOR_SHA=e892a9c730424c82bff50953b57674b53cdae35b',
              '== Miru H.40 Android 4.14.190 CI build ==': '== Miru H.40 Stage 9A task scheduler telemetry stable build ==',
              'KERNEL_LOCALVERSION=-miru-h40-lts190-ci1': 'KERNEL_LOCALVERSION=-miru-h40-stage9a-task-sched-info-a14-ci1',
              'CONFIG_LOCALVERSION="-miru-h40-lts190-ci1"': 'CONFIG_LOCALVERSION="-miru-h40-stage9a-task-sched-info-a14-ci1"',
              "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 '^Linux version 4\\.14\\.190-' || true)\"": "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 -F 'Linux version 4.14.357-openela-miru-h40-stage9a-task-sched-info-a14-ci1+' || true)\"",
              'echo "Clean kernel build and output validation: PASS"': final,
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'build-driver anchor count for {old!r}={text.count(old)}')
              text = text.replace(old, new, 1)

          target.write_text(text)
          target.chmod(0o755)
          PY
          bash -n build-stage9a-task-sched-info-a14-stable.sh
          grep -Fq 'VENDOR_SHA=e892a9c730424c82bff50953b57674b53cdae35b' build-stage9a-task-sched-info-a14-stable.sh
          grep -Fq 'KERNEL_LOCALVERSION=-miru-h40-stage9a-task-sched-info-a14-ci1' build-stage9a-task-sched-info-a14-stable.sh

      - name: Build Stage 9A task scheduler telemetry kernel with stable builder
        shell: bash
        working-directory: source
        env:
          STOCK_CONFIG: ${{ runner.temp }}/stage9a-task-sched-info-a14.config
        run: |
          set -Eeuo pipefail
          bash ../build-stage9a-task-sched-info-a14-stable.sh

          cfg="${RUNNER_TEMP}/android-root/out/h40-kernel/.config"
          grep -Fxq 'CONFIG_HAVE_USERSPACE_LOW_MEMORY_KILLER=y' "${cfg}"
          grep -Fxq '# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set' "${cfg}"
          grep -Fxq 'CONFIG_PROCESS_RECLAIM_ENHANCE=y' "${cfg}"
          grep -Fxq 'CONFIG_ION_DEFER_FREE_NO_SCHED_IDLE=y' "${cfg}"
          grep -Fxq '# CONFIG_OPLUS_FEATURE_LOWMEM_DBG is not set' "${cfg}"
          grep -Fxq 'CONFIG_DEBUG_LIST=y' "${cfg}"
          grep -Fxq '# CONFIG_KMALLOC_DEBUG is not set' "${cfg}"
          grep -Fxq '# CONFIG_VMALLOC_DEBUG is not set' "${cfg}"
          grep -Fxq 'CONFIG_OPLUS_FEATURE_CPU_JANKINFO=y' "${cfg}"
          grep -Fxq 'CONFIG_OPLUS_FEATURE_FRAME_BOOST=y' "${cfg}"
          grep -Fxq 'CONFIG_OPLUS_CTP=y' "${cfg}"
          grep -Fxq 'CONFIG_OPLUS_SCHED=y' "${cfg}"
          grep -Fxq 'CONFIG_OPLUS_PROACTIVE_COMPACT=y' "${cfg}"
          grep -Fxq 'CONFIG_OPLUS_FEATURE_EAS_OPT=y' "${cfg}"
          grep -Fxq 'CONFIG_OPLUS_FEATURE_VT_CAP=y' "${cfg}"
          grep -Fxq 'CONFIG_OPLUS_CPUFREQ_IOWAIT_PROTECT=y' "${cfg}"
          grep -Fxq 'CONFIG_OPLUS_STORAGE_LOG=y' "${cfg}"
          find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/sched_assist/sched_assist_common.o' -print -quit | grep -q .
          for object in eas_opt oplus_cap oplus_iowait; do
            object_path="$(find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path "*/sched_assist/eas_opt/${object}.o" -print -quit)"
            test -s "${object_path}"
          done
          find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/sched_info/oplus_schedinfo.o' -print -quit | grep -q .
          find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/sched_info/tasktrack.o' -print -quit | grep -q .
          find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/tuning/frame_group.o' -print -quit | grep -q .
          find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/tuning/frame_ioctl.o' -print -quit | grep -q .
          task_cpustats_obj="$(find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/fs/proc/task_cpustats.o' -print -quit)"
          test -n "${task_cpustats_obj}"
          test -s "${task_cpustats_obj}"
          test "$(tr -d '\n' < "${RUNNER_TEMP}/android-root/out/h40-kernel/include/config/kernel.release")" = "${EXPECTED_RELEASE}"

          out_dir="${RUNNER_TEMP}/android-root/out/h40-kernel"
          artifact_dir="${RUNNER_TEMP}/android-root/out/h40-artifacts"
          strings_file="${RUNNER_TEMP}/stage9a-task-sched-info-a14-vmlinux.strings"
          test -s "${out_dir}/System.map"
          test -s "${out_dir}/vmlinux"
          grep -Eq '[[:space:]][Tt][[:space:]]account_task_time$' "${out_dir}/System.map"
          grep -Eq '[[:space:]][BbDd][[:space:]]sysctl_task_cpustats_enable$' "${out_dir}/System.map"
          strings "${out_dir}/vmlinux" > "${strings_file}"
          for literal in task_cpustats_enable task_cpustats sgeinfo sgefreqinfo; do
            grep -Fxq "${literal}" "${strings_file}"
          done
          {
            echo result=PASS
            echo config=CONFIG_OPLUS_CTP=y
            echo object="${task_cpustats_obj#${out_dir}/}"
            echo symbol_account_task_time=present
            echo symbol_sysctl_task_cpustats_enable=present
            echo proc_task_cpustats=present
            echo proc_sgeinfo=present
            echo proc_sgefreqinfo=present
            echo task_cpustats=real-tick-accounting
          } | tee "${artifact_dir}/TASK-CPUSTATS-BINARY-AUDIT.txt"

          task_sched_obj="$(find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/fs/proc/task_sched_info.o' -print -quit)"
          test -n "${task_sched_obj}"
          test -s "${task_sched_obj}"
          proactive_compact_obj="$(find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/fs/proc/oplus_proactive_compact.o' -print -quit)"
          storage_log_obj="$(find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/fs/proc/oplus_storage_log.o' -print -quit)"
          test -s "${proactive_compact_obj}"
          test -s "${storage_log_obj}"
          core_obj="${RUNNER_TEMP}/android-root/out/h40-kernel/kernel/sched/core.o"
          fair_obj="${RUNNER_TEMP}/android-root/out/h40-kernel/kernel/sched/fair.o"
          exec_obj="${RUNNER_TEMP}/android-root/out/h40-kernel/fs/exec.o"
          cpufreq_obj="${RUNNER_TEMP}/android-root/out/h40-kernel/drivers/cpufreq/cpufreq.o"
          for object in "${core_obj}" "${fair_obj}" "${exec_obj}" "${cpufreq_obj}"; do test -s "${object}"; done
          core_relocs="${RUNNER_TEMP}/stage9a-task-sched-info-a14-core.relocations"
          fair_relocs="${RUNNER_TEMP}/stage9a-task-sched-info-a14-fair.relocations"
          exec_relocs="${RUNNER_TEMP}/stage9a-task-sched-info-a14-exec.relocations"
          cpufreq_relocs="${RUNNER_TEMP}/stage9a-task-sched-info-a14-cpufreq.relocations"
          readelf -rW "${core_obj}" > "${core_relocs}"
          readelf -rW "${fair_obj}" > "${fair_relocs}"
          readelf -rW "${exec_obj}" > "${exec_relocs}"
          readelf -rW "${cpufreq_obj}" > "${cpufreq_relocs}"
          echo checking-relocation=update_wake_tid
          grep -Fq 'update_wake_tid' "${core_relocs}"
          echo checking-relocation=update_running_start_time
          grep -Fq 'update_running_start_time' "${core_relocs}"
          echo checking-relocation=update_task_sched_info
          grep -Fq 'update_task_sched_info' "${fair_relocs}"
          echo checking-relocation=get_target_thread_pid
          grep -Fq 'get_target_thread_pid' "${exec_relocs}"
          for symbol in update_task_sched_info update_wake_tid update_running_start_time get_target_thread_pid sched_action_trig; do
            echo checking-system-map-symbol="${symbol}"
            grep -Eq "[[:space:]][Tt][[:space:]]${symbol}$" "${out_dir}/System.map"
          done
          # Stage 9F's heavy_task_info lets BFD tail-merge the shorter
          # task_info string.  The complete proc path below is authoritative.
          for literal in pids_set sched_buffer task_sched_info_enable sched_info_threshold d_convert 'SCHEDACTION=uevent' 'SCHEDNUM=%u'; do
            echo checking-vmlinux-literal="${literal}"
            grep -Fxq "${literal}" "${strings_file}"
          done
          # BFD tail-merges suffix string literals at final link.  Check the
          # retained full proc path and built-in module-parameter spelling,
          # rather than suffixes that need not remain standalone strings.
          for literal in task_info/task_sched_info task_sched_info.sched_info_ctrl; do
            echo checking-vmlinux-literal="${literal}"
            grep -Fxq "${literal}" "${strings_file}"
          done
          echo checking-stage9a-absence=update_freq_info
          ! grep -Fq 'update_freq_info' "${cpufreq_relocs}"
          echo checking-stage9a-absence=update_freq_limit_info
          ! grep -Fq 'update_freq_limit_info' "${cpufreq_relocs}"
          echo checking-stage9a-absence=update_cpu_isolate_info
          ! grep -Fq 'update_cpu_isolate_info' "${core_relocs}"
          {
            echo result=PASS
            echo config=CONFIG_OPLUS_SCHED=y
            echo object="${task_sched_obj#${out_dir}/}"
            echo scheduler_relocations=present
            echo stage_specific_relocations=absent-as-designed
            echo task_sched_info=core-scheduler-telemetry
          } | tee "${artifact_dir}/TASK-SCHED-INFO-BINARY-AUDIT.txt"

      - name: Build matching external modules with stable builder
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          kernel_dir="${RUNNER_TEMP}/android-root/kernel/msm-4.14"
          out_dir="${RUNNER_TEMP}/android-root/out/h40-kernel"
          artifact_dir="${RUNNER_TEMP}/android-root/out/h40-artifacts"
          vendor_source="${RUNNER_TEMP}/oneplus-sm8150-vendor-source"
          module_dir="${RUNNER_TEMP}/miru-external-modules/dropin"
          report_dir="${GITHUB_WORKSPACE}/external-module-diagnostics"
          mkdir -p "${report_dir}"
          runtime_archive="${RUNNER_TEMP}/android-root/out/${PACKAGE_TAG}.7z"
          audit_archive="${RUNNER_TEMP}/android-root/out/${PACKAGE_TAG}-audit.zip"

          test -s "${out_dir}/Module.symvers"
          test "$(git -C "${vendor_source}" rev-parse HEAD)" = "${MODULES_REPAIR_SHA}"
          git -C "${vendor_source}" fetch --no-tags --depth=16 origin "${MODULES_REPAIR_BRANCH}"
          test "$(git -C "${vendor_source}" rev-parse FETCH_HEAD)" = "${MODULES_REPAIR_SHA}"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_assist/sched_assist_common.c"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/oplus_sched_info.c"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/tasktrack.c"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/tasktrack.h"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/task_cpustats/task_cpustats.h"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_group.c"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.c"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_sysctl.c"
          grep -Fq 'frame_boost_safe_mode' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_sysctl.c"
          grep -Fq '!__frame_boost_enabled() || atomic_read(&fbg_initialized) == 0' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_group.c"
          grep -Fq 'ofb_handle_sf_msg_trans' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.c"
          grep -Fq '_IOC_NR(cmd) == SET_SF_MSG_TRANS' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.c"
          ! grep -Fq 'case CMD_ID_SET_SF_MSG_TRANS:' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.c"
          grep -Fq 'obj-y += frame_ioctl.o' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/Makefile"
          ! grep -Fq '#include <../kernel/sched/sched.h>' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_group.h"
          grep -Fq 'fbg_sysctl_init();' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_boost.c"
          grep -Fq 'proc_create("sched_impt_task", 0666' "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_assist/sched_assist_common.c"
          grep -Fq 'proc_create("im_flag", 0666' "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_assist/sched_assist_common.c"
          grep -Fq 'proc_create("clm_mux_switch", 0666' "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/oplus_sched_info.c"
          grep -Fq 'proc_create("task_track_enable", 0666' "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/tasktrack.c"
          grep -Fq 'tasktrack_enabled && tasktrack_has_entries_locked()' "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/tasktrack.c"
          grep -Fq 'if (!prev_tracked && !next_tracked)' "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/tasktrack.c"
          grep -Fq 'register_trace_sched_switch(tasktrack_sched_switch, NULL)' "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/tasktrack.c"
          ! grep -Fq 'trace_printk' "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/tasktrack.c"
          bash -n scripts/miru/verify_coloros14_procabi.sh
          bash scripts/miru/verify_coloros14_procabi.sh "${vendor_source}/vendor" "${out_dir}/.config" \
            | tee "${report_dir}/COLOROS14-PROCABI-AUDIT.txt"

          python3 scripts/miru/prepare_external_modules_toolchain.py
          python3 scripts/miru/prepare_external_pinctrl_headers.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/miru/prepare_wlan_response_link.py')
          old = 'expected = "74ce588c69513197a354ef0032c2145e91ee0641"'
          new = 'expected = "ee3b37a3bf6a586b74fe00f9e39ca5e77f08b6d3"'
          text = path.read_text()
          if text.count(old) != 1:
              raise SystemExit('WLAN response-link identity anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/miru/prepare_wlan_response_link.py

          python3 - "${EXPECTED_RELEASE}" "${PACKAGE_TAG}" <<'PY'
          from pathlib import Path
          import sys

          path = Path('scripts/miru/build_external_modules_4.14.190.sh')
          release, package_tag = sys.argv[1:]
          text = path.read_text()
          replacements = (
              ('4.14.190-miru-h40-lts190-ci1+', release, 1),
              ('miru-v3-modules-dropin-4.14.190', package_tag, 4),
              ('Miru 4.14.190 rebuilt external module ABI report',
               'Miru Stage 9A Android 14 task CPU statistics external module report', 1),
          )
          for old, new, expected_count in replacements:
              actual = text.count(old)
              if actual != expected_count:
                  raise SystemExit(f'external-module anchor {old!r}: expected {expected_count}, found {actual}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          bash -n scripts/miru/build_external_modules_4.14.190.sh
          bash scripts/miru/build_external_modules_4.14.190.sh

          test "$(find "${module_dir}" -maxdepth 1 -type f -name '*.ko' | wc -l)" = 32
          grep -Fxq 'errors=0' "${report_dir}/MODULE-ABI-REPORT.txt"
          test "$(grep -F ": ${EXPECTED_RELEASE} SMP preempt mod_unload modversions aarch64" "${report_dir}/vermagic.txt" | wc -l)" = 32
          grep -Fxq "vendor_source_commit=${MODULES_REPAIR_SHA}" "${report_dir}/BUILD-MANIFEST.txt"
          test -s "${runtime_archive}"
          test -s "${audit_archive}"

          mkdir -p "${artifact_dir}/external-modules"
          cp "${runtime_archive}" "${audit_archive}" "${artifact_dir}/external-modules/"
          cp "${report_dir}/BUILD-MANIFEST.txt" \
             "${report_dir}/MODULE-ABI-REPORT.txt" \
             "${report_dir}/PACKAGE-SUMMARY.txt" \
             "${report_dir}/vermagic.txt" \
             "${report_dir}/COLOROS14-PROCABI-AUDIT.txt" \
             "${artifact_dir}/external-modules/"
          sha256sum "${runtime_archive}" "${audit_archive}" > "${artifact_dir}/external-modules/ARCHIVES-SHA256.txt"
          {
            echo result=PASS
            echo kernel_release=${EXPECTED_RELEASE}
            echo kernel_head=$(git -C "${kernel_dir}" rev-parse HEAD)
            echo modules_base_sha=${MODULES_BASE_SHA}
            echo modules_repair_sha=${MODULES_REPAIR_SHA}
            echo modules_repair_branch=${MODULES_REPAIR_BRANCH}
            echo external_module_count=32
            echo abi_errors=0
            echo production_write=NONE
          } | tee "${artifact_dir}/external-modules/EXTERNAL-MODULES-SUMMARY.txt"

      - name: Verify final matched candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="${RUNNER_TEMP}/android-root/out/h40-artifacts"
          external_dir="${artifact_dir}/external-modules"
          test -s "${artifact_dir}/${EXPECTED_RELEASE}-Image.gz-dtb"
          test "$(cat "${artifact_dir}/KERNEL-RELEASE.txt")" = "${EXPECTED_RELEASE}"
          grep -Fxq 'external_module_count=32' "${external_dir}/EXTERNAL-MODULES-SUMMARY.txt"
          grep -Fxq 'abi_errors=0' "${external_dir}/EXTERNAL-MODULES-SUMMARY.txt"
          grep -Fxq "modules_repair_sha=${MODULES_REPAIR_SHA}" "${external_dir}/EXTERNAL-MODULES-SUMMARY.txt"
          grep -Fxq 'result=PASS' "${external_dir}/COLOROS14-PROCABI-AUDIT.txt"
          grep -Fxq 'audio_rt_placement=donor-status-gated-deep-idle-avoidance' "${external_dir}/COLOROS14-PROCABI-AUDIT.txt"
          grep -Fxq 'task_cpustats=real-tick-accounting' "${external_dir}/COLOROS14-PROCABI-AUDIT.txt"
          grep -Fxq 'task_sched_info=core-scheduler-telemetry' "${external_dir}/COLOROS14-PROCABI-AUDIT.txt"
          test -s "${artifact_dir}/TASK-SCHED-INFO-BINARY-AUDIT.txt"
          grep -Fxq 'task_sched_info=core-scheduler-telemetry' "${artifact_dir}/TASK-SCHED-INFO-BINARY-AUDIT.txt"
          test -s "${artifact_dir}/TASK-CPUSTATS-BINARY-AUDIT.txt"
          grep -Fxq 'task_cpustats=real-tick-accounting' "${artifact_dir}/TASK-CPUSTATS-BINARY-AUDIT.txt"
          live_production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          test "${live_production}" = "${PRODUCTION_SHA}"
          live_modules_production="$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/oneplus/sm8150_s_12.1_op7pro | awk 'NR == 1 {print $1}')"
          test "${live_modules_production}" = "${MODULES_PRODUCTION_SHA}"
          {
            cat BUILD-BOUNDARIES.txt
            echo result=PASS
            echo candidate=${EXPECTED_RELEASE}
            echo source_sha=${SOURCE_SHA}
            echo modules_repair_sha=${MODULES_REPAIR_SHA}
            echo external_module_count=32
            echo task_cpustats=real-tick-accounting
            echo task_sched_info=core-scheduler-telemetry
            echo production_after=${live_production}
            echo production_write=NONE
          } | tee "${artifact_dir}/FINAL-CANDIDATE-SUMMARY.txt"

      - name: Upload Stage 9A task scheduler telemetry kernel and modules
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: miru-h40-stage9a-task-sched-info-a14-kernel-and-modules
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/android-root/out/h40-artifacts/**
            build-diagnostics/**
            external-module-diagnostics/**

  build-wave20:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_BRANCH: miru-h40-wave20-audio-small-task
      SOURCE_SHA: caccc0e9e31224cce854ad677306f9a4273c1c70
      PARENT_SHA: 8b2e8f768fa5d910f94f0d02302d1b119ed4c04f
      MODULES_REPAIR_BRANCH: miru-h40-wave20-audio-small-task
      MODULES_REPAIR_SHA: f0679cb337b85e2e0b992d9b16e356b1839945bd
      MODULES_PARENT_SHA: a4d0d05f3b81024ea92c03dc697d7e2bf03c8cb9
      EXPECTED_RELEASE: 4.14.357-openela-miru-h40-wave20-audio-small-task-ci1+
      PACKAGE_TAG: miru-v3-modules-dropin-4.14.357-openela-miru-h40-wave20-audio-small-task-ci1

    steps:
      - name: Checkout Wave 20 audio small-task policy source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0

      - name: Verify immutable build boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          check() {
            local label="$1"
            shift
            if ! "$@"; then
              echo "::error title=Wave 20 boundary check failed::${label}"
              exit 1
            fi
            echo "boundary check passed: ${label}"
          }

          check source-head test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          check source-parent test "$(git -C source rev-parse HEAD^)" = "${PARENT_SHA}"
          check source-single-parent test "$(git -C source rev-list --parents -n1 HEAD | wc -w)" = 2
          check source-diff-clean test -z "$(git -C source diff --check HEAD^)"
          check source-index-clean test -z "$(git -C source ls-files -u)"
          check kernel-version test "$(sed -n 's/^VERSION = //p' source/Makefile | head -n1)" = 4
          check kernel-patchlevel test "$(sed -n 's/^PATCHLEVEL = //p' source/Makefile | head -n1)" = 14
          check kernel-sublevel test "$(sed -n 's/^SUBLEVEL = //p' source/Makefile | head -n1)" = 357
          check kernel-extraversion test "$(sed -n 's/^EXTRAVERSION = //p' source/Makefile | head -n1)" = -openela
          check reclaim-pages grep -Fq '#define STAGE3A_RECLAIM_PAGES 256' source/mm/process_reclaim.c
          check reclaim-min-index grep -Fq 'int min_idx = -1;' source/mm/process_reclaim.c
          check reclaim-index-guard grep -Fq 'if (min_idx >= 0)' source/mm/process_reclaim.c
          check stage4-configurator test -f source/scripts/miru/configure_mem_stage4.sh
          check sched-assist-macro grep -Fq -- '-DOPLUS_FEATURE_SCHED_ASSIST' source/Makefile
          check sched-assist-build grep -Fq 'obj-y += sched_assist/' source/kernel/Makefile
          check special-opt-build grep -Fq 'obj-y += special_opt/' source/kernel/Makefile
          check cpu-jank-build grep -Fq 'obj-$(CONFIG_OPLUS_FEATURE_CPU_JANKINFO) += sched_info/' source/kernel/Makefile
          check cpu-jank-symlink test -L source/kernel/sched_info
          check cpu-jank-symlink-target test "$(readlink source/kernel/sched_info)" = '../../../vendor/oplus/kernel/oplus_performance/sched_info'
          check cpu-jank-kconfig grep -Fq 'source "kernel/sched_info/Kconfig"' source/init/Kconfig
          check task-im-flag grep -Fq 'int ux_im_flag;' source/include/linux/sched.h
          check cpu-jank-config grep -Fxq 'CONFIG_OPLUS_FEATURE_CPU_JANKINFO=y' source/h40-repro/config/GM1911_11_H.40.config
          check frame-boost-build grep -Fq 'obj-$(CONFIG_OPLUS_FEATURE_FRAME_BOOST) += tuning/' source/kernel/Makefile
          check frame-boost-kconfig grep -Fq 'source "kernel/tuning/Kconfig"' source/init/Kconfig
          check frame-boost-kernel-symlink test -L source/kernel/tuning
          check frame-boost-kernel-symlink-target test "$(readlink source/kernel/tuning)" = '../../../vendor/oplus/kernel/oplus_performance/frame_boost'
          check frame-boost-header-symlink test -L source/include/linux/tuning
          check frame-boost-config grep -Fxq 'CONFIG_OPLUS_FEATURE_FRAME_BOOST=y' source/h40-repro/config/GM1911_11_H.40.config
          check frame-boost-task-field grep -Fq 'unsigned int fbg_state;' source/include/linux/sched.h
          check frame-boost-fork-hook grep -Fq 'fbg_sched_fork_hook(NULL, p);' source/kernel/sched/core.c
          check procabi-audit-script test -f source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-tasktrack-audit-source grep -Fq 'tasktrack_c="${sched_info_dir}/tasktrack.c"' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-tasktrack-audit-gate grep -Fq 'tasktrack_enabled && tasktrack_has_entries_locked()' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-tasktrack-audit-fastpath grep -Fq 'if (!prev_tracked && !next_tracked)' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-reporting-header test -f source/include/linux/oplus_jankinfo.h
          check cpu-jank-reporting-tick grep -Fq 'jankinfo_update_time_info(rq, p, TICK_NSEC);' source/kernel/sched/cputime.c
          check cpu-jank-reporting-cpufreq test "$(grep -Fc 'jankinfo_update_freq_reach_limit_count(policy' source/drivers/cpufreq/cpufreq.c)" -eq 3
          check cpu-jank-reporting-audit grep -Fq 'cpu_jank_reporting=donor-windowed-cputime-frequency-cgroup' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-hotthread-audit grep -Fq 'cpu_jank_hotthread=opt-in-bounded-workqueue-sampling' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-hotthread-audit-source grep -Fq 'cpu_jank_hotthread_c="${sched_info_dir}/osi_hotthread.c"' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-hotthread-abi-document test -f source/Documentation/ABI/testing/procfs-oplus-cpu-jank-hotthread
          check cpu-jank-passive-audit grep -Fq 'cpu_jank_passive_controls=donor-enable-osi-debug-default-off' source/scripts/miru/verify_coloros14_procabi.sh
          check sched-assist-debug-audit grep -Fq 'sched_assist_debug=donor-module-parameter-default-off' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-passive-abi-document test -f source/Documentation/ABI/testing/procfs-oplus-cpu-jank-passive-controls
          check cpu-jank-tasktrack-latency-audit grep -Fq 'cpu_jank_tasktrack_latency=on-demand-bounded-sched-events' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-tasktrack-latency-document test -f source/Documentation/ABI/testing/procfs-oplus-cpu-jank-tasktrack-latency
          check cpu-jank-tasktrack-callstack-audit grep -Fq 'cpu_jank_tasktrack_callstack=on-demand-bounded-dsleep-stacktrace' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-tasktrack-callstack-document test -f source/Documentation/ABI/testing/procfs-oplus-cpu-jank-tasktrack-callstack
          check cpu-jank-ux-throttle-audit grep -Fq 'cpu_jank_ux_throttle=opt-in-bounded-ux-runtime-frequency-telemetry' source/scripts/miru/verify_coloros14_procabi.sh
          check cpu-jank-ux-throttle-hook grep -Fq 'jankinfo_ux_throttle_tick(curr);' source/kernel/sched/core.c
          check cpu-jank-ux-throttle-document test -f source/Documentation/ABI/testing/procfs-oplus-cpu-jank-ux-throttle
          check frame-boost-kernel-enable-path grep -Eq '\.procname[[:space:]]*=[[:space:]]*"frame_boost_enabled"' source/kernel/sysctl.c
          check frame-boost-kernel-enable-storage grep -Eq '\.data[[:space:]]*=[[:space:]]*&sysctl_frame_boost_enable' source/kernel/sysctl.c
          check frame-boost-kernel-debug-path grep -Eq '\.procname[[:space:]]*=[[:space:]]*"frame_boost_debug"' source/kernel/sysctl.c
          check frame-boost-kernel-debug-storage grep -Eq '\.data[[:space:]]*=[[:space:]]*&sysctl_frame_boost_debug' source/kernel/sysctl.c
          check frame-boost-enable-declaration grep -Fq 'extern unsigned int sysctl_frame_boost_enable;' source/include/linux/sched/sysctl.h
          check frame-boost-debug-declaration grep -Fq 'extern unsigned int sysctl_frame_boost_debug;' source/include/linux/sched/sysctl.h
          check frame-boost-safe-mode-audit grep -Fq 'frame-boost-safe-mode-default-clear' source/scripts/miru/verify_coloros14_procabi.sh
          check frame-boost-ua-audit grep -Fq 'frame-boost-ua-control-node' source/scripts/miru/verify_coloros14_procabi.sh
          check frame-boost-touch-audit grep -Fq 'frame-boost-touch-info' source/scripts/miru/verify_coloros14_procabi.sh
          check frame-boost-parity-document test -f source/Documentation/ABI/testing/procfs-oplus-frame-boost
          check eas-kconfig-source grep -Fq 'source "kernel/sched_assist/Kconfig"' source/init/Kconfig
          check eas-master-config grep -Fxq 'CONFIG_OPLUS_FEATURE_EAS_OPT=y' source/h40-repro/config/GM1911_11_H.40.config
          check eas-cap-config grep -Fxq 'CONFIG_OPLUS_FEATURE_VT_CAP=y' source/h40-repro/config/GM1911_11_H.40.config
          check eas-iowait-config grep -Fxq 'CONFIG_OPLUS_CPUFREQ_IOWAIT_PROTECT=y' source/h40-repro/config/GM1911_11_H.40.config
          check eas-placement-hook grep -Fq 'oplus_eas_task_skip_cpu(p, i)' source/kernel/sched/fair.c
          check eas-capacity-hook grep -Fq 'oplus_eas_adjust_capacity(cpu, capacity);' source/kernel/sched/fair.c
          check eas-iowait-hook grep -Fq 'sysctl_iowait_apply_ticks' source/kernel/sched/cpufreq_schedutil.c
          check boost-kill-hook grep -Fq 'oplus_boost_kill_signal(sig, current, p);' source/kernel/signal.c
          check gameopt-config grep -Fxq 'CONFIG_OPLUS_FEATURE_GAME_OPT=y' source/h40-repro/config/GM1911_11_H.40.config
          check gameopt-kconfig grep -Fq 'source "drivers/soc/oplus/game_opt/Kconfig"' source/drivers/soc/Kconfig
          check gameopt-kbuild grep -Fq 'obj-$(CONFIG_OPLUS_FEATURE_GAME_OPT) += oplus/game_opt/' source/drivers/soc/Makefile
          check gameopt-dstate-object grep -Fq 'dstate_dump.o' source/drivers/soc/oplus/game_opt/Makefile
          check gameopt-source test -f source/drivers/soc/oplus/game_opt/cpu_load.c
          check gameopt-public-header test -f source/include/linux/oplus_game_opt.h
