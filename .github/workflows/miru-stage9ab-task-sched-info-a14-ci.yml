          grep -Fq 'obj-y += touch_ioctl.o' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/Makefile"
          grep -Fq 'ret = ua_ioctl_init();' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_boost.c"
          grep -Fq '#define UA_PROC_NODE "oplus_cpu"' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/ua_ioctl_common.c"
          grep -Fq 'proc_create("ua_ctrl", UA_CTRL_MODE' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/ua_ioctl_common.c"
          grep -Fq '#define UA_CTRL_MODE 0777' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/ua_ioctl_common.c"
          grep -Fq "#define CPU_CTRL_MAGIC 'o'" "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/ua_ioctl_common.h"
          grep -Fq 'fbg_get_prev_util(&info.frame_prev_util_scale);' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/ua_ioctl_common.c"
          grep -Fq 'fbg_get_curr_util(&info.frame_curr_util_scale);' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/ua_ioctl_common.c"
          grep -Fq '#define TOUCHBOOST_PROC_NODE "oplus_touch_boost"' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/touch_ioctl.c"
          grep -Fq 'proc_create("touch_info", 0444' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/touch_ioctl.c"
          grep -Fq 'input_register_handler(&touchboost_input_handler);' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/touch_ioctl.c"
          grep -Fq 'if (likely(!param_ux_debug))' "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_assist/sched_assist_common.c"
          grep -Fq 'proc_create("clm_mux_switch", 0666' "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/oplus_sched_info.c"
          grep -Fq 'ret = osi_base_proc_init(cpu_jank_dir);' "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/oplus_sched_info.c"
