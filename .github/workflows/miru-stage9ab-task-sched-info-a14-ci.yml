      - name: Prepare Wave 20 audio small-task policy H.40 config
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          cp h40-repro/config/GM1911_11_H.40.config "${RUNNER_TEMP}/stage9b-task-sched-info-a14.config"
          bash scripts/miru/configure_mem_stage4.sh "${RUNNER_TEMP}/stage9b-task-sched-info-a14.config"

      - name: Generate stable Wave 20 4.14.357 build driver
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('source/scripts/miru/ci_build_4.14.190.sh')
          target = Path('build-stage9b-task-sched-info-a14-stable.sh')
          text = source.read_text()

          start = text.index('# Fetch only the distant commits required by the source-level sanity checks.')
          end = text.index("# GitHub's Ubuntu image contains most dependencies already")
          gate = '''# Exact Wave 20 audio small-task policy source sanity gate.
          source_head="$(git rev-parse HEAD)"
