          grep -Eq '[[:space:]][Tt][[:space:]]g_time_in_state_update_idle$' "${out_dir}/System.map"
          for literal in game_opt 'CPU:%d busy_pct:%d util_pct:%d'; do
            grep -Fq "${literal}" "${strings_file}"
          done
          {
            echo result=PASS
            echo config=CONFIG_OPLUS_FEATURE_GAME_OPT=y
            echo object="${gameopt_obj#${out_dir}/}"
            echo proc_path=/proc/game_opt/cpu_load
            echo idle_hook=present
            echo cpufreq_notifier=present
            echo writable_frequency_controls=present-stage9l-inherited
            echo gameopt_cpu_load=donor-time-in-state-idle-frequency
          } | tee "${artifact_dir}/GAMEOPT-CPU-LOAD-BINARY-AUDIT.txt"
          gameopt_cpufreq_strings="${RUNNER_TEMP}/stage9m-gameopt-cpufreq.strings"
          gameopt_cpufreq_relocs="${RUNNER_TEMP}/stage9m-gameopt-cpufreq.relocations"
          strings "${gameopt_cpufreq_limits_obj}" > "${gameopt_cpufreq_strings}"
          readelf -rW "${gameopt_cpufreq_limits_obj}" > "${gameopt_cpufreq_relocs}"
          grep -Fxq 'cpu_min_freq' "${gameopt_cpufreq_strings}"
          grep -Fxq 'cpu_max_freq' "${gameopt_cpufreq_strings}"
          for symbol in cpufreq_register_notifier cpufreq_update_policy cpufreq_cpu_get cpufreq_cpu_put; do
            grep -Fq "${symbol}" "${gameopt_cpufreq_relocs}"
          done
          ! grep -Eq 'schedule_work|queue_work|kobject_uevent' "${gameopt_cpufreq_relocs}"
          {
            echo result=PASS
            echo proc_nodes=cpu_min_freq,cpu_max_freq
            echo input_grammar=whitespace-separated-CPU:kHz-pairs
            echo policy_backend=CPUFREQ_ADJUST-notifier
            echo default_min=0
            echo default_max=UINT_MAX
            echo scheduler_hook=absent
            echo dstate_coupling=absent
            echo gameopt_cpufreq_limits=donor-cpu-khz-policy-controls
          } | tee "${artifact_dir}/GAMEOPT-CPUFREQ-LIMITS-BINARY-AUDIT.txt"
          fair_gameopt_obj="${out_dir}/kernel/sched/fair.o"
          rt_gameopt_obj="${out_dir}/kernel/sched/rt.o"
          core_gameopt_obj="${out_dir}/kernel/sched/core.o"
          for object in "${fair_gameopt_obj}" "${rt_gameopt_obj}" "${core_gameopt_obj}"; do
            test -s "${object}"
          done
          readelf -rW "${fair_gameopt_obj}" | grep -Fq 'g_update_task_runtime'
          readelf -rW "${rt_gameopt_obj}" | grep -Fq 'g_update_task_runtime'
          readelf -rW "${core_gameopt_obj}" | grep -Fq 'g_rt_task_dead'
          for symbol in g_update_task_runtime g_rt_task_dead; do
            grep -Eq "[[:space:]][Tt][[:space:]]${symbol}$" "${out_dir}/System.map"
          done
          for literal in game_pid heavy_task_info '%d;%s;%u'; do
