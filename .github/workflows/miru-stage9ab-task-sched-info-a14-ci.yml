          done
          {
            echo result=PASS
            echo proc_nodes=game_pid,heavy_task_info
            echo scheduler_hooks=cfs-runtime,rt-runtime,task-death
            echo default_state=off-until-game-pid
            echo maximum_tracked_threads=256
            echo gameopt_task_runtime=opt-in-bounded-cfs-rt-accounting
          } | tee "${artifact_dir}/GAMEOPT-TASK-RUNTIME-BINARY-AUDIT.txt"
          readelf -rW "${core_gameopt_obj}" | grep -Fq 'g_rt_try_to_wake_up'
          readelf -rW "${core_gameopt_obj}" | grep -Fq 'g_rt_waker_task_dead'
          for symbol in g_rt_try_to_wake_up g_rt_waker_task_dead; do
            grep -Eq "[[:space:]][Tt][[:space:]]${symbol}$" "${out_dir}/System.map"
          done
          for literal in render_thread_info rt_num '%d;%s;%d;%llu;%u'; do
            grep -Fq "${literal}" "${strings_file}"
          done
          {
            echo result=PASS
            echo proc_nodes=render_thread_info,rt_num
            echo scheduler_hooks=successful-wakeup,task-death
            echo default_state=off-until-render-tids
            echo maximum_render_threads=2
            echo maximum_waker_records=256
            echo dstate_coupling=selected-tid-forwarding-stage9l-inherited
            echo gameopt_render_waker=opt-in-bounded-wakeup-accounting
          } | tee "${artifact_dir}/GAMEOPT-RENDER-WAKER-BINARY-AUDIT.txt"
          gameopt_dstate_strings="${RUNNER_TEMP}/stage9m-gameopt-dstate.strings"
          gameopt_dstate_relocs="${RUNNER_TEMP}/stage9m-gameopt-dstate.relocations"
          strings "${gameopt_dstate_obj}" > "${gameopt_dstate_strings}"
          readelf -rW "${gameopt_dstate_obj}" > "${gameopt_dstate_relocs}"
          for literal in dump_enable duration interested_tids game_opt_dstate; do
            grep -Fq "${literal}" "${gameopt_dstate_strings}"
          done
          for symbol in __tracepoint_sched_stat_blocked irq_work_queue queue_work_on save_stack_trace_tsk force_schedstat_enabled; do
            grep -Fq "${symbol}" "${gameopt_dstate_relocs}"
          done
          readelf -sW "${gameopt_dstate_obj}" | grep -Fq 'dstate_dump_init'
          readelf -sW "${gameopt_dstate_obj}" | grep -Fq 'rt_set_dstate_interested_threads'
          {
            echo result=PASS
            echo proc_nodes=dstate/dump_enable,dstate/duration,dstate/interested_tids
            echo default_enable=1
            echo default_duration_ms=5
            echo target_gate=render-or-explicit-tids
            echo producer=native-sched-stat-blocked-tracepoint
            echo scheduler_locking=trylock-drop-on-contention
            echo reporting=single-slot-250ms-rate-limit-deferred-worker
            echo gameopt_dstate=selected-rate-limited-deferred-stack-reporting
          } | tee "${artifact_dir}/GAMEOPT-DSTATE-BINARY-AUDIT.txt"
          for literal in task_cpustats_enable task_cpustats sgeinfo sgefreqinfo; do
            grep -Fxq "${literal}" "${strings_file}"
          done
          {
            echo result=PASS
            echo config=CONFIG_OPLUS_CTP=y
            echo object="${task_cpustats_obj#${out_dir}/}"
            echo symbol_account_task_time=present
            echo symbol_sysctl_task_cpustats_enable=present
            echo proc_task_cpustats=present
            echo proc_sgeinfo=present
            echo proc_sgefreqinfo=present
            echo task_cpustats=real-tick-accounting
          } | tee "${artifact_dir}/TASK-CPUSTATS-BINARY-AUDIT.txt"

          task_sched_obj="$(find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/fs/proc/task_sched_info.o' -print -quit)"
          test -n "${task_sched_obj}"
          test -s "${task_sched_obj}"
          proactive_compact_obj="$(find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/fs/proc/oplus_proactive_compact.o' -print -quit)"
          storage_log_obj="$(find "${RUNNER_TEMP}/android-root/out/h40-kernel" -type f -path '*/fs/proc/oplus_storage_log.o' -print -quit)"
          test -s "${proactive_compact_obj}"
          test -s "${storage_log_obj}"
          core_obj="${RUNNER_TEMP}/android-root/out/h40-kernel/kernel/sched/core.o"
          fair_obj="${RUNNER_TEMP}/android-root/out/h40-kernel/kernel/sched/fair.o"
          exec_obj="${RUNNER_TEMP}/android-root/out/h40-kernel/fs/exec.o"
          cpufreq_obj="${RUNNER_TEMP}/android-root/out/h40-kernel/drivers/cpufreq/cpufreq.o"
          for object in "${core_obj}" "${fair_obj}" "${exec_obj}" "${cpufreq_obj}"; do test -s "${object}"; done
          core_relocs="${RUNNER_TEMP}/stage9b-task-sched-info-a14-core.relocations"
          fair_relocs="${RUNNER_TEMP}/stage9b-task-sched-info-a14-fair.relocations"
          exec_relocs="${RUNNER_TEMP}/stage9b-task-sched-info-a14-exec.relocations"
          cpufreq_relocs="${RUNNER_TEMP}/stage9b-task-sched-info-a14-cpufreq.relocations"
          readelf -rW "${core_obj}" > "${core_relocs}"
          readelf -rW "${fair_obj}" > "${fair_relocs}"
          readelf -rW "${exec_obj}" > "${exec_relocs}"
          readelf -rW "${cpufreq_obj}" > "${cpufreq_relocs}"
          echo checking-relocation=update_wake_tid
          grep -Fq 'update_wake_tid' "${core_relocs}"
          echo checking-relocation=update_running_start_time
          grep -Fq 'update_running_start_time' "${core_relocs}"
          echo checking-relocation=update_task_sched_info
          grep -Fq 'update_task_sched_info' "${fair_relocs}"
          echo checking-relocation=get_target_thread_pid
          grep -Fq 'get_target_thread_pid' "${exec_relocs}"
          for symbol in update_task_sched_info update_wake_tid update_running_start_time get_target_thread_pid sched_action_trig; do
            echo checking-system-map-symbol="${symbol}"
            grep -Eq "[[:space:]][Tt][[:space:]]${symbol}$" "${out_dir}/System.map"
          done
          # Stage 9F's heavy_task_info lets BFD tail-merge the shorter
          # task_info string.  The complete proc path below is authoritative.
          for literal in pids_set sched_buffer task_sched_info_enable sched_info_threshold d_convert 'SCHEDACTION=uevent' 'SCHEDNUM=%u'; do
            echo checking-vmlinux-literal="${literal}"
            grep -Fxq "${literal}" "${strings_file}"
          done
          # BFD tail-merges suffix string literals at final link.  Check the
          # retained full proc path and built-in module-parameter spelling,
          # rather than suffixes that need not remain standalone strings.
          for literal in task_info/task_sched_info task_sched_info.sched_info_ctrl; do
            echo checking-vmlinux-literal="${literal}"
            grep -Fxq "${literal}" "${strings_file}"
          done
          echo checking-stage9b-relocation=update_freq_info
          grep -Fq 'update_freq_info' "${cpufreq_relocs}"
          echo checking-stage9b-relocation=update_freq_limit_info
          grep -Fq 'update_freq_limit_info' "${cpufreq_relocs}"
          echo checking-stage9b-relocation=update_cpu_isolate_info-count-2
          test "$(grep -Fc 'update_cpu_isolate_info' "${core_relocs}")" -eq 2
          for symbol in update_freq_info update_freq_limit_info update_cpu_isolate_info; do
            echo checking-system-map-symbol="${symbol}"
            grep -Eq "[[:space:]][Tt][[:space:]]${symbol}$" "${out_dir}/System.map"
          done
          grep -Eq '[[:space:]][Tt][[:space:]]pr_storage$' "${out_dir}/System.map"
          for literal in sched_stats fragmentation_index buf_log; do
            echo checking-stage9c-vmlinux-literal="${literal}"
            grep -Fxq "${literal}" "${strings_file}"
          done
          {
            echo result=PASS
            echo config=CONFIG_OPLUS_SCHED=y
            echo object="${task_sched_obj#${out_dir}/}"
            echo scheduler_relocations=present
            echo stage_specific_relocations=frequency-limit-isolation-present
            echo task_sched_info=full-scheduler-frequency-isolation-telemetry
          } | tee "${artifact_dir}/TASK-SCHED-INFO-BINARY-AUDIT.txt"

          grep -Fq 'sched_assist_update_record' "${fair_relocs}"
          grep -Fq 'sched_assist_pick_next_entity' "${fair_relocs}"
          grep -Eq '[[:space:]][Tt][[:space:]]sched_assist_update_record$' "${out_dir}/System.map"
          grep -Eq '[[:space:]][Tt][[:space:]]sched_assist_pick_next_entity$' "${out_dir}/System.map"
          {
            echo result=PASS
            echo config=CONFIG_OPLUS_FEATURE_AUDIO_OPT=y
            echo samples=4
            echo match_threshold=3
            echo exec_threshold_ns=3000000
            echo activation=audio-tgid-and-camera-scene
            echo fair_scheduler_relocations=present
            echo audio_small_task=donor-audio-tgid-camera-cadence-preference
          } | tee "${artifact_dir}/AUDIO-SMALL-TASK-BINARY-AUDIT.txt"

      - name: Build matching external modules with stable builder
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          kernel_dir="${RUNNER_TEMP}/android-root/kernel/msm-4.14"
          out_dir="${RUNNER_TEMP}/android-root/out/h40-kernel"
          artifact_dir="${RUNNER_TEMP}/android-root/out/h40-artifacts"
          vendor_source="${RUNNER_TEMP}/oneplus-sm8150-vendor-source"
          module_dir="${RUNNER_TEMP}/miru-external-modules/dropin"
          report_dir="${GITHUB_WORKSPACE}/external-module-diagnostics"
          mkdir -p "${report_dir}"
          runtime_archive="${RUNNER_TEMP}/android-root/out/${PACKAGE_TAG}.7z"
          audit_archive="${RUNNER_TEMP}/android-root/out/${PACKAGE_TAG}-audit.zip"

          test -s "${out_dir}/Module.symvers"
          test "$(git -C "${vendor_source}" rev-parse HEAD)" = "${MODULES_REPAIR_SHA}"
          git -C "${vendor_source}" fetch --no-tags --depth=16 origin "${MODULES_REPAIR_BRANCH}"
          test "$(git -C "${vendor_source}" rev-parse FETCH_HEAD)" = "${MODULES_REPAIR_SHA}"
          test "$(git -C "${vendor_source}" rev-parse HEAD^)" = "${MODULES_PARENT_SHA}"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_assist/sched_assist_common.c"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/oplus_sched_info.c"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/tasktrack.c"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/tasktrack.h"
          for source_file in osi_base.c osi_base.h osi_cpuload.c osi_cpuload.h \
            osi_cputime.h osi_freq.c osi_freq.h osi_loadindicator.c \
            osi_loadindicator.h osi_hotthread.c osi_hotthread.h \
            osi_enable.c osi_enable.h \
            osi_onlinecpu.c osi_onlinecpu.h \
            osi_topology.c osi_topology.h osi_version.c osi_version.h; do
            test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/sched_info/${source_file}"
          done
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/task_cpustats/task_cpustats.h"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_group.c"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.c"
          test -f "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_sysctl.c"
          grep -Fq 'frame_boost_safe_mode' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_sysctl.c"
          grep -Fq '!__frame_boost_enabled() || atomic_read(&fbg_initialized) == 0' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_group.c"
          grep -Fq 'ofb_handle_sf_msg_trans' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.c"
          grep -Fq '_IOC_NR(cmd) == SET_SF_MSG_TRANS' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.c"
          ! grep -Fq 'case CMD_ID_SET_SF_MSG_TRANS:' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.c"
          grep -Fq '#define STUNE_DEF 0x444546' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.h"
          grep -Fq '#define STUNE_SF 0x5346' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.h"
          grep -Fq 'int boost_sf_freq_nongpu;' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.h"
          grep -Fq 'int boost_sf_migr_nongpu;' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.h"
          grep -Fq 'int boost_sf_freq_gpu;' "${vendor_source}/vendor/oplus/kernel/oplus_performance/frame_boost/frame_ioctl.h"
