name: Miru H.40 USB source-only fix

on:
  push:
    branches: [miru-h40-lts336-release]
    paths:
      - Documentation/miru/.usb-source-fix-trigger

permissions:
  contents: write

concurrency:
  group: miru-h40-lts336-usb-source-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable boundary and source-only staging state
        shell: bash
        env:
          EXPECTED_SOURCE: c011d59828604da9308cb28619ee5065827806e1
          PRODUCTION_HEAD: a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee
        run: |
          set -Eeuo pipefail

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${EXPECTED_SOURCE}" HEAD
          test "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')" = "${PRODUCTION_HEAD}"
          test "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40-lts336-release | awk 'NR == 1 {print $1}')" = "${GITHUB_SHA}"

          printf '%s\n' \
            .github/workflows/miru-h40-usb-source-fix.yml \
            Documentation/miru/.usb-source-fix-trigger \
            | sort > expected-staging-files.txt
          git diff --name-only "${EXPECTED_SOURCE}" HEAD | sort > actual-staging-files.txt
          cmp expected-staging-files.txt actual-staging-files.txt

          test "$(git rev-parse HEAD:drivers/usb/dwc3/gadget.c)" = "f897b4fbda584d473f8a96cdd4440e2b4425c782"

      - name: Drop the incompatible suspended-event path
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/usb/dwc3/gadget.c")
          text = path.read_text()

          suspended_event = '''\tif (pm_runtime_suspended(dwc->dev)) {
          \t\tdwc->pending_events = true;
          \t\t/*
          \t\t * Trigger runtime resume. The get() function will be balanced
          \t\t * after processing the pending events in
          \t\t * dwc3_gadget_process_pending_events().
          \t\t */
          \t\tpm_runtime_get(dwc->dev);
          \t\tdisable_irq_nosync(dwc->irq_gadget);
          \t\treturn IRQ_HANDLED;
          \t}
          
          '''
          if text.count(suspended_event) != 1:
              raise SystemExit("suspended-event block identity mismatch")
          text = text.replace(suspended_event, "", 1)

          pending_drain = '''\t\tif (dwc3_check_event_buf(dwc->ev_buf) == IRQ_WAKE_THREAD)
          \t\t\tdwc3_thread_interrupt(dwc->irq_gadget, dwc->ev_buf);
          \t\tpm_runtime_put(dwc->dev);
          '''
          replacement = '''\t\tdwc3_interrupt(dwc->irq_gadget, dwc->ev_buf);
          '''
          if text.count(pending_drain) != 1:
              raise SystemExit("pending-event helper identity mismatch")
          text = text.replace(pending_drain, replacement, 1)

          if "pm_runtime_suspended(dwc->dev)" in text:
              raise SystemExit("stale suspended-event gate remains")

          expected_helper = '''void dwc3_gadget_process_pending_events(struct dwc3 *dwc)
          {
          \tif (dwc->pending_events) {
          \t\tdwc3_interrupt(dwc->irq_gadget, dwc->ev_buf);
          \t\tdwc->pending_events = false;
          \t\tenable_irq(dwc->irq_gadget);
          \t}
          }
          '''
          if text.count(expected_helper) != 1:
              raise SystemExit("final pending-event helper mismatch")

          path.write_text(text)
          PY

          rm .github/workflows/miru-h40-usb-source-fix.yml
          rm Documentation/miru/.usb-source-fix-trigger

          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" = 3
          test "${changed[0]}" = ".github/workflows/miru-h40-usb-source-fix.yml"
          test "${changed[1]}" = "Documentation/miru/.usb-source-fix-trigger"
          test "${changed[2]}" = "drivers/usb/dwc3/gadget.c"

          test "$(git diff --numstat -- drivers/usb/dwc3/gadget.c | awk '{print $1}')" = 1
          test "$(git diff --numstat -- drivers/usb/dwc3/gadget.c | awk '{print $2}')" = 15
          git diff -- drivers/usb/dwc3/gadget.c

      - name: Commit source fix without starting builders
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drivers/usb/dwc3/gadget.c \
            .github/workflows/miru-h40-usb-source-fix.yml \
            Documentation/miru/.usb-source-fix-trigger
          git commit \
            -m "usb: dwc3: drop suspended-event path incompatible with Qualcomm glue [skip ci]" \
            -m "Linux 4.14.336 defers gadget IRQ handling when the DWC3 child is marked runtime-suspended, disables irq_gadget, and waits for generic child resume. Qualcomm glue owns the hardware PM transition and can bypass that completion path, leaving the UDC permanently not attached. Remove only that incompatible path and restore the retained Qualcomm pending-event helper; keep the rest of the genuine 4.14.336 gadget implementation."
          git push origin HEAD:miru-h40-lts336-release
