name: Miru H.40 Linux 4.14.336 candidate audit

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miru-h40-lts336-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PRODUCTION_HEAD: a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee
  PRODUCTION_MERGE_305: 489177590738e082a37e17fc9ef9290e4f168058
  PRISTINE_H40: 180d787684d5965be5145bcfbf666ed427b4ea18
  ROLLBACK_269: 61371a1024e341f434deaf61b79a05f73827260a
  ANDROID_COMMON_305: 4415bf5e08942aee6487946a3e0a50956ef68f1e
  ANDROID_COMMON_336: 014241ad77dda0eafbdf671d5b8e86917d8ec97e
  ANDROID_COMMON_336_PARENT_1: bc841b804f61c5918bd950ccb15e63c36f5bd0b5
  ANDROID_COMMON_336_PARENT_2: c31e35278ea8f04f1dceadd77dca4dd7d47932a3
  RELEASE_BRANCH: miru-h40-lts336-release

jobs:
  provenance-and-conflict-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout candidate with complete Miru ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify immutable refs and import exact Android Common target
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p audit/conflicts/{base,ours,theirs,worktree}

          test "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" = "${RELEASE_BRANCH}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "${PRODUCTION_HEAD}" HEAD
          git merge-base --is-ancestor "${PRODUCTION_MERGE_305}" HEAD
          git merge-base --is-ancestor "${PRISTINE_H40}" HEAD
          git merge-base --is-ancestor "${ROLLBACK_269}" HEAD
          git merge-base --is-ancestor "${ANDROID_COMMON_305}" HEAD

          live_production="$(git ls-remote origin refs/heads/miru-h40 | awk '{print $1}')"
          test "${live_production}" = "${PRODUCTION_HEAD}"
          test "$(git rev-parse oneplus/sm8150_s_12.1_op7pro)" = "${PRISTINE_H40}"
          test "$(git rev-parse miru-h40-4.14.269-final^{commit})" = "${ROLLBACK_269}"

          target_branch_head="$(git ls-remote https://android.googlesource.com/kernel/common refs/heads/deprecated/android-4.14-stable | awk '{print $1}')"
          test "${target_branch_head}" = "${ANDROID_COMMON_336}"
          git fetch --no-tags --force https://android.googlesource.com/kernel/common "${ANDROID_COMMON_336}"
          test "$(git rev-parse FETCH_HEAD)" = "${ANDROID_COMMON_336}"
          git update-ref refs/remotes/android-common/deprecated-android-4.14-stable "${ANDROID_COMMON_336}"

          test "$(git rev-list --parents -n 1 "${ANDROID_COMMON_336}")" = "${ANDROID_COMMON_336} ${ANDROID_COMMON_336_PARENT_1} ${ANDROID_COMMON_336_PARENT_2}"
          test "$(git show "${ANDROID_COMMON_336}:Makefile" | sed -n 's/^VERSION = //p' | head -n1)" = 4
          test "$(git show "${ANDROID_COMMON_336}:Makefile" | sed -n 's/^PATCHLEVEL = //p' | head -n1)" = 14
          test "$(git show "${ANDROID_COMMON_336}:Makefile" | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 336
          git merge-base --is-ancestor "${ANDROID_COMMON_305}" "${ANDROID_COMMON_336}"

          {
            echo result=PASS
            echo "candidate_head=$(git rev-parse HEAD)"
            echo "production_head=${live_production}"
            echo "production_merge_305=${PRODUCTION_MERGE_305}"
            echo "pristine_h40=${PRISTINE_H40}"
            echo "rollback_269=${ROLLBACK_269}"
            echo "android_common_305=${ANDROID_COMMON_305}"
            echo "android_common_336=${ANDROID_COMMON_336}"
            echo "android_common_branch_head=${target_branch_head}"
            echo "android_common_336_parent_order=${ANDROID_COMMON_336_PARENT_1},${ANDROID_COMMON_336_PARENT_2}"
            echo "candidate_commits_after_production=$(git rev-list --count "${PRODUCTION_HEAD}..HEAD")"
            echo "merge_base_candidate_target=$(git merge-base HEAD "${ANDROID_COMMON_336}")"
            echo "merge_base_pristine_target=$(git merge-base "${PRISTINE_H40}" "${ANDROID_COMMON_336}")"
          } | tee audit/PROVENANCE.txt

      - name: Build three-way path and compatibility audit
        shell: bash
        run: |
          set -Eeuo pipefail

          git diff --name-status "${PRISTINE_H40}" "${PRODUCTION_HEAD}" -- > audit/H40-TO-PRODUCTION-PATHS.txt
          git diff --name-status "${ANDROID_COMMON_305}" "${ANDROID_COMMON_336}" -- > audit/ANDROID-COMMON-305-TO-336-PATHS.txt
          git diff --stat "${ANDROID_COMMON_305}" "${ANDROID_COMMON_336}" -- > audit/ANDROID-COMMON-305-TO-336-STAT.txt
          git diff --shortstat "${ANDROID_COMMON_305}" "${ANDROID_COMMON_336}" -- > audit/ANDROID-COMMON-305-TO-336-SHORTSTAT.txt
          git log --oneline --no-merges "${ANDROID_COMMON_305}..${ANDROID_COMMON_336}" > audit/ANDROID-COMMON-305-TO-336-COMMITS.txt

          git diff --name-only "${PRISTINE_H40}" "${PRODUCTION_HEAD}" -- | sort -u > audit/downstream-paths.txt
          git diff --name-only "${ANDROID_COMMON_305}" "${ANDROID_COMMON_336}" -- | sort -u > audit/common-305-336-paths.txt
          comm -12 audit/downstream-paths.txt audit/common-305-336-paths.txt > audit/OVERLAPPING-RUNTIME-PATHS.txt

          required_paths=(
            arch/arm64
            drivers/char/random.c
            drivers/extcon/extcon.c
            drivers/gpu/drm/msm
            drivers/input/touchscreen/oneplus_touchscreen
            drivers/of/fdt.c
            drivers/power/oplus
            drivers/rpmsg
            drivers/soc/qcom
            h40-repro/config
            mm/rmap.c
            net/qrtr
            sound/soc
          )
          : > audit/REQUIRED-PATH-305-336-DELTA.txt
          for path in "${required_paths[@]}"; do
            test -e "${path}"
            git diff --name-status "${ANDROID_COMMON_305}" "${ANDROID_COMMON_336}" -- "${path}" >> audit/REQUIRED-PATH-305-336-DELTA.txt
          done

          kcal_paths=(
            drivers/gpu/drm/msm/sde/sde_kcal_ctrl.c
            drivers/gpu/drm/msm/sde/sde_kcal_ctrl.h
            drivers/gpu/drm/msm/sde/sde_color_processing.c
            drivers/gpu/drm/msm/sde/sde_crtc.c
            drivers/gpu/drm/msm/msm_drv.c
          )
          : > audit/KCAL-PREMERGE-IDENTITY.txt
          for path in "${kcal_paths[@]}"; do
            test -s "${path}"
            printf '%s  %s\n' "$(git hash-object "${path}")" "${path}" >> audit/KCAL-PREMERGE-IDENTITY.txt
          done
          grep -Fq 'sde_kcal_apply_pcc' drivers/gpu/drm/msm/sde/sde_color_processing.c
          grep -Fq 'sde_kcal_ctrl_init' drivers/gpu/drm/msm/msm_drv.c
          grep -Fq 'kcal_ctrl' drivers/gpu/drm/msm/sde/Makefile
          grep -Fq 'CONFIG_DRM_SDE_KCAL=y' h40-repro/config

          {
            echo result=PASS
            echo "downstream_changed_paths=$(wc -l < audit/downstream-paths.txt)"
            echo "common_305_336_changed_paths=$(wc -l < audit/common-305-336-paths.txt)"
            echo "overlap_paths=$(wc -l < audit/OVERLAPPING-RUNTIME-PATHS.txt)"
            echo "kcal_identity_entries=$(wc -l < audit/KCAL-PREMERGE-IDENTITY.txt)"
          } | tee audit/THREE-WAY-SUMMARY.txt

      - name: Perform authentic no-commit merge and capture every conflict stage
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          parent1="$(git rev-parse HEAD)"
          set +e
          git merge --no-commit --no-ff "${ANDROID_COMMON_336}" > audit/MERGE-OUTPUT.txt 2>&1
          merge_status=$?
          set -e

          printf 'merge_exit_code=%s\n' "${merge_status}" | tee audit/MERGE-STATUS.txt
          printf 'expected_parent_1=%s\nexpected_parent_2=%s\n' "${parent1}" "${ANDROID_COMMON_336}" > audit/EXPECTED-MERGE-PARENTS.txt
          git status --short > audit/MERGE-STATUS-SHORT.txt
          git ls-files -u > audit/UNMERGED-INDEX.txt
          git diff --name-only --diff-filter=U | sort -u > audit/CONFLICT-PATHS.txt
          git diff --cc > audit/COMBINED-CONFLICT-DIFF.patch || true

          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            for entry in '1 base' '2 ours' '3 theirs'; do
              set -- ${entry}
              stage="$1"
              label="$2"
              mkdir -p "audit/conflicts/${label}/$(dirname "${path}")"
              if git show ":${stage}:${path}" > "audit/conflicts/${label}/${path}" 2>/dev/null; then
                :
              else
                printf 'MISSING AT INDEX STAGE %s\n' "${stage}" > "audit/conflicts/${label}/${path}.missing"
              fi
            done
            mkdir -p "audit/conflicts/worktree/$(dirname "${path}")"
            if [ -e "${path}" ]; then
              cp -a "${path}" "audit/conflicts/worktree/${path}"
            else
              printf 'MISSING IN WORKTREE\n' > "audit/conflicts/worktree/${path}.missing"
            fi
          done < audit/CONFLICT-PATHS.txt

          conflict_count="$(wc -l < audit/CONFLICT-PATHS.txt)"
          if [ "${merge_status}" -eq 0 ]; then
            test "${conflict_count}" -eq 0
            result=CLEAN
          else
            test "${conflict_count}" -gt 0
            result=CONFLICTS_CAPTURED
          fi

          {
            echo "result=${result}"
            echo "parent_1=${parent1}"
            echo "parent_2=${ANDROID_COMMON_336}"
            echo "initial_conflicts=${conflict_count}"
            echo "unmerged_index_entries=$(wc -l < audit/UNMERGED-INDEX.txt)"
          } | tee audit/CONFLICT-SUMMARY.txt

      - name: Upload provenance and semantic-resolution input
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts336-initial-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: audit
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
