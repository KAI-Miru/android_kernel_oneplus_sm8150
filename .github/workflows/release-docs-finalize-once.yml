          - 4.14.269 rollback tag: `miru-h40-4.14.269-final`
          - Exact boot-tested 4.14.305 source: `53f76796d1b68260507a83968a4a4bee3b89754f`
          - Android Common 4.14.305 target: `4415bf5e08942aee6487946a3e0a50956ef68f1e`
