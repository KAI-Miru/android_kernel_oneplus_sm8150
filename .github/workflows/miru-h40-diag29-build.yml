name: Miru H.40 4.14.292 merge probe

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: miru-h40-diag29-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Probe exact Linux 4.14.292 merge state
        shell: bash
        run: bash scripts/miru/diag29_probe.sh

      - name: Upload exact merge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-4.14.292-diag29-merge-probe
          path: diag29-probe/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
