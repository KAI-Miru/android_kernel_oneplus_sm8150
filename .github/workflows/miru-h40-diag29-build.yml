name: Miru H.40 4.14.292 build-driver preflight

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: miru-h40-diag29-driver-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  driver-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate transformed build driver through sanity gate
        id: preflight
        shell: bash
        run: |
          bash scripts/miru/diag29_driver_preflight_v3.sh
          result="$(cat diagnostic-result/RESULT 2>/dev/null || echo FAILURE)"
          echo "result=${result}" >> "${GITHUB_OUTPUT}"

      - name: Upload exact driver-preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-4.14.292-diag29-driver-preflight
          path: |
            diagnostic-result/
            full-artifact/validation/
            build-diagnostics/
            merge-conflicts.txt
            expected-possible-conflicts.txt
            source-validation.txt
          if-no-files-found: warn
          compression-level: 9
          retention-days: 30

      - name: Enforce driver-preflight result
        if: always()
        env:
          RESULT: ${{ steps.preflight.outputs.result }}
        shell: bash
        run: test "${RESULT}" = DRIVER_PREFLIGHT_PASS
