name: Miru H.40 audit OpenELA stage 2 to 4.14.344

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/miru-lts357-stage344-audit.yml'

permissions:
  contents: read

concurrency:
  group: miru-h40-lts357-stage344-audit
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PRODUCTION: eb9451c0a1639e1aa49ee094681f98df0545f797
  OPENELA_PREVIOUS: 9b7ef2749ffa187d86acd0033327338c0fc299bf
  OPENELA_TARGET: 7a22fc46cc7a72d72b6dfdcbbc46e18c9f2caab0
  OPENELA_FINAL: 1e6347375d088ecc896aabb067131d0f9e3c0575
  LINEAGE_MERGE: 9be6616473e5ecc83915ba3390d4c6751b1c4876
  MODULES_SHA: 3216c08bb3f97f865eb055296ea8034e1744caef

jobs:
  audit-stage-344:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'miru-h40-lts357-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify immutable boundaries and fetch references
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${PRODUCTION}"
          test "$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/oneplus/sm8150_s_12.1_op7pro | awk 'NR==1{print $1}')" = "${MODULES_SHA}"
          git remote add openela https://github.com/openela/kernel-lts.git
          git remote add lineage https://github.com/LineageOS/android_kernel_oneplus_sm8150.git
          git fetch --no-tags openela "${OPENELA_PREVIOUS}" "${OPENELA_TARGET}" "${OPENELA_FINAL}"
          git fetch --no-tags lineage "${LINEAGE_MERGE}"
          git merge-base --is-ancestor "${PRODUCTION}" HEAD
          git merge-base --is-ancestor "${OPENELA_PREVIOUS}" HEAD
          ! git merge-base --is-ancestor "${OPENELA_TARGET}" HEAD
          ! git merge-base --is-ancestor "${OPENELA_FINAL}" HEAD
          git merge-base --is-ancestor "${OPENELA_PREVIOUS}" "${OPENELA_TARGET}"
          git merge-base --is-ancestor "${OPENELA_TARGET}" "${OPENELA_FINAL}"
          test "$(git show ${OPENELA_TARGET}:Makefile | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 344

      - name: Capture exact four-state conflict evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          out=integration-evidence/stage-344-audit
          mkdir -p "${out}/files"
          first="$(git rev-parse HEAD)"
          set +e
          git merge --no-ff --no-commit "${OPENELA_TARGET}" >"${out}/merge.stdout" 2>"${out}/merge.stderr"
          rc=$?
          set -e
          test "${rc}" -ne 0
          git diff --name-only --diff-filter=U | sort | tee "${out}/conflicts.txt"
          test "$(wc -l < "${out}/conflicts.txt")" = 7
          while IFS= read -r path; do
            safe="${path//\//__}"
            mkdir -p "${out}/files/${safe}"
            printf '%s\n' "${path}" >"${out}/files/${safe}/PATH.txt"
            git show ":1:${path}" >"${out}/files/${safe}/merge-base"
            git show ":2:${path}" >"${out}/files/${safe}/miru-ours"
            git show ":3:${path}" >"${out}/files/${safe}/openela-theirs"
            git diff "${OPENELA_PREVIOUS}" "${OPENELA_TARGET}" -- "${path}" >"${out}/files/${safe}/openela-stage.patch"
            git show "${LINEAGE_MERGE}:${path}" >"${out}/files/${safe}/lineage-final" 2>"${out}/files/${safe}/lineage.stderr" || true
            cp "${path}" "${out}/files/${safe}/conflicted-worktree"
          done <"${out}/conflicts.txt"
          {
            echo "source=${first}"
            echo "openela_previous=${OPENELA_PREVIOUS}"
            echo "openela_target=${OPENELA_TARGET}"
            echo "lineage_merge=${LINEAGE_MERGE}"
            echo conflicts=7
            echo production_write=NONE
          } >"${out}/SUMMARY.txt"
          git merge --abort
          test "$(git rev-parse HEAD)" = "${first}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miru-h40-openela-stage344-audit-${{ env.SOURCE_SHA }}
          path: integration-evidence/stage-344-audit
          if-no-files-found: error
          retention-days: 30
