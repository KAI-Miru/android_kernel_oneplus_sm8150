name: Miru 4.14.357 OpenELA CI1 kernel

on:
  pull_request:
    branches: [miru-h40]
    types: [synchronize]
    paths:
      - '.github/workflows/miru-h40-lts357-ci1.yml'

permissions:
  contents: read

concurrency:
  group: miru-h40-lts357-ci1
  cancel-in-progress: true

env:
  SOURCE_SHA: 24626c96027f0bfc4431741ee0d249826a286293
  SOURCE_PARENT_1: a6aa49e75e8345027ea90b95858df682068d3a0e
  OPENELA_PARENT: 1e6347375d088ecc896aabb067131d0f9e3c0575
  PRODUCTION_SHA: eb9451c0a1639e1aa49ee094681f98df0545f797
  MODULES_SHA: 3216c08bb3f97f865eb055296ea8034e1744caef
  MODULES_REPAIR_SHA: c03a4c6339b959f1a9b288a157d5b5d16fbcf015
  MODULES_REPAIR_BRANCH: miru-h40-lts357-trace-printk-integration
  STALE_MODULES_SHA: 125ff7d0153cbb3aaa8f9fd618c33b7f728d7798
  EXPECTED_RELEASE: 4.14.357-openela-miru-ci1+
  BUILD_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout build control
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_HEAD }}
          path: control
          fetch-depth: 0

      - name: Checkout validated Stage 357 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_HEAD }}
          path: source
          fetch-depth: 0

      - name: Verify immutable build boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          control_head="$(git -C control rev-parse HEAD)"
          source_head="$(git -C source rev-parse HEAD)"
          test "${control_head}" = "${BUILD_HEAD}"
          test "${source_head}" = "${BUILD_HEAD}"
          test "$(git -C source merge-base "${SOURCE_SHA}" HEAD)" = "${SOURCE_SHA}"
          test "$(git -C source rev-list --parents -n 1 "${SOURCE_SHA}")" = "${SOURCE_SHA} ${SOURCE_PARENT_1} ${OPENELA_PARENT}"
          actual_repair_paths="$(git -C source diff --name-only "${SOURCE_SHA}" HEAD | LC_ALL=C sort | tr '\n' ' ')"
          test "${actual_repair_paths}" = ".github/workflows/miru-h40-lts357-ci1.yml .github/workflows/miru-lts357-stage357-executor.yml include/linux/fscrypt.h include/trace/events/f2fs.h "
          test -z "$(git -C source diff --check "${SOURCE_SHA}" HEAD)"
          test -z "$(git -C source ls-files -u)"
          grep -Fxq 'CONFIG_OPLUS_FEATURE_OF2FS=y' source/h40-repro/config/GM1911_11_H.40.config
          grep -Fq 'legacy test-dummy-encryption callback' source/include/linux/fscrypt.h
          grep -Fq 'OF2FS predates the F2FS background/compressed read counters' source/include/trace/events/f2fs.h
          test "$(sed -n 's/^VERSION = //p' source/Makefile | head -n1)" = 4
          test "$(sed -n 's/^PATCHLEVEL = //p' source/Makefile | head -n1)" = 14
          test "$(sed -n 's/^SUBLEVEL = //p' source/Makefile | head -n1)" = 357
          test "$(sed -n 's/^EXTRAVERSION = //p' source/Makefile | head -n1)" = -openela
          live_production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          test "${live_production}" = "${PRODUCTION_SHA}"
          live_modules="$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/oneplus/sm8150_s_12.1_op7pro | awk 'NR == 1 {print $1}')"
          test "${live_modules}" = "${MODULES_SHA}"
          live_modules_repair="$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/${MODULES_REPAIR_BRANCH} | awk 'NR == 1 {print $1}')"
          test "${live_modules_repair}" = "${MODULES_REPAIR_SHA}"
          {
            echo result=PASS
            echo control_head=${control_head}
            echo source_sha=${SOURCE_SHA}
            echo repair_head=${source_head}
            echo source_parent_1=${SOURCE_PARENT_1}
            echo openela_parent=${OPENELA_PARENT}
            echo production_sha=${PRODUCTION_SHA}
            echo modules_base_sha=${MODULES_SHA}
            echo modules_repair_sha=${MODULES_REPAIR_SHA}
            echo modules_repair_branch=${MODULES_REPAIR_BRANCH}
            echo expected_release=${EXPECTED_RELEASE}
            echo production_write=NONE
          } | tee BUILD-BOUNDARIES.txt

      - name: Generate exact 4.14.357 build driver
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('source/scripts/miru/ci_build_4.14.190.sh')
          target = Path('build-4.14.357-openela-miru-ci1.sh')
          text = source.read_text()

          start = text.index('# Fetch only the distant commits required by the source-level sanity checks.')
          end = text.index("# GitHub's Ubuntu image contains most dependencies already")
          gate = '''# Exact Stage 357 final-candidate sanity gate.
          repair_head="$(git rev-parse HEAD)"
          test "$(git merge-base "${SOURCE_SHA}" HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-list --parents -n 1 "${SOURCE_SHA}")" = "${SOURCE_SHA} ${SOURCE_PARENT_1} ${OPENELA_PARENT}"
          repair_paths="$(git diff --name-only "${SOURCE_SHA}" HEAD | LC_ALL=C sort | tr '\n' ' ')"
          test "${repair_paths}" = ".github/workflows/miru-h40-lts357-ci1.yml .github/workflows/miru-lts357-stage357-executor.yml include/linux/fscrypt.h include/trace/events/f2fs.h "
          test -z "$(git diff --check "${SOURCE_SHA}" HEAD)"
          test -z "$(git ls-files -u)"
          test "$(sed -n 's/^VERSION = //p' Makefile | head -n1)" = 4
          test "$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -n1)" = 14
          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)" = 357
          test "$(sed -n 's/^EXTRAVERSION = //p' Makefile | head -n1)" = -openela
          live_production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          test "${live_production}" = "${PRODUCTION_SHA}"
          {
            echo "Sanity gate: PASS"
            echo "head=${repair_head}"
            echo "source_sha=${SOURCE_SHA}"
            echo "repair_head=${repair_head}"
            echo "kernel_version=4.14.357-openela"
            echo "validated_stage357_merge=yes"
            echo "production_write=NONE"
          } | tee "${DIAG_DIR}/sanity-summary.txt"

          '''
          text = text[:start] + gate + text[end:]

          replacements = {
              'VENDOR_SHA=125ff7d0153cbb3aaa8f9fd618c33b7f728d7798': 'VENDOR_SHA=c03a4c6339b959f1a9b288a157d5b5d16fbcf015',
              '== Miru H.40 Android 4.14.190 CI build ==': '== Miru 4.14.357 OpenELA CI1 kernel build ==',
              'KERNEL_LOCALVERSION=-miru-h40-lts190-ci1': 'KERNEL_LOCALVERSION=-miru-ci1',
              'CONFIG_LOCALVERSION="-miru-h40-lts190-ci1"': 'CONFIG_LOCALVERSION="-miru-ci1"',
              "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 '^Linux version 4\\.14\\.190-' || true)\"": "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 -F 'Linux version 4.14.357-openela-miru-ci1+' || true)\"",
              'echo "Clean kernel build and output validation: PASS"': '''release="$(printf '%s\\n' "${banner}" | sed -n 's/^Linux version \\([^ ]*\\).*/\\1/p')"
          test "${release}" = "${EXPECTED_RELEASE}"
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb"
          printf '%s\\n' "${EXPECTED_RELEASE}" > "${ARTIFACT_DIR}/KERNEL-RELEASE.txt"
          sha256sum "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb" > "${ARTIFACT_DIR}/FINAL-CANDIDATE-SHA256.txt"
          echo "Exact 4.14.357 OpenELA Miru CI1 kernel build and output validation: PASS"''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'build-driver anchor missing or duplicated: {old!r}')
              text = text.replace(old, new, 1)

          target.write_text(text)
          target.chmod(0o755)
          PY
          bash -n build-4.14.357-openela-miru-ci1.sh
          grep -Fq 'VENDOR_SHA=c03a4c6339b959f1a9b288a157d5b5d16fbcf015' build-4.14.357-openela-miru-ci1.sh
          grep -Fq 'KERNEL_LOCALVERSION=-miru-ci1' build-4.14.357-openela-miru-ci1.sh
          ! grep -Fq 'VENDOR_SHA=125ff7d0153cbb3aaa8f9fd618c33b7f728d7798' build-4.14.357-openela-miru-ci1.sh

      - name: Build exact final candidate
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          bash ../build-4.14.357-openela-miru-ci1.sh

      - name: Verify trace_printk cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="$RUNNER_TEMP/android-root/out/h40-artifacts"
          vmlinux="$RUNNER_TEMP/android-root/out/h40-kernel/vmlinux"
          test -s "$vmlinux"
          mkdir -p "$artifact_dir"
          VMLINUX="$vmlinux" MODULES_BASE_SHA="$MODULES_SHA" MODULES_REPAIR_SHA="$MODULES_REPAIR_SHA" python3 - <<'PY' | tee "$artifact_dir/TRACE-PRINTK-CLEANUP.txt"
          import os
          import subprocess

          vmlinux = os.environ["VMLINUX"]
          wanted = {"__start___trace_bprintk_fmt", "__stop___trace_bprintk_fmt"}
          lines = subprocess.check_output(["nm", "-n", vmlinux], text=True).splitlines()
          format_entries = [line for line in lines if ".trace_printk_fmt" in line]
          if format_entries:
              raise SystemExit("compiled trace_printk format entries remain")
          bounds = {}
          for line in lines:
              parts = line.split()
              if len(parts) >= 3 and parts[2] in wanted:
                  bounds[parts[2]] = int(parts[0], 16)
          missing = wanted.difference(bounds)
          if missing and missing != wanted:
              raise SystemExit("incomplete trace_printk bounds: " + ", ".join(sorted(missing)))
          size = 0 if missing else bounds["__stop___trace_bprintk_fmt"] - bounds["__start___trace_bprintk_fmt"]
          if size != 0:
              raise SystemExit(f"compiled trace_printk format bytes: {size}")
          print("result=PASS")
          print("trace_printk_format_entries=0")
          print("trace_printk_format_bytes=0")
          print("modules_base_sha=" + os.environ["MODULES_BASE_SHA"])
          print("modules_repair_sha=" + os.environ["MODULES_REPAIR_SHA"])
          PY

      - name: Build matching external module package
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          kernel_dir="$RUNNER_TEMP/android-root/kernel/msm-4.14"
          out_dir="$RUNNER_TEMP/android-root/out/h40-kernel"
          artifact_dir="$RUNNER_TEMP/android-root/out/h40-artifacts"
          vendor_source="$RUNNER_TEMP/oneplus-sm8150-vendor-source"
          module_dir="$RUNNER_TEMP/miru-external-modules/dropin"
          report_dir="$GITHUB_WORKSPACE/external-module-diagnostics"
          runtime_archive="$RUNNER_TEMP/android-root/out/miru-v3-modules-dropin-4.14.357-openela-miru-ci1.7z"
          audit_archive="$RUNNER_TEMP/android-root/out/miru-v3-modules-dropin-4.14.357-openela-miru-ci1-audit.zip"

          test -s "$out_dir/Module.symvers"
          test -s "$out_dir/include/config/kernel.release"
          test "$(tr -d '\n' < "$out_dir/include/config/kernel.release")" = "$EXPECTED_RELEASE"
          test "$(git -C "$vendor_source" rev-parse HEAD)" = "$MODULES_REPAIR_SHA"
          git -C "$vendor_source" fetch --no-tags --depth=3 origin "$MODULES_REPAIR_BRANCH"
          test "$(git -C "$vendor_source" rev-parse FETCH_HEAD)" = "$MODULES_REPAIR_SHA"
          test "$(git -C "$vendor_source" cat-file -t "$MODULES_SHA")" = commit
          test "$(git -C "$vendor_source" merge-base "$MODULES_SHA" HEAD)" = "$MODULES_SHA"
          modules_repair_paths="$(git -C "$vendor_source" diff --name-only "$MODULES_SHA" HEAD | LC_ALL=C sort | tr '\n' ' ')"
          test "$modules_repair_paths" = "vendor/oplus/kernel_4.14/ext4/mballoc.c vendor/oplus/kernel_4.14/ufs/ufshcd.c "
          test "$(git -C "$vendor_source" rev-list --count "$MODULES_SHA..HEAD")" = 2
          grep -Fq 'EXPORT_SYMBOL_GPL(extend_codec_i2s_be_dailinks);' \
            "$vendor_source/vendor/oplus/kernel_4.14/audio/driver/audio_extend_drv.c"

          python3 scripts/miru/prepare_external_modules_toolchain.py
          python3 scripts/miru/prepare_external_pinctrl_headers.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/miru/prepare_wlan_response_link.py")
          old = 'expected = "74ce588c69513197a354ef0032c2145e91ee0641"'
          new = 'expected = "ee3b37a3bf6a586b74fe00f9e39ca5e77f08b6d3"'
          text = path.read_text()
          if text.count(old) != 1 or new in text:
              raise SystemExit("WLAN response-link Makefile.build identity mismatch")
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/miru/prepare_wlan_response_link.py

          python3 - "$EXPECTED_RELEASE" <<'PY'
          from pathlib import Path
          import sys

          path = Path("scripts/miru/build_external_modules_4.14.190.sh")
          release = sys.argv[1]
          text = path.read_text()

          replacements = (
              ("4.14.190-miru-h40-lts190-ci1+", release, 1),
              ("miru-v3-modules-dropin-4.14.190",
               "miru-v3-modules-dropin-4.14.357-openela-miru-ci1", 4),
              ("Miru 4.14.190 rebuilt external module ABI report",
               "Miru 4.14.357 OpenELA rebuilt external module ABI report", 1),
          )
          for old, new, expected_count in replacements:
              actual_count = text.count(old)
              if actual_count != expected_count:
                  raise SystemExit(
                      f"external-module adaptation anchor {old!r}: "
                      f"expected {expected_count}, found {actual_count}"
                  )
              text = text.replace(old, new)

          if "4.14.190-miru-h40-lts190-ci1+" in text:
              raise SystemExit("stale external-module release gate remains")
          path.write_text(text)
          PY

          bash -n scripts/miru/build_external_modules_4.14.190.sh
          expected_workspace_changes="$(printf '%s\n' \
            scripts/miru/build_external_modules_4.14.190.sh \
            scripts/miru/prepare_wlan_response_link.py | LC_ALL=C sort | tr '\n' ' ')"
          actual_workspace_changes="$(git diff --name-only | LC_ALL=C sort | tr '\n' ' ')"
          test "$actual_workspace_changes" = "$expected_workspace_changes"

          bash scripts/miru/build_external_modules_4.14.190.sh

          test "$(find "$module_dir" -maxdepth 1 -type f -name '*.ko' | wc -l)" = 32
          grep -Fxq 'errors=0' "$report_dir/MODULE-ABI-REPORT.txt"
          test "$(grep -F ": $EXPECTED_RELEASE SMP preempt mod_unload modversions aarch64" \
            "$report_dir/vermagic.txt" | wc -l)" = 32
          grep -Fxq "vendor_source_commit=$MODULES_REPAIR_SHA" "$report_dir/BUILD-MANIFEST.txt"
          test -s "$runtime_archive"
          test -s "$audit_archive"

          mkdir -p "$artifact_dir/external-modules"
          cp "$runtime_archive" "$audit_archive" "$artifact_dir/external-modules/"
          cp "$report_dir/BUILD-MANIFEST.txt" \
            "$report_dir/MODULE-ABI-REPORT.txt" \
            "$report_dir/PACKAGE-SUMMARY.txt" \
            "$report_dir/vermagic.txt" \
            "$artifact_dir/external-modules/"
          sha256sum "$runtime_archive" "$audit_archive" \
            > "$artifact_dir/external-modules/ARCHIVES-SHA256.txt"
          {
            echo result=PASS
            echo "kernel_release=$EXPECTED_RELEASE"
            echo "kernel_head=$(git -C "$kernel_dir" rev-parse HEAD)"
            echo "modules_base_sha=$MODULES_SHA"
            echo "modules_repair_sha=$(git -C "$vendor_source" rev-parse HEAD)"
            echo external_module_count=32
            echo abi_errors=0
            echo "runtime_archive=$(basename "$runtime_archive")"
            echo "audit_archive=$(basename "$audit_archive")"
            echo production_write=NONE
          } | tee "$artifact_dir/external-modules/EXTERNAL-MODULES-SUMMARY.txt"
      - name: Verify final candidate, modules, and immutable production
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="$RUNNER_TEMP/android-root/out/h40-artifacts"
          external_dir="$artifact_dir/external-modules"
          runtime_archive="$external_dir/miru-v3-modules-dropin-4.14.357-openela-miru-ci1.7z"
          audit_archive="$external_dir/miru-v3-modules-dropin-4.14.357-openela-miru-ci1-audit.zip"
          test -s "$artifact_dir/$EXPECTED_RELEASE-Image.gz-dtb"
          test "$(cat "$artifact_dir/KERNEL-RELEASE.txt")" = "$EXPECTED_RELEASE"
          grep -Fq "$EXPECTED_RELEASE" "$GITHUB_WORKSPACE/build-diagnostics/build-summary.txt"
          grep -Fxq 'clang_commit=252aba16f513a857bc923172f67b0e55e23de35f' "$artifact_dir/TOOLCHAIN-MANIFEST.txt"
          grep -Fxq 'clang_path=clang-r377782c' "$artifact_dir/TOOLCHAIN-MANIFEST.txt"
          test -s "$runtime_archive"
          test -s "$audit_archive"
          grep -Fxq 'external_module_count=32' "$external_dir/EXTERNAL-MODULES-SUMMARY.txt"
          grep -Fxq 'abi_errors=0' "$external_dir/EXTERNAL-MODULES-SUMMARY.txt"
          grep -Fxq "modules_base_sha=$MODULES_SHA" "$external_dir/EXTERNAL-MODULES-SUMMARY.txt"
          grep -Fxq "modules_repair_sha=$MODULES_REPAIR_SHA" "$external_dir/EXTERNAL-MODULES-SUMMARY.txt"
          grep -Fxq 'trace_printk_format_entries=0' "$artifact_dir/TRACE-PRINTK-CLEANUP.txt"
          grep -Fxq 'trace_printk_format_bytes=0' "$artifact_dir/TRACE-PRINTK-CLEANUP.txt"
          grep -Fxq 'errors=0' "$external_dir/MODULE-ABI-REPORT.txt"
          test "$(grep -F ": $EXPECTED_RELEASE SMP preempt mod_unload modversions aarch64" \
            "$external_dir/vermagic.txt" | wc -l)" = 32
          sha256sum -c "$external_dir/ARCHIVES-SHA256.txt"
          live_production="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          test "$live_production" = "$PRODUCTION_SHA"
          {
            cat BUILD-BOUNDARIES.txt
            echo result=PASS
            echo candidate=$EXPECTED_RELEASE
            echo artifact=$(basename "$artifact_dir/$EXPECTED_RELEASE-Image.gz-dtb")
            echo external_module_count=32
            echo modules_base_sha=$MODULES_SHA
            echo modules_repair_sha=$MODULES_REPAIR_SHA
            echo trace_printk_format_entries=0
            echo trace_printk_format_bytes=0
            echo external_modules_archive=$(basename "$runtime_archive")
            echo production_after=$live_production
            echo production_write=NONE
          } | tee "$artifact_dir/FINAL-CANDIDATE-SUMMARY.txt"

      - name: Upload kernel candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: 4.14.357-openela-miru-ci1-kernel-and-modules
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/android-root/out/h40-artifacts/**
            build-diagnostics/**
            BUILD-BOUNDARIES.txt
            external-module-diagnostics/**
