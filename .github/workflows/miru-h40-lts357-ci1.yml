name: Miru 4.14.357 OpenELA CI1 kernel

on:
  push:
    branches: [miru-h40-lts357-integration]
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miru-h40-lts357-ci1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 24626c96027f0bfc4431741ee0d249826a286293
  CONTROL_PARENT: 01fc05299187b13f73dded314d7fa8642a3d2869
  SOURCE_PARENT_1: a6aa49e75e8345027ea90b95858df682068d3a0e
  OPENELA_PARENT: 1e6347375d088ecc896aabb067131d0f9e3c0575
  PRODUCTION_SHA: eb9451c0a1639e1aa49ee094681f98df0545f797
  MODULES_SHA: 3216c08bb3f97f865eb055296ea8034e1744caef
  STALE_MODULES_SHA: 125ff7d0153cbb3aaa8f9fd618c33b7f728d7798
  EXPECTED_RELEASE: 4.14.357-openela-miru-ci1+

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout build control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
          fetch-depth: 3

      - name: Checkout validated Stage 357 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0

      - name: Verify immutable build boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          control_head="$(git -C control rev-parse HEAD)"
          test "$(git -C control rev-parse HEAD^)" = "${CONTROL_PARENT}"
          test "$(git -C control rev-parse HEAD^^)" = "${SOURCE_SHA}"
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/miru-h40-lts357-ci1.yml'
          test "$(git -C control diff-tree --no-commit-id --name-only -r "${CONTROL_PARENT}")" = '.github/workflows/miru-h40-lts357-ci1.yml'
          test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git -C source rev-list --parents -n 1 HEAD)" = "${SOURCE_SHA} ${SOURCE_PARENT_1} ${OPENELA_PARENT}"
          test "$(sed -n 's/^VERSION = //p' source/Makefile | head -n1)" = 4
          test "$(sed -n 's/^PATCHLEVEL = //p' source/Makefile | head -n1)" = 14
          test "$(sed -n 's/^SUBLEVEL = //p' source/Makefile | head -n1)" = 357
          test "$(sed -n 's/^EXTRAVERSION = //p' source/Makefile | head -n1)" = -openela
          test -z "$(git -C source ls-files -u)"
          live_production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          test "${live_production}" = "${PRODUCTION_SHA}"
          live_modules="$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/oneplus/sm8150_s_12.1_op7pro | awk 'NR == 1 {print $1}')"
          test "${live_modules}" = "${MODULES_SHA}"
          {
            echo result=PASS
            echo control_head=${control_head}
            echo source_sha=${SOURCE_SHA}
            echo source_parent_1=${SOURCE_PARENT_1}
            echo openela_parent=${OPENELA_PARENT}
            echo production_sha=${PRODUCTION_SHA}
            echo modules_sha=${MODULES_SHA}
            echo expected_release=${EXPECTED_RELEASE}
            echo production_write=NONE
          } | tee BUILD-BOUNDARIES.txt

      - name: Generate exact 4.14.357 build driver
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('source/scripts/miru/ci_build_4.14.190.sh')
          target = Path('build-4.14.357-openela-miru-ci1.sh')
          text = source.read_text()

          start = text.index('# Fetch only the distant commits required by the source-level sanity checks.')
          end = text.index("# GitHub's Ubuntu image contains most dependencies already")
          gate = '''# Exact Stage 357 final-candidate sanity gate.
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-list --parents -n 1 HEAD)" = "${SOURCE_SHA} ${SOURCE_PARENT_1} ${OPENELA_PARENT}"
          test -z "$(git ls-files -u)"
          test "$(sed -n 's/^VERSION = //p' Makefile | head -n1)" = 4
          test "$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -n1)" = 14
          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)" = 357
          test "$(sed -n 's/^EXTRAVERSION = //p' Makefile | head -n1)" = -openela
          live_production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          test "${live_production}" = "${PRODUCTION_SHA}"
          {
            echo "Sanity gate: PASS"
            echo "head=$(git rev-parse HEAD)"
            echo "kernel_version=4.14.357-openela"
            echo "validated_stage357_merge=yes"
            echo "production_write=NONE"
          } | tee "${DIAG_DIR}/sanity-summary.txt"

          '''
          text = text[:start] + gate + text[end:]

          replacements = {
              'VENDOR_SHA=125ff7d0153cbb3aaa8f9fd618c33b7f728d7798': 'VENDOR_SHA=3216c08bb3f97f865eb055296ea8034e1744caef',
              '== Miru H.40 Android 4.14.190 CI build ==': '== Miru 4.14.357 OpenELA CI1 kernel build ==',
              'KERNEL_LOCALVERSION=-miru-h40-lts190-ci1': 'KERNEL_LOCALVERSION=-miru-ci1',
              'CONFIG_LOCALVERSION="-miru-h40-lts190-ci1"': 'CONFIG_LOCALVERSION="-miru-ci1"',
              "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 '^Linux version 4\\.14\\.190-' || true)\"": "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 -F 'Linux version 4.14.357-openela-miru-ci1+' || true)\"",
              'echo "Clean kernel build and output validation: PASS"': '''release="$(printf '%s\\n' "${banner}" | sed -n 's/^Linux version \\([^ ]*\\).*/\\1/p')"
          test "${release}" = "${EXPECTED_RELEASE}"
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb"
          printf '%s\\n' "${EXPECTED_RELEASE}" > "${ARTIFACT_DIR}/KERNEL-RELEASE.txt"
          sha256sum "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb" > "${ARTIFACT_DIR}/FINAL-CANDIDATE-SHA256.txt"
          echo "Exact 4.14.357 OpenELA Miru CI1 kernel build and output validation: PASS"''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'build-driver anchor missing or duplicated: {old!r}')
              text = text.replace(old, new, 1)

          target.write_text(text)
          target.chmod(0o755)
          PY
          bash -n build-4.14.357-openela-miru-ci1.sh
          grep -Fq 'VENDOR_SHA=3216c08bb3f97f865eb055296ea8034e1744caef' build-4.14.357-openela-miru-ci1.sh
          grep -Fq 'KERNEL_LOCALVERSION=-miru-ci1' build-4.14.357-openela-miru-ci1.sh
          ! grep -Fq 'VENDOR_SHA=125ff7d0153cbb3aaa8f9fd618c33b7f728d7798' build-4.14.357-openela-miru-ci1.sh

      - name: Build exact final candidate
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          bash ../build-4.14.357-openela-miru-ci1.sh

      - name: Verify final candidate and immutable production
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="${RUNNER_TEMP}/android-root/out/h40-artifacts"
          test -s "${artifact_dir}/${EXPECTED_RELEASE}-Image.gz-dtb"
          test "$(cat "${artifact_dir}/KERNEL-RELEASE.txt")" = "${EXPECTED_RELEASE}"
          grep -Fq "${EXPECTED_RELEASE}" "${GITHUB_WORKSPACE}/build-diagnostics/build-summary.txt"
          live_production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          test "${live_production}" = "${PRODUCTION_SHA}"
          {
            cat BUILD-BOUNDARIES.txt
            echo result=PASS
            echo candidate=${EXPECTED_RELEASE}
            echo artifact=$(basename "${artifact_dir}/${EXPECTED_RELEASE}-Image.gz-dtb")
            echo production_after=${live_production}
            echo production_write=NONE
          } | tee "${artifact_dir}/FINAL-CANDIDATE-SUMMARY.txt"

      - name: Upload kernel candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: 4.14.357-openela-miru-ci1
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/android-root/out/h40-artifacts/**
            build-diagnostics/**
            BUILD-BOUNDARIES.txt
