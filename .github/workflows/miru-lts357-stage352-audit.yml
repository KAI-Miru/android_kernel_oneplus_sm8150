name: Miru H.40 OpenELA stage 352 conflict audit

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/miru-lts357-stage352-audit.yml'

permissions:
  contents: read

concurrency:
  group: miru-h40-lts357-stage352-conflict-audit
  cancel-in-progress: false

env:
  IMMUTABLE_PRODUCTION: eb9451c0a1639e1aa49ee094681f98df0545f797
  PRE_AUDIT_HEAD: 988f3796f6a00d52591e6bed07310d7797e25e41
  OPENELA_BASE: c31e35278ea8f04f1dceadd77dca4dd7d47932a3
  OPENELA_348: ef4cb0aa8addc73e6257039a17061cb1766b7477
  OPENELA_352: 6da009d8de389742d55219ebed50378f53937a5b
  STAGE348_MERGE: 2be978e53f5bddc97eb1ebc2a8da987b1c762b1f
  STAGE348_SOURCE: cf6da7a583920c5923c7f55ebb803b2007e11109
  MODULES_BRANCH: oneplus/sm8150_s_12.1_op7pro
  MODULES_SHA: 3216c08bb3f97f865eb055296ea8034e1744caef
  FORBIDDEN_MODULES_SHA: 125ff7d0153cbb3aaa8f9fd618c33b7f728d7798
  DWC3_REPAIR: a3192f52549713424a5d8352e4be381ca84434a0

jobs:
  audit-stage-352:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'miru-h40-lts357-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify immutable boundaries and exact audit commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "${PRE_AUDIT_HEAD}"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/miru-lts357-stage352-audit.yml'
          live_integration="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40-lts357-integration | awk 'NR==1{print $1}')"
          test "${live_integration}" = "$(git rev-parse HEAD)"
          live_production="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')"
          test "${live_production}" = "${IMMUTABLE_PRODUCTION}"
          live_modules="$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/${MODULES_BRANCH} | awk 'NR==1{print $1}')"
          test "${live_modules}" = "${MODULES_SHA}"
          test "${live_modules}" != "${FORBIDDEN_MODULES_SHA}"
          git merge-base --is-ancestor "${IMMUTABLE_PRODUCTION}" "${STAGE348_MERGE}"
          git merge-base --is-ancestor "${STAGE348_MERGE}" "${STAGE348_SOURCE}"
          git merge-base --is-ancestor "${STAGE348_SOURCE}" HEAD
          test "$(git rev-list --parents -n1 "${STAGE348_MERGE}")" = "${STAGE348_MERGE} $(git rev-list --parents -n1 "${STAGE348_MERGE}" | awk '{print $2}') ${OPENELA_348}"

      - name: Perform read-only exact stage 352 merge audit
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p integration-evidence/stage-352-audit/conflicts
          echo audit_started=1 > integration-evidence/stage-352-audit/started.txt
          git config user.name 'Miru H.40 Stage 352 Audit'
          git config user.email '110590275+KAI-Miru@users.noreply.github.com'
          git remote add openela https://github.com/openela/kernel-lts.git
          git fetch --no-tags openela "${OPENELA_BASE}" "${OPENELA_348}" "${OPENELA_352}"
          test "$(git rev-parse "${OPENELA_352}^{commit}")" = "${OPENELA_352}"
          git cat-file -e "${OPENELA_352}^{commit}"
          git merge-base --is-ancestor "${OPENELA_BASE}" "${OPENELA_348}"
          git merge-base --is-ancestor "${OPENELA_348}" "${OPENELA_352}"
          if git merge-base --is-ancestor "${OPENELA_352}" HEAD; then
            echo 'target_already_ancestor=YES' > integration-evidence/stage-352-audit/ancestry.txt
          else
            echo 'target_already_ancestor=NO' > integration-evidence/stage-352-audit/ancestry.txt
          fi
          test "$(git show ${OPENELA_352}:Makefile | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 352
          test "$(git show ${OPENELA_352}:.elts/config.yaml | sed -n 's/^version: //p')" = 4.14.352
          test "$(git show ${OPENELA_352}:.elts/config.yaml | sed -n 's/^base: //p')" = 4.14.336
          git merge-base --is-ancestor "${DWC3_REPAIR}" HEAD

          printf '%s\n' \
            Makefile \
            drivers/media/pci/cx18/cx18-streams.c \
            drivers/usb/dwc3/core.c \
            > integration-evidence/stage-352-audit/expected-conflicts.txt

          set +e
          git merge --no-ff --no-commit "${OPENELA_352}" \
            > integration-evidence/stage-352-audit/merge.stdout \
            2> integration-evidence/stage-352-audit/merge.stderr
          merge_rc=$?
          set -e
          printf 'merge_exit_code=%s\n' "${merge_rc}" > integration-evidence/stage-352-audit/SUMMARY.txt
          git diff --name-only --diff-filter=U | sort > integration-evidence/stage-352-audit/initial-conflicts.txt

          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            safe="$(printf '%s' "${path}" | sha256sum | cut -c1-16)"
            dir="integration-evidence/stage-352-audit/conflicts/${safe}"
            mkdir -p "${dir}"
            printf '%s\n' "${path}" > "${dir}/path.txt"
            git show ":1:${path}" > "${dir}/01-merge-base" 2>/dev/null || true
            git show ":2:${path}" > "${dir}/02-miru" 2>/dev/null || true
            git show ":3:${path}" > "${dir}/03-openela" 2>/dev/null || true
            git diff --no-index -- "${dir}/01-merge-base" "${dir}/02-miru" > "${dir}/miru-delta.diff" || true
            git diff --no-index -- "${dir}/01-merge-base" "${dir}/03-openela" > "${dir}/openela-intent.diff" || true
            git diff --no-index -- "${dir}/02-miru" "${dir}/03-openela" > "${dir}/miru-vs-openela.diff" || true
          done < integration-evidence/stage-352-audit/initial-conflicts.txt

          git diff --cc > integration-evidence/stage-352-audit/combined-conflicts.diff || true
          git diff --cached --stat > integration-evidence/stage-352-audit/clean-merge-stat.txt || true
          git show --stat --oneline "${DWC3_REPAIR}" > integration-evidence/stage-352-audit/dwc3-repair.txt
          git show --format=fuller "${DWC3_REPAIR}" -- drivers/usb/dwc3/gadget.c \
            >> integration-evidence/stage-352-audit/dwc3-repair.txt
          git log --oneline --decorate --all -- drivers/usb/dwc3/core.c drivers/usb/dwc3/gadget.c \
            > integration-evidence/stage-352-audit/dwc3-history.txt
          git grep -n -E 'pending_events|dwc3_(suspend|resume)_common|dwc3_core_(init|exit)|pm_runtime' -- \
            drivers/usb/dwc3/core.c drivers/usb/dwc3/gadget.c \
            > integration-evidence/stage-352-audit/dwc3-callflow.txt || true

          mismatch=0
          diff -u integration-evidence/stage-352-audit/expected-conflicts.txt \
            integration-evidence/stage-352-audit/initial-conflicts.txt \
            > integration-evidence/stage-352-audit/conflict-inventory.diff || mismatch=1
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "openela_second_parent=${OPENELA_352}"
            echo "conflict_count=$(wc -l < integration-evidence/stage-352-audit/initial-conflicts.txt)"
            echo "inventory_match=$([ "${mismatch}" -eq 0 ] && echo YES || echo NO)"
            echo "dwc3_repair=${DWC3_REPAIR}"
            echo 'production_write=NONE'
          } >> integration-evidence/stage-352-audit/SUMMARY.txt

          echo '=== exact conflicts ==='
          cat integration-evidence/stage-352-audit/initial-conflicts.txt
          echo '=== expected-vs-actual ==='
          cat integration-evidence/stage-352-audit/conflict-inventory.diff || true
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git merge --abort
          fi
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          test "${merge_rc}" -eq 1
          test "${mismatch}" -eq 0

      - name: Upload stage 352 audit evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miru-h40-openela-stage352-conflict-audit-${{ github.event.pull_request.head.sha }}
          path: integration-evidence/stage-352-audit
          if-no-files-found: error
          retention-days: 30
