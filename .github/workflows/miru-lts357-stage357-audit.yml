name: Miru H.40 OpenELA stage 357 exact merge audit

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/miru-lts357-stage357-audit.yml'

permissions:
  contents: read

concurrency:
  group: miru-h40-lts357-stage357-audit
  cancel-in-progress: false

env:
  IMMUTABLE_PRODUCTION: eb9451c0a1639e1aa49ee094681f98df0545f797
  PRE_AUDIT_HEAD: e587b021e19214d45091cd9ad6c75fba8dde3e7c
  STAGE356_MERGE: 921ac6a9195cdb3192cddaebb3fe2b4597e11f9c
  OPENELA_BASE: c31e35278ea8f04f1dceadd77dca4dd7d47932a3
  OPENELA_356: a76b6a6556353484f6f29572989cd37b6cff90cc
  OPENELA_357: 1e6347375d088ecc896aabb067131d0f9e3c0575
  MODULES_BRANCH: oneplus/sm8150_s_12.1_op7pro
  MODULES_SHA: 3216c08bb3f97f865eb055296ea8034e1744caef
  FORBIDDEN_MODULES_SHA: 125ff7d0153cbb3aaa8f9fd618c33b7f728d7798
  DWC3_REPAIR: a3192f52549713424a5d8352e4be381ca84434a0

jobs:
  audit-stage-357:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts357-integration' &&
      github.base_ref == 'miru-h40' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify immutable boundaries and audit commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "${PRE_AUDIT_HEAD}"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/miru-lts357-stage357-audit.yml'
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40-lts357-integration | awk 'NR==1{print $1}')" = "$(git rev-parse HEAD)"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${IMMUTABLE_PRODUCTION}"
          live_modules="$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/${MODULES_BRANCH} | awk 'NR==1{print $1}')"
          test "${live_modules}" = "${MODULES_SHA}"
          test "${live_modules}" != "${FORBIDDEN_MODULES_SHA}"
          parents="$(git rev-list --parents -n1 "${STAGE356_MERGE}")"
          test "$(printf '%s\n' "${parents}" | awk '{print NF-1}')" = 2
          test "$(printf '%s\n' "${parents}" | awk '{print $3}')" = "${OPENELA_356}"
          git merge-base --is-ancestor "${STAGE356_MERGE}" HEAD
          git merge-base --is-ancestor "${DWC3_REPAIR}" HEAD

      - name: Perform read-only exact stage 357 merge audit
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="${RUNNER_TEMP}/stage-357-audit"
          mkdir -p "${evidence}"
          git config user.name 'Miru H.40 Stage 357 Audit'
          git config user.email '110590275+KAI-Miru@users.noreply.github.com'
          git remote add openela https://github.com/openela/kernel-lts.git
          git fetch --no-tags openela "${OPENELA_BASE}" "${OPENELA_356}" "${OPENELA_357}" refs/tags/v4.14.357-openela:refs/tags/v4.14.357-openela
          test "$(git rev-parse "${OPENELA_357}^{commit}")" = "${OPENELA_357}"
          test "$(git rev-parse 'refs/tags/v4.14.357-openela^{commit}')" = "${OPENELA_357}"
          git merge-base --is-ancestor "${OPENELA_BASE}" "${OPENELA_356}"
          git merge-base --is-ancestor "${OPENELA_356}" "${OPENELA_357}"
          if git merge-base --is-ancestor "${OPENELA_357}" HEAD; then
            echo 'target_already_ancestor=YES' > "${evidence}/ancestry.txt"
            exit 1
          fi
          echo 'target_already_ancestor=NO' > "${evidence}/ancestry.txt"
          test "$(git show ${OPENELA_357}:Makefile | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 357
          test "$(git show ${OPENELA_357}:.elts/config.yaml | sed -n 's/^version: //p')" = 4.14.357
          test "$(git show ${OPENELA_357}:.elts/config.yaml | sed -n 's/^base: //p')" = 4.14.336

          printf '%s\n' \
            .elts/config.yaml \
            Makefile \
            drivers/clk/clk-devres.c \
            fs/ocfs2/quota_global.c \
            fs/ocfs2/quota_local.c \
            include/linux/skbuff.h \
            net/core/sock_destructor.h \
            net/ipv4/inet_fragment.c \
            net/ipv4/ip_fragment.c \
            net/ipv6/netfilter/nf_conntrack_reasm.c \
            security/integrity/ima/ima_api.c \
            security/integrity/ima/ima_template_lib.c \
            > "${evidence}/expected-merge-paths.txt"

          set +e
          git merge --no-ff --no-commit "${OPENELA_357}" > "${evidence}/merge.stdout" 2> "${evidence}/merge.stderr"
          merge_rc=$?
          set -e
          printf 'merge_exit_code=%s\n' "${merge_rc}" > "${evidence}/SUMMARY.txt"
          git diff --name-only --diff-filter=U | sort > "${evidence}/initial-conflicts.txt"
          git diff --cached --name-only | sort > "${evidence}/actual-merge-paths.txt"
          diff -u "${evidence}/expected-merge-paths.txt" "${evidence}/actual-merge-paths.txt" > "${evidence}/merge-path-inventory.diff"
          git diff --cached --stat > "${evidence}/clean-merge-stat.txt"
          git diff --cached --check -- \
            Makefile drivers/clk/clk-devres.c fs/ocfs2/quota_global.c fs/ocfs2/quota_local.c \
            include/linux/skbuff.h net/core/sock_destructor.h net/ipv4/inet_fragment.c \
            net/ipv4/ip_fragment.c net/ipv6/netfilter/nf_conntrack_reasm.c \
            security/integrity/ima/ima_api.c security/integrity/ima/ima_template_lib.c \
            > "${evidence}/source-diff-check.txt"
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "stage356_merge=${STAGE356_MERGE}"
            echo "openela_second_parent=${OPENELA_357}"
            echo "conflict_count=$(wc -l < "${evidence}/initial-conflicts.txt")"
            echo "merge_path_count=$(wc -l < "${evidence}/actual-merge-paths.txt")"
            echo "modules_sha=${MODULES_SHA}"
            echo 'production_write=NONE'
          } >> "${evidence}/SUMMARY.txt"

          echo '=== exact conflicts ==='
          cat "${evidence}/initial-conflicts.txt"
          echo '=== exact merge paths ==='
          cat "${evidence}/actual-merge-paths.txt"
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git merge --abort
          fi
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          test "${merge_rc}" = 0
          test ! -s "${evidence}/initial-conflicts.txt"

      - name: Upload stage 357 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-openela-stage357-audit-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/stage-357-audit
          if-no-files-found: error
          retention-days: 30
