name: Prepare proven Miru H.40 4.14.305 boot fixes

on:
  push:
    branches: [miru-h40-lts305-bootfix-prebuild]
    paths:
      - .github/workflows/miru-lts305-prepare-bootfixes.yml

permissions:
  contents: write

concurrency:
  group: miru-h40-lts305-bootfix-prebuild
  cancel-in-progress: false

jobs:
  prepare-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact preparation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and commit source-only compatibility fixes
        shell: bash
        env:
          AUDITED_SHA: af61e9d6dfc33b7b46bfc608b20b6badf894ad23
          VALIDATED_SHA: 09abbe312c55a13dd2bf0d652bb5d658a64ed781
          PRODUCTION_SHA: 61371a1024e341f434deaf61b79a05f73827260a
          BRANCH: miru-h40-lts305-bootfix-prebuild
          WORKFLOW: .github/workflows/miru-lts305-prepare-bootfixes.yml
        run: |
          set -Eeuo pipefail

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote origin refs/heads/${BRANCH} | awk '{print $1}')" = "${GITHUB_SHA}"
          test "$(git ls-remote origin refs/heads/miru-h40 | awk '{print $1}')" = "${PRODUCTION_SHA}"
          git merge-base --is-ancestor "${AUDITED_SHA}" HEAD
          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)" = 305

          test "$(git hash-object arch/arm64/kernel/cpu_errata.c)" = 55af07957502639c25367250357d0a204b27a270
          test "$(git hash-object drivers/soc/qcom/early_random.c)" = 73fd17290964803ccfd2784cf27ec718ff3de23a
          test "$(git hash-object mm/rmap.c)" = 0790b11c2a02effe93c5b71ce4c33fc99936e495
          test "$(git hash-object drivers/extcon/extcon.c)" = 117da8393690b281f87680bc4ea81b3984f1c24c
          test "$(git hash-object drivers/char/random.c)" = 3b69c261d3c6858e677053a24d6c4dc38b292396

          git fetch --no-tags origin "${VALIDATED_SHA}"
          git show "${VALIDATED_SHA}:arch/arm64/kernel/cpu_errata.c" > arch/arm64/kernel/cpu_errata.c
          git show "${VALIDATED_SHA}:drivers/soc/qcom/early_random.c" > drivers/soc/qcom/early_random.c
          git show "${VALIDATED_SHA}:mm/rmap.c" > mm/rmap.c

          test "$(git hash-object arch/arm64/kernel/cpu_errata.c)" = 11d9355f2f58ae60dbff1d9c33f2c6c1cce6b6c4
          test "$(git hash-object drivers/soc/qcom/early_random.c)" = 757fd896195ec2baca6443ab69cde6f33f4f556c
          test "$(git hash-object mm/rmap.c)" = 246712b339dd449d0e051781bbd37e530887be5a

          python3 - <<'PY'
          from pathlib import Path

          path = Path('drivers/extcon/extcon.c')
          text = path.read_text()

          def once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'extcon replacement count {count}, expected 1: {old!r}')
              text = text.replace(old, new, 1)

          once(
              '\tedev->bnh = devm_kzalloc(&edev->dev,\n'
              '\t\t\tsizeof(*edev->bnh) * edev->max_supported, GFP_KERNEL);\n'
              '\tif (!edev->bnh) {\n'
              '\t\tret = -ENOMEM;\n'
              '\t\tgoto err_dev;\n'
              '\t}\n',
              '\tif (edev->max_supported) {\n'
              '\t\tedev->bnh = kcalloc(edev->max_supported, sizeof(*edev->bnh),\n'
              '\t\t\t\tGFP_KERNEL);\n'
              '\t\tif (!edev->bnh) {\n'
              '\t\t\tret = -ENOMEM;\n'
              '\t\t\tgoto err_alloc_bnh;\n'
              '\t\t}\n'
              '\t}\n'
          )
          once(
              '\tfor (index = 0; index < edev->max_supported; index++)\n'
              '\t\tRAW_INIT_NOTIFIER_HEAD(&edev->nh[index]);\n\n'
              '\tRAW_INIT_NOTIFIER_HEAD(&edev->nh_all);\n',
              '\tfor (index = 0; index < edev->max_supported; index++) {\n'
              '\t\tRAW_INIT_NOTIFIER_HEAD(&edev->nh[index]);\n'
              '\t\tBLOCKING_INIT_NOTIFIER_HEAD(&edev->bnh[index]);\n'
              '\t}\n\n'
              '\tRAW_INIT_NOTIFIER_HEAD(&edev->nh_all);\n'
          )
          once(
              'err_dev:\n'
              '\tif (edev->max_supported)\n'
              '\t\tkfree(edev->nh);\n'
              'err_alloc_nh:\n',
              'err_dev:\n'
              '\tif (edev->max_supported)\n'
              '\t\tkfree(edev->bnh);\n'
              'err_alloc_bnh:\n'
              '\tif (edev->max_supported)\n'
              '\t\tkfree(edev->nh);\n'
              'err_alloc_nh:\n'
          )
          once(
              '\tif (edev->max_supported) {\n'
              '\t\tkfree(edev->extcon_dev_type.groups);\n'
              '\t\tkfree(edev->cables);\n'
              '\t\tkfree(edev->nh);\n'
              '\t}\n',
              '\tif (edev->max_supported) {\n'
              '\t\tkfree(edev->extcon_dev_type.groups);\n'
              '\t\tkfree(edev->cables);\n'
              '\t\tkfree(edev->nh);\n'
              '\t\tkfree(edev->bnh);\n'
              '\t}\n'
          )

          if 'devm_kzalloc(&edev->dev' in text:
              raise SystemExit('unsafe device-managed bnh allocation remains')
          path.write_text(text)

          path = Path('drivers/char/random.c')
          text = path.read_text()
          old = ('\tif (!kthread_should_stop() && crng_ready())\n'
                 '\t\tschedule_timeout_interruptible(CRNG_RESEED_INTERVAL);')
          new = ('\tif (system_wq && !kthread_should_stop() && crng_ready())\n'
                 '\t\tschedule_timeout_interruptible(CRNG_RESEED_INTERVAL);')
          if text.count(old) != 1:
              raise SystemExit(f'unexpected RNG guard source count: {text.count(old)}')
          text = text.replace(old, new, 1)
          if text.count(new) != 1:
              raise SystemExit('RNG system_wq guard was not applied exactly once')
          path.write_text(text)
          PY

          test "$(grep -c 'void __init arm64_update_smccc_conduit(' arch/arm64/kernel/cpu_errata.c)" = 1
          test "$(grep -c 'void __init arm64_enable_wa2_handling(' arch/arm64/kernel/cpu_errata.c)" = 1
          grep -Fq '#include <linux/hw_random.h>' drivers/soc/qcom/early_random.c
          grep -Fq '#include <linux/random.h>' drivers/soc/qcom/early_random.c
          ! grep -Fq -- '->degree' mm/rmap.c
          grep -Fq 'anon_vma->num_children < 2' mm/rmap.c
          grep -Fq 'anon_vma->num_active_vmas == 0' mm/rmap.c
          grep -Fq 'dst->anon_vma->num_active_vmas++' mm/rmap.c
          grep -Fq 'edev->bnh = kcalloc(edev->max_supported' drivers/extcon/extcon.c
          grep -Fq 'BLOCKING_INIT_NOTIFIER_HEAD(&edev->bnh[index])' drivers/extcon/extcon.c
          test "$(grep -c 'kfree(edev->bnh)' drivers/extcon/extcon.c)" = 2
          grep -Fq 'if (system_wq && !kthread_should_stop() && crng_ready())' drivers/char/random.c

          mkdir -p "${RUNNER_TEMP}/miru305-fix-audit"
          git diff --binary --full-index "${AUDITED_SHA}" -- drivers/extcon/extcon.c > \
            "${RUNNER_TEMP}/miru305-fix-audit/extcon.patch"
          echo '931ad82e354b6cab66233ab41eccc939f860c62f1a5fd818fa00b6a3a8edb15c  extcon.patch' > \
            "${RUNNER_TEMP}/miru305-fix-audit/EXTCON-PATCH-SHA256.txt"
          (cd "${RUNNER_TEMP}/miru305-fix-audit" && sha256sum -c EXTCON-PATCH-SHA256.txt)

          cat > "${RUNNER_TEMP}/expected-files.txt" <<'EOF'
          arch/arm64/kernel/cpu_errata.c
          drivers/char/random.c
          drivers/extcon/extcon.c
          drivers/soc/qcom/early_random.c
          mm/rmap.c
          EOF
          git diff --name-only "${AUDITED_SHA}" -- \
            arch/arm64/kernel/cpu_errata.c drivers/char/random.c drivers/extcon/extcon.c \
            drivers/soc/qcom/early_random.c mm/rmap.c | sort > "${RUNNER_TEMP}/actual-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/actual-files.txt"
          git diff --check

          git rm "${WORKFLOW}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add arch/arm64/kernel/cpu_errata.c drivers/char/random.c drivers/extcon/extcon.c \
            drivers/soc/qcom/early_random.c mm/rmap.c
          git commit -m 'kernel: apply proven 4.14.305 boot compatibility fixes [skip ci]'

          test "$(git diff --name-only "${AUDITED_SHA}" HEAD | sort)" = "$(cat "${RUNNER_TEMP}/expected-files.txt")"
          test "$(git ls-remote origin refs/heads/${BRANCH} | awk '{print $1}')" = "${GITHUB_SHA}"
          test "$(git ls-remote origin refs/heads/miru-h40 | awk '{print $1}')" = "${PRODUCTION_SHA}"
          git push origin HEAD:"${BRANCH}"
