name: Miru H.40 OpenELA stage 356 guarded merge and checkpoint

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/miru-lts357-stage356-executor.yml'
      - 'scripts/miru/lts357/resolve_stage_356.py'
      - 'scripts/miru/lts357/run_compile_checkpoint_356.sh'
      - 'scripts/miru/lts357/run_compile_checkpoint_356_v2.sh'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: miru-h40-lts357-stage356-executor
  cancel-in-progress: true

env:
  IMMUTABLE_PRODUCTION: eb9451c0a1639e1aa49ee094681f98df0545f797
  PRE_EXECUTOR_HEAD: 8b4cc07d417e90ae98f4de53dc4ac5334fc595ba
  STAGE352_MERGE: f5ebecc06992d60f50c21ebf9e9dc0538fa7b1c3
  OPENELA_BASE: c31e35278ea8f04f1dceadd77dca4dd7d47932a3
  OPENELA_352: 6da009d8de389742d55219ebed50378f53937a5b
  OPENELA_356: a76b6a6556353484f6f29572989cd37b6cff90cc
  MODULES_BRANCH: oneplus/sm8150_s_12.1_op7pro
  MODULES_SHA: 3216c08bb3f97f865eb055296ea8034e1744caef
  FORBIDDEN_MODULES_SHA: 125ff7d0153cbb3aaa8f9fd618c33b7f728d7798
  DWC3_REPAIR: a3192f52549713424a5d8352e4be381ca84434a0

jobs:
  stage356:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts357-integration' &&
      github.base_ref == 'miru-h40' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate stage 356 scripts without writing bytecode
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/miru/lts357/resolve_stage_356.py')
          compile(path.read_text(), str(path), 'exec')
          PY
          bash -n scripts/miru/lts357/run_compile_checkpoint_356.sh
          bash -n scripts/miru/lts357/run_compile_checkpoint_356_v2.sh
          test ! -e scripts/miru/lts357/__pycache__
          test -z "$(git status --porcelain)"

      - name: Execute exact merge, validate, compile and guarded-push
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          evidence="${RUNNER_TEMP}/stage-356-executor"
          mkdir -p "${evidence}"
          step() {
            printf '%s\n' "$1" | tee "${evidence}/LAST_STEP.txt"
          }
          trap 'rc=$?; git status --porcelain=v1 > "${evidence}/status-at-exit.txt" 2>/dev/null || true; printf "exit_code=%s\nproduction_write=NONE\n" "${rc}" > "${evidence}/EXIT.txt"; exit "${rc}"' EXIT

          step verify-immutable-boundaries
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40-lts357-integration | awk 'NR==1{print $1}')" = "${EXPECTED_HEAD}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${IMMUTABLE_PRODUCTION}"
          live_modules="$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/${MODULES_BRANCH} | awk 'NR==1{print $1}')"
          test "${live_modules}" = "${MODULES_SHA}"
          test "${live_modules}" != "${FORBIDDEN_MODULES_SHA}"
          git merge-base --is-ancestor "${STAGE352_MERGE}" HEAD
          git merge-base --is-ancestor "${DWC3_REPAIR}" HEAD

          step fetch-and-verify-openela356
          git config user.name 'Miru H.40 OpenELA Integration'
          git config user.email '110590275+KAI-Miru@users.noreply.github.com'
          git remote add openela https://github.com/openela/kernel-lts.git
          git fetch --no-tags openela "${OPENELA_BASE}" "${OPENELA_352}" "${OPENELA_356}"
          test "$(git rev-parse "${OPENELA_356}^{commit}")" = "${OPENELA_356}"
          git merge-base --is-ancestor "${OPENELA_BASE}" "${OPENELA_352}"
          git merge-base --is-ancestor "${OPENELA_352}" "${OPENELA_356}"
          test "$(git show ${OPENELA_356}:Makefile | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 356
          test "$(git show ${OPENELA_356}:.elts/config.yaml | sed -n 's/^version: //p')" = 4.14.356
          test "$(git show ${OPENELA_356}:.elts/config.yaml | sed -n 's/^base: //p')" = 4.14.336

          if git merge-base --is-ancestor "${OPENELA_356}" HEAD; then
            step already-complete
            stage356_merge="$(git rev-list --parents HEAD | awk -v target="${OPENELA_356}" 'NF == 3 && $3 == target {print $1; exit}')"
            test -n "${stage356_merge}"
            {
              echo result=ALREADY_COMPLETE
              echo "stage356_merge=${stage356_merge}"
              echo "current_head=${EXPECTED_HEAD}"
              echo "openela_second_parent=${OPENELA_356}"
              echo "modules_sha=${MODULES_SHA}"
              echo production_write=NONE
              echo exit_code=0
            } | tee "${evidence}/SUMMARY.txt"
            exit 0
          fi

          step verify-single-purpose-executor-commit
          test "$(git rev-parse HEAD^)" = "${PRE_EXECUTOR_HEAD}"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/miru-lts357-stage356-executor.yml'

          printf '%s\n' \
            arch/arm64/include/asm/cputype.h \
            drivers/mmc/core/mmc_test.c \
            drivers/net/usb/usbnet.c \
            drivers/usb/dwc3/core.c \
            fs/f2fs/inode.c \
            fs/f2fs/namei.c \
            include/linux/clk.h \
            net/qrtr/qrtr.c \
            security/selinux/selinuxfs.c \
            > "${evidence}/expected-conflicts.txt"

          step merge-openela356-no-commit
          set +e
          git merge --no-ff --no-commit "${OPENELA_356}" > "${evidence}/merge.stdout" 2> "${evidence}/merge.stderr"
          merge_rc=$?
          set -e
          test "${merge_rc}" = 1
          git diff --name-only --diff-filter=U | sort > "${evidence}/initial-conflicts.txt"
          diff -u "${evidence}/expected-conflicts.txt" "${evidence}/initial-conflicts.txt"

          step run-audited-resolver
          set +e
          python3 -u scripts/miru/lts357/resolve_stage_356.py > "${evidence}/resolver.stdout" 2> "${evidence}/resolver.stderr"
          resolver_rc=$?
          set -e
          printf 'resolver_exit_code=%s\n' "${resolver_rc}" > "${evidence}/resolver-result.txt"
          git status --porcelain=v1 > "${evidence}/status-after-resolver.txt"
          test "${resolver_rc}" = 0

          step stage-and-scan-resolution
          while IFS= read -r path; do
            git add -- "${path}"
          done < "${evidence}/expected-conflicts.txt"
          git add Documentation/miru/lts-4.14.357-conflicts.md
          git diff --name-only --diff-filter=U > "${evidence}/remaining-unmerged.txt"
          git ls-files -u > "${evidence}/remaining-index-stages.txt"
          test ! -s "${evidence}/remaining-unmerged.txt"
          test ! -s "${evidence}/remaining-index-stages.txt"
          git diff --cached --stat > "${evidence}/staged-stat.txt"
          : > "${evidence}/staged-check.txt"
          while IFS= read -r path; do
            git diff --cached --check -- "${path}" >> "${evidence}/staged-check.txt"
          done < "${evidence}/expected-conflicts.txt"
          git diff --cached --check -- Documentation/miru/lts-4.14.357-conflicts.md >> "${evidence}/staged-check.txt"
          : > "${evidence}/conflict-marker-scan.txt"
          while IFS= read -r path; do
            grep -nE '^(<<<<<<<|\|\|\|\|\|\|\||=======|>>>>>>>)' "${path}" >> "${evidence}/conflict-marker-scan.txt" || true
          done < "${evidence}/expected-conflicts.txt"
          test ! -s "${evidence}/conflict-marker-scan.txt"
          find . -path './.git' -prune -o -type f \
            \( -name '*.orig' -o -name '*.rej' -o -name '*.pyc' \) -print \
            > "${evidence}/temporary-files.txt"
          test ! -s "${evidence}/temporary-files.txt"

          step create-and-verify-genuine-merge
          git commit \
            -m 'Merge OpenELA eLTS Linux 4.14.356 into Miru H.40' \
            -m 'Second parent: a76b6a6556353484f6f29572989cd37b6cff90cc' \
            -m 'Resolve the exact audited ARM64, MMC, usbnet, DWC3, F2FS, clock, QRTR and SELinux conflicts while preserving Qualcomm and Android downstream behavior.'
          stage356_merge="$(git rev-parse HEAD)"
          parents="$(git rev-list --parents -n1 "${stage356_merge}")"
          test "$(printf '%s\n' "${parents}" | awk '{print NF-1}')" = 2
          test "$(printf '%s\n' "${parents}" | awk '{print $2}')" = "${EXPECTED_HEAD}"
          test "$(printf '%s\n' "${parents}" | awk '{print $3}')" = "${OPENELA_356}"
          git merge-base --is-ancestor "${DWC3_REPAIR}" "${stage356_merge}"
          git status --porcelain=v1 > "${evidence}/status-after-merge-commit.txt"
          test ! -s "${evidence}/status-after-merge-commit.txt"

          step compile-stage356-checkpoint
          STAGE356_MERGE="${stage356_merge}" EXPECTED_REMOTE_HEAD="${EXPECTED_HEAD}" \
            bash scripts/miru/lts357/run_compile_checkpoint_356_v2.sh

          step guarded-integration-push
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${IMMUTABLE_PRODUCTION}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40-lts357-integration | awk 'NR==1{print $1}')" = "${EXPECTED_HEAD}"
          git push \
            --force-with-lease=refs/heads/miru-h40-lts357-integration:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/miru-h40-lts357-integration
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40-lts357-integration | awk 'NR==1{print $1}')" = "${stage356_merge}"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${IMMUTABLE_PRODUCTION}"

          step complete
          {
            echo result=PASS
            echo "pre_merge_head=${EXPECTED_HEAD}"
            echo "stage356_merge=${stage356_merge}"
            echo "openela_second_parent=${OPENELA_356}"
            echo conflict_count=9
            while IFS= read -r path; do echo "conflict=${path}"; done < "${evidence}/expected-conflicts.txt"
            echo "modules_sha=${MODULES_SHA}"
            echo kernel_release=4.14.356-openela-miru-h40-lts356-stage5+
            echo production_write=NONE
            echo exit_code=0
          } | tee "${evidence}/SUMMARY.txt"

      - name: Upload stage 356 merge and checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-openela-stage356-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/stage-356-executor
            integration-evidence/compile-checkpoint-356
          if-no-files-found: error
          retention-days: 30
