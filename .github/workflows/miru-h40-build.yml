name: Miru H.40 4.14.283 matching modules only

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: miru-h40-283-modules-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  modules-only:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout module-build control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify workflow-only control delta
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha=20794dacf7a37dbff8fc01835edfb48bb0a94a94
          production=61371a1024e341f434deaf61b79a05f73827260a
          test "$(git ls-remote origin refs/heads/miru-h40 | awk '{print $1}')" = "${production}"
          git fetch --no-tags origin "${source_sha}"
          git merge-base --is-ancestor "${source_sha}" HEAD
          git diff --name-only "${source_sha}" HEAD | sort -u > control-delta.txt
          cat > expected-control-delta.txt <<'EOF'
          .github/workflows/miru-h40-build.yml
          scripts/miru/ci_build_modules_4.14.283.sh
          EOF
          sed -i 's/^          //' expected-control-delta.txt
          cmp -s expected-control-delta.txt control-delta.txt
          git diff --check "${source_sha}" HEAD

      - name: Download exact 4.14.283 kernel ABI artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 8783913334
          path: prior-kernel-artifact
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: KAI-Miru/android_kernel_oneplus_sm8150
          run-id: 30605949074

      - name: Verify prior ABI and build matching modules only
        shell: bash
        run: |
          set -Eeuo pipefail
          PRIOR_SYMVERS="${GITHUB_WORKSPACE}/prior-kernel-artifact/_temp/android-root/out/h40-artifacts/Module.symvers"
          test -s "${PRIOR_SYMVERS}"
          printf '%s  %s\n' \
            1f967afbc4399aec43078370e4064f26fd81edae11c6eb90740927d7ee4b3755 \
            "${PRIOR_SYMVERS}" | sha256sum -c -
          grep -Fq 'kernel_release=4.14.283-miru-h40-diag19-full283-extconfix+' \
            prior-kernel-artifact/_temp/android-root/out/h40-artifacts/SUMMARY.txt
          export PRIOR_SYMVERS
          bash scripts/miru/ci_build_modules_4.14.283.sh

      - name: Upload matching 4.14.283 module package
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-4.14.283-diag19-matching-modules
          path: |
            ${{ runner.temp }}/android-root/out/miru-v3-modules-dropin-4.14.283.7z
            ${{ runner.temp }}/android-root/out/miru-v3-modules-dropin-4.14.283-audit.zip
            external-module-diagnostics
            build-diagnostics
            final-report
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
