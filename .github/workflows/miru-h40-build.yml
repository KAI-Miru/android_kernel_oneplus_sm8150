name: Miru H.40 Linux 4.14.291 notifier source repair

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: miru-h40-lts291-source-diag24-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PRODUCTION_SHA: 61371a1024e341f434deaf61b79a05f73827260a
  SOURCE_SHA: 5add27b31f6c0ce4a20ae0834550266e3311f043
  SCAFFOLD_283_SHA: b581c659db87713eb2df1c29e4f28e337e5e908c
  STABLE_291_SHA: e548869f356fead9fdcb3562f52d2226574f4f41
  FDT_292_SHA: 3c2ae48eceaa40f1ecb18ba31dda3f6fe755796c
  TARGET_BRANCH: miru-h40-lts291-source-diag24

jobs:
  repair-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact preparation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Repair the 4.14.291 notifier API conflict
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p source-repair-evidence
          trigger_sha="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/miru-h40 | awk '{print $1}')" = "${PRODUCTION_SHA}"
          test -z "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}")"
          git fetch --no-tags origin "${SOURCE_SHA}" "${SCAFFOLD_283_SHA}" "${STABLE_291_SHA}" "${FDT_292_SHA}"

          wt="${RUNNER_TEMP}/miru-291-source-diag24"
          rm -rf "${wt}"
          git worktree add --detach "${wt}" "${SOURCE_SHA}"
          git -C "${wt}" config user.name github-actions[bot]
          git -C "${wt}" config user.email 41898282+github-actions[bot]@users.noreply.github.com

          test "$(git -C "${wt}" rev-parse HEAD^1)" = "${SCAFFOLD_283_SHA}"
          test "$(git -C "${wt}" rev-parse HEAD^2)" = "${STABLE_291_SHA}"
          test "$(sed -n 's/^SUBLEVEL = //p' "${wt}/Makefile" | head -n1)" = 291
          ! git -C "${wt}" merge-base --is-ancestor "${FDT_292_SHA}" HEAD
          test "$(git -C "${wt}" hash-object include/crypto/chacha.h)" = 84a04c0845a4b0d14469583b1a7f4f62a3fd157d
          test "$(git -C "${wt}" hash-object lib/vsprintf.c)" = fea85a576df628cccb2a664f93a7e5a594c29307

          python3 - "${wt}/lib/vsprintf.c" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          include_anchor = "#include <linux/compiler.h>\n"
          include_replacement = (
              "#include <linux/compiler.h>\n"
              "#include <linux/random.h>\n"
              "#include <linux/notifier.h>\n"
          )
          if text.count(include_anchor) != 1:
              raise SystemExit(f"unexpected compiler include count: {text.count(include_anchor)}")
          if "#include <linux/random.h>" in text or "#include <linux/notifier.h>" in text:
              raise SystemExit("random/notifier include already present")
          text = text.replace(include_anchor, include_replacement, 1)

          old = '''static void fill_random_ptr_key(struct random_ready_callback *unused)
          {
          \tget_random_bytes(&ptr_key, sizeof(ptr_key));
          \t/*
          \t * have_filled_random_ptr_key==true is dependent on get_random_bytes().
          \t * ptr_to_id() needs to see have_filled_random_ptr_key==true
          \t * after get_random_bytes() returns.
          \t */
          \tsmp_mb();
          \tWRITE_ONCE(have_filled_random_ptr_key, true);
          }

          static struct random_ready_callback random_ready = {
          \t.func = fill_random_ptr_key
          };

          static int __init initialize_ptr_random(void)
          {
          \tint ret = add_random_ready_callback(&random_ready);

          \tif (!ret) {
          \t\treturn 0;
          \t} else if (ret == -EALREADY) {
          \t\tfill_random_ptr_key(&random_ready);
          \t\treturn 0;
          \t}

          \treturn ret;
          }
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"

          new = '''static int fill_random_ptr_key(struct notifier_block *nb,
          \t\t\t       unsigned long action, void *data)
          {
          \tget_random_bytes(&ptr_key, sizeof(ptr_key));
          \t/*
          \t * have_filled_random_ptr_key==true is dependent on get_random_bytes().
          \t * ptr_to_id() needs to see have_filled_random_ptr_key==true
          \t * after get_random_bytes() returns.
          \t */
          \tsmp_mb();
          \tWRITE_ONCE(have_filled_random_ptr_key, true);
          \treturn 0;
          }

          static struct notifier_block random_ready = {
          \t.notifier_call = fill_random_ptr_key
          };

          static int __init initialize_ptr_random(void)
          {
          \tint ret = register_random_ready_notifier(&random_ready);

          \tif (!ret) {
          \t\treturn 0;
          \t} else if (ret == -EALREADY) {
          \t\tfill_random_ptr_key(&random_ready, 0, NULL);
          \t\treturn 0;
          \t}

          \treturn ret;
          }
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"

          if text.count(old) != 1:
              raise SystemExit(f"unexpected legacy callback block count: {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git -C "${wt}" diff --check
          test "$(git -C "${wt}" diff --name-only)" = lib/vsprintf.c
          ! grep -Fq 'struct random_ready_callback' "${wt}/lib/vsprintf.c"
          ! grep -Fq 'add_random_ready_callback' "${wt}/lib/vsprintf.c"
          grep -Fq 'struct notifier_block random_ready' "${wt}/lib/vsprintf.c"
          grep -Fq 'register_random_ready_notifier(&random_ready)' "${wt}/lib/vsprintf.c"
          grep -Fq 'fill_random_ptr_key(&random_ready, 0, NULL)' "${wt}/lib/vsprintf.c"
          grep -Fq '#include <linux/random.h>' "${wt}/lib/vsprintf.c"
          grep -Fq '#include <linux/notifier.h>' "${wt}/lib/vsprintf.c"

          git -C "${wt}" add -- lib/vsprintf.c
          GIT_COMMITTER_DATE='2026-07-31T09:35:00Z' git -C "${wt}" commit --amend --no-edit
          repaired_sha="$(git -C "${wt}" rev-parse HEAD)"
          repaired_tree="$(git -C "${wt}" rev-parse HEAD^{tree})"
          repaired_blob="$(git -C "${wt}" hash-object lib/vsprintf.c)"

          test "${repaired_sha}" != "${SOURCE_SHA}"
          test "$(git -C "${wt}" rev-parse HEAD^1)" = "${SCAFFOLD_283_SHA}"
          test "$(git -C "${wt}" rev-parse HEAD^2)" = "${STABLE_291_SHA}"
          test "$(git -C "${wt}" diff-tree --no-commit-id --name-only -r "${SOURCE_SHA}^{tree}" "${repaired_tree}")" = lib/vsprintf.c
          ! git -C "${wt}" merge-base --is-ancestor "${FDT_292_SHA}" HEAD

          {
            echo result=PASS
            echo "trigger_sha=${trigger_sha}"
            echo "production_sha=${PRODUCTION_SHA}"
            echo "old_source_sha=${SOURCE_SHA}"
            echo "repaired_source_sha=${repaired_sha}"
            echo "repaired_source_tree=${repaired_tree}"
            echo "repaired_vsprintf_blob=${repaired_blob}"
            echo "first_parent=${SCAFFOLD_283_SHA}"
            echo "second_parent=${STABLE_291_SHA}"
            echo "excluded_fdt_292=${FDT_292_SHA}"
            echo changed_paths=lib/vsprintf.c
          } | tee source-repair-evidence/SUMMARY.txt
          git -C "${wt}" diff "${SOURCE_SHA}" HEAD -- lib/vsprintf.c > source-repair-evidence/vsprintf-notifier-repair.patch
          sha256sum source-repair-evidence/* > source-repair-evidence/SHA256SUMS

          git -C "${wt}" push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${repaired_sha}"

      - name: Upload source repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts291-source-diag24-evidence
          path: source-repair-evidence/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
