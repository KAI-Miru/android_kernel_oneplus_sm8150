name: Miru H.40 Linux 4.14.336 validator preparation audit

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: miru-h40-4.14.336-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PRODUCTION_HEAD: a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee
  ANDROID_COMMON_TARGET: 014241ad77dda0eafbdf671d5b8e86917d8ec97e
  AUTHENTIC_MERGE: e0fc49a4660130692e6ac893f8119282b0192b85
  RELEASE_BRANCH: miru-h40-lts336-release
  VALIDATOR_SHA: 9db1ff57feb92e9bed955f0395d9ea298ae13906
  VALIDATOR_BLOB: 6d5e44a57b611463b7f691710ccfb84e2e88123b
  MAKEFILE_BUILD_BLOB: ee3b37a3bf6a586b74fe00f9e39ca5e77f08b6d3
  EXPECTED_RELEASE: 4.14.336-miru-h40-lts336-ci1+
  EXPECTED_LOCALVERSION: miru-h40-lts336-ci1
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  validator-preparation-audit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts336-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0

      - name: Checkout reviewed validator
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATOR_SHA }}
          path: control
          fetch-depth: 1

      - name: Verify immutable inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git -C control hash-object scripts/miru/ci_validate_4.14.305.sh)" = "${VALIDATOR_BLOB}"
          git -C source merge-base --is-ancestor "${AUTHENTIC_MERGE}" "${SOURCE_SHA}"
          git -C source merge-base --is-ancestor "${ANDROID_COMMON_TARGET}" "${SOURCE_SHA}"
          test "$(sed -n 's/^SUBLEVEL = //p' source/Makefile | head -n1)" = 336
          live_production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          test "${live_production}" = "${PRODUCTION_HEAD}"
          test "$(git -C source hash-object scripts/Makefile.build)" = "${MAKEFILE_BUILD_BLOB}"

      - name: Adapt and instrument validator
        shell: bash
        run: |
          set -Eeuo pipefail
          validator=control/scripts/miru/ci_validate_4.14.305.sh
          helper=source/scripts/miru/prepare_wlan_response_link.py

          python3 - "${validator}" "${SOURCE_SHA}" "${EXPECTED_RELEASE}" "${EXPECTED_LOCALVERSION}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source_sha, expected_release, expected_local = sys.argv[2:]
          text = path.read_text()
          replacements = [
              ("af61e9d6dfc33b7b46bfc608b20b6badf894ad23", source_sha, 1),
              ("61371a1024e341f434deaf61b79a05f73827260a", "a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee", 2),
              ("b92a77e96dd54fd30f8f39c7eef23e76f211c515", "e0fc49a4660130692e6ac893f8119282b0192b85", 2),
              ("4415bf5e08942aee6487946a3e0a50956ef68f1e", "014241ad77dda0eafbdf671d5b8e86917d8ec97e", 2),
              ("4.14.305", "4.14.336", 1),
              ("lts305", "lts336", 1),
              ("4.14.336-miru-h40-lts336-af61e9d-ci1+", expected_release, 2),
              ("miru-h40-lts336-af61e9d-ci1", expected_local, 2),
              ("test \"$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)\" = 305",
               "test \"$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)\" = 336", 1),
              ("test \"$(sed -n \\'s/^SUBLEVEL = //p\\' Makefile | head -n1)\" = \"305\"",
               "test \"$(sed -n \\'s/^SUBLEVEL = //p\\' Makefile | head -n1)\" = \"336\"", 1),
              ("grep -Fq -- '- Initial authentic conflicts: **33**' Documentation/miru/lts-4.14.336-conflicts.md",
               "grep -Fq -- '- Authentic conflicts: **14**' Documentation/miru/lts-4.14.336-conflicts.md", 1),
              ("grep -Fq -- '- Index-resolved conflicts: **33**' Documentation/miru/lts-4.14.336-conflicts.md",
               "grep -Fq -- '- Integration status: **COMPLETE — authentic candidate merge created**' Documentation/miru/lts-4.14.336-conflicts.md", 1),
              ("grep -Fq -- '- Semantically resolved conflicts: **33**' Documentation/miru/lts-4.14.336-conflicts.md",
               "grep -Fq -- '- Semantic resolutions: **14 of 14 complete**' Documentation/miru/lts-4.14.336-conflicts.md", 2),
              ("grep -Fq -- '- Remaining semantic conflicts: **0**' Documentation/miru/lts-4.14.336-conflicts.md",
               "grep -Fq -- '- Production promotion: **not authorized**' Documentation/miru/lts-4.14.336-conflicts.md", 2),
              ("echo conflicts=33/33", "echo conflicts=14/14", 1),
              ('echo "conflicts=33/33 resolved"', 'echo "conflicts=14/14 resolved"', 1),
          ]
          for old, new, minimum in replacements:
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(
                      f"validator replacement count for {old!r}: {count}, expected at least {minimum}"
                  )
              text = text.replace(old, new)

          exit_trap = "trap 'status=$?; echo \"exit_code=${status}\" > \"${REPORT_ROOT}/validation-exit-code.txt\"; exit \"${status}\"' EXIT\n"
          err_trap = "trap 'rc=$?; printf \"failed_line=%s\\nfailed_command=%s\\nfailed_rc=%s\\n\" \"$LINENO\" \"$BASH_COMMAND\" \"$rc\" | tee \"${REPORT_ROOT}/validation-error.txt\" >&2' ERR\n"
          if text.count(exit_trap) != 1:
              raise SystemExit("validator EXIT trap anchor missing or duplicated")
          text = text.replace(exit_trap, exit_trap + err_trap, 1)

          success = "echo gate_kernel_build_driver=PASS\n"
          stop = success + "cp scripts/miru/ci_build_4.14.190.sh \"${REPORT_ROOT}/transformed-ci-build.sh\"\nexit 0\n"
          if text.count(success) != 1:
              raise SystemExit("kernel build-driver success anchor missing or duplicated")
          text = text.replace(success, stop, 1)
          path.write_text(text)
          PY

          python3 - "${helper}" "${MAKEFILE_BUILD_BLOB}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          new_blob = sys.argv[2]
          text = path.read_text()
          old_blob = "74ce588c69513197a354ef0032c2145e91ee0641"
          if text.count(old_blob) != 1:
              raise SystemExit("stale WLAN Makefile.build identity is missing or duplicated")
          if text.count(new_blob) != 0:
              raise SystemExit("new WLAN Makefile.build identity already present unexpectedly")
          path.write_text(text.replace(old_blob, new_blob, 1))
          PY

          bash -n "${validator}"
          python3 -m py_compile "${helper}"
          mkdir -p audit
          cp "${validator}" audit/transformed-validator.sh

      - name: Execute preparation audit
        id: audit
        shell: bash
        run: |
          set +e
          bash control/scripts/miru/ci_validate_4.14.305.sh \
            "${GITHUB_WORKSPACE}/source" \
            "${GITHUB_WORKSPACE}/control"
          status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          cp -a control/build-validation-result audit/validator-result 2>/dev/null || true
          cp source/scripts/miru/ci_build_4.14.190.sh audit/transformed-ci-build-at-exit.sh
          exit 0

      - name: Upload preparation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-4.14.336-validator-preparation-${{ env.SOURCE_SHA }}
          path: audit
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Enforce preparation result
        if: always()
        shell: bash
        run: test "${{ steps.audit.outputs.exit_code }}" = 0
