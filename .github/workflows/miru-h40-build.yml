name: Miru H.40 Linux 4.14.336 conflict capture

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: miru-h40-lts336-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PRODUCTION_HEAD: a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee
  PRODUCTION_MERGE_305: 489177590738e082a37e17fc9ef9290e4f168058
  PRISTINE_H40: 180d787684d5965be5145bcfbf666ed427b4ea18
  ROLLBACK_269: 61371a1024e341f434deaf61b79a05f73827260a
  ANDROID_COMMON_305: 4415bf5e08942aee6487946a3e0a50956ef68f1e
  ANDROID_COMMON_336: 014241ad77dda0eafbdf671d5b8e86917d8ec97e
  ANDROID_COMMON_336_PARENT_1: bc841b804f61c5918bd950ccb15e63c36f5bd0b5
  ANDROID_COMMON_336_PARENT_2: c31e35278ea8f04f1dceadd77dca4dd7d47932a3
  ANDROID_COMMON_BRANCH: deprecated/android-4.14-stable
  RELEASE_BRANCH: miru-h40-lts336-release
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  capture-authentic-conflicts:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts336-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify immutable refs and exact Android Common target
        shell: bash
        run: |
          set -Eeuo pipefail

          check_eq() {
            local label="$1" actual="$2" expected="$3"
            printf '%s.actual=%s\n%s.expected=%s\n' "${label}" "${actual}" "${label}" "${expected}"
            test "${actual}" = "${expected}"
          }

          read_ref() {
            git ls-remote origin "$1" | awk 'NR == 1 {print $1}'
          }

          source_head="$(git rev-parse HEAD)"
          check_eq source_head "${source_head}" "${SOURCE_SHA}"
          check_eq head_ref "${GITHUB_HEAD_REF}" "${RELEASE_BRANCH}"
          check_eq live_candidate "$(read_ref "refs/heads/${RELEASE_BRANCH}")" "${source_head}"
          check_eq live_production "$(read_ref refs/heads/miru-h40)" "${PRODUCTION_HEAD}"
          check_eq live_h40 "$(read_ref refs/heads/oneplus/sm8150_s_12.1_op7pro)" "${PRISTINE_H40}"

          live_rollback="$(read_ref 'refs/tags/miru-h40-4.14.269-final^{}')"
          if [ -z "${live_rollback}" ]; then
            live_rollback="$(read_ref refs/tags/miru-h40-4.14.269-final)"
          fi
          check_eq live_rollback "${live_rollback}" "${ROLLBACK_269}"

          for ancestor in \
            "${PRODUCTION_HEAD}" \
            "${PRODUCTION_MERGE_305}" \
            "${PRISTINE_H40}" \
            "${ROLLBACK_269}" \
            "${ANDROID_COMMON_305}"; do
            git cat-file -e "${ancestor}^{commit}"
            git merge-base --is-ancestor "${ancestor}" HEAD
            printf 'candidate_ancestor.%s=PASS\n' "${ancestor}"
          done

          remote_branch="refs/heads/${ANDROID_COMMON_BRANCH}"
          local_branch="refs/remotes/android-common/${ANDROID_COMMON_BRANCH}"
          advertised="$(git ls-remote https://android.googlesource.com/kernel/common "${remote_branch}" | awk 'NR == 1 {print $1}')"
          check_eq android_common_advertised "${advertised}" "${ANDROID_COMMON_336}"
          git fetch --no-tags --force https://android.googlesource.com/kernel/common \
            "+${remote_branch}:${local_branch}"
          check_eq android_common_fetched "$(git rev-parse "${local_branch}^{commit}")" "${ANDROID_COMMON_336}"

          mapfile -t parents < <(git cat-file -p "${ANDROID_COMMON_336}" | sed -n 's/^parent //p')
          test "${#parents[@]}" -eq 2
          check_eq android_common_parent_1 "${parents[0]}" "${ANDROID_COMMON_336_PARENT_1}"
          check_eq android_common_parent_2 "${parents[1]}" "${ANDROID_COMMON_336_PARENT_2}"

          target_version="$(git show "${ANDROID_COMMON_336}:Makefile" | awk '$1 == "VERSION" && $2 == "=" {print $3; exit}')"
          target_patchlevel="$(git show "${ANDROID_COMMON_336}:Makefile" | awk '$1 == "PATCHLEVEL" && $2 == "=" {print $3; exit}')"
          target_sublevel="$(git show "${ANDROID_COMMON_336}:Makefile" | awk '$1 == "SUBLEVEL" && $2 == "=" {print $3; exit}')"
          check_eq target_version "${target_version}" 4
          check_eq target_patchlevel "${target_patchlevel}" 14
          check_eq target_sublevel "${target_sublevel}" 336
          git merge-base --is-ancestor "${ANDROID_COMMON_305}" "${ANDROID_COMMON_336}"
          echo exact_target_gate=PASS

      - name: Capture authentic merge conflicts without resolving or writing refs
        id: capture
        shell: bash
        run: |
          set -Eeuo pipefail
          audit="$RUNNER_TEMP/lts336-conflict-audit"
          mkdir -p "$audit/stages/base" "$audit/stages/ours" "$audit/stages/theirs" "$audit/worktree"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          parent1="$(git rev-parse HEAD)"

          git diff --name-only "${PRISTINE_H40}" "${PRODUCTION_HEAD}" -- | sort -u > "$audit/downstream-paths.txt"
          git diff --name-only "${ANDROID_COMMON_305}" "${ANDROID_COMMON_336}" -- | sort -u > "$audit/common-305-336-paths.txt"
          comm -12 "$audit/downstream-paths.txt" "$audit/common-305-336-paths.txt" > "$audit/overlap-paths.txt"
          git diff --shortstat "${ANDROID_COMMON_305}" "${ANDROID_COMMON_336}" -- > "$audit/common-305-336-shortstat.txt"
          git diff --name-status "${ANDROID_COMMON_305}" "${ANDROID_COMMON_336}" -- > "$audit/common-305-336-name-status.txt"
          git log --oneline --no-merges "${ANDROID_COMMON_305}..${ANDROID_COMMON_336}" > "$audit/common-305-336-commits.txt"

          set +e
          git merge --no-commit --no-ff "${ANDROID_COMMON_336}" > "$audit/merge-output.txt" 2>&1
          merge_status=$?
          set -e

          git status --porcelain=v1 > "$audit/status-porcelain.txt"
          git ls-files -u > "$audit/unmerged-index.txt"
          git diff --name-only --diff-filter=U | sort -u > "$audit/conflict-paths.txt"
          git diff --cc > "$audit/combined-conflicts.patch" || true

          conflict_count="$(wc -l < "$audit/conflict-paths.txt")"
          printf 'merge_exit_code=%s\ninitial_conflicts=%s\n' "$merge_status" "$conflict_count"
          test "$merge_status" -ne 0
          test "$conflict_count" -gt 0

          python3 - "$audit" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          audit = Path(sys.argv[1])
          paths = [p for p in audit.joinpath('conflict-paths.txt').read_text().splitlines() if p]
          index = {}
          for line in audit.joinpath('unmerged-index.txt').read_text().splitlines():
              meta, path = line.split('\t', 1)
              mode, blob, stage = meta.split()
              index.setdefault(path, {})[int(stage)] = (mode, blob)

          labels = {1: 'base', 2: 'ours', 3: 'theirs'}
          rows = []
          for path in paths:
              row = [path]
              for stage in (1, 2, 3):
                  mode, blob = index.get(path, {}).get(stage, ('-', '-'))
                  row.extend([mode, blob])
                  output = audit / 'stages' / labels[stage] / path
                  output.parent.mkdir(parents=True, exist_ok=True)
                  if blob != '-':
                      data = subprocess.run(
                          ['git', 'cat-file', 'blob', blob],
                          stdout=subprocess.PIPE,
                          check=True,
                      ).stdout
                      output.write_bytes(data)
                  else:
                      output.with_name(output.name + '.missing').write_text(
                          f'missing at index stage {stage}\n'
                      )

              worktree = audit / 'worktree' / path
              worktree.parent.mkdir(parents=True, exist_ok=True)
              source = Path(path)
              if source.exists() and source.is_file():
                  worktree.write_bytes(source.read_bytes())
              else:
                  worktree.with_name(worktree.name + '.missing').write_text(
                      'missing in conflicted worktree\n'
                  )
              rows.append(row)

          with audit.joinpath('conflict-stages.tsv').open('w') as out:
              out.write('path\tbase_mode\tbase_blob\tours_mode\tours_blob\ttheirs_mode\ttheirs_blob\n')
              for row in rows:
                  out.write('\t'.join(row) + '\n')

          if len(rows) != len(paths):
              raise SystemExit('conflict manifest row count mismatch')
          PY

          stage_rows="$(( $(wc -l < "$audit/conflict-stages.tsv") - 1 ))"
          test "$stage_rows" -eq "$conflict_count"

          {
            echo result=CONFLICTS_CAPTURED
            echo "candidate_parent_1=${parent1}"
            echo "android_common_parent_2=${ANDROID_COMMON_336}"
            echo "merge_exit_code=${merge_status}"
            echo "initial_conflicts=${conflict_count}"
            echo "manifest_rows=${stage_rows}"
            echo "production_head=${PRODUCTION_HEAD}"
            echo "production_write=NONE"
            echo "candidate_write=NONE"
          } | tee "$audit/SUMMARY.txt"

          echo 'Conflict paths:'
          cat "$audit/conflict-paths.txt"
          echo 'Conflict stage manifest:'
          cat "$audit/conflict-stages.tsv"
          echo "audit_path=$audit" >> "$GITHUB_OUTPUT"
          echo "conflict_count=$conflict_count" >> "$GITHUB_OUTPUT"

      - name: Upload complete conflict-stage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts336-conflict-audit-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/lts336-conflict-audit
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Prove workflow performed no repository write
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          live_candidate="$(git ls-remote origin "refs/heads/${RELEASE_BRANCH}" | awk 'NR == 1 {print $1}')"
          live_production="$(git ls-remote origin refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          test "$live_candidate" = "$SOURCE_SHA"
          test "$live_production" = "$PRODUCTION_HEAD"
          echo repository_write_gate=PASS
