name: Miru H.40 USB source-only repair

on:
  pull_request:
    branches: [miru-h40]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: miru-h40-lts336-properfix-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts336-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify boundary and apply narrow DWC3 repair
        shell: bash
        env:
          PRODUCTION_HEAD: a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee
          ORIGINAL_SOURCE: c011d59828604da9308cb28619ee5065827806e1
          ORIGINAL_GADGET_BLOB: f897b4fbda584d473f8a96cdd4440e2b4425c782
        run: |
          set -Eeuo pipefail

          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "${ORIGINAL_SOURCE}" HEAD
          test "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')" = "${PRODUCTION_HEAD}"
          test "$(git rev-parse HEAD:drivers/usb/dwc3/gadget.c)" = "${ORIGINAL_GADGET_BLOB}"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('drivers/usb/dwc3/gadget.c')
          text = path.read_text()

          suspended = '''\tif (pm_runtime_suspended(dwc->dev)) {
          \t\tdwc->pending_events = true;
          \t\t/*
          \t\t * Trigger runtime resume. The get() function will be balanced
          \t\t * after processing the pending events in
          \t\t * dwc3_gadget_process_pending_events().
          \t\t */
          \t\tpm_runtime_get(dwc->dev);
          \t\tdisable_irq_nosync(dwc->irq_gadget);
          \t\treturn IRQ_HANDLED;
          \t}
          
          '''
          if text.count(suspended) != 1:
              raise SystemExit('suspended-event block identity mismatch')
          text = text.replace(suspended, '', 1)

          current = '''\t\tif (dwc3_check_event_buf(dwc->ev_buf) == IRQ_WAKE_THREAD)
          \t\t\tdwc3_thread_interrupt(dwc->irq_gadget, dwc->ev_buf);
          \t\tpm_runtime_put(dwc->dev);
          '''
          restored = '''\t\tdwc3_interrupt(dwc->irq_gadget, dwc->ev_buf);
          '''
          if text.count(current) != 1:
              raise SystemExit('pending-event helper identity mismatch')
          text = text.replace(current, restored, 1)

          if 'pm_runtime_suspended(dwc->dev)' in text:
              raise SystemExit('stale suspended-event gate remains')

          expected = '''void dwc3_gadget_process_pending_events(struct dwc3 *dwc)
          {
          \tif (dwc->pending_events) {
          \t\tdwc3_interrupt(dwc->irq_gadget, dwc->ev_buf);
          \t\tdwc->pending_events = false;
          \t\tenable_irq(dwc->irq_gadget);
          \t}
          }
          '''
          if text.count(expected) != 1:
              raise SystemExit('final pending-event helper mismatch')

          path.write_text(text)
          PY

          # Restore the previously reviewed builder exactly, but do not run it.
          git show HEAD^:.github/workflows/miru-h40-build.yml > .github/workflows/miru-h40-build.yml
          rm -f .github/workflows/miru-h40-usb-source-fix.yml
          rm -f Documentation/miru/.usb-source-fix-trigger

          git diff --check
          test "$(git diff --numstat -- drivers/usb/dwc3/gadget.c | awk '{print $1}')" = 1
          test "$(git diff --numstat -- drivers/usb/dwc3/gadget.c | awk '{print $2}')" = 15
          test "$(git hash-object .github/workflows/miru-h40-build.yml)" = "$(git rev-parse HEAD^:.github/workflows/miru-h40-build.yml)"

      - name: Commit source-only repair
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drivers/usb/dwc3/gadget.c \
            .github/workflows/miru-h40-build.yml \
            .github/workflows/miru-h40-usb-source-fix.yml \
            Documentation/miru/.usb-source-fix-trigger
          git commit \
            -m "usb: dwc3: drop suspended-event path incompatible with Qualcomm glue [skip ci]" \
            -m "Linux 4.14.336 defers gadget IRQ handling while the DWC3 child is runtime-suspended, disables irq_gadget, and waits for generic child resume. Qualcomm glue owns the hardware PM transition and can bypass that completion path, leaving the UDC permanently not attached. Remove only that incompatible path and retain the rest of the genuine 4.14.336 gadget implementation."
          git push origin HEAD:miru-h40-lts336-release
