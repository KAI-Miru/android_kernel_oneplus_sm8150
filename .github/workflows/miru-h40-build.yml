name: Temporary diag27 duplicate-run repair

on:
  pull_request:
    branches: [miru-h40]
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: miru-h40-diag27-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'miru-h40-lts287-rng-earlyboot-fix-diag27'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: miru-h40-lts287-rng-earlyboot-fix-diag27
          fetch-depth: 0

      - name: Restore validated workflow and remove duplicate trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=ba7735cfc2496faaad33b02e8ba17d53c62e9a63
          PRODUCTION=61371a1024e341f434deaf61b79a05f73827260a
          test "$(git ls-remote origin refs/heads/miru-h40 | awk '{print $1}')" = "${PRODUCTION}"
          git merge-base --is-ancestor "${BASE}" HEAD
          git show "${BASE}:.github/workflows/miru-h40-build.yml" > .github/workflows/miru-h40-build.yml

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/miru-h40-build.yml')
          text = path.read_text()

          old = '''on:
  push:
    branches: [miru-h40-lts287-rng-earlyboot-fix-diag27]
  pull_request:
'''
          new = '''on:
  pull_request:
'''
          if text.count(old) != 1:
              raise SystemExit('unexpected push/pull_request trigger block')
          text = text.replace(old, new, 1)

          old = '''concurrency:
  group: miru-h40-diag27-rng-earlyboot-fix-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
'''
          new = '''concurrency:
  group: miru-h40-diag27-rng-earlyboot-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true
'''
          if text.count(old) != 1:
              raise SystemExit('unexpected concurrency block')
          text = text.replace(old, new, 1)

          old = "    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository\n"
          new = "    if: github.event.pull_request.head.repo.full_name == github.repository\n"
          if text.count(old) != 1:
              raise SystemExit('unexpected job event condition')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          ! grep -Fq '  push:' .github/workflows/miru-h40-build.yml
          grep -Fq 'group: miru-h40-diag27-rng-earlyboot-fix-${{ github.event.pull_request.number }}' .github/workflows/miru-h40-build.yml
          grep -Fq 'cancel-in-progress: true' .github/workflows/miru-h40-build.yml
          test "$(git diff --name-only "${BASE}" HEAD | sort -u | tr '\n' ' ')" = ".github/workflows/miru-h40-build.yml "
          git diff --check "${BASE}" -- .github/workflows/miru-h40-build.yml

          git add .github/workflows/miru-h40-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci: prevent duplicate diag27 PR builds"
          git push origin HEAD:miru-h40-lts287-rng-earlyboot-fix-diag27
