name: Miru H.40 Linux 4.14.336 authentic integration

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: miru-h40-lts336-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: miru-h40-lts336-release
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  authentic-integration:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts336-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Prime exact Android Common ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --force https://android.googlesource.com/kernel/common "+refs/heads/deprecated/android-4.14-stable:refs/remotes/android-common/deprecated/android-4.14-stable"
          test "$(git rev-parse refs/remotes/android-common/deprecated/android-4.14-stable)" = "014241ad77dda0eafbdf671d5b8e86917d8ec97e"
          git cat-file -e "4415bf5e08942aee6487946a3e0a50956ef68f1e^{commit}"

      - name: Apply audited runtime-only guard corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p audit
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/miru/integrate_4.14.336.sh")
          text = path.read_text()
          replacements = {
              "if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- \\\n":
                  "if git grep -n -E '^(<<<<<<< .+|>>>>>>> .+)$' -- \\\n",
              "    grep -Fq 'sde_kcal_apply_pcc' drivers/gpu/drm/msm/sde/sde_color_processing.c\n":
                  "    grep -Fq 'sde_cp_crtc_kcal_update_locked' drivers/gpu/drm/msm/sde/sde_color_processing.c\n"
                  "    grep -Fq 'sde_kcal_get_generation' drivers/gpu/drm/msm/sde/sde_color_processing.c\n",
              "    grep -Fq 'CONFIG_DRM_SDE_KCAL=y' h40-repro/config/GM1911_11_H.40.config\n":
                  "    grep -Fq 'CONFIG_DRM_MSM_KCAL_CTRL=y' h40-repro/config/GM1911_11_H.40.config\n",
              "        drivers/input/touchscreen/oneplus_touchscreen\n":
                  "        drivers/input/touchscreen/oplus_touchscreen\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"runtime guard source count is not one: {old!r}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          bash -n scripts/miru/integrate_4.14.336.sh
          git diff -- scripts/miru/integrate_4.14.336.sh > audit/runtime-guard-corrections.patch
          test -s audit/runtime-guard-corrections.patch
          grep -Fq "^(<<<<<<< .+|>>>>>>> .+)$" scripts/miru/integrate_4.14.336.sh
          grep -Fq "sde_cp_crtc_kcal_update_locked" scripts/miru/integrate_4.14.336.sh
          grep -Fq "CONFIG_DRM_MSM_KCAL_CTRL=y" scripts/miru/integrate_4.14.336.sh
          grep -Fq "drivers/input/touchscreen/oplus_touchscreen" scripts/miru/integrate_4.14.336.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git config user.name)" = "github-actions[bot]"

      - name: Prepare and validate authentic merge
        id: integrate
        shell: bash
        run: bash scripts/miru/integrate_4.14.336.sh prepare

      - name: Upload integration evidence before any push
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts336-integration-${{ env.SOURCE_SHA }}
          path: |
            audit
            Documentation/miru/lts-4.14.336-conflicts.md
            Documentation/miru/lts-4.14.336-resolution-results.tsv
          if-no-files-found: warn
          compression-level: 9
          retention-days: 30

      - name: Guarded candidate-only push
        if: steps.integrate.outputs.created == 'true'
        shell: bash
        run: bash scripts/miru/integrate_4.14.336.sh push
