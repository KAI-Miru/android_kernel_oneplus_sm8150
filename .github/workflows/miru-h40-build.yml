name: Miru H.40 Linux 4.14.336 real-resolution capture

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: miru-h40-lts336-real-resolution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PRODUCTION_HEAD: a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee
  PRODUCTION_MERGE_305: 489177590738e082a37e17fc9ef9290e4f168058
  PRISTINE_H40: 180d787684d5965be5145bcfbf666ed427b4ea18
  ROLLBACK_269: 61371a1024e341f434deaf61b79a05f73827260a
  ANDROID_COMMON_305: 4415bf5e08942aee6487946a3e0a50956ef68f1e
  ANDROID_COMMON_336: 014241ad77dda0eafbdf671d5b8e86917d8ec97e
  ANDROID_COMMON_336_PARENT_1: bc841b804f61c5918bd950ccb15e63c36f5bd0b5
  ANDROID_COMMON_336_PARENT_2: c31e35278ea8f04f1dceadd77dca4dd7d47932a3
  ANDROID_COMMON_BRANCH: deprecated/android-4.14-stable
  RELEASE_BRANCH: miru-h40-lts336-release
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  capture-real-resolution:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts336-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout exact candidate head with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify immutable refs and exact Android Common target
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p audit

          check_eq() {
            local label="$1" actual="$2" expected="$3"
            printf '%s.actual=%s\n%s.expected=%s\n' "$label" "$actual" "$label" "$expected" | tee -a audit/provenance.txt
            test "$actual" = "$expected"
          }

          read_ref() {
            git ls-remote origin "$1" | awk 'NR == 1 {print $1}'
          }

          source_head="$(git rev-parse HEAD)"
          check_eq source_head "$source_head" "$SOURCE_SHA"
          check_eq head_ref "$GITHUB_HEAD_REF" "$RELEASE_BRANCH"
          check_eq live_candidate "$(read_ref "refs/heads/$RELEASE_BRANCH")" "$source_head"
          check_eq live_production "$(read_ref refs/heads/miru-h40)" "$PRODUCTION_HEAD"
          check_eq live_h40 "$(read_ref refs/heads/oneplus/sm8150_s_12.1_op7pro)" "$PRISTINE_H40"

          live_rollback="$(read_ref 'refs/tags/miru-h40-4.14.269-final^{}')"
          if [ -z "$live_rollback" ]; then
            live_rollback="$(read_ref refs/tags/miru-h40-4.14.269-final)"
          fi
          check_eq live_rollback "$live_rollback" "$ROLLBACK_269"

          for ancestor in \
            "$PRODUCTION_HEAD" \
            "$PRODUCTION_MERGE_305" \
            "$PRISTINE_H40" \
            "$ROLLBACK_269" \
            "$ANDROID_COMMON_305"; do
            git cat-file -e "${ancestor}^{commit}"
            git merge-base --is-ancestor "$ancestor" HEAD
            echo "candidate_ancestor.$ancestor=PASS" | tee -a audit/provenance.txt
          done

          remote_branch="refs/heads/$ANDROID_COMMON_BRANCH"
          local_branch="refs/remotes/android-common/$ANDROID_COMMON_BRANCH"
          advertised="$(git ls-remote https://android.googlesource.com/kernel/common "$remote_branch" | awk 'NR == 1 {print $1}')"
          check_eq android_common_advertised "$advertised" "$ANDROID_COMMON_336"
          git fetch --no-tags --force https://android.googlesource.com/kernel/common \
            "+${remote_branch}:${local_branch}"
          check_eq android_common_fetched "$(git rev-parse "${local_branch}^{commit}")" "$ANDROID_COMMON_336"

          mapfile -t parents < <(git cat-file -p "$ANDROID_COMMON_336" | sed -n 's/^parent //p')
          test "${#parents[@]}" -eq 2
          check_eq android_common_parent_1 "${parents[0]}" "$ANDROID_COMMON_336_PARENT_1"
          check_eq android_common_parent_2 "${parents[1]}" "$ANDROID_COMMON_336_PARENT_2"

          target_version="$(git show "$ANDROID_COMMON_336:Makefile" | awk '$1 == "VERSION" && $2 == "=" {print $3; exit}')"
          target_patchlevel="$(git show "$ANDROID_COMMON_336:Makefile" | awk '$1 == "PATCHLEVEL" && $2 == "=" {print $3; exit}')"
          target_sublevel="$(git show "$ANDROID_COMMON_336:Makefile" | awk '$1 == "SUBLEVEL" && $2 == "=" {print $3; exit}')"
          check_eq target_version "$target_version" 4
          check_eq target_patchlevel "$target_patchlevel" 14
          check_eq target_sublevel "$target_sublevel" 336
          git merge-base --is-ancestor "$ANDROID_COMMON_305" "$ANDROID_COMMON_336"
          echo exact_target_gate=PASS | tee -a audit/provenance.txt

      - name: Reproduce merge and capture actual resolved files
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p audit/resolved
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          set +e
          git merge --no-commit --no-ff "$ANDROID_COMMON_336" > audit/merge-output.txt 2>&1
          merge_status=$?
          set -e
          git status --porcelain=v1 > audit/status-after-merge.txt
          git ls-files -u > audit/unmerged-before-resolution.txt
          git diff --name-only --diff-filter=U | sort -u > audit/conflict-paths.txt
          conflict_count="$(wc -l < audit/conflict-paths.txt)"
          printf 'merge_exit_code=%s\nconflict_count=%s\n' "$merge_status" "$conflict_count" | tee audit/merge-summary.txt
          test "$merge_status" -ne 0
          test "$conflict_count" -eq 14

          set +e
          python3 scripts/miru/resolve_4.14.336.py \
            --report audit/resolver-report.tsv \
            > audit/resolver-stdout.txt 2> audit/resolver-stderr.txt
          resolver_status=$?
          set -e
          printf 'resolver_exit_code=%s\n' "$resolver_status" | tee audit/resolver-status.txt

          # The strict resolver is expected to stop on the first real-merge blob
          # that differs from the synthetic expected tree. It has already
          # verified all 42 conflict-stage mode/blob pairs and staged all 14
          # explicitly resolved paths before checking final hashes.
          test "$resolver_status" -ne 0
          test -z "$(git ls-files -u)"

          printf 'path\tmode\tstaged_blob\tworktree_blob\n' > audit/actual-final-blobs.tsv
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            entry="$(git ls-files -s -- "$path")"
            test -n "$entry"
            mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
            staged_blob="$(printf '%s\n' "$entry" | awk '{print $2}')"
            worktree_blob="$(git hash-object "$path")"
            test "$staged_blob" = "$worktree_blob"
            printf '%s\t%s\t%s\t%s\n' "$path" "$mode" "$staged_blob" "$worktree_blob" >> audit/actual-final-blobs.tsv
            mkdir -p "audit/resolved/$(dirname "$path")"
            cp -a -- "$path" "audit/resolved/$path"
          done < audit/conflict-paths.txt

          test "$(( $(wc -l < audit/actual-final-blobs.tsv) - 1 ))" -eq 14
          git diff --cached --binary > audit/actual-resolved-index.patch
          git diff --cached --stat > audit/actual-resolved-index.stat
          git status --porcelain=v1 > audit/status-after-resolution.txt
          git diff --cached --check
          perl -c scripts/checkpatch.pl > audit/checkpatch-perl.txt 2>&1

          while IFS= read -r path; do
            if grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "$path"; then
              echo "unresolved marker in $path" >&2
              exit 1
            fi
          done < audit/conflict-paths.txt

          {
            echo result=REAL_RESOLUTION_CAPTURED
            echo "candidate_parent=$SOURCE_SHA"
            echo "android_common_parent=$ANDROID_COMMON_336"
            echo "authentic_conflicts=$conflict_count"
            echo "resolver_exit_code=$resolver_status"
            echo "actual_final_rows=$(( $(wc -l < audit/actual-final-blobs.tsv) - 1 ))"
            echo candidate_write=NONE
            echo production_write=NONE
          } | tee audit/SUMMARY.txt

          echo 'Actual final mode/blob manifest:'
          cat audit/actual-final-blobs.tsv
          echo 'Strict resolver diagnostic:'
          cat audit/resolver-stderr.txt

      - name: Upload real full-history resolution capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts336-real-resolution-${{ env.SOURCE_SHA }}
          path: audit
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Prove workflow performed no repository write
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          live_candidate="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk 'NR == 1 {print $1}')"
          live_production="$(git ls-remote origin refs/heads/miru-h40 | awk 'NR == 1 {print $1}')"
          test "$live_candidate" = "$SOURCE_SHA"
          test "$live_production" = "$PRODUCTION_HEAD"
          echo repository_write_gate=PASS
