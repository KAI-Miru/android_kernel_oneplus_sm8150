name: Miru H.40 Linux 4.14.305 kernel and matching modules

on:
  push:
    branches:
      - miru-h40
  pull_request:
    branches:
      - miru-h40
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miru-h40-4.14.305-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PRODUCTION_BASE: 61371a1024e341f434deaf61b79a05f73827260a
  ANDROID_COMMON_TARGET: 4415bf5e08942aee6487946a3e0a50956ef68f1e
  PRISTINE_H40: 180d787684d5965be5145bcfbf666ed427b4ea18
  BOOT_TESTED_SOURCE: 53f76796d1b68260507a83968a4a4bee3b89754f
  AUTHENTIC_MERGE: b92a77e96dd54fd30f8f39c7eef23e76f211c515
  AUTHENTIC_MERGE_PARENT_1: b125a425ef1559871b1d6cd662806c8afc53e934
  RELEASE_BRANCH: miru-h40-lts305-release
  AUDITED_SCAFFOLD: af61e9d6dfc33b7b46bfc608b20b6badf894ad23
  VENDOR_SHA: 125ff7d0153cbb3aaa8f9fd618c33b7f728d7798
  VALIDATOR_SHA: 9db1ff57feb92e9bed955f0395d9ea298ae13906
  VALIDATOR_BLOB: 6d5e44a57b611463b7f691710ccfb84e2e88123b
  WLAN_HELPER_BLOB: f8db305e54123f3b9a768d4fc32a418785838bb6
  MAKEFILE_BUILD_BLOB: ee3b37a3bf6a586b74fe00f9e39ca5e77f08b6d3
  EXPECTED_RELEASE: 4.14.305-miru-h40-lts305-ci1+
  EXPECTED_LOCALVERSION: miru-h40-lts305-ci1
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  kernel-and-matching-modules:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout release candidate or production head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0

      - name: Checkout reviewed production-derived validator
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATOR_SHA }}
          path: control
          fetch-depth: 1

      - name: Verify ancestry, cleanup, source equivalence, and compatibility
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git -C control hash-object scripts/miru/ci_validate_4.14.305.sh)" = "${VALIDATOR_BLOB}"
          test "$(git -C source hash-object scripts/miru/prepare_wlan_response_link.py)" = "${WLAN_HELPER_BLOB}"
          test "$(git -C source hash-object scripts/Makefile.build)" = "${MAKEFILE_BUILD_BLOB}"

          git -C source merge-base --is-ancestor "${PRODUCTION_BASE}" "${SOURCE_SHA}"
          git -C source merge-base --is-ancestor "${ANDROID_COMMON_TARGET}" "${SOURCE_SHA}"
          git -C source merge-base --is-ancestor "${PRISTINE_H40}" "${SOURCE_SHA}"
          git -C source merge-base --is-ancestor "${BOOT_TESTED_SOURCE}" "${SOURCE_SHA}"
          git -C source merge-base --is-ancestor "${AUTHENTIC_MERGE}" "${SOURCE_SHA}"
          test "$(git -C source rev-list --parents -n 1 "${AUTHENTIC_MERGE}")" = "${AUTHENTIC_MERGE} ${AUTHENTIC_MERGE_PARENT_1} ${ANDROID_COMMON_TARGET}"

          live_production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk '{print $1}')"
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF_NAME}" = miru-h40 ]; then
            expected_live_production="${SOURCE_SHA}"
          else
            expected_live_production="${PRODUCTION_BASE}"
          fi
          test "${live_production}" = "${expected_live_production}"
          echo "EXPECTED_LIVE_PRODUCTION=${expected_live_production}" >> "${GITHUB_ENV}"

          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            test "${GITHUB_HEAD_REF}" = "${RELEASE_BRANCH}"
          else
            test "${GITHUB_REF_NAME}" = "${RELEASE_BRANCH}" || test "${GITHUB_REF_NAME}" = miru-h40
          fi

          test "$(sed -n 's/^SUBLEVEL = //p' source/Makefile | head -n1)" = 305
          test -z "$(git -C source ls-files -u)"
          git -C source diff --check "${BOOT_TESTED_SOURCE}" "${SOURCE_SHA}" --

          if git -C source grep -nE '^(<<<<<<< |=======|>>>>>>> )' -- . \
              > source-conflict-markers.txt; then
            cat source-conflict-markers.txt
            exit 1
          fi

          grep -Fq -- '- Initial authentic conflicts: **33**' source/Documentation/miru/lts-4.14.305-conflicts.md
          grep -Fq -- '- Index-resolved conflicts: **33**' source/Documentation/miru/lts-4.14.305-conflicts.md
          grep -Fq -- '- Semantically resolved conflicts: **33**' source/Documentation/miru/lts-4.14.305-conflicts.md
          grep -Fq -- '- Remaining semantic conflicts: **0**' source/Documentation/miru/lts-4.14.305-conflicts.md

          test -z "$(find source/.github/workflows -maxdepth 1 -type f -name 'miru-lts305-*' -print -quit)"
          test ! -e source/.github/miru-audit
          test ! -e source/Documentation/miru/lts305-final3-recon

          mapfile -t workflow_files < <(find source/.github/workflows -type f -printf '%P\n' | sort)
          test "${#workflow_files[@]}" = 1
          test "${workflow_files[0]}" = miru-h40-build.yml

          runtime_paths=(
            arch block crypto drivers fs include init ipc kernel lib mm net
            security sound virt Kbuild Kconfig Makefile h40-repro/config
          )
          git -C source diff --name-only "${BOOT_TESTED_SOURCE}" "${SOURCE_SHA}" -- \
            "${runtime_paths[@]}" > runtime-source-differences.txt
          test ! -s runtime-source-differences.txt

          git -C source diff --name-only "${BOOT_TESTED_SOURCE}" "${SOURCE_SHA}" -- \
            > all-release-differences.txt
          awk '
            /^\.github\// { next }
            /^Documentation\// { next }
            /^README\.md$/ { next }
            { print; bad = 1 }
            END { exit bad }
          ' all-release-differences.txt > unexpected-release-differences.txt
          test ! -s unexpected-release-differences.txt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("source")
          cpu = (root / "arch/arm64/kernel/cpu_errata.c").read_text()
          random = (root / "drivers/char/random.c").read_text()
          extcon = (root / "drivers/extcon/extcon.c").read_text()
          fdt = (root / "drivers/of/fdt.c").read_text()
          early = (root / "drivers/soc/qcom/early_random.c").read_text()
          setup = (root / "arch/arm64/kernel/setup.c").read_text()
          mmu = (root / "arch/arm64/mm/mmu.c").read_text()
          rmap = (root / "mm/rmap.c").read_text()

          for name in ("arm64_update_smccc_conduit", "arm64_enable_wa2_handling"):
              count = len(re.findall(
                  rf"^\s*(?:static\s+)?void\s+__init\s+{name}\s*\(", cpu, re.M
              ))
              if count != 1:
                  raise SystemExit(f"{name}: expected one definition, got {count}")

          normalized = re.sub(r"\s+", " ", random)
          guard = (
              "if (system_wq && !kthread_should_stop() && crng_ready()) "
              "schedule_timeout_interruptible(CRNG_RESEED_INTERVAL);"
          )
          if guard not in normalized:
              raise SystemExit("RNG early-boot system_wq guard missing")

          if "edev->bnh = kcalloc" not in extcon:
              raise SystemExit("extcon blocking-notifier allocation missing")
          if not re.search(
              r"BLOCKING_INIT_NOTIFIER_HEAD\s*\(\s*&edev->bnh\s*"
              r"\[\s*[A-Za-z_]\w*\s*\]\s*\)\s*;",
              extcon,
          ):
              raise SystemExit("extcon blocking-notifier initialization missing")
          if extcon.count("kfree(edev->bnh);") < 2:
              raise SystemExit("extcon blocking-notifier lifetime cleanup incomplete")

          if len(re.findall(r"^int\s+of_fdt_get_ddrtype\s*\(", fdt, re.M)) != 1:
              raise SystemExit("downstream of_fdt_get_ddrtype API missing or duplicated")
          if setup.count("fixmap_remap_fdt(") < 2:
              raise SystemExit("ARM64 public FDT caller missing")
          if len(re.findall(r"^void \*__init fixmap_remap_fdt\s*\(", mmu, re.M)) != 1:
              raise SystemExit("ARM64 public FDT implementation missing or duplicated")
          if "__fixmap_remap_fdt" in setup or "__fixmap_remap_fdt" in mmu:
              raise SystemExit("temporary private FDT workaround detected")

          for include in ("#include <linux/hw_random.h>", "#include <linux/random.h>"):
              if early.count(include) != 1:
                  raise SystemExit(f"early_random include gate failed: {include}")

          clone = rmap[rmap.index("int anon_vma_clone_oplus"):]
          if "->degree" in clone:
              raise SystemExit("stale anon-vma degree access remains")
          for token in ("num_children", "num_active_vmas"):
              if token not in clone:
                  raise SystemExit(f"anon-vma clone missing {token}")
          PY

          {
            echo result=PASS
            echo "source_sha=${SOURCE_SHA}"
            echo "production_base=${PRODUCTION_BASE}"
            echo "android_common_target=${ANDROID_COMMON_TARGET}"
            echo "pristine_h40=${PRISTINE_H40}"
            echo "boot_tested_source=${BOOT_TESTED_SOURCE}"
            echo "authentic_merge=${AUTHENTIC_MERGE}"
            echo "authentic_merge_parent_order=PASS"
            echo "live_production_expected=${expected_live_production}"
            echo "permanent_workflow_count=1"
            echo sublevel=305
            echo conflict_ledger=33/33
            echo remaining_conflicts=0
            echo runtime_source_equivalence=PASS
            echo allowed_difference_roots=.github,Documentation,README.md
            echo mandatory_compatibility_areas=5
            echo additional_rmap_compatibility=PASS
          } | tee SOURCE-EQUIVALENCE.txt

      - name: Prepare exact validator and WLAN control identity
        shell: bash
        run: |
          set -Eeuo pipefail

          validator=control/scripts/miru/ci_validate_4.14.305.sh
          helper=source/scripts/miru/prepare_wlan_response_link.py
          bash -n "${validator}"

          python3 - "${validator}" "${SOURCE_SHA}" "${EXPECTED_RELEASE}" "${EXPECTED_LOCALVERSION}" "${EXPECTED_LIVE_PRODUCTION}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source_sha, expected_release, expected_local, expected_live_production = sys.argv[2:]
          text = path.read_text()
          replacements = (
              ("af61e9d6dfc33b7b46bfc608b20b6badf894ad23", source_sha, 1),
              ("4.14.305-miru-h40-lts305-af61e9d-ci1+", expected_release, 2),
              ("miru-h40-lts305-af61e9d-ci1", expected_local, 2),
              ("PRODUCTION_BASE=61371a1024e341f434deaf61b79a05f73827260a",
               "PRODUCTION_BASE=61371a1024e341f434deaf61b79a05f73827260a\n"
               "EXPECTED_LIVE_PRODUCTION=" + expected_live_production, 1),
              ('test "${production_ref}" = "${PRODUCTION_BASE}"',
               'test "${production_ref}" = "${EXPECTED_LIVE_PRODUCTION}"', 1),
          )
          for old, new, minimum in replacements:
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(
                      f"validator parameter count for {old}: {count}, expected at least {minimum}"
                  )
              text = text.replace(old, new)
          path.write_text(text)
          PY

          python3 - "${helper}" "${MAKEFILE_BUILD_BLOB}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          new_blob = sys.argv[2]
          text = path.read_text()
          old_blob = "74ce588c69513197a354ef0032c2145e91ee0641"
          if text.count(old_blob) != 1:
              raise SystemExit("stale WLAN Makefile.build identity is missing or duplicated")
          if text.count(new_blob) != 0:
              raise SystemExit("new WLAN Makefile.build identity already present unexpectedly")
          path.write_text(text.replace(old_blob, new_blob, 1))
          PY

          bash -n "${validator}"
          python3 -m py_compile "${helper}"
          grep -Fq "SOURCE_SHA=${SOURCE_SHA}" "${validator}"
          grep -Fq "EXPECTED_RELEASE=${EXPECTED_RELEASE}" "${validator}"
          grep -Fq "KERNEL_LOCALVERSION=-${EXPECTED_LOCALVERSION}" "${validator}"
          grep -Fq "EXPECTED_LIVE_PRODUCTION=${EXPECTED_LIVE_PRODUCTION}" "${validator}"
          grep -Fq 'test "${production_ref}" = "${EXPECTED_LIVE_PRODUCTION}"' "${validator}"
          grep -Fq "expected = \"${MAKEFILE_BUILD_BLOB}\"" "${helper}"
          test "$(git -C source hash-object scripts/Makefile.build)" = "${MAKEFILE_BUILD_BLOB}"

          {
            echo result=PASS
            echo committed_runtime_source_changes=0
            echo workspace_only_control_patch=scripts/miru/prepare_wlan_response_link.py
            echo "expected_makefile_build_blob=${MAKEFILE_BUILD_BLOB}"
          } | tee BUILD-CONTROL-PATCH.txt

      - name: Build kernel, DTBs, in-tree modules, and external modules
        id: validation
        shell: bash
        run: |
          set +e
          bash control/scripts/miru/ci_validate_4.14.305.sh \
            "${GITHUB_WORKSPACE}/source" \
            "${GITHUB_WORKSPACE}/control"
          status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [ "${status}" = 0 ]; then
            echo result=success >> "${GITHUB_OUTPUT}"
          else
            echo result=failure >> "${GITHUB_OUTPUT}"
          fi
          exit 0

      - name: Enforce release, DTB, module, vermagic, and ABI gates
        id: post
        if: always() && steps.validation.outputs.result == 'success'
        shell: bash
        run: |
          set +e
          (
            set -Eeuo pipefail
            OUT_DIR="${RUNNER_TEMP}/android-root/out/h40-kernel"
            ARTIFACT_DIR="${RUNNER_TEMP}/android-root/out/h40-artifacts"
            EXTERNAL_DIR="${RUNNER_TEMP}/miru-external-modules/dropin"
            REPORT_DIR="${GITHUB_WORKSPACE}/post-validation"
            mkdir -p "${REPORT_DIR}"
            exec > >(tee "${REPORT_DIR}/post-validation-console.log") 2>&1

            test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
            test "$(tr -d '\n' < "${OUT_DIR}/include/config/kernel.release")" = "${EXPECTED_RELEASE}"

            for rel in \
              arch/arm64/boot/Image \
              arch/arm64/boot/Image.gz \
              arch/arm64/boot/Image.gz-dtb \
              .config System.map Module.symvers; do
              test -s "${OUT_DIR}/${rel}"
            done

            mapfile -t in_tree_modules < <(find "${OUT_DIR}" -type f -name '*.ko' | sort)
            mapfile -t external_modules < <(find "${EXTERNAL_DIR}" -maxdepth 1 -type f -name '*.ko' | sort)
            test "${#in_tree_modules[@]}" = 13
            test "${#external_modules[@]}" = 32

            expected_vermagic="${EXPECTED_RELEASE} SMP preempt mod_unload modversions aarch64"
            : > "${REPORT_DIR}/IN-TREE-VERMAGIC.txt"
            for module in "${in_tree_modules[@]}"; do
              vermagic="$(modinfo -F vermagic "${module}")"
              test "${vermagic}" = "${expected_vermagic}"
              echo "${module#${OUT_DIR}/}: ${vermagic}" >> "${REPORT_DIR}/IN-TREE-VERMAGIC.txt"
            done
            test "$(grep -F ": ${expected_vermagic}" source/external-module-diagnostics/vermagic.txt | wc -l)" = 32
            grep -Fq 'modules=32' source/external-module-diagnostics/MODULE-ABI-REPORT.txt
            grep -Fq 'errors=0' source/external-module-diagnostics/MODULE-ABI-REPORT.txt

            python3 - "${OUT_DIR}/Module.symvers" "${REPORT_DIR}/IN-TREE-MODVERSIONS.txt" "${in_tree_modules[@]}" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          symvers = {}
          for line in Path(sys.argv[1]).read_text().splitlines():
              fields = line.split()
              if len(fields) >= 2:
                  symvers[fields[1]] = int(fields[0], 16)

          modules = [Path(p) for p in sys.argv[3:]]
          errors = []
          details = []
          for module in modules:
              output = subprocess.check_output(
                  ["modprobe", "--dump-modversions", str(module)], text=True
              )
              imports = 0
              for line in output.splitlines():
                  fields = line.split()
                  if len(fields) != 2:
                      continue
                  imports += 1
                  actual = int(fields[0], 16)
                  symbol = fields[1]
                  expected = symvers.get(symbol)
                  if expected is None:
                      errors.append(f"{module}: missing export {symbol}")
                  elif expected != actual:
                      errors.append(f"{module}: CRC mismatch {symbol}")
              details.append(f"{module}: imports={imports}")
          report = [f"modules={len(modules)}", f"errors={len(errors)}", "", *details]
          if errors:
              report.extend(["", "ERRORS", *errors])
          Path(sys.argv[2]).write_text("\n".join(report) + "\n")
          if errors:
              raise SystemExit("\n".join(errors))
          PY
            grep -Fq 'modules=13' "${REPORT_DIR}/IN-TREE-MODVERSIONS.txt"
            grep -Fq 'errors=0' "${REPORT_DIR}/IN-TREE-MODVERSIONS.txt"

            dtb_root="${OUT_DIR}/arch/arm64/boot/dts"
            projects=(18821 19801 19863 18865 18857)
            mapfile -t all_dtbs < <(find "${dtb_root}" -type f -name '*.dtb' | sort)
            test "${#all_dtbs[@]}" = 5
            dtbs=()
            for project in "${projects[@]}"; do
              dtb="${dtb_root}/${project}/sm8150-v2-mtp.dtb"
              test -s "${dtb}"
              dtbs+=("${dtb}")
            done
            test "$(find "${dtb_root}" -type f -name '*.dtbo' | wc -l)" = 0

            cat "${OUT_DIR}/arch/arm64/boot/Image.gz" "${dtbs[@]}" \
              > "${REPORT_DIR}/expected-Image.gz-dtb"
            cmp "${REPORT_DIR}/expected-Image.gz-dtb" \
              "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb"
            rm "${REPORT_DIR}/expected-Image.gz-dtb"

            {
              echo 'order=18821 19801 19863 18865 18857'
              for dtb in "${dtbs[@]}"; do
                stat -c 'size=%s path=%n' "${dtb}"
                sha256sum "${dtb}"
              done
            } > "${REPORT_DIR}/DTB-REPORT.txt"

            {
              for rel in \
                arch/arm64/boot/Image \
                arch/arm64/boot/Image.gz \
                arch/arm64/boot/Image.gz-dtb \
                .config System.map Module.symvers; do
                stat -c 'size=%s path=%n' "${OUT_DIR}/${rel}"
                sha256sum "${OUT_DIR}/${rel}"
              done
            } > "${REPORT_DIR}/KERNEL-OUTPUTS-SHA256.txt"

            {
              echo "source_sha=${SOURCE_SHA}"
              echo "production_base=${PRODUCTION_BASE}"
              echo "android_common_target=${ANDROID_COMMON_TARGET}"
              echo "pristine_h40=${PRISTINE_H40}"
              echo "boot_tested_source=${BOOT_TESTED_SOURCE}"
              echo "external_module_source_sha=${VENDOR_SHA}"
              echo "kernel_release=${EXPECTED_RELEASE}"
              echo "vermagic=${expected_vermagic}"
              echo 'dtb_order=18821 19801 19863 18865 18857'
              echo 'dtb_count=5'
              echo 'dtbo_count=0'
              echo "in_tree_module_count=${#in_tree_modules[@]}"
              echo "external_module_count=${#external_modules[@]}"
              echo 'unresolved_symbol_abi_errors=0'
              echo 'external_module_abi_errors=0'
              echo 'in_tree_modversions=PASS'
              echo 'runtime_source_equivalence=PASS'
            } | tee "${REPORT_DIR}/VALIDATION-SUMMARY.txt"

            find "${ARTIFACT_DIR}" -type f -print0 | sort -z | xargs -0 sha256sum \
              > "${REPORT_DIR}/FULL-KERNEL-FILES-SHA256.txt"
            find "${EXTERNAL_DIR}" -type f -print0 | sort -z | xargs -0 sha256sum \
              > "${REPORT_DIR}/EXTERNAL-MODULE-FILES-SHA256.txt"
            echo result=PASS > "${REPORT_DIR}/RESULT.txt"
          )
          status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [ "${status}" = 0 ]; then
            echo result=success >> "${GITHUB_OUTPUT}"
          else
            echo result=failure >> "${GITHUB_OUTPUT}"
          fi
          exit 0

      - name: Assemble release-candidate and full validation packages
        if: always()
        shell: bash
        env:
          VALIDATION_RESULT: ${{ steps.validation.outputs.result }}
          VALIDATION_EXIT: ${{ steps.validation.outputs.exit_code }}
          POST_RESULT: ${{ steps.post.outputs.result }}
          POST_EXIT: ${{ steps.post.outputs.exit_code }}
        run: |
          set -Eeuo pipefail
          OUT_DIR="${RUNNER_TEMP}/android-root/out/h40-kernel"
          ARTIFACT_DIR="${RUNNER_TEMP}/android-root/out/h40-artifacts"
          EXTERNAL_DIR="${RUNNER_TEMP}/miru-external-modules/dropin"
          PACKAGE_ROOT="${GITHUB_WORKSPACE}/packages"
          FULL="${PACKAGE_ROOT}/full-validation"
          RELEASE="${PACKAGE_ROOT}/release-candidate"
          mkdir -p "${FULL}" "${RELEASE}"

          cp -a SOURCE-EQUIVALENCE.txt BUILD-CONTROL-PATCH.txt \
            runtime-source-differences.txt all-release-differences.txt \
            unexpected-release-differences.txt source-conflict-markers.txt \
            "${FULL}/" 2>/dev/null || true
          cp -a control/build-validation-result "${FULL}/validator-result" 2>/dev/null || true
          cp -a source/build-diagnostics "${FULL}/kernel-build-logs" 2>/dev/null || true
          cp -a source/external-module-diagnostics "${FULL}/external-module-logs" 2>/dev/null || true
          cp -a post-validation "${FULL}/post-validation" 2>/dev/null || true
          cp -a "${ARTIFACT_DIR}" "${FULL}/kernel-output" 2>/dev/null || true
          cp -a "${EXTERNAL_DIR}" "${FULL}/external-modules" 2>/dev/null || true
          cp -a "${RUNNER_TEMP}/android-root/out/miru-v3-modules-dropin-4.14.305.7z" \
            "${FULL}/" 2>/dev/null || true
          cp -a "${RUNNER_TEMP}/android-root/out/miru-v3-modules-dropin-4.14.305-audit.zip" \
            "${FULL}/" 2>/dev/null || true

          {
            echo "validation_result=${VALIDATION_RESULT:-missing}"
            echo "validator_exit=${VALIDATION_EXIT:-missing}"
            echo "post_result=${POST_RESULT:-missing}"
            echo "post_exit=${POST_EXIT:-missing}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${FULL}/RUN-STATUS.txt"

          if [ "${VALIDATION_RESULT:-}" = success ] && [ "${POST_RESULT:-}" = success ]; then
            mkdir -p "${RELEASE}/external-modules" "${RELEASE}/in-tree-modules"
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" "${RELEASE}/"
            cp "${RUNNER_TEMP}/android-root/out/miru-v3-modules-dropin-4.14.305.7z" \
              "${RELEASE}/external-modules/"
            cp "${RUNNER_TEMP}/android-root/out/miru-v3-modules-dropin-4.14.305-audit.zip" \
              "${RELEASE}/external-modules/"
            while IFS= read -r -d '' module; do
              rel="${module#${OUT_DIR}/}"
              mkdir -p "${RELEASE}/in-tree-modules/$(dirname "${rel}")"
              cp "${module}" "${RELEASE}/in-tree-modules/${rel}"
            done < <(find "${OUT_DIR}" -type f -name '*.ko' -print0)
            cp SOURCE-EQUIVALENCE.txt BUILD-CONTROL-PATCH.txt "${RELEASE}/"
            cp post-validation/VALIDATION-SUMMARY.txt \
              "${RELEASE}/KERNEL-RELEASE-AND-VALIDATION.txt"
            cp post-validation/KERNEL-OUTPUTS-SHA256.txt \
              post-validation/DTB-REPORT.txt "${RELEASE}/"
            cat > "${RELEASE}/README.txt" <<EOF
          Miru H.40 Linux 4.14.305 release candidate
          ===========================================

          Kernel release:
            ${EXPECTED_RELEASE}

          Source:
            ${SOURCE_SHA}

          Status:
            RELEASE CANDIDATE — requires final physical smoke testing on the OnePlus 7 Pro before production merge.

          This package contains the exact kernel image, 13 matching in-tree
          modules, the matching 32-module external drop-in, checksums, and
          validation reports. Use only the modules shipped with this package.
          EOF
            (
              cd "${RELEASE}"
              find . -type f ! -name SHA256SUMS -print0 | sort -z | \
                xargs -0 sha256sum > SHA256SUMS
            )
