name: Miru H.40 Linux 4.14.336 authentic integration

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: miru-h40-lts336-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: miru-h40-lts336-release
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  authentic-integration:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts336-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Prepare and validate authentic merge
        id: integrate
        shell: bash
        run: bash scripts/miru/integrate_4.14.336.sh prepare

      - name: Upload integration evidence before any push
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts336-integration-${{ env.SOURCE_SHA }}
          path: |
            audit
            Documentation/miru/lts-4.14.336-conflicts.md
            Documentation/miru/lts-4.14.336-resolution-results.tsv
          if-no-files-found: warn
          compression-level: 9
          retention-days: 30

      - name: Guarded candidate-only push
        if: steps.integrate.outputs.created == 'true'
        shell: bash
        run: bash scripts/miru/integrate_4.14.336.sh push
