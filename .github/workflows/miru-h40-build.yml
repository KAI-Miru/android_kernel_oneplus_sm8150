name: Miru H.40 Linux 4.14.336 authentic integration

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: miru-h40-lts336-authentic-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PRODUCTION_HEAD: a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee
  PRODUCTION_MERGE_305: 489177590738e082a37e17fc9ef9290e4f168058
  PRISTINE_H40: 180d787684d5965be5145bcfbf666ed427b4ea18
  ROLLBACK_269: 61371a1024e341f434deaf61b79a05f73827260a
  ANDROID_COMMON_305: 4415bf5e08942aee6487946a3e0a50956ef68f1e
  ANDROID_COMMON_336: 014241ad77dda0eafbdf671d5b8e86917d8ec97e
  ANDROID_COMMON_336_PARENT_1: bc841b804f61c5918bd950ccb15e63c36f5bd0b5
  ANDROID_COMMON_336_PARENT_2: c31e35278ea8f04f1dceadd77dca4dd7d47932a3
  ANDROID_COMMON_BRANCH: deprecated/android-4.14-stable
  RELEASE_BRANCH: miru-h40-lts336-release
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  RESOLVER_BLOB: edc816bf754ab8b5992d8ce42628565184b42659
  LEDGER: Documentation/miru/lts-4.14.336-conflicts.md
  RESULT_TSV: Documentation/miru/lts-4.14.336-resolution-results.tsv

jobs:
  integrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts336-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout exact candidate head with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify immutable refs and exact Android Common target
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p audit

          read_ref() {
            git ls-remote origin "$1" | awk 'NR == 1 {value=$1} END {print value}'
          }
          check_eq() {
            local label="$1" actual="$2" expected="$3"
            printf '%s.actual=%s\n%s.expected=%s\n' \
              "$label" "$actual" "$label" "$expected" | tee -a audit/provenance.txt
            test "$actual" = "$expected"
          }

          check_eq source_head "$(git rev-parse HEAD)" "$SOURCE_SHA"
          check_eq head_ref "$GITHUB_HEAD_REF" "$RELEASE_BRANCH"
          check_eq candidate_ref "$(read_ref "refs/heads/$RELEASE_BRANCH")" "$SOURCE_SHA"
          check_eq production_ref "$(read_ref refs/heads/miru-h40)" "$PRODUCTION_HEAD"
          check_eq pristine_h40_ref "$(read_ref refs/heads/oneplus/sm8150_s_12.1_op7pro)" "$PRISTINE_H40"

          rollback_ref="$(read_ref 'refs/tags/miru-h40-4.14.269-final^{}')"
          if [ -z "$rollback_ref" ]; then
            rollback_ref="$(read_ref refs/tags/miru-h40-4.14.269-final)"
          fi
          check_eq rollback_ref "$rollback_ref" "$ROLLBACK_269"

          for ancestor in \
            "$PRODUCTION_HEAD" \
            "$PRODUCTION_MERGE_305" \
            "$PRISTINE_H40" \
            "$ROLLBACK_269" \
            "$ANDROID_COMMON_305"; do
            git cat-file -e "${ancestor}^{commit}"
            git merge-base --is-ancestor "$ancestor" HEAD
            echo "candidate_ancestor.$ancestor=PASS" | tee -a audit/provenance.txt
          done

          cat > audit/expected-parent-delta.txt <<'EOF'
          .github/workflows/miru-h40-build.yml
          Documentation/miru/lts-4.14.336-conflicts.md
          scripts/miru/resolve_4.14.336.py
          EOF
          git diff --name-only "$PRODUCTION_HEAD" HEAD | sort -u > audit/actual-parent-delta.txt
          diff -u audit/expected-parent-delta.txt audit/actual-parent-delta.txt
          check_eq resolver_blob "$(git rev-parse "HEAD:scripts/miru/resolve_4.14.336.py")" "$RESOLVER_BLOB"

          remote_branch="refs/heads/$ANDROID_COMMON_BRANCH"
          local_branch="refs/remotes/android-common/$ANDROID_COMMON_BRANCH"
          advertised="$(git ls-remote https://android.googlesource.com/kernel/common "$remote_branch" | awk 'NR == 1 {value=$1} END {print value}')"
          check_eq android_common_advertised "$advertised" "$ANDROID_COMMON_336"
          git fetch --no-tags --force https://android.googlesource.com/kernel/common \
            "+${remote_branch}:${local_branch}"
          check_eq android_common_fetched "$(git rev-parse "${local_branch}^{commit}")" "$ANDROID_COMMON_336"

          mapfile -t target_parents < <(git cat-file -p "$ANDROID_COMMON_336" | sed -n 's/^parent //p')
          test "${#target_parents[@]}" -eq 2
          check_eq target_parent_1 "${target_parents[0]}" "$ANDROID_COMMON_336_PARENT_1"
          check_eq target_parent_2 "${target_parents[1]}" "$ANDROID_COMMON_336_PARENT_2"
          git merge-base --is-ancestor "$ANDROID_COMMON_305" "$ANDROID_COMMON_336"

          git show "$ANDROID_COMMON_336:Makefile" > audit/android-common-Makefile
          check_eq target_version "$(awk '$1 == "VERSION" && $2 == "=" {value=$3} END {print value}' audit/android-common-Makefile)" 4
          check_eq target_patchlevel "$(awk '$1 == "PATCHLEVEL" && $2 == "=" {value=$3} END {print value}' audit/android-common-Makefile)" 14
          check_eq target_sublevel "$(awk '$1 == "SUBLEVEL" && $2 == "=" {value=$3} END {print value}' audit/android-common-Makefile)" 336

          if git merge-base --is-ancestor "$ANDROID_COMMON_336" HEAD; then
            echo already_integrated=true >> "$GITHUB_OUTPUT"
            echo integration_state=ALREADY_PRESENT | tee -a audit/provenance.txt
          else
            echo already_integrated=false >> "$GITHUB_OUTPUT"
            echo integration_state=READY | tee -a audit/provenance.txt
          fi

      - name: Capture downstream identities before merge
        if: steps.preflight.outputs.already_integrated == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          kcal_paths=(
            drivers/gpu/drm/msm/sde/sde_kcal_ctrl.c
            drivers/gpu/drm/msm/sde/sde_kcal_ctrl.h
            drivers/gpu/drm/msm/sde/sde_color_processing.c
            drivers/gpu/drm/msm/sde/sde_crtc.c
            drivers/gpu/drm/msm/msm_drv.c
            drivers/gpu/drm/msm/Makefile
            h40-repro/config/GM1911_11_H.40.config
          )
          : > audit/kcal-parent-identities.tsv
          for path in "${kcal_paths[@]}"; do
            test -s "$path"
            printf '%s\t%s\n' "$(git hash-object "$path")" "$path" >> audit/kcal-parent-identities.tsv
          done

          git diff --name-only "$PRISTINE_H40" "$PRODUCTION_HEAD" | sort -u > audit/downstream-paths.txt
          git diff --name-only "$ANDROID_COMMON_305" "$ANDROID_COMMON_336" | sort -u > audit/common-305-336-paths.txt
          comm -12 audit/downstream-paths.txt audit/common-305-336-paths.txt > audit/overlap-paths.txt
          git log --oneline --no-merges "$ANDROID_COMMON_305..$ANDROID_COMMON_336" > audit/common-305-336-commits.txt

      - name: Perform authentic merge and deterministic resolution
        if: steps.preflight.outputs.already_integrated == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config rerere.enabled false
          git config rerere.autoupdate false
          git config merge.renormalize false

          set +e
          git -c rerere.enabled=false -c rerere.autoupdate=false -c merge.renormalize=false \
            merge --no-commit --no-ff "$ANDROID_COMMON_336" \
            > audit/merge-stdout.txt 2> audit/merge-stderr.txt
          merge_status=$?
          set -e

          git status --porcelain=v1 > audit/status-after-merge.txt
          git ls-files -u > audit/unmerged-before-resolution.tsv
          git diff --name-only --diff-filter=U | sort -u > audit/conflict-paths.txt
          cat > audit/expected-conflict-paths.txt <<'EOF'
          drivers/devfreq/devfreq.c
          drivers/gpu/drm/drm_mipi_dsi.c
          drivers/mmc/core/block.c
          drivers/mtd/ubi/wl.c
          drivers/thermal/thermal_core.c
          drivers/usb/dwc3/core.c
          drivers/usb/dwc3/gadget.c
          drivers/usb/gadget/function/f_fs.c
          include/net/pkt_sched.h
          init/main.c
          kernel/events/core.c
          kernel/sched/fair.c
          lib/ubsan.h
          scripts/checkpatch.pl
          EOF
          test "$merge_status" -ne 0
          diff -u audit/expected-conflict-paths.txt audit/conflict-paths.txt

          python3 scripts/miru/resolve_4.14.336.py --report "$RESULT_TSV" | tee audit/resolver-output.txt
          test -z "$(git ls-files -u)"
          test "$(wc -l < "$RESULT_TSV")" -eq 15
          git diff --cached --check | tee audit/diff-check.txt
          perl -c scripts/checkpatch.pl 2>&1 | tee audit/checkpatch-perl.txt

          while IFS= read -r path; do
            if grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- "$path"; then
              echo "unresolved merge marker in $path" >&2
              exit 1
            fi
          done < audit/conflict-paths.txt

          while IFS=$'\t' read -r expected path; do
            test "$(git hash-object "$path")" = "$expected"
          done < audit/kcal-parent-identities.tsv

          required_paths=(
            arch/arm64
            drivers/gpu/drm/msm
            drivers/input/touchscreen/oneplus_touchscreen
            drivers/power/oplus
            drivers/rpmsg
            drivers/soc/qcom
            h40-repro/config
            net/qrtr
            sound/soc
          )
          for path in "${required_paths[@]}"; do
            test -e "$path"
          done

          test "$(awk '$1 == "VERSION" && $2 == "=" {value=$3} END {print value}' Makefile)" = 4
          test "$(awk '$1 == "PATCHLEVEL" && $2 == "=" {value=$3} END {print value}' Makefile)" = 14
          test "$(awk '$1 == "SUBLEVEL" && $2 == "=" {value=$3} END {print value}' Makefile)" = 336
          echo merge_and_resolution=PASS | tee audit/integration-gates.txt

      - name: Finalize ledger and create authentic two-parent merge
        if: steps.preflight.outputs.already_integrated == 'false'
        id: merge_commit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$SOURCE_SHA" <<'PY'
          from pathlib import Path
          import sys

          path = Path('Documentation/miru/lts-4.14.336-conflicts.md')
          text = path.read_text()
          replacements = {
              '@INTEGRATION_STATUS@': 'COMPLETE — authentic candidate merge created',
              '@CANDIDATE_PARENT@': sys.argv[1],
              '@SEMANTIC_STATUS@': '14 of 14 complete',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'ledger placeholder {old} count is not one')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          git add -- "$LEDGER" "$RESULT_TSV"
          git diff --cached --check
          test -z "$(git ls-files -u)"
          git commit \
            -m 'Merge Android Common Linux 4.14.336 into Miru H.40' \
            -m 'Parent 1 is the production-derived Miru H.40 4.14.305 candidate.' \
            -m 'Parent 2 is exact Android Common deprecated/android-4.14-stable commit 014241ad77dda0eafbdf671d5b8e86917d8ec97e.' \
            -m 'All 14 authentic conflicts use the deterministic, six-replay-verified resolutions.'

          merge_head="$(git rev-parse HEAD)"
          actual_parents="$(git rev-list --parents -n 1 HEAD)"
          test "$actual_parents" = "$merge_head $SOURCE_SHA $ANDROID_COMMON_336"
          git merge-base --is-ancestor "$PRODUCTION_HEAD" "$merge_head"
          git merge-base --is-ancestor "$ANDROID_COMMON_336" "$merge_head"
          printf 'merge_commit=%s\nparent_1=%s\nparent_2=%s\n' \
            "$merge_head" "$SOURCE_SHA" "$ANDROID_COMMON_336" | tee audit/authentic-merge.txt
          echo "merge_head=$merge_head" >> "$GITHUB_OUTPUT"

      - name: Upload integration evidence before push
        if: steps.preflight.outputs.already_integrated == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts336-authentic-integration-${{ env.SOURCE_SHA }}
          path: |
            audit
            Documentation/miru/lts-4.14.336-conflicts.md
            Documentation/miru/lts-4.14.336-resolution-results.tsv
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Guarded candidate-only push
        if: steps.preflight.outputs.already_integrated == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          read_ref() {
            git ls-remote origin "$1" | awk 'NR == 1 {value=$1} END {print value}'
          }
          merge_head="${{ steps.merge_commit.outputs.merge_head }}"
          test -n "$merge_head"
          test "$(read_ref "refs/heads/$RELEASE_BRANCH")" = "$SOURCE_SHA"
          test "$(read_ref refs/heads/miru-h40)" = "$PRODUCTION_HEAD"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          test "$(read_ref "refs/heads/$RELEASE_BRANCH")" = "$merge_head"
          test "$(read_ref refs/heads/miru-h40)" = "$PRODUCTION_HEAD"
          echo candidate_push=PASS
          echo production_write=NONE

      - name: Validate an already-integrated candidate
        if: steps.preflight.outputs.already_integrated == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          found=''
          while IFS= read -r commit; do
            mapfile -t parents < <(git cat-file -p "$commit" | sed -n 's/^parent //p')
            if [ "${#parents[@]}" -eq 2 ] && [ "${parents[1]}" = "$ANDROID_COMMON_336" ]; then
              found="$commit"
              break
            fi
          done < <(git rev-list --merges --first-parent HEAD)
          test -n "$found"
          git merge-base --is-ancestor "$PRODUCTION_HEAD" "$found"
          git merge-base --is-ancestor "$ANDROID_COMMON_336" "$found"
          test "$(awk '$1 == "SUBLEVEL" && $2 == "=" {value=$3} END {print value}' Makefile)" = 336
          grep -Fq 'Integration status: **COMPLETE' "$LEDGER"
          grep -Fq 'Semantic resolutions: **14 of 14 complete**' "$LEDGER"
          test "$(wc -l < "$RESULT_TSV")" -eq 15
          echo "existing_authentic_merge=$found"
          echo production_write=NONE
