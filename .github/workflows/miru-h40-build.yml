name: Miru H.40 Linux 4.14.336 deterministic replay

on:
  pull_request:
    branches:
      - miru-h40
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: miru-h40-lts336-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PRODUCTION_HEAD: a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee
  OLD_PARENT: 34ecf6910e9052c8d427861af9744b15d041fc07
  PASS_PARENT: 7e013ba1973a82ef13f8940cb73ba658ebf21d75
  ANDROID_COMMON_305: 4415bf5e08942aee6487946a3e0a50956ef68f1e
  ANDROID_COMMON_336: 014241ad77dda0eafbdf671d5b8e86917d8ec97e
  ANDROID_COMMON_BRANCH: deprecated/android-4.14-stable
  RELEASE_BRANCH: miru-h40-lts336-release
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  EXPECTED_DEVFREQ_BLOB: ffa38b2a847440ef62661d1a8b72e43ff61dc875

jobs:
  deterministic-replay:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts336-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout exact current candidate with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify refs, parent-tree scope, and exact target
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p audit

          read_ref() {
            git ls-remote origin "$1" | awk 'NR == 1 {value=$1} END {print value}'
          }
          check_eq() {
            local label="$1" actual="$2" expected="$3"
            printf '%s.actual=%s\n%s.expected=%s\n' "$label" "$actual" "$label" "$expected" | tee -a audit/provenance.txt
            test "$actual" = "$expected"
          }

          check_eq source_head "$(git rev-parse HEAD)" "$SOURCE_SHA"
          check_eq candidate_ref "$(read_ref "refs/heads/$RELEASE_BRANCH")" "$SOURCE_SHA"
          check_eq production_ref "$(read_ref refs/heads/miru-h40)" "$PRODUCTION_HEAD"

          for commit in "$OLD_PARENT" "$PASS_PARENT" "$ANDROID_COMMON_305"; do
            git cat-file -e "${commit}^{commit}"
          done
          git merge-base --is-ancestor "$OLD_PARENT" "$PASS_PARENT"
          test "$(git rev-list --count "$OLD_PARENT..$PASS_PARENT")" -eq 1

          git diff --name-status "$OLD_PARENT" "$PASS_PARENT" > audit/old-to-pass-tree-delta.txt
          test "$(wc -l < audit/old-to-pass-tree-delta.txt)" -eq 1
          grep -Fxq $'M\t.github/workflows/miru-h40-build.yml' audit/old-to-pass-tree-delta.txt

          git diff --name-only "$PASS_PARENT" "$SOURCE_SHA" | sort -u > audit/pass-to-source-paths.txt
          test "$(wc -l < audit/pass-to-source-paths.txt)" -eq 1
          grep -Fxq '.github/workflows/miru-h40-build.yml' audit/pass-to-source-paths.txt

          old_resolver="$(git rev-parse "$OLD_PARENT:scripts/miru/resolve_4.14.336.py")"
          pass_resolver="$(git rev-parse "$PASS_PARENT:scripts/miru/resolve_4.14.336.py")"
          source_resolver="$(git rev-parse "$SOURCE_SHA:scripts/miru/resolve_4.14.336.py")"
          check_eq old_pass_resolver "$old_resolver" "$pass_resolver"
          check_eq source_resolver "$source_resolver" "$pass_resolver"

          remote_branch="refs/heads/$ANDROID_COMMON_BRANCH"
          local_branch="refs/remotes/android-common/$ANDROID_COMMON_BRANCH"
          advertised="$(git ls-remote https://android.googlesource.com/kernel/common "$remote_branch" | awk 'NR == 1 {value=$1} END {print value}')"
          check_eq android_common_advertised "$advertised" "$ANDROID_COMMON_336"
          git fetch --no-tags --force https://android.googlesource.com/kernel/common \
            "+${remote_branch}:${local_branch}"
          check_eq android_common_fetched "$(git rev-parse "${local_branch}^{commit}")" "$ANDROID_COMMON_336"
          git merge-base --is-ancestor "$ANDROID_COMMON_305" "$ANDROID_COMMON_336"

          git show "$ANDROID_COMMON_336:Makefile" > audit/android-common-Makefile
          check_eq target_version "$(awk '$1 == "VERSION" && $2 == "=" {value=$3} END {print value}' audit/android-common-Makefile)" 4
          check_eq target_patchlevel "$(awk '$1 == "PATCHLEVEL" && $2 == "=" {value=$3} END {print value}' audit/android-common-Makefile)" 14
          check_eq target_sublevel "$(awk '$1 == "SUBLEVEL" && $2 == "=" {value=$3} END {print value}' audit/android-common-Makefile)" 336

          git version | tee audit/git-version.txt
          git config --show-origin --list | sort > audit/git-config-before.txt
          echo preflight=PASS | tee -a audit/provenance.txt

      - name: Replay old, passing, and current parents twice each
        shell: bash
        run: |
          set -Eeuo pipefail
          common_dir="$(git rev-parse --git-common-dir)"
          rm -rf "$common_dir/rr-cache"
          git config rerere.enabled false
          git config rerere.autoupdate false
          git config merge.renormalize false

          printf 'label\tparent\tmerge_status\tconflicts\tresolver_status\tunmerged_after\tdevfreq_blob\n' > audit/replay-summary.tsv

          replay_one() {
            local label="$1" parent="$2"
            local dir="$RUNNER_TEMP/worktree-$label"
            local out="$GITHUB_WORKSPACE/audit/$label"
            mkdir -p "$out/resolved"
            git worktree add --detach "$dir" "$parent"

            (
              set -Eeuo pipefail
              cd "$dir"
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git config rerere.enabled false
              git config rerere.autoupdate false
              git config merge.renormalize false

              git rev-parse HEAD > "$out/parent.txt"
              git status --porcelain=v1 > "$out/status-before.txt"
              git config --show-origin --list | sort > "$out/git-config.txt"

              set +e
              git -c rerere.enabled=false -c rerere.autoupdate=false -c merge.renormalize=false \
                merge --no-commit --no-ff "$ANDROID_COMMON_336" \
                > "$out/merge-stdout.txt" 2> "$out/merge-stderr.txt"
              merge_status=$?
              set -e

              git status --porcelain=v1 > "$out/status-after-merge.txt"
              git ls-files -u > "$out/unmerged-before.tsv"
              git diff --name-only --diff-filter=U | sort -u > "$out/conflict-paths.txt"
              conflict_count="$(wc -l < "$out/conflict-paths.txt")"

              python3 - "$out" <<'PY'
          from pathlib import Path
          import sys

          out = Path(sys.argv[1])
          entries = {}
          for line in out.joinpath('unmerged-before.tsv').read_text().splitlines():
              meta, path = line.split('\t', 1)
              mode, blob, stage = meta.split()
              entries.setdefault(path, {})[int(stage)] = (mode, blob)
          with out.joinpath('conflict-stages.tsv').open('w') as f:
              f.write('path\tbase_mode\tbase_blob\tours_mode\tours_blob\ttheirs_mode\ttheirs_blob\n')
              for path in sorted(entries):
                  row = [path]
                  for stage in (1, 2, 3):
                      row.extend(entries[path].get(stage, ('-', '-')))
                  f.write('\t'.join(row) + '\n')
          PY

              set +e
              python3 scripts/miru/resolve_4.14.336.py \
                --report Documentation/miru/lts-4.14.336-resolution-results.tsv \
                > "$out/resolver-stdout.txt" 2> "$out/resolver-stderr.txt"
              resolver_status=$?
              set -e

              unmerged_after="$(git ls-files -u | wc -l)"
              git status --porcelain=v1 > "$out/status-after-resolution.txt"
              cp -a Documentation/miru/lts-4.14.336-resolution-results.tsv "$out/resolution-results.tsv" 2>/dev/null || true

              printf 'path\tmode\tstaged_blob\tworktree_blob\n' > "$out/final-blobs.tsv"
              mapfile -t conflict_paths < "$out/conflict-paths.txt"
              for path in "${conflict_paths[@]}"; do
                [ -n "$path" ] || continue
                git ls-files -s -- "$path" > "$out/index-entry.tmp"
                entry_count="$(wc -l < "$out/index-entry.tmp")"
                if [ "$entry_count" -eq 1 ]; then
                  mode="$(awk '{print $1}' "$out/index-entry.tmp")"
                  staged_blob="$(awk '{print $2}' "$out/index-entry.tmp")"
                  worktree_blob="$(git hash-object "$path")"
                  printf '%s\t%s\t%s\t%s\n' "$path" "$mode" "$staged_blob" "$worktree_blob" >> "$out/final-blobs.tsv"
                  mkdir -p "$out/resolved/$(dirname "$path")"
                  cp -a -- "$path" "$out/resolved/$path"
                else
                  printf '%s\tUNMERGED\tUNMERGED\t%s\n' "$path" "$(git hash-object "$path")" >> "$out/final-blobs.tsv"
                fi
              done
              rm -f "$out/index-entry.tmp"

              if [ "${#conflict_paths[@]}" -gt 0 ]; then
                git diff --cached --binary -- "${conflict_paths[@]}" > "$out/staged.patch"
                git diff --cached --stat -- "${conflict_paths[@]}" > "$out/staged.stat"
              fi
              git diff --cached --check > "$out/diff-check.txt" 2>&1 || true
              perl -c scripts/checkpatch.pl > "$out/checkpatch-perl.txt" 2>&1 || true

              devfreq_blob="$(awk -F '\t' '$1 == "drivers/devfreq/devfreq.c" {value=$3} END {print value}' "$out/final-blobs.tsv")"
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$label" "$parent" "$merge_status" "$conflict_count" \
                "$resolver_status" "$unmerged_after" "$devfreq_blob" \
                >> "$GITHUB_WORKSPACE/audit/replay-summary.tsv"
            )
          }

          replay_one old-a "$OLD_PARENT"
          replay_one old-b "$OLD_PARENT"
          replay_one pass-a "$PASS_PARENT"
          replay_one pass-b "$PASS_PARENT"
          replay_one source-a "$SOURCE_SHA"
          replay_one source-b "$SOURCE_SHA"

          cat audit/replay-summary.tsv

      - name: Prove identical deterministic output in all six replays
        shell: bash
        run: |
          set -Eeuo pipefail
          labels=(old-a old-b pass-a pass-b source-a source-b)
          for label in "${labels[@]}"; do
            test "$(awk -F '\t' -v l="$label" '$1 == l {value=$3} END {print value}' audit/replay-summary.tsv)" -ne 0
            test "$(awk -F '\t' -v l="$label" '$1 == l {value=$4} END {print value}' audit/replay-summary.tsv)" -eq 14
            test "$(awk -F '\t' -v l="$label" '$1 == l {value=$5} END {print value}' audit/replay-summary.tsv)" -eq 0
            test "$(awk -F '\t' -v l="$label" '$1 == l {value=$6} END {print value}' audit/replay-summary.tsv)" -eq 0
            test "$(awk -F '\t' -v l="$label" '$1 == l {value=$7} END {print value}' audit/replay-summary.tsv)" = "$EXPECTED_DEVFREQ_BLOB"
            test "$(( $(wc -l < "audit/$label/conflict-stages.tsv") - 1 ))" -eq 14
            test "$(( $(wc -l < "audit/$label/final-blobs.tsv") - 1 ))" -eq 14
            test "$(wc -l < "audit/$label/resolution-results.tsv")" -eq 15
            test ! -s "audit/$label/resolver-stderr.txt"
            grep -Fq 'syntax OK' "audit/$label/checkpatch-perl.txt"
          done

          for other in old-b pass-a pass-b source-a source-b; do
            cmp audit/old-a/conflict-stages.tsv "audit/$other/conflict-stages.tsv"
            cmp audit/old-a/final-blobs.tsv "audit/$other/final-blobs.tsv"
            cmp audit/old-a/resolution-results.tsv "audit/$other/resolution-results.tsv"
            cmp audit/old-a/staged.patch "audit/$other/staged.patch"
          done

          sha256sum \
            audit/old-a/conflict-stages.tsv \
            audit/old-a/final-blobs.tsv \
            audit/old-a/resolution-results.tsv \
            audit/old-a/staged.patch \
            | tee audit/deterministic-digests.txt
          echo deterministic_replay=PASS | tee audit/RESULT.txt

      - name: Upload complete deterministic replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts336-deterministic-replay-${{ env.SOURCE_SHA }}
          path: audit
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Prove no repository write
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          live_candidate="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk 'NR == 1 {value=$1} END {print value}')"
          live_production="$(git ls-remote origin refs/heads/miru-h40 | awk 'NR == 1 {value=$1} END {print value}')"
          test "$live_candidate" = "$SOURCE_SHA"
          test "$live_production" = "$PRODUCTION_HEAD"
          echo repository_write_gate=PASS
