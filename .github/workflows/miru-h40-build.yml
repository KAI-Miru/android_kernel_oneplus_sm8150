name: Miru H.40 Linux 4.14.336 authentic integration

on:
  push:
    branches:
      - miru-h40-lts336-release
    paths:
      - ".github/workflows/miru-h40-build.yml"

permissions:
  contents: write

concurrency:
  group: miru-h40-lts336-integration
  cancel-in-progress: false

env:
  RELEASE_BRANCH: miru-h40-lts336-release
  SOURCE_SHA: ${{ github.sha }}

jobs:
  authentic-integration:
    if: >-
      github.repository == 'KAI-Miru/android_kernel_oneplus_sm8150' &&
      github.ref == 'refs/heads/miru-h40-lts336-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Prime exact Android Common ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --force https://android.googlesource.com/kernel/common "+refs/heads/deprecated/android-4.14-stable:refs/remotes/android-common/deprecated/android-4.14-stable"
          test "$(git rev-parse refs/remotes/android-common/deprecated/android-4.14-stable)" = "014241ad77dda0eafbdf671d5b8e86917d8ec97e"
          git cat-file -e "4415bf5e08942aee6487946a3e0a50956ef68f1e^{commit}"

      - name: Apply audited runtime-only marker guard
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p audit
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/miru/integrate_4.14.336.sh")
          text = path.read_text()
          old = "if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- \\\n"
          new = "if git grep -n -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- \\\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one broad merge-marker guard")
          path.write_text(text.replace(old, new))
          PY
          bash -n scripts/miru/integrate_4.14.336.sh
          git diff -- scripts/miru/integrate_4.14.336.sh > audit/runtime-marker-guard.patch
          test -s audit/runtime-marker-guard.patch
          grep -Fq "^(<<<<<<< .+|=======|>>>>>>> .+)$" scripts/miru/integrate_4.14.336.sh

      - name: Prepare and validate authentic merge
        id: integrate
        shell: bash
        run: GITHUB_HEAD_REF="$RELEASE_BRANCH" bash scripts/miru/integrate_4.14.336.sh prepare

      - name: Upload integration evidence before any push
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts336-integration-${{ env.SOURCE_SHA }}
          path: |
            audit
            Documentation/miru/lts-4.14.336-conflicts.md
            Documentation/miru/lts-4.14.336-resolution-results.tsv
          if-no-files-found: warn
          compression-level: 9
          retention-days: 30

      - name: Guarded candidate-only push
        if: steps.integrate.outputs.created == 'true'
        shell: bash
        run: GITHUB_HEAD_REF="$RELEASE_BRANCH" bash scripts/miru/integrate_4.14.336.sh push
