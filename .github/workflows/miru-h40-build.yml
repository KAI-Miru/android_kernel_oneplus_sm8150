name: Miru H.40 4.14.291 RNG early-boot fix diagnostic

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: miru-h40-diag28-rng-earlyboot-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kernel-only:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Build and validate fixed Linux 4.14.291
        id: diagnostic
        shell: bash
        run: |
          bash scripts/miru/diag28_build.sh
          result="$(cat diagnostic-result/RESULT 2>/dev/null || echo FAILURE)"
          echo "result=${result}" >> "${GITHUB_OUTPUT}"

      - name: Upload compact physical-test ZIP
        if: always() && steps.diagnostic.outputs.result == 'SUCCESS'
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-4.14.291-diag28-rng-earlyboot-fix-kernel
          path: diagnostic-result/miru-h40-4.14.291-diag28-rng-earlyboot-fix-kernel.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload full kernel and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-4.14.291-diag28-rng-earlyboot-fix-full
          path: full-artifact/
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
          retention-days: 30

      - name: Enforce diagnostic result
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.diagnostic.outputs.result }}
        run: |
          test "${RESULT}" = SUCCESS
