name: Miru H.40 Linux 4.14.336 full validation

on:
  pull_request:
    branches: [miru-h40]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: miru-h40-lts336-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PRODUCTION_HEAD: a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee
  ANDROID_COMMON_TARGET: 014241ad77dda0eafbdf671d5b8e86917d8ec97e
  AUTHENTIC_MERGE: e0fc49a4660130692e6ac893f8119282b0192b85
  AUTHENTIC_PARENT_1: 94d2f7f9ac571047c961addbc73aa703b5762293
  VALIDATOR_SHA: 9db1ff57feb92e9bed955f0395d9ea298ae13906
  VALIDATOR_BLOB: 6d5e44a57b611463b7f691710ccfb84e2e88123b
  WLAN_HELPER_BLOB: f8db305e54123f3b9a768d4fc32a418785838bb6
  MAKEFILE_BUILD_BLOB: ee3b37a3bf6a586b74fe00f9e39ca5e77f08b6d3
  EXPECTED_RELEASE: 4.14.336-miru-h40-lts336-ci1+
  EXPECTED_LOCALVERSION: miru-h40-lts336-ci1
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts336-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0

      - name: Checkout reviewed production validator
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATOR_SHA }}
          path: control
          fetch-depth: 1

      - name: Verify immutable integration, semantics, and KCAL
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git -C control hash-object scripts/miru/ci_validate_4.14.305.sh)" = "${VALIDATOR_BLOB}"
          test "$(git -C source hash-object scripts/miru/prepare_wlan_response_link.py)" = "${WLAN_HELPER_BLOB}"
          test "$(git -C source hash-object scripts/Makefile.build)" = "${MAKEFILE_BUILD_BLOB}"
          test "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR == 1 {print $1}')" = "${PRODUCTION_HEAD}"

          for ancestor in "${PRODUCTION_HEAD}" "${ANDROID_COMMON_TARGET}" "${AUTHENTIC_MERGE}"; do
            git -C source merge-base --is-ancestor "${ancestor}" "${SOURCE_SHA}"
          done
          test "$(git -C source rev-list --parents -n 1 "${AUTHENTIC_MERGE}")" = \
            "${AUTHENTIC_MERGE} ${AUTHENTIC_PARENT_1} ${ANDROID_COMMON_TARGET}"
          test "$(sed -n 's/^SUBLEVEL = //p' source/Makefile | head -n 1)" = 336
          test -z "$(git -C source ls-files -u)"
          git -C source diff --check "${AUTHENTIC_MERGE}" "${SOURCE_SHA}" --

          printf '%s\n' .github/workflows/miru-h40-build.yml > expected-control-diff.txt
          git -C source diff --name-only "${AUTHENTIC_MERGE}" "${SOURCE_SHA}" -- | sort > actual-control-diff.txt
          cmp expected-control-diff.txt actual-control-diff.txt

          ledger=source/Documentation/miru/lts-4.14.336-conflicts.md
          grep -Fq -- '- Integration status: **COMPLETE — authentic candidate merge created**' "${ledger}"
          grep -Fq -- '- Authentic conflicts: **14**' "${ledger}"
          grep -Fq -- '- Semantic resolutions: **14 of 14 complete**' "${ledger}"
          grep -Fq -- '- Production promotion: **not authorized**' "${ledger}"
          test "$(wc -l < source/Documentation/miru/lts-4.14.336-resolution-results.tsv)" = 15

          (cd source && python3 scripts/miru/audit_4.14.336_semantics.py) | tee SEMANTIC-GATES.txt
          grep -Fq 'semantic_gate_count=40' SEMANTIC-GATES.txt
          test "$(grep -c '^PASS' SEMANTIC-GATES.txt)" = 40
          (cd source && perl -c scripts/checkpatch.pl) |& tee CHECKPATCH-PERL.txt

          kcal_paths=(
            drivers/gpu/drm/msm/sde/sde_kcal_ctrl.c
            drivers/gpu/drm/msm/sde/sde_kcal_ctrl.h
            drivers/gpu/drm/msm/sde/sde_color_processing.c
            drivers/gpu/drm/msm/sde/sde_crtc.c
            drivers/gpu/drm/msm/msm_drv.c
            drivers/gpu/drm/msm/Makefile
            h40-repro/config/GM1911_11_H.40.config
          )
          : > KCAL-IDENTITY.txt
          for path in "${kcal_paths[@]}"; do
            expected="$(git -C source rev-parse "${AUTHENTIC_MERGE}:${path}")"
            actual="$(git -C source rev-parse "${SOURCE_SHA}:${path}")"
            test "${actual}" = "${expected}"
            printf '%s  %s\n' "${actual}" "${path}" >> KCAL-IDENTITY.txt
          done

          {
            echo result=PASS
            echo "source_sha=${SOURCE_SHA}"
            echo "production_head=${PRODUCTION_HEAD}"
            echo "android_common_target=${ANDROID_COMMON_TARGET}"
            echo "authentic_merge=${AUTHENTIC_MERGE}"
            echo conflicts=14/14
            echo semantic_gates=40/40
            echo kcal_identity=PASS
            echo production_write=NONE
          } | tee SOURCE-EQUIVALENCE.txt

      - name: Adapt reviewed validator to exact 4.14.336
        shell: bash
        run: |
          set -Eeuo pipefail
          validator=control/scripts/miru/ci_validate_4.14.305.sh
          helper=source/scripts/miru/prepare_wlan_response_link.py

          python3 - "${validator}" "${SOURCE_SHA}" "${EXPECTED_RELEASE}" "${EXPECTED_LOCALVERSION}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source_sha, release, localversion = sys.argv[2:]
          text = path.read_text()

          replacements = [
              ("af61e9d6dfc33b7b46bfc608b20b6badf894ad23", source_sha),
              ("61371a1024e341f434deaf61b79a05f73827260a", "a97fcbe96ab6d8392a0a0acf91da46ccb37fdaee"),
              ("b92a77e96dd54fd30f8f39c7eef23e76f211c515", "e0fc49a4660130692e6ac893f8119282b0192b85"),
              ("4415bf5e08942aee6487946a3e0a50956ef68f1e", "014241ad77dda0eafbdf671d5b8e86917d8ec97e"),
              (r"4\\.14\\.305", r"4\\.14\\.336"),
              ("4.14.305", "4.14.336"),
              ("lts305", "lts336"),
              ("4.14.336-miru-h40-lts336-af61e9d-ci1+", release),
              ("miru-h40-lts336-af61e9d-ci1", localversion),
              ("= 305", "= 336"),
              ('= "305"', '= "336"'),
              ("- Initial authentic conflicts: **33**", "- Authentic conflicts: **14**"),
              ("- Index-resolved conflicts: **33**", "- Integration status: **COMPLETE — authentic candidate merge created**"),
              ("- Semantically resolved conflicts: **33**", "- Semantic resolutions: **14 of 14 complete**"),
              ("- Remaining semantic conflicts: **0**", "- Production promotion: **not authorized**"),
              ("conflicts=33/33", "conflicts=14/14"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing validator anchor: {old!r}")
              text = text.replace(old, new)

          if "305" in text or "lts305" in text:
              stale = [f"{i}: {line}" for i, line in enumerate(text.splitlines(), 1)
                       if "305" in line or "lts305" in line]
              raise SystemExit("stale 305 validator tokens:\n" + "\n".join(stale))

          exit_trap = "trap 'status=$?; echo \"exit_code=${status}\" > \"${REPORT_ROOT}/validation-exit-code.txt\"; exit \"${status}\"' EXIT\n"
          err_trap = "trap 'rc=$?; printf \"failed_line=%s\\nfailed_command=%s\\nfailed_rc=%s\\n\" \"$LINENO\" \"$BASH_COMMAND\" \"$rc\" | tee \"${REPORT_ROOT}/validation-error.txt\" >&2' ERR\n"
          if text.count(exit_trap) != 1:
              raise SystemExit("validator EXIT trap mismatch")
          text = text.replace(exit_trap, exit_trap + err_trap, 1)

          build_call = "bash scripts/miru/ci_build_4.14.190.sh"
          if text.count(build_call) != 1:
              raise SystemExit("kernel build invocation missing or duplicated")
          text = text.replace(build_call, "bash -x scripts/miru/ci_build_4.14.190.sh", 1)
          path.write_text(text)
          PY

          python3 - "${helper}" "${MAKEFILE_BUILD_BLOB}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          new_blob = sys.argv[2]
          text = path.read_text()
          old_blob = "74ce588c69513197a354ef0032c2145e91ee0641"
          if text.count(old_blob) != 1 or new_blob in text:
              raise SystemExit("WLAN helper identity mismatch")
          path.write_text(text.replace(old_blob, new_blob, 1))
          PY

          bash -n "${validator}"
          python3 -m py_compile "${helper}"
          grep -Fq "SOURCE_SHA=${SOURCE_SHA}" "${validator}"
          grep -Fq "EXPECTED_RELEASE=${EXPECTED_RELEASE}" "${validator}"
          grep -Fq "KERNEL_LOCALVERSION=-${EXPECTED_LOCALVERSION}" "${validator}"
          grep -Fq "grep -m1 '^Linux version 4\\\\.14\\\\.336-'" "${validator}"
          grep -Fq "grep -Fq '= \"336\"' scripts/miru/ci_build_4.14.190.sh" "${validator}"
          grep -Fq 'bash -x scripts/miru/ci_build_4.14.190.sh' "${validator}"

          {
            echo result=PASS
            echo "validator_origin_sha=${VALIDATOR_SHA}"
            echo "validator_origin_blob=${VALIDATOR_BLOB}"
            echo "expected_release=${EXPECTED_RELEASE}"
            echo "expected_localversion=${EXPECTED_LOCALVERSION}"
            echo escaped_banner_sublevel=336
            echo stale_305_tokens=0
          } | tee VALIDATOR-ADAPTATION.txt

      - name: Build kernel, five DTBs, in-tree modules, and external modules
        id: build
        shell: bash
        run: |
          set +e
          bash control/scripts/miru/ci_validate_4.14.305.sh \
            "${GITHUB_WORKSPACE}/source" "${GITHUB_WORKSPACE}/control"
          status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [ "${status}" = 0 ]; then
            echo result=success >> "${GITHUB_OUTPUT}"
          else
            echo result=failure >> "${GITHUB_OUTPUT}"
          fi
          exit 0

      - name: Enforce release, DTB order, modules, vermagic, MODVERSIONS, and ABI
        id: post
        if: always() && steps.build.outputs.result == 'success'
        shell: bash
        run: |
          set +e
          (
            set -Eeuo pipefail
            out="${RUNNER_TEMP}/android-root/out/h40-kernel"
            artifacts="${RUNNER_TEMP}/android-root/out/h40-artifacts"
            external="${RUNNER_TEMP}/miru-external-modules/dropin"
            report="${GITHUB_WORKSPACE}/post-validation"
            mkdir -p "${report}"
            exec > >(tee "${report}/console.log") 2>&1

            test "$(tr -d '\n' < "${out}/include/config/kernel.release")" = "${EXPECTED_RELEASE}"
            strings "${out}/arch/arm64/boot/Image" | grep -m 1 -F "Linux version ${EXPECTED_RELEASE}" > "${report}/KERNEL-BANNER.txt"
            grep -Fq 'CONFIG_MODVERSIONS=y' "${out}/.config"
            grep -Fq '# CONFIG_MODULE_SIG_FORCE is not set' "${out}/.config"

            for rel in arch/arm64/boot/Image arch/arm64/boot/Image.gz \
              arch/arm64/boot/Image.gz-dtb vmlinux System.map Module.symvers .config; do
              test -s "${out}/${rel}"
            done

            mapfile -t in_tree < <(find "${out}" -type f -name '*.ko' | sort)
            mapfile -t extmods < <(find "${external}" -maxdepth 1 -type f -name '*.ko' | sort)
            test "${#in_tree[@]}" = 13
            test "${#extmods[@]}" = 32

            vermagic="${EXPECTED_RELEASE} SMP preempt mod_unload modversions aarch64"
            : > "${report}/IN-TREE-VERMAGIC.txt"
            for module in "${in_tree[@]}"; do
              actual="$(modinfo -F vermagic "${module}")"
              test "${actual}" = "${vermagic}"
              echo "${module#${out}/}: ${actual}" >> "${report}/IN-TREE-VERMAGIC.txt"
            done
            test "$(grep -F ": ${vermagic}" source/external-module-diagnostics/vermagic.txt | wc -l)" = 32
            grep -Fq 'modules=32' source/external-module-diagnostics/MODULE-ABI-REPORT.txt
            grep -Fq 'errors=0' source/external-module-diagnostics/MODULE-ABI-REPORT.txt

            python3 - "${out}/Module.symvers" "${report}/IN-TREE-MODVERSIONS.txt" "${in_tree[@]}" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          exports = {}
          for line in Path(sys.argv[1]).read_text().splitlines():
              fields = line.split()
              if len(fields) >= 2:
                  exports[fields[1]] = int(fields[0], 16)

          modules = [Path(p) for p in sys.argv[3:]]
          errors = []
          details = []
          for module in modules:
              imports = 0
              output = subprocess.check_output(
                  ["modprobe", "--dump-modversions", str(module)], text=True
              )
              for line in output.splitlines():
                  fields = line.split()
                  if len(fields) != 2:
                      continue
                  imports += 1
                  actual = int(fields[0], 16)
                  expected = exports.get(fields[1])
                  if expected is None:
                      errors.append(f"{module}: missing export {fields[1]}")
                  elif expected != actual:
                      errors.append(f"{module}: CRC mismatch {fields[1]}")
              details.append(f"{module}: imports={imports}")

          report = [f"modules={len(modules)}", f"errors={len(errors)}", "", *details]
          if errors:
              report.extend(["", "ERRORS", *errors])
          Path(sys.argv[2]).write_text("\n".join(report) + "\n")
          if errors:
              raise SystemExit("\n".join(errors))
          PY
            grep -Fq 'modules=13' "${report}/IN-TREE-MODVERSIONS.txt"
            grep -Fq 'errors=0' "${report}/IN-TREE-MODVERSIONS.txt"

            dtb_root="${out}/arch/arm64/boot/dts"
            projects=(18821 19801 19863 18865 18857)
            test "$(find "${dtb_root}" -type f -name '*.dtb' | wc -l)" = 5
            dtbs=()
            for project in "${projects[@]}"; do
              dtb="${dtb_root}/${project}/sm8150-v2-mtp.dtb"
              test -s "${dtb}"
              dtbs+=("${dtb}")
            done
            test "$(find "${dtb_root}" -type f -name '*.dtbo' | wc -l)" = 0

            cat "${out}/arch/arm64/boot/Image.gz" "${dtbs[@]}" > "${report}/expected-Image.gz-dtb"
            cmp "${report}/expected-Image.gz-dtb" "${out}/arch/arm64/boot/Image.gz-dtb"
            rm "${report}/expected-Image.gz-dtb"

            {
              echo 'order=18821 19801 19863 18865 18857'
              for dtb in "${dtbs[@]}"; do
                stat -c 'size=%s path=%n' "${dtb}"
                sha256sum "${dtb}"
              done
            } > "${report}/DTB-REPORT.txt"

            {
              echo result=PASS
              echo "source_sha=${SOURCE_SHA}"
              echo "production_head=${PRODUCTION_HEAD}"
              echo "android_common_target=${ANDROID_COMMON_TARGET}"
              echo "authentic_merge=${AUTHENTIC_MERGE}"
              echo "kernel_release=${EXPECTED_RELEASE}"
              echo "vermagic=${vermagic}"
              echo 'dtb_order=18821 19801 19863 18865 18857'
              echo dtb_count=5
              echo dtbo_count=0
              echo in_tree_module_count=13
              echo external_module_count=32
              echo external_module_abi_errors=0
              echo in_tree_modversion_errors=0
              echo production_write=NONE
            } | tee "${report}/VALIDATION-SUMMARY.txt"

            find "${artifacts}" -type f -print0 | sort -z | xargs -0 sha256sum > "${report}/KERNEL-FILES-SHA256.txt"
            find "${external}" -type f -print0 | sort -z | xargs -0 sha256sum > "${report}/EXTERNAL-MODULE-FILES-SHA256.txt"
            echo result=PASS > "${report}/RESULT.txt"
          )
          status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [ "${status}" = 0 ]; then
            echo result=success >> "${GITHUB_OUTPUT}"
          else
            echo result=failure >> "${GITHUB_OUTPUT}"
          fi
          exit 0

      - name: Assemble diagnostic and release-candidate packages
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outputs.result }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          POST_RESULT: ${{ steps.post.outputs.result }}
          POST_EXIT: ${{ steps.post.outputs.exit_code }}
        run: |
          set -Eeuo pipefail
          out="${RUNNER_TEMP}/android-root/out/h40-kernel"
          artifacts="${RUNNER_TEMP}/android-root/out/h40-artifacts"
          external="${RUNNER_TEMP}/miru-external-modules/dropin"
          root="${GITHUB_WORKSPACE}/packages"
          full="${root}/full-validation"
          release="${root}/release-candidate"
          mkdir -p "${full}" "${release}"

          cp -a SOURCE-EQUIVALENCE.txt VALIDATOR-ADAPTATION.txt \
            SEMANTIC-GATES.txt CHECKPATCH-PERL.txt KCAL-IDENTITY.txt \
            expected-control-diff.txt actual-control-diff.txt "${full}/" 2>/dev/null || true
          cp -a control/build-validation-result "${full}/validator" 2>/dev/null || true
          cp -a source/build-diagnostics "${full}/kernel-logs" 2>/dev/null || true
          cp -a source/external-module-diagnostics "${full}/module-logs" 2>/dev/null || true
          cp -a post-validation "${full}/" 2>/dev/null || true
          cp -a "${artifacts}" "${full}/kernel-output" 2>/dev/null || true
          cp -a "${external}" "${full}/external-modules" 2>/dev/null || true

          {
            echo "build_result=${BUILD_RESULT:-missing}"
            echo "build_exit=${BUILD_EXIT:-missing}"
            echo "post_result=${POST_RESULT:-missing}"
            echo "post_exit=${POST_EXIT:-missing}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "source_sha=${SOURCE_SHA}"
          } > "${full}/RUN-STATUS.txt"

          if [ "${BUILD_RESULT:-}" = success ] && [ "${POST_RESULT:-}" = success ]; then
            mkdir -p "${release}/in-tree-modules" "${release}/external-modules"
            cp "${out}/arch/arm64/boot/Image.gz-dtb" "${release}/"
            cp "${RUNNER_TEMP}/android-root/out/miru-v3-modules-dropin-4.14.336.7z" \
              "${release}/external-modules/"
            cp "${RUNNER_TEMP}/android-root/out/miru-v3-modules-dropin-4.14.336-audit.zip" \
              "${release}/external-modules/"
            while IFS= read -r -d '' module; do
              rel="${module#${out}/}"
              mkdir -p "${release}/in-tree-modules/$(dirname "${rel}")"
              cp "${module}" "${release}/in-tree-modules/${rel}"
            done < <(find "${out}" -type f -name '*.ko' -print0)

            cp SOURCE-EQUIVALENCE.txt VALIDATOR-ADAPTATION.txt KCAL-IDENTITY.txt "${release}/"
            cp post-validation/*.txt "${release}/"
            cat > "${release}/README.txt" <<EOF
          Miru H.40 Linux 4.14.336 release candidate
          ===========================================

          Kernel release: ${EXPECTED_RELEASE}
          Source: ${SOURCE_SHA}

          This candidate passed source, semantic, KCAL, kernel, DTB, in-tree
          module, external-module, vermagic, MODVERSIONS, ABI, and checksum
          gates. It still requires physical OnePlus 7 Pro validation before
          production promotion.
          EOF
            (cd "${release}" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
            command -v zip >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends zip
            (cd "${root}" && zip -q -9 -r miru-h40-4.14.336-lts336-ci1-release-candidate.zip release-candidate)
          fi

      - name: Upload release candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-4.14.336-lts336-ci1-release-candidate
          path: packages/miru-h40-4.14.336-lts336-ci1-release-candidate.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Upload full validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-4.14.336-lts336-ci1-full-validation
          path: packages/full-validation
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Enforce complete validation
        if: always()
        shell: bash
        run: |
          test "${{ steps.build.outputs.result }}" = success
          test "${{ steps.post.outputs.result }}" = success
