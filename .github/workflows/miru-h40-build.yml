name: Miru H.40 Linux 4.14.287 midpoint source materialization

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: miru-h40-lts287-source-diag26-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PRODUCTION_SHA: 61371a1024e341f434deaf61b79a05f73827260a
  SCAFFOLD_283_SHA: b581c659db87713eb2df1c29e4f28e337e5e908c
  SOURCE_291_SHA: a79859d15ae0025897791a77654bcebeedc708ab
  STABLE_287_SHA: 1048779a1d7dcf0b5c150188decafa21c19821e4
  STABLE_291_SHA: e548869f356fead9fdcb3562f52d2226574f4f41
  FDT_292_SHA: 3c2ae48eceaa40f1ecb18ba31dda3f6fe755796c
  TARGET_BRANCH: miru-h40-lts287-source-diag26

jobs:
  materialize-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact preparation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Materialize audited 4.14.287 midpoint source
        shell: bash
        run: bash scripts/miru/materialize_4.14.287_diag26.sh

      - name: Upload source materialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts287-source-diag26-evidence
          path: source-287-evidence/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
