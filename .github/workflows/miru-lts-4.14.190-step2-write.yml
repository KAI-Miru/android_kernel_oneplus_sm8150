name: Miru LTS 4.14.190 Step 2 write

on:
  pull_request:
    branches:
      - h40-miru-module-compat-test
    types:
      - synchronize

permissions:
  contents: write

jobs:
  resolve-step-2:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'h40-miru-lts-4.14.190'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: h40-miru-lts-4.14.190
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Miru LTS Integration"
          git config user.email "110590275+Benetsu@users.noreply.github.com"

      - name: Check one-shot guard
        id: guard
        run: |
          if git log --all --grep='^lts: resolve module matching and input ABI conflicts$' --format='%H' | grep -q .; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch resolved SM8150 reference
        if: steps.guard.outputs.run == 'true'
        run: git fetch --no-tags https://github.com/LineageOS/android_kernel_oneplus_sm8150.git 0190a01fb1cde1c2ba48e7836084bad818c14d94

      - name: Apply guarded Step 2 resolution
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 scripts/miru/resolve_step2.py
          git rm scripts/miru/resolve_step2.py .github/workflows/miru-lts-4.14.190-step2-write.yml
          git add include/linux/mod_devicetable.h include/uapi/linux/input-event-codes.h Documentation/miru/lts-4.14.190-conflicts.md
          printf '%s\n' '.github/workflows/miru-lts-4.14.190-step2-write.yml' 'Documentation/miru/lts-4.14.190-conflicts.md' 'include/linux/mod_devicetable.h' 'include/uapi/linux/input-event-codes.h' 'scripts/miru/resolve_step2.py' | sort > "$RUNNER_TEMP/expected.txt"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git diff --cached --check
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- include/linux/mod_devicetable.h include/uapi/linux/input-event-codes.h Documentation/miru/lts-4.14.190-conflicts.md
          git commit -m "lts: resolve module matching and input ABI conflicts" -m "Use the LineageOS SM8150 Android 4.14.190 resolution for mod_devicetable and input-event-codes. Preserve Qualcomm GPR, SoundWire, Slimbus and MHI module IDs, all H.40 fingerprint gesture and headset switch values, and SW_MAX=0x20; add stable x86 stepping support and SW_MACHINE_COVER at the free value 0x14. Update the ledger to 8 of 28 conflicts resolved and remove the temporary resolver files."
          git push origin HEAD:h40-miru-lts-4.14.190

      - name: Report branch tip
        if: always()
        run: |
          git log -1 --decorate --oneline
          git show --stat --oneline --summary HEAD
