name: Miru H.40 LTS 4.14.210 kernel and external modules

on:
  push:
    branches:
      - miru-h40-lts210-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity-build-and-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout 4.14.210 integration revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare 4.14.210 kernel build driver
        run: |
          python3 scripts/miru/prepare_vendor_v6_linewise.py
          python3 scripts/miru/inject_vendor_compat_v3_into_ci_build.py
          sed -i 's/apply_vendor_lts190_compat_v3.py/apply_vendor_lts190_compat_v6.py/' \
            scripts/miru/ci_build_4.14.190.sh
          python3 scripts/miru/insert_vendor_format_fixer.py
          grep -Fq 'apply_vendor_lts190_compat_v6.py' scripts/miru/ci_build_4.14.190.sh
          grep -Fq 'fix_vendor_lts190_format_quotes.py' scripts/miru/ci_build_4.14.190.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/miru/ci_build_4.14.190.sh')
          text = path.read_text()

          replacements = {
              'BASE_SHA=59858c8f798778f4e6c1c4449baba631e353600e':
                  'BASE_SHA=40a2cb6fcf0411c100a7aaa609e128705a0bc2d8',
              'STABLE_SHA=d2d05bcf4b4edf8d028fa420dee3c6644aa5b4ac':
                  'STABLE_SHA=39a7f9a39c0bd6d0f67869df227f6fa23286edd2',
              'echo "== Miru H.40 Android 4.14.190 CI build =="':
                  'echo "== Miru H.40 Android 4.14.210 CI build =="',
              "':!Documentation/miru/lts-4.14.190-conflicts.md'":
                  "':!Documentation/miru/lts-4.14.210-conflicts.md'",
              'test "$(sed -n \'s/^SUBLEVEL = //p\' Makefile | head -n1)" = "190"':
                  'test "$(sed -n \'s/^SUBLEVEL = //p\' Makefile | head -n1)" = "210"',
              "grep -Fq -- '- Resolved conflicts: 28' Documentation/miru/lts-4.14.190-conflicts.md":
                  "grep -Fq -- '- Resolved conflicts: **19**' Documentation/miru/lts-4.14.210-conflicts.md",
              "grep -Fq -- '- Remaining conflicts: 0' Documentation/miru/lts-4.14.190-conflicts.md":
                  "grep -Fq -- '- Remaining conflicts: **0" + " — semantic resolution complete**' Documentation/miru/lts-4.14.210-conflicts.md",
              'echo "kernel_version=4.14.190"':
                  'echo "kernel_version=4.14.210"',
              'echo "conflicts=28/28 resolved"':
                  'echo "conflicts=19/19 resolved"',
              'export KERNEL_LOCALVERSION=-miru-h40-lts190-ci1':
                  'export KERNEL_LOCALVERSION=-miru-h40-lts210-ci1',
              "grep -Fq 'CONFIG_LOCALVERSION=\"-miru-h40-lts190-ci1\"' \"${OUT_DIR}/.config\"":
                  "grep -Fq 'CONFIG_LOCALVERSION=\"-miru-h40-lts210-ci1\"' \"${OUT_DIR}/.config\"",
              "grep -m1 '^Linux version 4\\.14\\.190-'":
                  "grep -m1 '^Linux version 4\\.14\\.210-'",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected 4.14.190 build-driver text: {old}')
              text = text.replace(old, new, 1)

          fetch_scaffold = 'git fetch --no-tags --depth=1 origin "${SCAFFOLD_SHA}"\n'
          if fetch_scaffold not in text:
              raise SystemExit('missing scaffold fetch')
          text = text.replace(fetch_scaffold, '', 1)

          old_scaffold_check = '''git cat-file -p "${SCAFFOLD_SHA}" > "${DIAG_DIR}/merge-scaffold.txt"
          test "$(grep -c '^parent ' "${DIAG_DIR}/merge-scaffold.txt")" = "2"
          grep -Fq "parent ${STABLE_SHA}" "${DIAG_DIR}/merge-scaffold.txt"'''
          new_scaffold_check = '''git merge-base --is-ancestor "${BASE_SHA}" HEAD
          git merge-base --is-ancestor "${STABLE_SHA}" HEAD
          {
            echo "integration_base=${BASE_SHA}"
            echo "stable_parent=${STABLE_SHA}"
            git log -1 --format='head=%H%nparents=%P%nsubject=%s' HEAD
          } > "${DIAG_DIR}/merge-scaffold.txt"'''
          if old_scaffold_check not in text:
              raise SystemExit('missing old scaffold validation block')
          text = text.replace(old_scaffold_check, new_scaffold_check, 1)

          path.write_text(text)
          PY

          grep -Fq 'kernel_version=4.14.210' scripts/miru/ci_build_4.14.190.sh
          grep -Fq 'KERNEL_LOCALVERSION=-miru-h40-lts210-ci1' scripts/miru/ci_build_4.14.190.sh

      - name: Run sanity scan and clean 4.14.210 kernel build
        run: bash scripts/miru/ci_build_4.14.190.sh

      - name: Rebuild and package 4.14.210 external modules
        run: |
          python3 scripts/miru/prepare_external_modules_toolchain.py
          python3 scripts/miru/prepare_external_pinctrl_headers.py
          python3 scripts/miru/prepare_wlan_response_link.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/miru/build_external_modules_4.14.190.sh')
          text = path.read_text()
          old_release = '4.14.190-miru-h40-lts190-ci1+'
          new_release = '4.14.210-miru-h40-lts210-ci1+'
          if old_release not in text:
              raise SystemExit('missing expected 4.14.190 external-module release gate')
          text = text.replace(old_release, new_release)
          text = text.replace('4.14.190', '4.14.210')
          text = text.replace('lts190', 'lts210')
          path.write_text(text)
          PY
          bash scripts/miru/build_external_modules_4.14.190.sh

      - name: Upload 4.14.210 external module drop-in packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-v3-modules-dropin-4.14.210
          path: |
            ${{ runner.temp }}/android-root/out/miru-v3-modules-dropin-4.14.210.7z
            ${{ runner.temp }}/android-root/out/miru-v3-modules-dropin-4.14.210-audit.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Upload 4.14.210 external module diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-v3-modules-dropin-4.14.210-diagnostics
          path: external-module-diagnostics
          if-no-files-found: warn
          retention-days: 30

      - name: Upload 4.14.210 kernel build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts-4.14.210-ci1-build
          path: ${{ runner.temp }}/android-root/out/h40-artifacts
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Upload 4.14.210 kernel build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-lts-4.14.210-ci1-diagnostics
          path: build-diagnostics
          if-no-files-found: error
          retention-days: 30
