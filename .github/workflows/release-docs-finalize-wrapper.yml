name: Guarded Miru H.40 4.14.305 documentation finalizer wrapper

on:
  push:
    branches:
      - miru-h40-lts305-release
    paths:
      - .github/workflows/release-docs-finalize-wrapper.yml

permissions:
  contents: write

concurrency:
  group: miru-h40-lts305-release-docs-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.head_commit.message == 'ci: trigger one-time 4.14.305 documentation finalizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v4
        with:
          ref: miru-h40-lts305-release
          fetch-depth: 0
          persist-credentials: true

      - name: Extract, correct, and execute pinned finalizer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release-docs-finalize-once.yml')
          lines = path.read_text().splitlines()
          marker = '        run: |'
          if lines.count(marker) != 1:
              raise SystemExit(f'expected one finalizer run block, found {lines.count(marker)}')
          start = lines.index(marker) + 1
          body = []
          for line in lines[start:]:
              if line and not line.startswith('          '):
                  raise SystemExit(f'unexpected line outside finalizer run block: {line!r}')
              body.append(line[10:] if line.startswith('          ') else '')
          script = '\n'.join(body) + '\n'

          old = 'git rm .github/workflows/release-docs-finalize-once.yml'
          new = ('git rm .github/workflows/release-docs-finalize-once.yml '
                 '.github/workflows/release-docs-finalize-wrapper.yml')
          if script.count(old) != 1:
              raise SystemExit('finalizer self-removal command missing or duplicated')
          script = script.replace(old, new, 1)

          old = '''          .github/workflows/release-docs-finalize-once.yml
          Documentation/miru-lts-integration.md'''
          new = '''          .github/workflows/release-docs-finalize-once.yml
          .github/workflows/release-docs-finalize-wrapper.yml
          Documentation/miru-lts-integration.md'''
          if script.count(old) != 1:
              raise SystemExit('expected-path block missing or duplicated')
          script = script.replace(old, new, 1)

          old = 'actual_paths="$(git diff --name-only | sort)"'
          new = '''git add -N \
            Documentation/miru/lts-4.14.305-boot-regression.md \
            Documentation/miru/lts-4.14.305-changelog.md \
            Documentation/miru/lts-4.14.305-validation.md
          actual_paths="$(git diff --name-only | sort)"'''
          if script.count(old) != 1:
              raise SystemExit('actual-path check missing or duplicated')
          script = script.replace(old, new, 1)

          Path('/tmp/miru-lts305-finalize-docs.sh').write_text(script)
          PY
          bash -n /tmp/miru-lts305-finalize-docs.sh
          bash /tmp/miru-lts305-finalize-docs.sh
