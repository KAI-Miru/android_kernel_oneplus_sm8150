name: Miru H.40 OpenELA stage 1 merge to 4.14.340

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/miru-lts357-stage340.yml'
      - 'scripts/miru/lts357/resolve_stage_340.py'

permissions:
  contents: write

concurrency:
  group: miru-h40-lts357-real-integration
  cancel-in-progress: false

env:
  INTEGRATION_BRANCH: miru-h40-lts357-integration
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  IMMUTABLE_PRODUCTION: eb9451c0a1639e1aa49ee094681f98df0545f797
  OPENELA_PREVIOUS: c31e35278ea8f04f1dceadd77dca4dd7d47932a3
  OPENELA_TARGET: 9b7ef2749ffa187d86acd0033327338c0fc299bf
  OPENELA_FINAL: 1e6347375d088ecc896aabb067131d0f9e3c0575
  MODULES_SHA: 3216c08bb3f97f865eb055296ea8034e1744caef
  MODULES_BRANCH: oneplus/sm8150_s_12.1_op7pro

jobs:
  merge-stage-340:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'miru-h40-lts357-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact integration branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATION_BRANCH }}
          fetch-depth: 0
          filter: blob:none

      - name: Verify immutable boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_HEAD_REF}" = "${INTEGRATION_BRANCH}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          remote_head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${INTEGRATION_BRANCH}" | awk 'NR==1{print $1}')"
          test "${remote_head}" = "${SOURCE_SHA}"
          production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR==1{print $1}')"
          test "${production}" = "${IMMUTABLE_PRODUCTION}"
          modules="$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git "refs/heads/${MODULES_BRANCH}" | awk 'NR==1{print $1}')"
          test "${modules}" = "${MODULES_SHA}"
          git merge-base --is-ancestor "${IMMUTABLE_PRODUCTION}" HEAD
          if git merge-base --is-ancestor "${OPENELA_TARGET}" HEAD; then
            echo already_integrated=true >> "${GITHUB_ENV}"
          else
            echo already_integrated=false >> "${GITHUB_ENV}"
          fi
          if git merge-base --is-ancestor "${OPENELA_FINAL}" HEAD; then
            echo 'OpenELA final target unexpectedly present before stage 1' >&2
            exit 1
          fi

      - name: Fetch exact OpenELA parents
        if: env.already_integrated == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote add openela https://github.com/openela/kernel-lts.git
          git fetch --no-tags openela "${OPENELA_PREVIOUS}" "${OPENELA_TARGET}" "${OPENELA_FINAL}"
          git merge-base --is-ancestor "${OPENELA_PREVIOUS}" "${OPENELA_TARGET}"
          git merge-base --is-ancestor "${OPENELA_TARGET}" "${OPENELA_FINAL}"
          test "$(git show "${OPENELA_TARGET}":Makefile | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 340

      - name: Merge and resolve OpenELA 4.14.336 to 4.14.340
        if: env.already_integrated == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Miru H.40 Integration Bot'
          git config user.email '110590275+KAI-Miru@users.noreply.github.com'
          first_parent="$(git rev-parse HEAD)"
          mkdir -p integration-evidence/stage-340
          set +e
          git merge --no-ff --no-commit "${OPENELA_TARGET}" \
            > integration-evidence/stage-340/merge.stdout \
            2> integration-evidence/stage-340/merge.stderr
          merge_rc=$?
          set -e
          git diff --name-only --diff-filter=U | sort \
            | tee integration-evidence/stage-340/initial-conflicts.txt
          test "${merge_rc}" -ne 0
          test "$(wc -l < integration-evidence/stage-340/initial-conflicts.txt)" = 6

          python3 scripts/miru/lts357/resolve_stage_340.py
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          test -z "$(git ls-files -u)"
          git diff --cached --check
          test "$(sed -n 's/^SUBLEVEL = //p' Makefile | head -n1)" = 340
          test -z "$(find . -path ./.git -prune -o -type f \( -name '*.orig' -o -name '*.rej' \) -print)"
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- . \
              ':!Documentation/miru/lts-4.14.357-conflicts.md' \
              > integration-evidence/stage-340/conflict-markers.txt; then
            cat integration-evidence/stage-340/conflict-markers.txt
            exit 1
          fi

          git commit -m 'Merge OpenELA Linux 4.14.340 into Miru H.40' \
            -m 'Integrate the cumulative OpenELA 4.14.336..4.14.340 range.' \
            -m 'Resolve six conflicts semantically while preserving Android, Qualcomm and OPlus downstream behavior. See Documentation/miru/lts-4.14.357-conflicts.md.'
          merge_commit="$(git rev-parse HEAD)"
          parents="$(git rev-list --parents -n1 HEAD)"
          test "${parents}" = "${merge_commit} ${first_parent} ${OPENELA_TARGET}"
          git merge-base --is-ancestor "${IMMUTABLE_PRODUCTION}" HEAD
          git merge-base --is-ancestor "${OPENELA_TARGET}" HEAD
          if git merge-base --is-ancestor "${OPENELA_FINAL}" HEAD; then
            echo 'OpenELA history advanced beyond the bounded stage' >&2
            exit 1
          fi
          {
            echo "stage=4.14.336..4.14.340"
            echo "merge_commit=${merge_commit}"
            echo "first_parent=${first_parent}"
            echo "second_parent=${OPENELA_TARGET}"
            echo "initial_conflicts=6"
            echo "remaining_conflicts=0"
            echo "production_write=NONE"
          } | tee integration-evidence/stage-340/RESULT.txt

      - name: Recheck production and push integration fast-forward
        if: env.already_integrated == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          production="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR==1{print $1}')"
          test "${production}" = "${IMMUTABLE_PRODUCTION}"
          remote_head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${INTEGRATION_BRANCH}" | awk 'NR==1{print $1}')"
          test "${remote_head}" = "${SOURCE_SHA}"
          git push origin "HEAD:refs/heads/${INTEGRATION_BRANCH}"
          test "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${IMMUTABLE_PRODUCTION}"

      - name: Upload stage 1 integration evidence
        if: always() && env.already_integrated == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-openela-stage340-${{ env.SOURCE_SHA }}
          path: integration-evidence/stage-340
          if-no-files-found: error
          retention-days: 30
