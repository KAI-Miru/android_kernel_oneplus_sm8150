name: Miru H.40 OpenELA stage 356 conflict audit

on:
  pull_request:
    branches: [miru-h40]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/miru-lts357-stage356-audit.yml'

permissions:
  contents: read

concurrency:
  group: miru-h40-lts357-stage356-conflict-audit
  cancel-in-progress: false

env:
  IMMUTABLE_PRODUCTION: eb9451c0a1639e1aa49ee094681f98df0545f797
  PRE_AUDIT_HEAD: 7d98c8086f538afad59dd3fdce9f99144018f8a5
  STAGE352_MERGE: f5ebecc06992d60f50c21ebf9e9dc0538fa7b1c3
  OPENELA_BASE: c31e35278ea8f04f1dceadd77dca4dd7d47932a3
  OPENELA_352: 6da009d8de389742d55219ebed50378f53937a5b
  OPENELA_356: a76b6a6556353484f6f29572989cd37b6cff90cc
  MODULES_BRANCH: oneplus/sm8150_s_12.1_op7pro
  MODULES_SHA: 3216c08bb3f97f865eb055296ea8034e1744caef
  FORBIDDEN_MODULES_SHA: 125ff7d0153cbb3aaa8f9fd618c33b7f728d7798
  DWC3_REPAIR: a3192f52549713424a5d8352e4be381ca84434a0

jobs:
  audit-stage-356:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'miru-h40-lts357-integration' &&
      github.base_ref == 'miru-h40' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify immutable boundaries and exact audit commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "${PRE_AUDIT_HEAD}"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/miru-lts357-stage356-audit.yml'
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40-lts357-integration | awk 'NR==1{print $1}')" = "$(git rev-parse HEAD)"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/miru-h40 | awk 'NR==1{print $1}')" = "${IMMUTABLE_PRODUCTION}"
          live_modules="$(git ls-remote https://github.com/KAI-Miru/android_kernel_modules_and_devicetree_oneplus_sm8150.git refs/heads/${MODULES_BRANCH} | awk 'NR==1{print $1}')"
          test "${live_modules}" = "${MODULES_SHA}"
          test "${live_modules}" != "${FORBIDDEN_MODULES_SHA}"
          test "$(git rev-parse "${STAGE352_MERGE}^{commit}")" = "${STAGE352_MERGE}"
          parents="$(git rev-list --parents -n1 "${STAGE352_MERGE}")"
          test "$(printf '%s\n' "${parents}" | awk '{print NF-1}')" = 2
          test "$(printf '%s\n' "${parents}" | awk '{print $3}')" = "${OPENELA_352}"
          git merge-base --is-ancestor "${DWC3_REPAIR}" HEAD

      - name: Perform read-only exact stage 356 merge audit
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="${RUNNER_TEMP}/stage-356-audit"
          mkdir -p "${evidence}/conflicts"
          git config user.name 'Miru H.40 Stage 356 Audit'
          git config user.email '110590275+KAI-Miru@users.noreply.github.com'
          git remote add openela https://github.com/openela/kernel-lts.git
          git fetch --no-tags openela "${OPENELA_BASE}" "${OPENELA_352}" "${OPENELA_356}"
          test "$(git rev-parse "${OPENELA_356}^{commit}")" = "${OPENELA_356}"
          git merge-base --is-ancestor "${OPENELA_BASE}" "${OPENELA_352}"
          git merge-base --is-ancestor "${OPENELA_352}" "${OPENELA_356}"
          ! git merge-base --is-ancestor "${OPENELA_356}" HEAD
          test "$(git show ${OPENELA_356}:Makefile | sed -n 's/^SUBLEVEL = //p' | head -n1)" = 356
          test "$(git show ${OPENELA_356}:.elts/config.yaml | sed -n 's/^version: //p')" = 4.14.356
          test "$(git show ${OPENELA_356}:.elts/config.yaml | sed -n 's/^base: //p')" = 4.14.336

          printf '%s\n' \
            arch/arm64/include/asm/cputype.h \
            drivers/mmc/core/mmc_test.c \
            drivers/net/usb/usbnet.c \
            drivers/usb/dwc3/core.c \
            fs/f2fs/inode.c \
            fs/f2fs/namei.c \
            include/linux/clk.h \
            net/qrtr/qrtr.c \
            security/selinux/selinuxfs.c \
            > "${evidence}/expected-conflicts.txt"

          set +e
          git merge --no-ff --no-commit "${OPENELA_356}" > "${evidence}/merge.stdout" 2> "${evidence}/merge.stderr"
          merge_rc=$?
          set -e
          git diff --name-only --diff-filter=U | sort > "${evidence}/initial-conflicts.txt"
          inventory_match=YES
          diff -u "${evidence}/expected-conflicts.txt" "${evidence}/initial-conflicts.txt" > "${evidence}/conflict-inventory.diff" || inventory_match=NO

          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            safe="$(printf '%s' "${path}" | sha256sum | cut -c1-16)"
            dir="${evidence}/conflicts/${safe}"
            mkdir -p "${dir}"
            printf '%s\n' "${path}" > "${dir}/path.txt"
            git show ":1:${path}" > "${dir}/01-merge-base" 2>/dev/null || true
            git show ":2:${path}" > "${dir}/02-miru" 2>/dev/null || true
            git show ":3:${path}" > "${dir}/03-openela" 2>/dev/null || true
            git diff --no-index -- "${dir}/01-merge-base" "${dir}/02-miru" > "${dir}/miru-delta.diff" || true
            git diff --no-index -- "${dir}/01-merge-base" "${dir}/03-openela" > "${dir}/openela-intent.diff" || true
            git diff --no-index -- "${dir}/02-miru" "${dir}/03-openela" > "${dir}/miru-vs-openela.diff" || true
          done < "${evidence}/initial-conflicts.txt"

          git diff --cc > "${evidence}/combined-conflicts.diff" || true
          git log --oneline --decorate --all -- $(cat "${evidence}/initial-conflicts.txt") > "${evidence}/conflict-history.txt"
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "openela_second_parent=${OPENELA_356}"
            echo "merge_exit_code=${merge_rc}"
            echo "conflict_count=$(wc -l < "${evidence}/initial-conflicts.txt")"
            echo "inventory_match=${inventory_match}"
            echo "modules_sha=${MODULES_SHA}"
            echo 'metadata_conflicts=0'
            echo 'production_write=NONE'
          } | tee "${evidence}/SUMMARY.txt"

          echo '=== exact conflicts ==='
          cat "${evidence}/initial-conflicts.txt"
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git merge --abort
          fi
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          test "${merge_rc}" = 1
          test "${inventory_match}" = YES

      - name: Upload stage 356 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-openela-stage356-conflict-audit-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/stage-356-audit
          if-no-files-found: error
          retention-days: 30
